      if (/^[a-zA-Z]$/.test(e.key)) {
        var t = round.tiles.find(function (x) { return x.letter === e.key.toUpperCase() && !isPlaced(x); });
        if (t) { e.preventDefault(); place(t, false); keepFocus(); }
      } else if (e.key === "Backspace") {
        for (var i = round.placed.length - 1; i >= 0; i--) {
          if (round.placed[i] !== null) { e.preventDefault(); unplace(i, false); keepFocus(); break; }
        }
      }
    });

    /* si la fitxa o la casella amb el focus ha desaparegut, el focus no es perd */
    function keepFocus() {
      var a = document.activeElement;
      if (a && root.contains(a) && !a.disabled) return;
      var t = round.tiles.find(function (x) { return !isPlaced(x); });
      (t ? t.el : checkBtn).focus({ preventScroll: true });
    }

    newGame();
    return root;
  }

  return { build: build };
})();

</script>
  <script>
/*
 * PIXEL ACADEMY — Zoo Express (etapa Game d'un recorregut)
 * ------------------------------------------------------------
 * Tauler: la il·lustració del zoo amb vies (assets/img/express/zoo-rail-board)
 * i, a sobre, un SVG amb el MATEIX sistema de coordenades (1672 × 941 px del
 * fons): el tren i el senyal es mouen en aquestes coordenades i els rètols es
 * posicionen en percentatges, de manera que tot queda alineat a qualsevol mida.
 *
 * Els dos recorreguts passen pel centre exacte dels rails del dibuix
 * (js/data/express-board.js, generat per tools/build_express_board.py):
 * comparteixen el tram d'entrada i se separen al desviament.
 *
 * Rondes: 9 per partida (5 d'animals i 4 de verbs, barrejades i triades de nou
 * a cada partida, js/data/express.js). Als animals, la imatge viatja dins del
 * vagó; als verbs, la il·lustració sencera de l'acció va emmarcada damunt del
 * vagó perquè es llegeixi bé.
 *
 * Tren: locomotora + vagó (sprites). Cada cotxe es col·loca amb les seves dues
 * rodes extremes SOBRE el recorregut i s'orienta segons la recta que les uneix,
 * així el vagó encara fa la corba quan la locomotora ja és a la recta. L'animal
 * viatja dins del vagó. Arrencada amb acceleració i frenada abans de la parada.
 *
 *   - clic/toc a un rètol, o teclat (Tab o ↑/↓ entre rètols, Retorn/Espai);
 *   - el rètol triat es destaca i el senyal es posa verd abans d'arrencar;
 *   - via correcta → el tren s'atura a l'andana, «Delivered!» i arriba el vagó
 *     següent; via equivocada → el tren s'atura a l'andana equivocada, «Wrong
 *     stop!» i arriba el vagó següent (una sola oportunitat per animal).
 * Mentre el tren es mou no s'accepta cap tria.
 *
 * Puntuació: animals lliurats a l'estació correcta; 3 → 1 estrella, 6 → 2,
 * 9 → 3. Es desa amb el motor de progressió dels mapes cada vegada que puja.
 */
window.PA = window.PA || {};
PA.views = PA.views || {};

PA.views.express = (function () {
  var h = PA.h;
  var STAR = "assets/img/map-nodes/stars/star-gold.png";
  var NS = "http://www.w3.org/2000/svg";

  var SWITCH_MS = 750;      /* el rètol triat i el senyal verd es veuen abans d'arrencar */
  var CRUISE = 300;         /* velocitat mitjana, px del fons per segon */
  var DROP = 7;             /* les rodes recolzen una mica per sota del centre de la via */
  var COUPLING = 8;         /* espai entre locomotora i vagó (px del fons): a les corbes no es trepitgen */

  /* ---------- Recorreguts (taules de longitud d'arc) ---------- */
  function makeRoute(points) {
    var cum = [0];
    for (var i = 1; i < points.length; i++) {
      cum.push(cum[i - 1] + Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1]));
    }
    return { pts: points, cum: cum, length: cum[cum.length - 1] };
  }
  function pointAt(route, s) {
    var c = route.cum, p = route.pts;
    if (s <= 0) return p[0].slice();
    if (s >= route.length) return p[p.length - 1].slice();
    var lo = 0, hi = c.length - 1;
    while (hi - lo > 1) { var m = (lo + hi) >> 1; if (c[m] <= s) lo = m; else hi = m; }
    var t = (s - c[lo]) / (c[hi] - c[lo]);
    return [p[lo][0] + (p[hi][0] - p[lo][0]) * t, p[lo][1] + (p[hi][1] - p[lo][1]) * t];
  }
  /* longitud d'arc on el recorregut arriba a la x indicada (els recorreguts avancen sempre cap a la dreta) */
  function sAtX(route, x) {
    var p = route.pts;
    for (var i = 1; i < p.length; i++) {
      if (p[i][0] >= x) {
        var t = (x - p[i - 1][0]) / (p[i][0] - p[i - 1][0]);
        return route.cum[i - 1] + (route.cum[i] - route.cum[i - 1]) * t;
      }
    }
    return route.length;
  }

  /* perfil de velocitat trapezoïdal: acceleració, creuer, frenada */
  function travel(k, ta, td) {
    var v = 1 / (1 - ta / 2 - td / 2);
    if (k < ta) return v * k * k / (2 * ta);
    if (k > 1 - td) return 1 - v * (1 - k) * (1 - k) / (2 * td);
    return v * (ta / 2 + (k - ta));
  }

  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }

  function build(course, unit, section, stageId) {
    var map = PA.getMap(section.map);
    var trackId = course.id + "/" + unit.id + "/" + section.id;
    var game = PA.getExpressGame(map.stages.find(function (s) { return s.id === stageId; }).activity);
    var board = PA.expressBoard;
    var W = board.width, H = board.height;
    var mapHref = PA.router.sectionHref(course.id, unit.id, section.id);
    var savedAtStart = PA.progressStore.load(trackId);
    var rounds = [];
    var total = game.sets.reduce(function (n, set) { return n + set.count; }, 0);
    var reduced = PA.prefersReducedMotion();
    var routes = { top: makeRoute(board.paths.top), bottom: makeRoute(board.paths.bottom) };
    var L1 = board.loco.w, L2 = board.wagon.w;

    var idx, delivered, log, busy = true, lastRes = null, savedStars = 0;
    var trainS = 0, trainSide = "top", mounted = true;

    function nameOf(guideId, id) {
      var a = PA.getFieldGuide(guideId).animals.find(function (x) { return x.id === id; });
      return a ? a.name : id;
    }
    function imageOf(guideId, id) { return PA.fieldGuideImage(PA.getFieldGuide(guideId), id, 400); }

    /* ---------- Capçalera ---------- */
    var count = h("span.express-head__count", { "aria-live": "polite" });
    var head = h("div.express-head", null, [h("p.express-head__text", null, game.instruction), count]);

    /* ---------- Tauler ---------- */
    var bgAttrs = PA.isInline()
      ? { src: PA.asset(board.background + "-1672.webp") }
      : { src: board.background + "-1672.webp",
          srcset: board.background + "-836.webp 836w, " + board.background + "-1672.webp 1672w",
          sizes: "(max-width: 900px) 100vw, 1360px" };
    var bg = h("img.express-bg", Object.assign({ alt: "", width: String(W), height: String(H), decoding: "async", draggable: "false" }, bgAttrs));
    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, class: "express-svg", "aria-hidden": "true" });

    /* senyal del desviament: llum verda quan hi ha via triada (el vermell és al dibuix) */
    var sx = board.signal.x, sy = board.signal.y;
    var lamp = el("g", { class: "xp-lamp", "shape-rendering": "crispEdges" });
    [[-5, -10, 10, 20], [-8, -8, 16, 16], [-10, -5, 20, 10]].forEach(function (r) {
      lamp.appendChild(el("rect", { x: sx + r[0], y: sy + r[1], width: r[2], height: r[3], fill: "#35d04a" }));
    });
    lamp.appendChild(el("rect", { x: sx - 5, y: sy - 6, width: 4, height: 4, fill: "#c8ffb8" }));
    svg.appendChild(lamp);

    /* tren: cada cotxe és un grup amb el seu propi transform (posició + gir) */
    function carGroup(spr) {
      var g = el("g", { class: "xp-car" });
      var am = (spr.axles[0] + spr.axles[1]) / 2;
      var img = el("image", { href: PA.asset(spr.src), width: spr.w, height: spr.h, x: (-am * spr.w).toFixed(1), y: (DROP - spr.h).toFixed(1) });
      return { g: g, img: img, am: am };
    }
    var locoCar = carGroup(board.loco);
    locoCar.g.appendChild(locoCar.img);
    var wagonCar = carGroup(board.wagon);
    /* l'animal, darrere de la paret del vagó (en surt la meitat de dalt) */
    var CARGO = 150, PIC = 170, PAD = 8;
    var rim = DROP - board.wagon.h;                 /* vora de dalt del vagó (coordenades del cotxe) */
    var wagonMid = -wagonCar.am * L2 + L2 / 2;
    var cargoGroup = el("g", { class: "xp-cargo" });
    /* marc per a les il·lustracions d'acció (només es veu a les rondes de verbs) */
    var picFrame = el("rect", {
      class: "xp-cargo__frame", x: (wagonMid - PIC / 2 - PAD).toFixed(1), y: (rim - PIC - PAD).toFixed(1),
      width: PIC + 2 * PAD, height: PIC + 2 * PAD, fill: "#fffaf0", stroke: "#0a0f4d", "stroke-width": 5
    });
    var wagonImg = el("image", { class: "xp-cargo__img" });
    cargoGroup.appendChild(picFrame);
    cargoGroup.appendChild(wagonImg);
    wagonCar.g.appendChild(cargoGroup);
    function setCargo(rd) {
      var action = rd.kind === "action";
      var size = action ? PIC : CARGO;
      wagonImg.setAttribute("href", imageOf(rd.guide, rd.answer));
      wagonImg.setAttribute("width", size);
      wagonImg.setAttribute("height", size);
      wagonImg.setAttribute("x", (wagonMid - size / 2).toFixed(1));
      /* animal: assegut dins del vagó (la paret en tapa la part de baix);
         acció: sencera, emmarcada damunt de la vora del vagó */
      wagonImg.setAttribute("y", (action ? rim - PIC : rim + board.wagon.h * 0.42 - CARGO).toFixed(1));
      picFrame.style.display = action ? "" : "none";
      cargoGroup.setAttribute("data-kind", rd.kind);
      cargoGroup.setAttribute("data-answer", rd.answer);
    }
    wagonCar.g.appendChild(wagonCar.img);
    var train = el("g", { class: "xp-train" });
    train.appendChild(wagonCar.g); train.appendChild(locoCar.g);
    svg.appendChild(train);

    var signs = {};
    ["top", "bottom"].forEach(function (side) {
      var sg = board.signs[side];
      var b = h("button.express-sign.express-sign--" + side, {
        type: "button",
        style: {
          left: (sg.cx / W * 100) + "%",
          top: (sg.y / H * 100) + "%",
          "--sign-w": (sg.w / W * 100) + "%",
          height: (sg.h / H * 100) + "%"
        }
      }, h("span.express-sign__text"));
      b.addEventListener("click", function () { choose(side); });
      signs[side] = b;
    });
    var cargoLabel = h("p.visually-hidden", { "aria-live": "polite" });
    /* missatge (Delivered! / Wrong stop…) damunt del tauler, al cel del centre */
    var feedback = h("p.express-feedback", { "aria-live": "assertive" });
    var scene = h("div.express-scene", { role: "group", "aria-label": "Train tracks. Choose a sign." },
      [bg, svg, signs.top, signs.bottom, feedback]);
    var scroll = h("div.express-scroll", null, scene);
    var play = h("div.express-play", null, [scroll, cargoLabel]);

    /* ---------- Resultat ---------- */
    var resStars = h("span.guide-results__stars", { "aria-hidden": "true" });
    var resTitle = h("h2.guide-results__title", { id: "express-results-title", tabindex: "-1" });
    var resList = h("ol.signs-results__list.express-results__list", { "aria-label": "Deliveries" });
    var resBest = h("p.guide-results__best");
    var resNote = h("p.guide-results__note");
    var againBtn = h("button.px-btn.guide-btn", { type: "button" }, "Play again");
    var results = h("section.guide-results.express-results", { hidden: true, "aria-labelledby": "express-results-title" }, [
      resStars, resTitle, resList, resBest, resNote,
      h("div.guide-results__actions", null, [againBtn, h("a.px-btn.guide-btn.guide-btn--map", { href: mapHref }, "Tornar al mapa")])
    ]);

    /* ---------- Moviment ---------- */
    /* un cotxe: les dues rodes extremes sobre el recorregut; gir = recta entre elles */
    function placeCar(car, spr, front, len) {
      var route = routes[trainSide];
      var pf = pointAt(route, front - (1 - spr.axles[1]) * len);
      var pr = pointAt(route, front - (1 - spr.axles[0]) * len);
      var ang = Math.atan2(pf[1] - pr[1], pf[0] - pr[0]) * 180 / Math.PI;
      var cx = (pf[0] + pr[0]) / 2, cy = (pf[1] + pr[1]) / 2;
      car.g.setAttribute("transform", "translate(" + cx.toFixed(2) + " " + cy.toFixed(2) + ") rotate(" + ang.toFixed(2) + ")");
    }
    function placeTrain() {
      placeCar(locoCar, board.loco, trainS, L1);
      placeCar(wagonCar, board.wagon, trainS - L1 - COUPLING, L2);
    }
    /* morro de la locomotora fins a la x indicada, pel ramal actual */
    function move(toX, speedMul) {
      var route = routes[trainSide];
      var from = trainS, to = sAtX(route, toX);
      var dur = Math.abs(to - from) / (CRUISE * (speedMul || 1) * (reduced ? 2 : 1)) * 1000;
      train.classList.add("is-moving");
      return new Promise(function (resolve) {
        var t0 = null;
        function step(now) {
          if (!mounted) return;
          if (t0 === null) t0 = now;
          var k = dur ? Math.min(1, (now - t0) / dur) : 1;
          trainS = from + (to - from) * travel(k, 0.22, 0.32);
          placeTrain();
          if (k < 1) requestAnimationFrame(step);
          else { trainS = to; placeTrain(); train.classList.remove("is-moving"); resolve(); }
        }
        requestAnimationFrame(step);
      });
    }

    function wait(ms) {
      return new Promise(function (resolve) { setTimeout(function () { if (mounted) resolve(); }, ms); });
    }

    function setSwitch(side) { scene.dataset.switch = side || "none"; }

    function setBusy(b) {
      busy = b;
      scene.classList.toggle("is-busy", b);
      ["top", "bottom"].forEach(function (s) { signs[s].setAttribute("aria-disabled", b ? "true" : "false"); });
    }

    /* ---------- Rondes ---------- */
    function round() { return rounds[idx]; }

    /* comptador de rondes: avança tant amb un encert com amb un error */
    function updateCount() { count.textContent = "Round " + Math.min(idx + 1, total) + "/" + total; }

    function loadRound() {
      var rd = round();
      ["top", "bottom"].forEach(function (s) {
        signs[s].classList.remove("is-chosen", "is-right", "is-wrong");
        signs[s].querySelector(".express-sign__text").textContent = nameOf(rd.guide, rd[s]);
        signs[s].setAttribute("aria-label", nameOf(rd.guide, rd[s]) + " track");
      });
      setCargo(rd);
      cargoGroup.classList.remove("is-happy");
      cargoLabel.textContent = "Train " + (idx + 1) + " of " + total + ". Look at the picture in the wagon.";
      train.classList.remove("is-leaving");
      trainSide = "top";
      trainS = sAtX(routes.top, board.stops.entry);
      placeTrain();
      setSwitch(null);
      updateCount();
    }

    function arriveNewTrain() {
      setBusy(true);
      loadRound();
      return move(board.stops.junction, 1.5).then(function () { setBusy(false); });
    }

    function choose(side) {
      if (busy) return;
      setBusy(true);
      var rd = round();
      feedback.textContent = ""; feedback.className = "express-feedback";
      signs.top.classList.remove("is-wrong"); signs.bottom.classList.remove("is-wrong");
      signs[side].classList.add("is-chosen");
      /* 1) rètol destacat i senyal verd; 2) el tren avança per aquella via */
      setSwitch(side);
      trainSide = side;
      wait(SWITCH_MS).then(function () { return move(board.stops[side]); }).then(function () {
        return wait(300).then(function () {
          if (rd[side] === rd.answer) return delivered_(side);
          return wrongStop(side);
        });
      });
    }

    function delivered_(side) {
      var rd = round();
      delivered++;
      log.push({ guide: rd.guide, id: rd.answer, ok: true });
      signs[side].classList.remove("is-chosen"); signs[side].classList.add("is-right");
      feedback.textContent = "Delivered!"; feedback.className = "express-feedback is-ok";
      /* l'animal salta de content al vagó: ja és al seu recinte */
      cargoGroup.classList.add("is-happy");
      save();
      return nextTrain();
    }

    /* una sola oportunitat: a l'andana equivocada, la ronda val zero, es mostra el
       rètol correcte i passa el tren següent */
    function wrongStop(side) {
      var rd = round();
      log.push({ guide: rd.guide, id: rd.answer, ok: false });
      signs[side].classList.remove("is-chosen"); signs[side].classList.add("is-wrong");
      signs[side === "top" ? "bottom" : "top"].classList.add("is-right");
      feedback.textContent = "Wrong stop! The right sign is \u201c" + nameOf(rd.guide, rd.answer) + "\u201d.";
      feedback.className = "express-feedback is-no";
      return nextTrain();
    }

    function nextTrain() {
      return wait(1800).then(function () {
        idx++;
        if (idx >= total) { showResults(); return; }
        train.classList.add("is-leaving");
        return wait(360).then(function () {
          feedback.textContent = ""; feedback.className = "express-feedback";
          return arriveNewTrain();
        });
      });
    }

    /* Desa quan puja la puntuació; el mapa anima des de l'estat inicial */
    function save() {
      var stars = PA.expressStars(game, delivered);
      if (stars <= savedStars) return;
      savedStars = stars;
      var res = PA.progression.record(map.stages, PA.progressStore.load(trackId), stageId, stars);
      if (res.reason === "locked") return;
      PA.progressStore.save(trackId, res.saved);
      var fromStart = PA.progression.record(map.stages, savedAtStart, stageId, stars);
      PA.views.map.setPendingResult(trackId, stageId, fromStart);
      lastRes = { now: res, fromStart: fromStart };
    }

    function showResults() {
      var n = PA.expressStars(game, delivered);
      resStars.textContent = "";
      for (var i = 1; i <= 3; i++) {
        resStars.appendChild(h("img.px-star" + (i <= n ? ".is-earned" : ""), { src: PA.asset(STAR), alt: "", width: "69", height: "67" }));
      }
      resTitle.textContent = delivered === total ? "Perfect delivery!" : "Zoo Express finished!";
      resList.textContent = "";
      log.forEach(function (d) {
        resList.appendChild(h("li.signs-mini" + (d.ok ? ".is-solved" : ".is-revealed"), null, [
          h("span.signs-mini__frame", null, h("img.signs-mini__img", { src: imageOf(d.guide, d.id), alt: "", width: "400", height: "400" })),
          h("span.signs-mini__name", null, nameOf(d.guide, d.id)),
          h("span.signs-mini__tag", null, d.ok ? "✓" : "wrong stop")
        ]));
      });
      var best = lastRes ? lastRes.now.bestStars : n;
      resBest.textContent = "Right tracks: " + delivered + " of " + total + " · Best score: " + best + (best === 1 ? " star" : " stars");
      var opened = lastRes && lastRes.fromStart.newlyUnlocked && lastRes.fromStart.newlyUnlocked.length;
      resNote.textContent = opened ? "The next stage is now open on the map!" : "";
      resNote.hidden = !opened;
      head.hidden = true;
      play.hidden = true;
      results.hidden = false;
      resTitle.focus({ preventScroll: true });
    }

    function newGame() {
      idx = 0; delivered = 0; log = [];
      rounds = PA.newExpressRounds(game);           /* animals i verbs nous a cada partida */
      head.hidden = false; play.hidden = false; results.hidden = true;
      feedback.textContent = ""; feedback.className = "express-feedback";
      return arriveNewTrain();
    }

    /* teclat: ↑/↓ canvien de rètol (Retorn/Espai el trien, com qualsevol botó) */
    scene.addEventListener("keydown", function (e) {
      if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        signs[e.key === "ArrowUp" ? "top" : "bottom"].focus();
      }
    });
    againBtn.addEventListener("click", function () {
      newGame();
      signs.top.focus({ preventScroll: true });
    });

    var root = h("div.view.view--sections.view--express", {
      style: { "--c": section.color, "--cb": "#7FE3D6", "--sc": section.color, "--tone": section.color }
    }, [
      PA.views.sections.buildHeader({
        backHref: mapHref,
        backLabel: "Tornar al mapa",
        context: course.label + " · " + unit.label + " · " + section.name,
        title: game.title
      }),
      h("main.sections.dither.express-page", null, [head, play, results])
    ]);

    /* quan la vista desapareix, s'aturen les animacions pendents */
    var watcher = setInterval(function () {
      if (!document.contains(root) && started) { mounted = false; clearInterval(watcher); }
    }, 1000);
    var started = false;
    setTimeout(function () { started = true; }, 0);

    newGame();
    return root;
  }

  return { build: build };
})();

</script>
  <script>
/*
 * PIXEL ACADEMY — Find the Action! (etapa Game d'un recorregut)
 * ------------------------------------------------------------
 * Set rondes, una per verb (eat, drink, sleep, fight, walk, play, live) en
 * ordre aleatori. A cada ronda: consigna «Find: drink», progrés «3/7» i tres
 * cartes il·lustrades sense text (imatges de la guia Animal Actions).
 *   - el primer clic/toc confirma: encert → la carta queda verda amb ✓ i el
 *     verb; error → la carta tocada sacseja i la correcta queda vermella amb ✗
 *     i el verb (les mateixes marques que la teoria);
 *   - les cartes queden bloquejades i surt «Next» («See results» a la setena).
 * La partida (ordre, cartes de cada ronda, ronda actual i respostes) es desa a
 * PA.progressStore com a partida a mitges: si l'alumne surt i torna, continua
 * on era i les respostes anteriors segueixen comptant. «Play again» en comença
 * una de nova.
 *
 * Puntuació (en acabar les set rondes): 0–2 encerts → 0 estrelles, 3–4 → 1,
 * 5–6 → 2, 7 → 3. Es desa amb el motor de progressió dels mapes (millor marca;
 * ≥ 1 estrella obre la casella següent).
 */
window.PA = window.PA || {};
PA.views = PA.views || {};

PA.views.findAction = (function () {
  var h = PA.h;
  var STAR = "assets/img/map-nodes/stars/star-gold.png";

  function starsText(n) { return n + (n === 1 ? " star" : " stars"); }

  function build(course, unit, section, stageId) {
    var map = PA.getMap(section.map);
    var trackId = course.id + "/" + unit.id + "/" + section.id;
    var stageData = map.stages.find(function (s) { return s.id === stageId; });
    var game = PA.getFindActionGame(stageData.activity);
    var guide = PA.getFieldGuide(game.guide);
    var verbs = guide.animals;
    var verbIds = verbs.map(function (v) { return v.id; });
    var mapHref = PA.router.sectionHref(course.id, unit.id, section.id);
    var sessionKey = trackId + "/" + stageId;
    var session;

    function verb(id) { return verbs.find(function (v) { return v.id === id; }); }

    /* partida desada vàlida (mateixos verbs) o una de nova */
    function validSession(s) {
      return s && Array.isArray(s.order) && s.order.length === verbIds.length &&
        s.order.every(function (id) { return verbIds.indexOf(id) !== -1; }) &&
        Array.isArray(s.options) && s.options.length === s.order.length &&
        Array.isArray(s.answers) && typeof s.round === "number" &&
        s.round >= 0 && s.round < s.order.length && s.answers.length <= s.round + 1;
    }
    function saveSession() { PA.progressStore.saveSession(sessionKey, session); }

    /* ---------- Consigna i progrés ---------- */
    var bannerLead = h("span.guide-banner__lead", null, game.prompt);
    var bannerTarget = h("span.guide-banner__target");
    var bannerRound = h("span.guide-banner__round");
    var banner = h("div.guide-banner.is-quiz", { "aria-live": "polite" }, [
      h("p.guide-banner__text", null, [bannerLead, bannerTarget]),
      bannerRound
    ]);

    /* ---------- Tres cartes ---------- */
    var grid = h("ul.guide-grid.find-grid.is-quiz", { "aria-label": "Actions" });
    var feedback = h("p.guide-feedback", { "aria-live": "polite" });
    var nextBtn = h("button.px-btn.guide-btn", { type: "button", hidden: true }, "Next");
    var resultsBtn = h("button.px-btn.guide-btn", { type: "button", hidden: true }, "See results");
    nextBtn.addEventListener("click", next);
    resultsBtn.addEventListener("click", finish);
    var actions = h("div.guide-actions", null, [nextBtn, resultsBtn]);

    /* ---------- Resultat ---------- */
    var resStars = h("span.guide-results__stars", { "aria-hidden": "true" });
    var resTitle = h("h2.guide-results__title", { id: "find-results-title", tabindex: "-1" });
    var resList = h("ol.signs-results__list.find-results__list", { "aria-label": "Rounds" });
    var resBest = h("p.guide-results__best");
    var resNote = h("p.guide-results__note");
    var againBtn = h("button.px-btn.guide-btn", { type: "button" }, "Play again");
    againBtn.addEventListener("click", function () { newGame(); focusFirstCard(); });
    var results = h("section.guide-results.find-results", { hidden: true, "aria-labelledby": "find-results-title" }, [
      resStars, resTitle, resList, resBest, resNote,
      h("div.guide-results__actions", null, [
        againBtn,
        h("a.px-btn.guide-btn.guide-btn--map", { href: mapHref }, "Tornar al mapa")
      ])
    ]);

    /* ---------- Ronda ---------- */
    function card(id, i) {
      var v = verb(id);
      var btn = h("button.guide-card", { type: "button", "data-animal": id, "aria-label": "Picture " + (i + 1) }, [
        h("span.guide-card__art", null,
          h("img.guide-card__img", Object.assign({ alt: "", width: "400", height: "400", decoding: "async" },
            PA.isInline()
              ? { src: PA.fieldGuideImage(guide, id, 400) }
              : { src: PA.fieldGuideImage(guide, id, 400),
                  srcset: PA.fieldGuideImage(guide, id, 400) + " 400w, " + PA.fieldGuideImage(guide, id, 800) + " 800w",
                  sizes: "(min-width: 900px) 340px, 30vw" }))),
        h("span.guide-card__name", null, v.name),
        h("span.guide-card__badge", { "aria-hidden": "true" })
      ]);
      btn.addEventListener("click", function () { answer(id, btn); });
      btn.addEventListener("animationend", function () { btn.classList.remove("is-shaking"); });
      return h("li.guide-grid__item", { style: { "--n": i } }, btn);
    }
    function cardFor(id) { return grid.querySelector('.guide-card[data-animal="' + id + '"]'); }

    function lock(c, kind) {
      var name = verb(c.getAttribute("data-animal")).name;
      c.classList.add(kind === "ok" ? "is-correct" : "is-missed");
      c.querySelector(".guide-card__badge").appendChild(PA.views.fieldGuide.mark(kind));
      c.setAttribute("aria-label", name + (kind === "ok" ? ", correct" : ", the right answer"));
    }

    /* mostra la ronda actual; si ja estava resposta (partida represa), amb el seu resultat */
    function render(animate) {
      var r = session.round;
      var target = verb(session.order[r]);
      bannerTarget.textContent = target.name;
      bannerRound.textContent = (r + 1) + "/" + session.order.length;
      banner.classList.remove("is-pop");
      if (animate) { void banner.offsetWidth; banner.classList.add("is-pop"); }
      grid.textContent = "";
      session.options[r].forEach(function (id, i) { grid.appendChild(card(id, i)); });
      feedback.textContent = "";
      feedback.className = "guide-feedback";
      nextBtn.hidden = true;
      resultsBtn.hidden = true;
      var done = session.answers[r];
      if (done) showAnswered(done, false);
    }

    function showAnswered(ans, fresh) {
      var target = verb(session.order[session.round]);
      if (ans.ok) {
        lock(cardFor(target.id), "ok");
        feedback.textContent = "Correct! This is “" + target.name + "”.";
        feedback.classList.add("is-ok");
      } else {
        if (fresh) cardFor(ans.pick).classList.add("is-shaking");
        lock(cardFor(target.id), "no");
        feedback.textContent = "Not quite. This is “" + target.name + "”.";
        feedback.classList.add("is-no");
      }
      if (fresh) cardFor(target.id).classList.add("is-just-marked");
      [].forEach.call(grid.querySelectorAll(".guide-card"), function (c) { c.setAttribute("aria-disabled", "true"); });
      var last = session.round >= session.order.length - 1;
      nextBtn.hidden = last;
      resultsBtn.hidden = !last;
    }

    function answer(id, btn) {
      var r = session.round;
      if (session.answers[r] || btn.getAttribute("aria-disabled") === "true") return; /* un sol intent */
      var ans = { pick: id, ok: id === session.order[r] };
      session.answers[r] = ans;
      saveSession();
      showAnswered(ans, true);
      (nextBtn.hidden ? resultsBtn : nextBtn).focus({ preventScroll: true });
    }

    function next() {
      if (!session.answers[session.round] || session.round >= session.order.length - 1) return;
      session.round++;
      saveSession();
      render(true);
      focusFirstCard();
    }

    function focusFirstCard() {
      var c = grid.querySelector(".guide-card");
      if (c) c.focus({ preventScroll: true });
    }

    /* ---------- Resultat ---------- */
    function finish() {
      if (session.answers.length < session.order.length) return;
      var correct = session.answers.filter(function (a) { return a.ok; }).length;
      var stars = PA.findActionStars(game, correct);
      var res = PA.progression.record(map.stages, PA.progressStore.load(trackId), stageId, stars);
      if (res.reason !== "locked") {
        PA.progressStore.save(trackId, res.saved);
        PA.views.map.setPendingResult(trackId, stageId, res);
      }
      PA.progressStore.clearSession(sessionKey);   /* partida acabada */

      resStars.textContent = "";
      for (var i = 1; i <= 3; i++) {
        resStars.appendChild(h("img.px-star" + (i <= stars ? ".is-earned" : ""), { src: PA.asset(STAR), alt: "", width: "69", height: "67" }));
      }
      resTitle.textContent = "You found " + correct + " of " + session.order.length + "!";
      resList.textContent = "";
      session.order.forEach(function (id, r) {
        var ok = session.answers[r].ok;
        resList.appendChild(h("li.signs-mini" + (ok ? ".is-solved" : ".is-revealed"), null, [
          h("span.signs-mini__frame", null, h("img.signs-mini__img", { src: PA.fieldGuideImage(guide, id, 400), alt: "", width: "400", height: "400" })),
          h("span.signs-mini__name", null, verb(id).name),
          h("span.signs-mini__tag", null, ok ? "✓" : "✗")
        ]));
      });
      var best = res.bestStars != null ? res.bestStars : stars;
      resBest.textContent = "Your score: " + starsText(stars) + " · Best score: " + starsText(best);
      var notes = [];
      if (res.changed && res.previousBest > 0) notes.push("New best score!");
      if (!res.changed && res.previousBest > stars) notes.push("Your best score is kept.");
      if (res.newlyUnlocked && res.newlyUnlocked.length) {
        var opened = map.stages.find(function (s) { return s.id === res.newlyUnlocked[0]; });
        notes.push("Stage " + opened.index + " is now open on the map!");
      }
      if (best === 0) notes.push("Find at least " + game.stars[game.stars.length - 1].min + " actions to pass this stage.");
      resNote.textContent = notes.join(" ");
      resNote.hidden = !notes.length;

      banner.hidden = true;
      grid.hidden = true;
      feedback.hidden = true;
      actions.hidden = true;
      results.hidden = false;
      resTitle.focus({ preventScroll: true });
    }

    function newGame() {
      session = PA.newFindActionGame(game, verbIds);
      saveSession();
      banner.hidden = false; grid.hidden = false; feedback.hidden = false; actions.hidden = false;
      results.hidden = true;
      render(true);
    }

    var root = h("div.view.view--sections.view--guide.view--find", {
      style: { "--c": section.color, "--cb": "#7FE3D6", "--sc": section.color, "--tone": section.color }
    }, [
      PA.views.sections.buildHeader({
        backHref: mapHref,
        backLabel: "Tornar al mapa",
        context: course.label + " · " + unit.label + " · " + section.name,
        title: game.title
      }),
      h("main.sections.dither.guide-page.find-page", null, [
        banner,
        h("div.guide-scroll", null, grid),
        feedback,
        actions,
        results
      ])
    ]);

    /* reprèn la partida a mitges, si n'hi ha */
    var saved = PA.progressStore.loadSession(sessionKey);
    if (validSession(saved)) { session = saved; render(false); }
    else newGame();
    return root;
  }

  return { build: build };
})();

</script>
  <script>
/*
 * PIXEL ACADEMY — Open the Zoo! (repte final d'un recorregut)
 * ------------------------------------------------------------
 * Nou rondes, barrejades a cada partida. A cada ronda: una il·lustració, la
 * consigna «Look at the picture and build the sentence.», el progrés i les
 * opcions en columnes (Animals, Actions i, si cal, Food, Drink o Places), cada
 * una amb capçalera, fons propi i botons apilats.
 * Distribució: imatge a l'esquerra amb el panell «Your sentence» a sota i les
 * columnes a la dreta; en pantalles estretes, imatge → columnes → frase.
 *   - es tria una opció per columna (es pot canviar fins a «Check»): la paraula
 *     apareix com una fitxa al seu espai de la frase, sempre en l'ordre
 *     animal → acció → complement, i un canvi la substitueix al mateix lloc;
 *   - «Check» s'activa quan tots els grups tenen una fitxa; valida la frase
 *     sencera: la ronda val 1 si totes les fitxes són correctes (un sol intent);
 *   - després es veuen les fitxes triades marcades (verd / vermell), la fitxa
 *     correcta de cada grup fallat i la frase correcta; «Next» passa a la
 *     ronda següent («See results» a la novena).
 * Resultat: encerts de 9 → 0–3 estrelles (3 → 1, 6 → 2, 9 → 3), desat amb el
 * motor de progressió (millor marca). «Try again» comença una partida nova.
 */
window.PA = window.PA || {};
PA.views = PA.views || {};

PA.views.openZoo = (function () {
  var h = PA.h;
  var STAR = "assets/img/map-nodes/stars/star-gold.png";

  function starsText(n) { return n + (n === 1 ? " star" : " stars"); }

  function build(course, unit, section, stageId) {
    var map = PA.getMap(section.map);
    var trackId = course.id + "/" + unit.id + "/" + section.id;
    var stageData = map.stages.find(function (s) { return s.id === stageId; });
    var game = PA.getOpenZooGame(stageData.activity);
    var mapHref = PA.router.sectionHref(course.id, unit.id, section.id);

    var rounds = [], idx = 0, correct = 0, log = [], picks = {}, checked = false, justPlaced = null;

    /* ---------- Consigna i progrés ---------- */
    var count = h("span.signs-head__count", { "aria-live": "polite" });
    var head = h("div.signs-head.ozoo-head", null, [h("p.signs-head__text", null, game.instruction), count]);

    /* ---------- Il·lustració ---------- */
    var pic = h("img.ozoo-pic__img", { alt: "", width: "800", height: "800", decoding: "async" });
    /* ✓ / ✗ damunt la carta (Weekend Builder!, U4): la posa la web, mai la imatge */
    var picMark = h("span.sk-mark.ozoo-mark", { role: "img", hidden: true });
    var picBox = h("figure.ozoo-pic", null, [pic, picMark]);

    /* ---------- Opcions (columnes) i panell de la frase ---------- */
    var groupsBox = h("div.ozoo-groups");
    var sentence = h("p.ozoo-sentence", { "aria-live": "polite" });
    var feedback = h("p.guide-feedback.ozoo-feedback", { "aria-live": "polite" });
    var checkBtn = h("button.px-btn.guide-btn", { type: "button", disabled: true }, "Check");
    var nextBtn = h("button.px-btn.guide-btn", { type: "button", hidden: true }, "Next");
    var resultsBtn = h("button.px-btn.guide-btn", { type: "button", hidden: true }, "See results");
    checkBtn.addEventListener("click", check);
    nextBtn.addEventListener("click", next);
    resultsBtn.addEventListener("click", finish);
    var actions = h("div.guide-actions.ozoo-actions", null, [checkBtn, nextBtn, resultsBtn]);
    var panel = h("section.ozoo-panel", { "aria-labelledby": "ozoo-panel-title" }, [
      h("h2.ozoo-panel__title", { id: "ozoo-panel-title" }, "Your sentence"),
      sentence, feedback, actions
    ]);
    var play = h("div.ozoo-play", null, [picBox, groupsBox, panel]);

    /* ---------- Resultat ---------- */
    var resStars = h("span.guide-results__stars", { "aria-hidden": "true" });
    var resTitle = h("h2.guide-results__title", { id: "ozoo-results-title", tabindex: "-1" });
    var resList = h("ol.ozoo-results__list", { "aria-label": "Sentences" });
    var resBest = h("p.guide-results__best");
    var resNote = h("p.guide-results__note");
    var againBtn = h("button.px-btn.guide-btn", { type: "button" }, "Try again");
    againBtn.addEventListener("click", function () { newGame(); focusFirstChip(); });
    var results = h("section.guide-results.ozoo-results", { hidden: true, "aria-labelledby": "ozoo-results-title" }, [
      resStars, resTitle, resList, resBest, resNote,
      h("div.guide-results__actions", null, [
        againBtn,
        h("a.px-btn.guide-btn.guide-btn--map", { href: mapHref }, "Tornar al mapa")
      ])
    ]);

    /* ---------- Ronda ---------- */
    function round() { return rounds[idx]; }

    function sentenceText(words) { return words.join(" ") + "."; }
    function answerText(rd) { return sentenceText(rd.groups.map(function (g) { return g.answer; })); }

    /* un espai per grup, en l'ordre de la frase; la paraula triada hi va com a fitxa */
    function renderSentence() {
      var rd = round();
      sentence.textContent = "";
      rd.groups.forEach(function (g) {
        var w = picks[g.name];
        var tile = null;
        if (w) {
          /* g.given: paraula que ja ve posada (Pizza Builder!): no es corregeix ni es pot canviar */
          var cls = "span.ozoo-tile" + (g.given ? ".is-given" : checked ? (w === g.answer ? ".is-ok" : ".is-no") : "") +
            (justPlaced === g.name ? ".is-new" : "");
          tile = h(cls, null, w);
        }
        sentence.appendChild(h("span.ozoo-slot.ozoo-tone--" + (g.tone || g.name.toLowerCase()) + (w ? ".is-filled" : ""),
          { "data-group": g.name, "aria-label": g.name + ": " + (w || "empty") },
          tile || h("span.ozoo-slot__hint", { "aria-hidden": "true" }, g.name)));
      });
      sentence.appendChild(h("span.ozoo-stop", { "aria-hidden": "true" }, "."));
    }

    function renderGroups() {
      var rd = round();
      groupsBox.textContent = "";
      /* columnes que s'encenen una a una (19-11-2026, petició del mestre): de color només
         les ja triades i la que toca ara; les següents queden apagades i no es poden tocar */
      var turn = rd.groups.findIndex(function (g) { return !picks[g.name]; });
      rd.groups.forEach(function (g, gi) {
        if (g.given) return;   /* ja és a la frase: sense columna */
        var locked = !checked && turn !== -1 && gi > turn;
        var state = checked ? "" : locked ? ".is-locked" : gi === turn ? ".is-turn" : ".is-done";
        var chips = g.options.map(function (w) {
          var on = picks[g.name] === w;
          var cls = "button.px-btn.ozoo-chip" + (on ? ".is-picked" : "");
          if (checked) {
            if (on) cls += w === g.answer ? ".is-ok" : ".is-no";
            else if (w === g.answer && picks[g.name] !== g.answer) cls += ".is-answer";
          }
          var b = h(cls, { type: "button", "aria-pressed": on ? "true" : "false", "data-word": w, disabled: (checked || locked) ? true : null }, w);
          b.addEventListener("click", function () { choose(g.name, w); });
          return b;
        });
        groupsBox.appendChild(h("div.ozoo-group.ozoo-tone--" + (g.tone || g.name.toLowerCase()) + state, { role: "group", "aria-label": g.name, "aria-disabled": locked ? "true" : null }, [
          h("p.ozoo-group__label", null, g.name),
          h("div.ozoo-group__chips", null, chips)
        ]));
      });
    }

    function render() {
      var rd = round();
      count.textContent = "Round " + (idx + 1) + "/" + rounds.length;
      pic.src = PA.openZooImage(game, rd.image, PA.isInline() ? 400 : 800);
      pic.setAttribute("data-image", rd.image);
      picMark.hidden = !rd.mark;
      if (rd.mark) { picMark.className = "sk-mark ozoo-mark is-" + rd.mark; picMark.textContent = rd.mark === "yes" ? "✓" : "✗";
        picMark.setAttribute("aria-label", rd.mark === "yes" ? "Yes" : "No"); }
      groupsBox.style.setProperty("--cols", rd.groups.filter(function (g) { return !g.given; }).length);
      renderSentence();
      renderGroups();
      justPlaced = null;
      checkBtn.hidden = checked;
      checkBtn.disabled = !rd.groups.every(function (g) { return picks[g.name]; });
      var last = idx >= rounds.length - 1;
      nextBtn.hidden = !checked || last;
      resultsBtn.hidden = !checked || !last;
    }

    function startRound() {
      picks = {}; checked = false;
      round().groups.forEach(function (g) { if (g.given) picks[g.name] = g.answer; });
      feedback.textContent = ""; feedback.className = "guide-feedback ozoo-feedback";
      pic.classList.remove("is-new"); void pic.offsetWidth; pic.classList.add("is-new");
      render();
    }

    /* triar o canviar una fitxa (fins a Check) */
    function choose(group, word) {
      if (checked) return;
      if (picks[group] === word) return;
      picks[group] = word;
      justPlaced = group;
      var focusedWord = word;
      render();
      var b = groupsBox.querySelector('.ozoo-group[aria-label="' + group + '"] .ozoo-chip[data-word="' + focusedWord + '"]');
      if (b) b.focus({ preventScroll: true });
    }

    function check() {
      var rd = round();
      if (checked || !rd.groups.every(function (g) { return picks[g.name]; })) return;
      checked = true;   /* només el primer intent puntua */
      var ok = rd.groups.every(function (g) { return picks[g.name] === g.answer; });
      if (ok) correct++;
      log.push({ id: rd.id, image: rd.image, sentence: answerText(rd), ok: ok });
      if (ok) {
        feedback.textContent = "Correct! " + answerText(rd);
        feedback.classList.add("is-ok");
      } else {
        feedback.textContent = "Not quite. The sentence is: " + answerText(rd);
        feedback.classList.add("is-no");
      }
      render();
      (nextBtn.hidden ? resultsBtn : nextBtn).focus({ preventScroll: true });
    }

    function next() {
      if (!checked || idx >= rounds.length - 1) return;
      idx++;
      startRound();
      focusFirstChip();
    }

    function focusFirstChip() {
      var c = groupsBox.querySelector(".ozoo-chip");
      if (c) c.focus({ preventScroll: true });
    }

    /* ---------- Resultat ---------- */
    function finish() {
      if (log.length < rounds.length) return;
      var stars = PA.openZooStars(game, correct);
      var res = PA.progression.record(map.stages, PA.progressStore.load(trackId), stageId, stars);
      if (res.reason !== "locked") {
        PA.progressStore.save(trackId, res.saved);
        PA.views.map.setPendingResult(trackId, stageId, res);
      }
      resStars.textContent = "";
      for (var i = 1; i <= 3; i++) {
        resStars.appendChild(h("img.px-star" + (i <= stars ? ".is-earned" : ""), { src: PA.asset(STAR), alt: "", width: "69", height: "67" }));
      }
      resTitle.textContent = correct === rounds.length ? "The zoo is open!" : "You built " + correct + " of " + rounds.length + " sentences!";
      resList.textContent = "";
      log.forEach(function (d) {
        resList.appendChild(h("li.ozoo-mini" + (d.ok ? ".is-ok" : ".is-no"), null, [
          h("img.ozoo-mini__img", { src: PA.openZooImage(game, d.image, 400), alt: "", width: "400", height: "400" }),
          h("span.ozoo-mini__text", null, d.sentence),
          h("span.ozoo-mini__tag", { "aria-label": d.ok ? "correct" : "wrong" }, d.ok ? "✓" : "✗")
        ]));
      });
      var best = res.bestStars != null ? res.bestStars : stars;
      resBest.textContent = "Correct sentences: " + correct + " of " + rounds.length + " · Your score: " + starsText(stars) + " · Best score: " + starsText(best);
      var notes = [];
      if (res.changed && res.previousBest > 0) notes.push("New best score!");
      if (!res.changed && res.previousBest > stars) notes.push("Your best score is kept.");
      if (res.justCompleted) notes.push(section.name + " completed!");
      if (best === 0) notes.push("Build at least " + game.stars[game.stars.length - 1].min + " sentences to pass this stage.");
      resNote.textContent = notes.join(" ");
      resNote.hidden = !notes.length;
      head.hidden = true;
      play.hidden = true;
      results.hidden = false;
      resTitle.focus({ preventScroll: true });
    }

    function newGame() {
      rounds = PA.newOpenZooGame(game);
      idx = 0; correct = 0; log = [];
      head.hidden = false; play.hidden = false; results.hidden = true;
      startRound();
    }

    var root = h("div.view.view--sections.view--guide.view--ozoo", {
      style: { "--c": section.color, "--cb": "#7FE3D6", "--sc": section.color, "--tone": section.color }
    }, [
      PA.views.sections.buildHeader({
        backHref: mapHref,
        backLabel: "Tornar al mapa",
        context: course.label + " · " + unit.label + " · " + section.name,
        title: game.title
      }),
      h("main.sections.dither.ozoo-page", null, [head, play, results])
    ]);

    newGame();
    return root;
  }

  return { build: build };
})();

  <script>
/*
 * PIXEL ACADEMY — «What are they like?» (Grammar 1, etapa Theory)
 * ------------------------------------------------------------
 * 1. Descoberta guiada: sis exemples, un per pantalla (Back / Next). Cada un
 *    mostra la il·lustració, l'adjectiu amb el significat en català i la frase
 *    amb are / aren't ressaltat. A la comparativa (balenes / foques) una fletxa
 *    ancorada a la imatge assenyala el grup sencer i l'etiqueta de l'adjectiu
 *    hi queda al costat; a les negatives, l'etiqueta porta una creu.

    var left = h("div.aa-left", null, [h("div.wl-stage.aa-stage", null, art), pointer]);

    /* ---------- Exercici (dreta) ---------- */
    var right = h("div.aa-right");
    var feedback = h("p.guide-feedback.aa-feedback", { "aria-live": "polite" });
    var startBtn = h("button.px-btn.guide-btn", { type: "button" }, "Let's start!");
    var checkBtn = h("button.px-btn.guide-btn", { type: "button" }, "Check");
    var nextBtn = h("button.px-btn.guide-btn", { type: "button" }, "Next");
    var resultsBtn = h("button.px-btn.guide-btn", { type: "button" }, "See results");
    startBtn.addEventListener("click", function () { idx = 0; correct = 0; log = []; renderItem(true); });
    checkBtn.addEventListener("click", check);
    nextBtn.addEventListener("click", function () { if (checked && idx < act.items.length - 1) { idx++; renderItem(true); } });
    resultsBtn.addEventListener("click", finish);
    var actions = h("div.guide-actions.aa-actions", null, [startBtn, checkBtn, nextBtn, resultsBtn]);
    var panel = h("section.aa-panel", null, [right, feedback, actions]);

    var play = h("div.aa-play", null, [left, panel]);

    /* ---------- Resultat ---------- */
    var resStars = h("span.guide-results__stars", { "aria-hidden": "true" });
    var resTitle = h("h2.guide-results__title", { id: "aa-results-title", tabindex: "-1" });
    var resList = h("ol.ozoo-results__list.wl-results__list", { "aria-label": "Questions and answers" });
    var resBest = h("p.guide-results__best");
    var resNote = h("p.guide-results__note");
    var againBtn = h("button.px-btn.guide-btn", { type: "button" }, "Try again");
    var modelBtn = h("button.px-btn.guide-btn", { type: "button" }, "See the example");
    againBtn.addEventListener("click", function () { showPlay(); idx = 0; correct = 0; log = []; renderItem(true); });
    modelBtn.addEventListener("click", function () { showPlay(); renderModel(); });
    var results = h("section.guide-results.wl-results", { hidden: true, "aria-labelledby": "aa-results-title" }, [
      resStars, resTitle, resList, resBest, resNote,
      h("div.guide-results__actions", null, [
        againBtn, modelBtn,
        h("a.px-btn.guide-btn.guide-btn--map", { href: mapHref }, "Tornar al mapa")
      ])
    ]);

    function only(btns) {
      [startBtn, checkBtn, nextBtn, resultsBtn].forEach(function (b) { b.hidden = btns.indexOf(b) === -1; });
    }

    /* canvia la il·lustració (només si és una altra) */
    function setImage(id) {
      if (shownImage === id) return;

      var meta = act.images[id];
      var sizes = meta.sizes || [800, 1600];
      img.src = PA.grammarImage(act, id, 800);
      if (!PA.isInline()) {
        img.srcset = sizes.map(function (w) { return PA.grammarImage(act, id, w) + " " + w + "w"; }).join(", ");
        img.sizes = "(min-width: 1100px) 640px, 90vw";
      }
      img.alt = meta.alt;
      img.width = meta.w; img.height = meta.h;
      art.style.setProperty("--ratio", meta.w + " / " + meta.h);
      root.style.setProperty("--rn", (meta.w / meta.h).toFixed(4));

    }

    /* el marc i la fletxa només surten quan la imatge contrasta dos grups (balenes / foques) */
    function pointAt(groupId) {
      var g = act.groups[groupId];
      setImage(g.image);
      left.classList.toggle("is-pointing", !!g.contrast);
      frame.hidden = !g.contrast; callout.hidden = !g.contrast; pointer.hidden = !g.contrast;
      art.setAttribute("data-group", groupId);

      var b = g.box;
      left.style.setProperty("--gtop", (b[1] / 100).toFixed(3));
      frame.style.left = b[0] + "%"; frame.style.top = b[1] + "%";
      frame.style.width = (b[2] - b[0]) + "%"; frame.style.height = (b[3] - b[1]) + "%";
      callout.style.left = ((b[0] + b[2]) / 2) + "%";
      callout.style.bottom = (100 - b[1]) + "%";
      pointer.textContent = "The arrow points at " + act.groups[groupId].name + ".";
      frame.classList.remove("is-new"); void frame.offsetWidth; frame.classList.add("is-new");
    }

    function resetFeedback() { feedback.textContent = ""; feedback.className = "guide-feedback aa-feedback"; }

    /* ---------- 0. Exemple resolt ---------- */
    function renderModel() {
      var m = act.model;
      idx = -1;
      play.dataset.mode = "model";
      headText.textContent = m.instruction;
      count.textContent = "Example";

      right.textContent = "";

        line("q", highlight(m.question, "first")),

      right.appendChild(h("div.aa-dialog.aa-dialog--neg", null, [
        h("p.aa-dialog__label", null, "When the answer is no:"),

      only([startBtn]);
    }

    /* ---------- Ítems ---------- */
    function item() { return act.items[idx]; }

    function renderItem(focus) {
      var it = item();
      checked = false; choice = null;
      play.dataset.mode = it.kind;
      headText.textContent = act.parts[it.kind];
      count.textContent = "Question " + (idx + 1) + "/" + act.items.length;
      pointAt(it.group);
      resetFeedback();
      right.textContent = "";

        var f = right.querySelector(".wl-chip, .aa-tile");

      }
    }

    /* part 1: Are they small? — Yes, they ___. */
    var answerLine, chips;
    function paintAnswer(fresh, result) {
      var it = item();
      answerLine.textContent = "";
      answerLine.appendChild(document.createTextNode((it.yes ? "Yes" : "No") + ", they "));
      var cls = "span.wl-blank" + (choice ? ".is-filled" : "") + (result ? (result === "ok" ? ".is-ok" : ".is-no") : "");
      answerLine.appendChild(h(cls, { "aria-label": choice || "blank" },
        choice ? h("span.wl-blank__tile" + (fresh ? ".is-new" : ""), null, choice) : " "));
      answerLine.appendChild(document.createTextNode("."));
      if (result) answerLine.appendChild(badge(result === "ok"));
    }
    function renderComplete(it) {
      answerLine = h("span.aa-a--blank", { "aria-live": "polite" });
      chips = ["are", "aren't"].map(function (v) {
        var b = h("button.px-btn.wl-chip.aa-chip--" + (v === "are" ? "yes" : "no"), { type: "button", "data-verb": v, "aria-pressed": "false" }, v);
        b.addEventListener("click", function () { choose(v); });
        return b;
      });
      right.appendChild(h("div.aa-dialog", null, [
        line("q", highlight(it.question, "first")),
        line("a", answerLine, it.yes ? "yes" : "no")

      right.appendChild(h("div.wl-chips.aa-chips", { role: "group", "aria-label": "Choose the verb" }, chips));
      paintAnswer(false, null);

    function choose(v) {
      if (checked) return;

      chips.forEach(function (c) {
        var on = c.getAttribute("data-verb") === v;

    /* part 2: fitxes de la pregunta (es col·loquen a sota, a «Your question») i,
       quan la pregunta és completa, les dues respostes per triar */
    var bankBox, answerBox, answerBtns, answerChoice = null, aMark, aFix;
    function renderBuild(it) {
      var order = scramble(it.words.map(function (w, i) { return i; }));
      bank = order; placed = []; answerChoice = null;
      bankBox = h("div.aa-bank", { role: "group", "aria-label": "Words" });
      aMark = h("span.aa-row-mark");
      aFix = h("p.aa-fix", { hidden: true });
      answerBtns = act.answerModels.map(function (m) {
        var yes = /^yes/i.test(m);
        var b = h("button.px-btn.aa-answer.aa-answer--" + (yes ? "yes" : "no"), { type: "button", "data-answer": m, "aria-pressed": "false" }, m);
        b.addEventListener("click", function () { chooseAnswer(m); });
        return b;
      });
      answerBox = h("div.aa-answerbox", { hidden: true }, [
        h("p.aa-step", null, ["2. Choose the answer.", aMark]),
        h("div.aa-answers", { role: "group", "aria-label": "Answer" }, answerBtns),
        aFix
      ]);
      right.appendChild(h("p.aa-step", null, "1. Put the words in order."));
      right.appendChild(bankBox);
      right.appendChild(yourQ);
      right.appendChild(answerBox);
      qMark.textContent = ""; qFix.textContent = ""; qFix.hidden = true;
      slots.className = "aa-slots";
      paintTiles(null);
    }

    function chooseAnswer(m) {
      if (checked) return;
      answerChoice = m;
      answerBtns.forEach(function (b) {
        var on = b.getAttribute("data-answer") === m;
        b.classList.toggle("is-picked", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      updateCheck();
    }

    /* les respostes apareixen quan totes les paraules són a «Your question» */
    function syncAnswers() {
      var ready = bank.length === 0;
      if (!ready && answerChoice) chooseAnswer(null);
      var was = answerBox.hidden;
      answerBox.hidden = !ready;
      if (ready && was) { answerBox.classList.remove("is-new"); void answerBox.offsetWidth; answerBox.classList.add("is-new"); }
    }

    function paintTiles(fresh) {
      var it = item();
      bankBox.textContent = "";
      bank.forEach(function (wi) {
        var b = h("button.px-btn.aa-tile", { type: "button", "data-word": it.words[wi], disabled: checked ? true : null }, it.words[wi]);
        b.addEventListener("click", function () { place(wi); });
        bankBox.appendChild(b);
      });
      if (!bank.length) bankBox.appendChild(h("span.aa-bank__empty", null, "All the words are in your question."));
      if (answerBox) syncAnswers();
      slots.textContent = "";
      placed.forEach(function (wi) {
        var b = h("button.aa-tile.aa-tile--placed" + (fresh === wi ? ".is-new" : ""), {
          type: "button", "data-word": it.words[wi], disabled: checked ? true : null,
          "aria-label": it.words[wi] + " (tap to take it back)"
        }, it.words[wi]);
        b.addEventListener("click", function () { unplace(wi); });
        slots.appendChild(b);
      });
      if (!placed.length) slots.appendChild(h("span.aa-slots__hint", null, "Tap the words above."));
    }
    function place(wi) {
      if (checked) return;
      bank.splice(bank.indexOf(wi), 1); placed.push(wi);
      paintTiles(wi); updateCheck();
      var next = bankBox.querySelector(".aa-tile");
      (next || answerBtns[0]).focus();   /* en pantalla estreta, porta la vista on cal */
    }
    function unplace(wi) {
      if (checked) return;
      placed.splice(placed.indexOf(wi), 1); bank.push(wi);
      paintTiles(null); updateCheck();
      var back = bankBox.querySelector('.aa-tile[data-word="' + item().words[wi].replace(/"/g, '\\"') + '"]');
      if (back) back.focus({ preventScroll: true });
    }

    function updateCheck() {
      if (idx < 0) return;
      var it = item();
      checkBtn.disabled = it.kind === "complete" ? !choice : (bank.length > 0 || !answerChoice);
    }

    function check() {
      if (checked || checkBtn.disabled) return;
      var it = item();
      checked = true;   /* un sol intent */
      var ok, entry = { it: it };
      if (it.kind === "complete") {
        ok = choice === it.verb;
        paintAnswer(false, ok ? "ok" : "no");
        chips.forEach(function (c) {
          var v = c.getAttribute("data-verb");
          c.disabled = true;
          c.classList.remove("is-picked");
          if (v === choice) c.classList.add(ok ? "is-ok" : "is-no");
          else if (!ok && v === it.verb) c.classList.add("is-answer");
        });
        entry.text = it.question + " " + (it.yes ? "Yes" : "No") + ", they " + it.verb + ".";
        feedback.textContent = ok ? "Correct! " + entry.text : "Not quite. The answer is: " + (it.yes ? "Yes" : "No") + ", they " + it.verb + ".";
      } else {
        var built = placed.map(function (wi) { return it.words[wi]; });
        var qOk = built.join(" ") === it.words.join(" ");
        var aOk = answerChoice === it.answer;
        ok = qOk && aOk;
        paintTiles(null);
        answerBtns.forEach(function (b) {
          var m = b.getAttribute("data-answer");
          b.disabled = true;
          b.classList.remove("is-picked");
          if (m === answerChoice) b.classList.add(aOk ? "is-ok" : "is-no");
          else if (!aOk && m === it.answer) b.classList.add("is-answer");
        });
        slots.classList.add(qOk ? "is-ok" : "is-no");
        qMark.appendChild(badge(qOk));
        aMark.appendChild(badge(aOk));
        if (!qOk) { qFix.hidden = false; qFix.textContent = "Word order: " + questionText(it.words); }
        entry.text = questionText(it.words) + " " + it.answer;
        entry.q = qOk; entry.a = aOk;
        feedback.textContent = ok ? "Correct! " + entry.text
          : (!qOk && !aOk ? "Check the word order and the answer." : !qOk ? "The answer is right. Check the word order." : "The question is right. Check the answer.");
      }
      if (ok) correct++;
      entry.ok = ok;
      log.push(entry);
      feedback.classList.add(ok ? "is-ok" : "is-no");
      var last = idx >= act.items.length - 1;
      only([last ? resultsBtn : nextBtn]);
      (last ? resultsBtn : nextBtn).focus();
    }

    /* ---------- Resultat ---------- */
    function finish() {
      if (log.length < act.items.length) return;
      var stars = PA.grammarStars(act, correct);
      var res = PA.progression.record(map.stages, PA.progressStore.load(trackId), stageId, stars);
      if (res.reason !== "locked") {
        PA.progressStore.save(trackId, res.saved);
        PA.views.map.setPendingResult(trackId, stageId, res);
      }
      resStars.textContent = "";
      for (var i = 1; i <= 3; i++) {
        resStars.appendChild(h("img.px-star" + (i <= stars ? ".is-earned" : ""), { src: PA.asset(STAR), alt: "", width: "69", height: "67" }));
      }
      resTitle.textContent = "You got " + correct + " of " + act.items.length + "!";
      resList.textContent = "";
      log.forEach(function (d) {
        resList.appendChild(h("li.ozoo-mini" + (d.ok ? ".is-ok" : ".is-no"), null, [
          h("img.ozoo-mini__img.wl-mini__img", { src: PA.grammarImage(act, act.groups[d.it.group].image, 800), alt: "" }),
          h("span.ozoo-mini__text", null, d.text + " (" + act.groups[d.it.group].name + ")"),
          h("span.ozoo-mini__tag", { "aria-label": d.ok ? "correct" : "wrong" }, d.ok ? "✓" : "✗")
        ]));
      });
      var best = res.bestStars != null ? res.bestStars : stars;
      resBest.textContent = "Correct answers: " + correct + " of " + act.items.length + " · Your score: " + starsText(stars) + " · Best score: " + starsText(best);
      var notes = [];
      if (res.changed && res.previousBest > 0) notes.push("New best score!");
      if (!res.changed && res.previousBest > stars) notes.push("Your best score is kept.");
      if (res.newlyUnlocked && res.newlyUnlocked.length) {
        var opened = map.stages.find(function (s) { return s.id === res.newlyUnlocked[0]; });
        notes.push("Stage " + opened.index + " is now open on the map!");
      }
      if (best === 0) notes.push("Get at least " + act.stars[act.stars.length - 1].min + " right to pass this stage.");
      resNote.textContent = notes.join(" ");
      resNote.hidden = !notes.length;
      head.hidden = true; play.hidden = true; results.hidden = false;
      resTitle.focus({ preventScroll: true });
    }

    function showPlay() { head.hidden = false; play.hidden = false; results.hidden = true; }

    root = h("div.view.view--sections.view--guide.view--aa", {
      style: { "--c": accent, "--cb": bright, "--sc": accent, "--tone": accent }
    }, [
      PA.views.sections.buildHeader({
        backHref: mapHref,
        backLabel: "Tornar al mapa",
        context: course.label + " · " + unit.label + " · " + section.name,
        title: act.title
      }),
      h("main.sections.dither.wl-page.aa-page", null, [head, play, results])
    ]);

    renderModel();
    return root;
  }

  return { build: build };
})();

  <script>
/*
 * PIXEL ACADEMY — «Animal Puzzle» (Grammar 3, etapa Game)
 * ------------------------------------------------------------
 * Tres rondes amb les il·lustracions de «What are they like?».
 *   1. Put the picture together: puzle de 4 peces (ronda 1) o de 6 (rondes 2
 *      i 3), barrejat. Es toca una peça (queda ressaltada) i després una altra
 *      per intercanviar-les; tornar a tocar la mateixa la deixa anar. Funciona
 *      amb ratolí, dit o teclat (fletxes per moure's, Enter / espai per triar,
 *      Esc per deixar anar). Totes les peces tenen el mateix fons, perquè les
 *      zones transparents es llegeixin igual. Moviments lliures, sense rellotge.
 *   2. Look and choose: amb la imatge muntada (a la primera ronda, la fletxa
 *      assenyala les balenes) surten dues frases; en tocar-ne una es corregeix
 *      i apareix Next. Si és un error, la frase correcta es mostra amb are /
 *      aren't ressaltat. Només puntua la primera tria de cada ronda.
 * Resultat sobre 3 amb el motor de progressió de Grammar.
 */
window.PA = window.PA || {};
PA.views = PA.views || {};

PA.views.animalPuzzle = (function () {
  var h = PA.h;
  var STAR = "assets/img/map-nodes/stars/star-gold.png";

  function starsText(n) { return n + (n === 1 ? " star" : " stars"); }
  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  /* barreja on cap peça no queda al seu lloc */
  function derange(n) {
    var ids = [];
    for (var i = 0; i < n; i++) ids.push(i);
    var a;
    do { a = shuffle(ids); } while (a.some(function (v, k) { return v === k; }));
    return a;
  }
  function sentence(adj, verb) { return "They " + verb + " " + adj + "."; }
  /* frase amb el verb ressaltat (verd per a are, vermell per a aren't) */
  function sentenceNodes(adj, verb) {
    return [
      document.createTextNode("They "),
      h("span.wl-verb" + (verb === "aren't" ? ".is-neg" : ""), null, verb),
      document.createTextNode(" " + adj + ".")
    ];
  }

  function build(course, unit, section, stageId) {
    var map = PA.getMap(section.map);
    var trackId = course.id + "/" + unit.id + "/" + section.id;
    var stageData = map.stages.find(function (s) { return s.id === stageId; });
    var act = PA.getGrammarActivity(stageData.activity);
    var mapHref = PA.router.sectionHref(course.id, unit.id, section.id);
    var accent = (map.accent && map.accent.color) || section.color;
    var bright = (map.accent && map.accent.bright) || "#C29BFF";

    var r = 0, correct = 0, log = [];
    var slots = [], selected = -1, solved = false, answered = false;

    /* ---------- Consigna i progrés ---------- */
    var headText = h("p.signs-head__text");
    var count = h("span.signs-head__count", { "aria-live": "polite" });
    var head = h("div.signs-head.pz-head", null, [headText, count]);

    /* ---------- Tauler ---------- */
    var board = h("div.pz-board", { role: "group", "aria-label": "Puzzle" });
    var frame = h("span.wl-frame", { "aria-hidden": "true", hidden: true });
    var callout = h("span.wl-callout.aa-callout", { "aria-hidden": "true", hidden: true }, [
      h("span.aa-they", null, "they"), PA.views.whatLike.arrowDown()
    ]);
    var boardWrap = h("div.pz-art", null, [board, frame, callout]);
    var stage = h("div.wl-stage.pz-stage", null, boardWrap);
    var status = h("p.pz-status", { "aria-live": "polite" });

    /* ---------- Frases ---------- */
    var options = h("div.pz-options", { role: "group", "aria-label": "Choose the sentence", hidden: true });
    var feedback = h("p.guide-feedback.pz-feedback", { "aria-live": "polite" });
    var nextBtn = h("button.px-btn.guide-btn", { type: "button", hidden: true }, "Next");
    var resultsBtn = h("button.px-btn.guide-btn", { type: "button", hidden: true }, "See results");
    nextBtn.addEventListener("click", function () { if (answered && r < act.rounds.length - 1) { r++; startRound(); } });
    resultsBtn.addEventListener("click", finish);
    var actions = h("div.guide-actions.pz-actions", null, [nextBtn, resultsBtn]);

    /* correcció i Next a la mateixa fila, perquè la imatge no hagi de pujar */
    var after = h("div.pz-after", null, [feedback, actions]);
    var play = h("div.pz-play", null, [stage, status, options, after]);

    /* ---------- Resultat ---------- */
    var resStars = h("span.guide-results__stars", { "aria-hidden": "true" });
    var resTitle = h("h2.guide-results__title", { id: "pz-results-title", tabindex: "-1" });
    var resList = h("ol.ozoo-results__list.pz-results__list", { "aria-label": "Sentences" });
    var resBest = h("p.guide-results__best");
    var resNote = h("p.guide-results__note");
    var againBtn = h("button.px-btn.guide-btn", { type: "button" }, "Play again");
    againBtn.addEventListener("click", newGame);
    var results = h("section.guide-results.wl-results", { hidden: true, "aria-labelledby": "pz-results-title" }, [
      resStars, resTitle, resList, resBest, resNote,
      h("div.guide-results__actions", null, [
        againBtn,
        h("a.px-btn.guide-btn.guide-btn--map", { href: mapHref }, "Tornar al mapa")
      ])
    ]);

    function round() { return act.rounds[r]; }

    /* ---------- Ronda ---------- */
    function startRound() {
      var rd = round(), meta = act.images[rd.image];
      solved = false; answered = false; selected = -1;
      slots = derange(rd.cols * rd.rows);
      headText.textContent = act.puzzleInstruction;
      count.textContent = "Round " + (r + 1) + "/" + act.rounds.length;
      root.style.setProperty("--rn", (meta.w / meta.h).toFixed(4));
      board.style.setProperty("--cols", rd.cols);
      board.style.setProperty("--rows", rd.rows);
      /* URL absoluta: dins d'una variable CSS, una ruta relativa es resoldria des del full d'estils */
      var src = PA.grammarImage(act, rd.image, PA.isInline() ? 800 : 1600);
      if (!/^data:/.test(src)) src = new URL(src, document.baseURI).href;
      board.style.setProperty("--img", "url(\"" + src + "\")");
      boardWrap.style.setProperty("--ratio", meta.w + " / " + meta.h);
      boardWrap.setAttribute("data-image", rd.image);
      board.setAttribute("aria-label", "Puzzle: " + meta.alt.replace(/\.$/, "") + ". " + rd.cols * rd.rows + " pieces.");

 * ------------------------------------------------------------

 * cada una, dues cartes de la mateixa mida una al costat de l'altra, amb la
 * frase just a sota de la imatge; les dues es veuen alhora per comparar-les.
 * don't sempre amb el mateix color (vermell), i el verb i el complement iguals
 * a les dues frases. La setena contrasta aren't (com són: big, small…) i don't
 * (què fan: eat, sleep…) amb les mateixes tortugues. Progrés 1/7, Back i
 * Next; a l'última, Done registra la lliçó com a superada amb el motor de
 * progressió de Grammar i torna al mapa, que obre la casella següent.

    var backBtn = h("button.px-btn.guide-btn", { type: "button" }, "Back");

    }, [

 * ------------------------------------------------------------
 * Vuit exercicis, un cada vegada, en el format de quadern de Grammar (classes
 * d'Ask and answer): imatge a l'esquerra i pregunta a la dreta, progrés 1/8.
 *   - Les opcions són botons (barrejats a cada ítem); la tria va al buit i es
 *     pot canviar fins a Check. Als ítems de resposta curta, les dues frases
 *     senceres són els botons i la triada va a la línia de la resposta.
 *   - A les preguntes de mida, la comparativa de balenes i foques amb el marc i
 *     la fletxa «they» sobre el grup que toca; a les d'accions, la imatge és la
 *     pista; a l'últim ítem, dues cartes amb la dels tigres ressaltada.
 *   - Check: ✓ o ✗, la frase correcta amb la paraula treballada ressaltada i,
 *     si es confon aren't / don't, una pista curta en català. Després, Next.

 * progressió de Grammar (millor marca; amb 1 estrella, Grammar completat).

  <script>
/*
 * PIXEL ACADEMY — "Tot a la pantalla" (19-11-2026, petició del mestre:
 * cap exercici ha de demanar scroll). 23-11-2026: també la pàgina de la unitat,
 * els mapes i les llistes d'activitats, i la pàgina queda sense scroll
 * (html.pa-noscroll) perquè en Pix no es mogui.
 * ------------------------------------------------------------
 * PA.fit.watch(main) mesura el contingut d'una pantalla d'activitat i, si no hi
 * cap sota la capçalera, el redueix amb CSS zoom (com a mínim fins al 60 %),
 * de manera que tot es vegi sense desplaçar-se. Es torna a calcular quan canvia
 * la mida de la finestra, quan es carrega una imatge o quan canvia el contingut
 * (pregunta nova, correcció, resultats).
 * Les pantalles s'han de dissenyar perquè hi càpiguen; això és la xarxa de
 * seguretat perquè no hi hagi mai scroll.
 */
window.PA = window.PA || {};

PA.fit = (function () {
  var MIN = 0.6, current = null;

  function measure(main) {
    if (!main.isConnected) { stop(); return; }
    main.style.zoom = "";
    var top = main.getBoundingClientRect().top + window.scrollY;
    var avail = window.innerHeight - top - 4;
    var need = main.scrollHeight;
    var z = need > avail ? Math.max(MIN, Math.floor(avail / need * 100) / 100) : 1;
    main.style.zoom = z < 1 ? String(z) : "";
    /* arrodoniments: si encara sobresurt uns píxels, es redueix una mica més */
    for (var k = 0; k < 20 && z > MIN && document.documentElement.scrollHeight > window.innerHeight + 1; k++) {
      z = Math.max(MIN, Math.round((z - 0.02) * 100) / 100);
      main.style.zoom = String(z);
    }
    main.classList.toggle("is-fitted", z < 1);
    /* si ja hi cap, la pàgina queda bloquejada: sense scroll, en Pix no es mou mai */
    document.documentElement.classList.toggle("pa-noscroll",
      document.documentElement.scrollHeight <= window.innerHeight + 1 || z > MIN);
  }

  function stop() {
    document.documentElement.classList.remove("pa-noscroll");
    if (!current) return;
    current.mo.disconnect();
    window.removeEventListener("resize", current.onResize);
    current.main.removeEventListener("load", current.onResize, true);
    current = null;
  }

  function watch(main) {
    stop();
    if (!main || main.dataset.nofit) return;   /* vistes que s'escalen soles (School Run) */
    var raf = 0;
    function schedule() {
      if (raf) return;
      raf = requestAnimationFrame(function () { raf = 0; measure(main); });
    }
    var mo = new MutationObserver(function (list) {
      /* ignora els canvis d'estil propis (zoom) */
      if (list.every(function (m) { return m.type === "attributes" && m.target === main; })) return;
      schedule();
    });
    mo.observe(main, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden", "class"] });
    window.addEventListener("resize", schedule);
    main.addEventListener("load", schedule, true);   /* imatges que acaben de carregar */
    current = { main: main, mo: mo, onResize: schedule };
    schedule();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
  }

  return { watch: watch, stop: stop };
})();

    "..kghhssssesk...", "..kgghsssssk....", "..kggksssssk....", "..kgggkkskk.....", "..kggkbbbbbk....",
    "..kggkbbbbbbk...", "..kggkbbbbBsk...", "..kGgkbbbbBsk...", "...kkkbbbbbk....", "....kbbbbbbk....",
    "....kpppppk.....", "....kpppppk....."];

      var bob = Math.sin(S.t * 14) * 3, shake = S.bumpT > 0 ? Math.sin(S.t * 80) * 6 : 0;

        if (im.complete && im.naturalWidth) { ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high"; ctx.drawImage(im, x + 17, y - 52, 76, 76); ctx.imageSmoothingEnabled = false; }

    function qbox(x, y) {

      rect(x - 4, y - 44 + b, 72, 72, "#0a0f4d"); rect(x, y - 40 + b, 64, 64, "#ffd23f"); rect(x, y - 40 + b, 64, 8, "#fff1a8"); rect(x, y + 16 + b, 64, 8, "#e0a100");
      ctx.font = "bold 44px 'Pixelify Sans', monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#0a0f4d"; ctx.fillText("?", x + 32, y + 6 + b); ctx.textAlign = "left";

    function school(x, y) { rect(x, y + 10, 26, 18, "#f2d7a6"); rect(x - 2, y + 4, 30, 8, "#d8433c"); rect(x + 10, y, 6, 6, "#ffd23f"); rect(x + 10, y + 18, 6, 10, "#7a4a22"); }

    function drawHud() {
