      var(--halo);
  }
}
.guide-card:not([aria-disabled="true"]):active {
  transform: translateY(var(--px));
  background-color: color-mix(in srgb, var(--c) 30%, #ffffff);
  box-shadow: var(--o4), var(--halo);
}
.guide-card:focus-visible {
  outline: var(--px) solid var(--c);
  outline-offset: calc(var(--px) * 2.5);
}
/*
 * PIXEL ACADEMY — en Pix a la web (3r). Imatges: variables --pix-<reacció> (js/pix.js).
 * Fase 1 (22-11-2026): resultats segons les estrelles i correccions (encert / error).
 * Tot penja de <html data-course="3r">: als altres cursos no surt res.
 */

/* ---------- Saltet en aparèixer (pixelat, sense moviment continu) ---------- */
@keyframes pix-pop {
  0% { transform: translateY(18px) scale(.6); opacity: 0; }
  60% { transform: translateY(-6px) scale(1.05); opacity: 1; }
  100% { transform: none; opacity: 1; }
}
@media (prefers-reduced-motion: reduce) { [data-mascot] * { --pix-anim: none; } }

/* ---------- Resultats (quan no hi ha el Pix gran al costat) ----------
   3 estrelles celebra «Amazing!» · 2 anima «Well done!» · 1 o 0 pensa «Try again!» */
[data-mascot] .guide-results { position: relative; --pix-w: clamp(120px, 13vw, 180px); --pix-img: var(--pix-pensa); --pix-say: "Try again!"; }
[data-mascot] .guide-results:has(.guide-results__stars > .is-earned:nth-child(2)) { --pix-img: var(--pix-anima); --pix-say: "Well done!"; }
[data-mascot] .guide-results:has(.guide-results__stars > .is-earned:nth-child(3)) { --pix-img: var(--pix-celebra); --pix-say: "Amazing!"; }
[data-mascot][data-pix-side="on"] .guide-results::before, [data-mascot][data-pix-side="on"] .guide-results::after { display: none; }
[data-mascot] .guide-results::before {
  content: ""; position: absolute; z-index: 2; pointer-events: none;
  right: calc(100% + 10px); bottom: 0; width: var(--pix-w); aspect-ratio: 1;
  background: var(--pix-img) center / contain no-repeat;
  image-rendering: pixelated;
  animation: var(--pix-anim, pix-pop .42s steps(5, end) both);
}
[data-mascot] .guide-results::after {
  content: var(--pix-say); position: absolute; z-index: 2; pointer-events: none;
  right: calc(100% + 10px + var(--pix-w) * .1); bottom: calc(var(--pix-w) + 14px);
  padding: 6px 12px; white-space: nowrap;
  font-size: clamp(1rem, 1.4vw, 1.2rem); font-weight: 700; color: var(--outline, #0b1460);
  background: #fff; box-shadow: 0 0 0 3px var(--outline, #0b1460), 0 4px 0 3px var(--shadow, rgba(10, 15, 77, .25));
  animation: var(--pix-anim, pix-pop .42s .15s steps(5, end) both);
}
/* pantalles estretes: en Pix petit dins del quadre, a la cantonada de dalt (sense bombolla,
   perquè no tapi les estrelles) */
@media (max-width: 1000px) {
  [data-mascot] .guide-results { --pix-w: clamp(64px, 11vw, 90px); }
  [data-mascot] .guide-results::before { right: auto; left: 6px; top: 6px; bottom: auto; }
  [data-mascot] .guide-results::after { display: none; }
}

/* ---------- Pix gran al costat de l'activitat (js/pix.js) ---------- */
.pix-side {
  position: fixed; z-index: 40; bottom: clamp(16px, 5vh, 56px); width: var(--pix-side-w, 180px);
  display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;
}
.pix-side[hidden] { display: none; }
.pix-side__img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.pix-side__say {
  margin: 0; padding: 8px 14px; max-width: 100%; text-align: center;
  font-size: clamp(1.05rem, 1.5vw, 1.35rem); font-weight: 700; color: var(--outline, #0b1460);
  background: #fff; box-shadow: 0 0 0 3px var(--outline, #0b1460), 0 5px 0 3px var(--shadow, rgba(10, 15, 77, .25));
  position: relative;
}
.pix-side__say::after { content: ""; position: absolute; left: 50%; bottom: -13px; width: 16px; height: 10px; margin-left: -8px; background: var(--outline, #0b1460); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.pix-side.is-new .pix-side__img { animation: var(--pix-anim, pix-pop .42s steps(5, end) both); }
.pix-side.is-new .pix-side__say { animation: var(--pix-anim, pix-pop .42s .1s steps(5, end) both); }
.pix-side__say:empty { display: none; }

    <script>
/*
 * PIXEL ACADEMY — dades dels cursos i unitats
 * ------------------------------------------------------------
 * Única font de veritat de la navegació. Per afegir una unitat:
 *   1. Desa les imatges a assets/img/units/curs-N/<slug>-540.webp i -1086.webp
 *   2. Afegeix-la aquí amb `image: "curs-N/<slug>"`.
 * Una unitat amb `image: null` existeix a l'estructura però no es mostra.
 * 19-11-2026: les unitats «Starter» s'han retirat de tots els cursos (decisió del mestre);
 * es guarden a js/data/_historic/starter-units.js.
 *
 * Àrees d'aprenentatge (Vocabulary, Grammar, Reading, Listening):
 *   Una unitat amb `sections: [...]` obre el menú de quatre àrees en lloc de
 *   la pantalla provisional. Cada àrea indica el tipus (vegeu PA.sectionTypes)
 *   i la seva il·lustració: assets/img/sections/<image>-724.webp i -1448.webp
 *   (o, provisionalment, una icona pixelada: `icon: "<nom>"`, vegeu js/dom.js).
 *   Les unitats sense `sections` continuen obrint la pantalla provisional.
 *   Una àrea amb `map: "<id>"` obre aquell mapa d'etapes (vegeu js/data/maps.js).
 *   Una àrea amb `activities: "<id>"` obre una selecció de quatre activitats
 *   sempre disponibles (vegeu js/data/activities.js).
 *   Sense cap de les dues, mostra la pantalla provisional "Coming soon".
 */
window.PA = window.PA || {};

PA.subject = "English";

/* Tipus d'àrea: nom, frase breu i color permanent (iguals a totes les unitats) */
PA.sectionTypes = {
  vocabulary: { name: "Vocabulary", tagline: "Learn new words",      color: "#18B5A4" },
  grammar:    { name: "Grammar",    tagline: "Build sentences",      color: "#9462DE" },
  reading:    { name: "Reading",    tagline: "Read and understand",  color: "#438DE8" },
  listening:  { name: "Listening",  tagline: "Listen and understand", color: "#F18A50" }
};

PA.courses = [
  {
    id: "1r", num: "1", ord: "r", name: "1r de primària",
    color: "#407BE0", bright: "#65AAFF",
    units: [] // pendent de continguts i il·lustracions
  },
  {
    id: "2n", num: "2", ord: "n", name: "2n de primària",
    color: "#16A88A", bright: "#3FE3B9",
    units: [] // pendent de continguts i il·lustracions

        sections: [

          { type: "grammar",    image: "curs-3/unit-1/grammar",    map: "zoo-grammar" },
          { type: "reading",    image: "curs-3/unit-1/reading",    activities: "3r/unit-1/reading" },
          { type: "listening",  image: "curs-3/unit-1/listening",  activities: "3r/unit-1/listening" }

      { id: "unit-2",  label: "Unit 2",  title: "Off to School!", image: "curs-3/unit-2-my-school-day",
        sections: [
          { type: "vocabulary", image: "curs-3/unit-2/vocabulary", map: "school-vocabulary" },
          { type: "grammar",    image: "curs-3/unit-2/grammar",    map: "school-grammar" },
          { type: "reading",    image: "curs-3/unit-2/reading",    activities: "3r/unit-2/reading" },
          { type: "listening",  image: "curs-3/unit-2/listening",  activities: "3r/unit-2/listening" }

      },

      { id: "unit-3",  label: "Unit 3",  title: "Pizza Party!",   image: "curs-3/unit-3-i-like-cooking",

          { type: "listening",  image: "curs-3/unit-3/listening",  activities: "3r/unit-3/listening" }
        ]
      },
      /* Unit 4 (27-11-2026): parc de Hilltop. Disseny: docs/jocs/unitat-4.md */
      { id: "unit-4",  label: "Unit 4",  title: "Weekend Fun!",   image: "curs-3/unit-4-weekend-fun",
        sections: [
          { type: "vocabulary", image: "curs-3/unit-4/vocabulary", map: "park-vocabulary" },
          { type: "grammar",    image: "curs-3/unit-4/grammar",    map: "park-grammar" },
          { type: "reading",    image: "curs-3/unit-4/reading",    activities: "3r/unit-4/reading" },
          { type: "listening",  image: "curs-3/unit-4/listening",  activities: "3r/unit-4/listening" }

    color: "#9360D9", bright: "#BF8CFF",
    units: [
      { id: "unit-1",  label: "Unit 1",  title: "I am helping Mum",      image: "curs-4/unit-1-i-am-helping-mum" },
      { id: "unit-2",  label: "Unit 2",  title: "My day",                image: "curs-4/unit-2-my-day" }

  },
  {
    id: "5e", num: "5", ord: "è", name: "5è de primària",

/* Utilitats de consulta */
/* Etiqueta visible del curs: "5è", "1r"... */
PA.courses.forEach(function (c) { c.label = c.num + c.ord; });

PA.getCourse = function (id) {
  return PA.courses.find(function (c) { return c.id === id; }) || null;
};

/* Només les unitats que ja tenen il·lustració aprovada */
PA.getVisibleUnits = function (course) {
  return course.units.filter(function (u) { return u.image && u.title; });
};

PA.getUnit = function (course, unitId) {
  return PA.getVisibleUnits(course).find(function (u) { return u.id === unitId; }) || null;
};

/* Àrees d'una unitat, amb les dades del seu tipus ja incorporades */
PA.getSections = function (unit) {
  return (unit && unit.sections || []).map(function (s) {
    var t = PA.sectionTypes[s.type];
    return {
      id: s.type, image: s.image || null, icon: s.icon || null,
      name: t.name, tagline: t.tagline, color: t.color,
      map: s.map || null, activities: s.activities || null
    };
  });
};

PA.getSection = function (unit, sectionId) {
  return PA.getSections(unit).find(function (s) { return s.id === sectionId; }) || null;
};

  <script>
/*
 * PIXEL ACADEMY — DADES dels recorreguts (mapes d'etapes)
 * ------------------------------------------------------------
 * Aquest fitxer només conté dades: quin fons té cada mapa i on hi ha cada etapa.
 * L'estat del progrés (estrelles, desbloquejos) és a js/progress/, i el dibuix
 * del mapa a js/views/map.js. Així el mateix sistema serveix per a Grammar,
 * Reading, Mix i altres unitats: n'hi ha prou d'afegir-hi un mapa nou.
 *
 * Cada etapa:
 *   id        identificador únic dins del mapa
 *   type      tipus d'activitat (theory, game, exercise, challenge): decideix l'sprite
 *   label     nom visible de l'etapa
 *   position  centre de la casella en % del mapa (x d'esquerra a dreta, y de dalt a baix)
 *   maxStars  estrelles màximes (3)
 *   activity  (opcional) id de l'activitat real que obre l'etapa (p. ex. una guia
 *             de camp, js/data/field-guides.js); sense activitat, obre la prova.
 *   comingSoon (opcional) casella provisional: es veu al camí amb el títol i les

/*

 * ------------------------------------------------------------
 * Una guia de camp és una etapa d'un recorregut: primer s'exploren els animals
 * (graella + fitxa ampliada) i després es comprova amb «Find the …»: es
 * demanen TOTS els animals, un per ronda i en ordre aleatori. Cada animal
 * resolt queda marcat amb el seu nom (verd si s'ha trobat, vermell si no)
 * fins que el tauler és complet. Els encerts es converteixen en 0–3
 * estrelles segons `stars` i el resultat es desa al registre de l'etapa.
 *
 * Opcions:
 *   layout: "wide"  graella ampla (4 + 3 per a set targetes) en lloc de 3 × 3
 *   prompt          consigna de la comprovació (per defecte «Find the»)
 *   article: false  els missatges diuen «This is “eat”» en lloc de «That is the eat»
 *   failNote        missatge del resultat quan no s'arriba a 1 estrella
 *   sentence        (per element) frase de la fitxa ampliada, sota el nom
 *
 * Per fer servir una guia en una etapa: a js/data/maps.js, afegeix
 * `activity: "<id de la guia>"` a l'etapa.
 * Imatges: assets/img/field-guides/<carpeta>/<animal>-400.webp i -800.webp
 * (WebP sense pèrdua; originals a assets/source/field-guides/).
 */
window.PA = window.PA || {};

PA.fieldGuides = {
  "zoo-field-guide": {
    title: "Zoo Field Guide",
    instruction: "Tap an animal.",
    folder: "assets/img/field-guides/zoo/",
    /* encerts mínims (de 9) per a cada nombre d'estrelles; ≥ 1 estrella obre la casella següent */
    stars: [
      { min: 9, stars: 3 },
      { min: 7, stars: 2 },
      { min: 5, stars: 1 }
    ],
    /* ordre de la graella 3 × 3, per files */
    animals: [
      { id: "panda",    name: "Panda" },
      { id: "tiger",    name: "Tiger" },
      { id: "parrot",   name: "Parrot" },
      { id: "gorilla",  name: "Gorilla" },
      { id: "hippo",    name: "Hippo" },
      { id: "tortoise", name: "Tortoise",
        /* comparació breu a la fitxa (la tortuga marina és només un recurs de comparació) */
        compare: { with: { id: "sea-turtle", name: "Sea turtle", hint: "flippers" }, hint: "legs" } },
      { id: "dolphin",  name: "Dolphin" },
      { id: "seal",     name: "Seal" },

    ],
    failNote: "Find at least 4 actions to pass this stage.",
    animals: [

      { id: "sleep", name: "sleep", sentence: "Pandas sleep in trees." },
      { id: "fight", name: "fight", sentence: "Gorillas fight." },

      { id: "play",  name: "play",  sentence: "Dolphins play in the sea." },
      { id: "live",  name: "live",  sentence: "Whales live in the oceans." }
    ]
  }

PA.getFieldGuide = function (id) {
  return PA.fieldGuides[id] || null;
};

/* Estrelles (0–3) que corresponen a un nombre d'encerts */
PA.fieldGuideStars = function (guide, found) {
  for (var i = 0; i < guide.stars.length; i++) {

  }

};

PA.fieldGuideImage = function (guide, animalId, size) {

};

/*
 * PIXEL ACADEMY — DADES de Safari Snap! (fotografiar animals per encàrrec)
 * ------------------------------------------------------------
 * Al panorama del zoo hi ha els nou animals de la Zoo Field Guide, sencers,
 * cadascun al seu recinte. Una consigna escrita demana un animal cada vegada
 * («Take a photo of the tortoise.»); l'alumne el clica (o el toca, o hi apunta
 * amb les fletxes i prem Espai/Retorn). Una sola oportunitat per animal: si
 * s'equivoca, l'animal es perd i surt el següent.
 *
 *   background  panorama del zoo (px reals: width × height); no es deforma
 *   minWidth    amplada mínima de l'escena: en pantalles més estretes es
 *               desplaça per arribar a tots els recintes
 *   frame       mida del visor, en px del panorama (només visual)
 *   stars       fotos mínimes per a cada nombre d'estrelles
 *   animals     ordre de l'àlbum de referència; cada partida el barreja
 *               (ask: text de la consigna després de «Take a photo of the …»,
 *               si no és el nom; p. ex. "boy who walks to school")
 *
 * Camps opcionals (School Snap! i escenes noves):
 *   scene       escena de js/data/safari-scene-<id>.js (per defecte "zoo")
 *   cardFolder  carpeta de les cartes de l'àlbum (<id>-400.webp), si no hi ha guide
 *   sceneName   nom curt de l'escena per a l'etiqueta accessible ("School")
 *   alt         descripció del panorama
 *   ariaLabel   etiqueta de l'escena per a lectors de pantalla
 *   hitPadding  { id: px } marge de clic al voltant de la silueta (objectes prims)
 *
 * Posició i silueta de cada animal: js/data/safari-scene.js (generat per
 * tools/build_safari_scene.py). Per fer servir el joc en una etapa:
 * `activity: "<id>"` a js/data/maps.js.

function decodeMask(b64) {
  var raw = atob(b64), bits = [];
  for (var i = 0; i < raw.length; i++) {
    var byte = raw.charCodeAt(i);
    for (var k = 7; k >= 0; k--) bits.push((byte >> k) & 1);
  }
  return bits;
}

/*

 * les parts transparents del PNG queden fora. Retorna l'animal o null.
 */
PA.safariAnimalAt = function (game, x, y) {
  for (var i = 0; i < game.animals.length; i++) {
    if (silhouetteHit(game.animals[i], x, y)) return game.animals[i];
  }
  /* objectes prims (regle, campana…): un clic molt a prop també compta */
  var pad = game.hitPadding || {};
  for (var j = 0; j < game.animals.length; j++) {
    var b = game.animals[j], m = pad[b.id];
    if (!m) continue;
    for (var dy = -m; dy <= m; dy += m / 2) {
      for (var dx = -m; dx <= m; dx += m / 2) {
        if (dx * dx + dy * dy <= m * m && silhouetteHit(b, x + dx, y + dy)) return b;
      }
    }
  }
  return null;
};

function silhouetteHit(a, x, y) {
  var G = PA.safariSceneGrid, p = a.place;
  if (x < p.x || y < p.y || x >= p.x + p.w || y >= p.y + p.h) return false;
  var gx = Math.floor((x - p.x) / p.w * G), gy = Math.floor((y - p.y) / p.h * G);
  return !!a.bits[gy * G + gx];
}

  <script>
/*
 * PIXEL ACADEMY — DADES de Zoo Express (guiar el tren fins a l'estació correcta)
 * ------------------------------------------------------------
 * El tren porta una imatge al vagó i s'atura davant del desviament. Les dues
 * estacions tenen un rètol en anglès; l'alumne tria la via del nom correcte.
 * Cada partida té 9 rondes, barrejades:
 *   - animals: 5 animals diferents de la Zoo Field Guide (imatge de l'animal al
 *     vagó; rètols amb noms d'animals; tortoise = tortuga terrestre);
 *   - actions: 4 verbs diferents d'Animal Actions (la il·lustració sencera de
 *     l'acció al vagó; rètols amb verbs).
 * Cada partida nova torna a triar animals i verbs. El rètol que no és la
 * resposta és la parella confusible (`pairs`) si n'hi ha, o un altre a l'atzar;
 * la via de la resposta correcta es reparteix entre dalt i baix.
 *
 *   stars    rondes encertades (una sola oportunitat per ronda) per a cada
 *            nombre d'estrelles
 *
 * Per fer servir el joc en una etapa: `activity: "<id>"` a js/data/maps.js.
 */
window.PA = window.PA || {};

PA.expressGames = {
  "zoo-express": {
    title: "Zoo Express",
    instruction: "Look at the picture. Choose the right track.",
    sets: [
      { kind: "animal", guide: "zoo-field-guide", count: 5,
        pairs: [["dolphin", "whale"], ["seal", "whale"], ["tiger", "tortoise"], ["gorilla", "hippo"], ["panda", "parrot"]] },
      { kind: "action", guide: "animal-actions", count: 4,
        pairs: [["eat", "drink"], ["fight", "play"]] }
    ],
    stars: [
      { min: 9, stars: 3 },
      { min: 6, stars: 2 },
      { min: 3, stars: 1 }
    ]
  }
};

/*
 * Rondes d'una partida nova: { kind, guide, answer, top, bottom }.
 * `top` / `bottom` són els ids dels rètols de dalt i de baix.
 */
PA.newExpressRounds = function (game) {
  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  var rounds = [];
  game.sets.forEach(function (set) {
    var ids = PA.getFieldGuide(set.guide).animals.map(function (a) { return a.id; });
    shuffle(ids).slice(0, set.count).forEach(function (answer) {
      var partners = [];
      set.pairs.forEach(function (p) { var i = p.indexOf(answer); if (i !== -1) partners.push(p[1 - i]); });
      var other = partners.length ? shuffle(partners)[0]
        : shuffle(ids.filter(function (x) { return x !== answer; }))[0];
      rounds.push({ kind: set.kind, guide: set.guide, answer: answer, other: other });
    });
  });
  rounds = shuffle(rounds);

 * ------------------------------------------------------------
 * PA.pixelClock(h, m, opts)  esfera de ChatGPT (amb números) + canvas amb les

 *                            curta = hores), escalat amb image-rendering: pixelated.
 *                            m: 0 (o'clock) o 30 (half past).

/* Esfera del rellotge: il·lustració de ChatGPT (números 1-12, sense agulles).
   Les agulles es dibuixen per codi, píxel a píxel, en un canvas transparent
   de la mateixa graella que l'esfera (~52 píxels d'art), perquè es puguin moure. */
PA.clockFaceSrc = "assets/img/clock/clock-face-512.webp";

/* Només les agulles (canvas transparent de 52 × 52 píxels d'art) */
PA.clockHands = function (h, m, opts) {
  opts = opts || {};
  var N = 52, c = N / 2 - 0.5;
  var cv = document.createElement("canvas");
  cv.className = "px-clock__hands";
  cv.width = N; cv.height = N;
  var g = cv.getContext("2d");
  function dot(x, y, col) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), 1, 1); }
  function hand(angle, len, col) {
    for (var t = 0; t <= len; t += 0.25) {
      var x = c + t * Math.sin(angle), y = c - t * Math.cos(angle);
      dot(x, y, "#0a0f4d"); dot(x + 1, y, "#0a0f4d"); dot(x, y + 1, "#0a0f4d"); dot(x + 1, y + 1, "#0a0f4d");
    }
    for (t = 0; t <= len - 0.5; t += 0.25) {
      x = c + t * Math.sin(angle); y = c - t * Math.cos(angle);
      dot(x + 0.5, y + 0.5, col);
    }
  }
  var hh = (h % 12) + (m === 30 ? 0.5 : 0);
  hand((m / 60) * 2 * Math.PI, 12, opts.minuteColor || "#2a3a8f");  /* agulla llarga: minuts */
  hand(hh * Math.PI / 6, 8, opts.hourColor || "#e2343f");        /* agulla curta: hores */
  g.fillStyle = "#0a0f4d"; g.fillRect(Math.round(c) - 2, Math.round(c) - 2, 5, 5);

};

PA.pixelClock = function (h, m, opts) {
  opts = opts || {};
  var box = document.createElement("span");
  box.className = "px-clock" + (opts.className ? " " + opts.className : "");
  box.setAttribute("role", "img");
  box.setAttribute("aria-label", opts.label || "A clock");
  var face = document.createElement("img");
  face.className = "px-clock__face";
  face.src = PA.asset(PA.clockFaceSrc);
  face.alt = ""; face.width = 512; face.height = 512; face.decoding = "async";
  box.appendChild(face);
  box.appendChild(PA.clockHands(h, m, opts));
  return box;
};

 * Format de hash simple (sense "/") perquè els enllaços funcionin
 * també dins d'un artefacte publicat.
 */
window.PA = window.PA || {};

PA.router = (function () {
  var listeners = [];

  function parse(hash) {
    var raw = (hash || "").replace(/^#/, "");
    var match = raw.match(/^(1r|2n|3r|4t|5e|6e)(?:-(.+))?$/);
    if (!match) return { view: "home", courseId: null, unitId: null };
    var course = PA.getCourse(match[1]);
    if (!course) return { view: "home", courseId: null, unitId: null };
    var rest = match[2];
    if (rest && PA.getUnit(course, rest)) {
      return { view: "unit", courseId: course.id, unitId: rest };
    }
    /* "unit-1-vocabulary": unitat + àrea */
    if (rest) {
      var units = PA.getVisibleUnits(course);
      for (var i = 0; i < units.length; i++) {
        var prefix = units[i].id + "-";
        if (rest.indexOf(prefix) === 0) {
          var sectionId = rest.slice(prefix.length);
          if (PA.getSection(units[i], sectionId)) {
            return { view: "unit", courseId: course.id, unitId: units[i].id, sectionId: sectionId };
          }

             "vocabulary-stage-1": àrea amb mapa + etapa amb activitat real */
          var sections = PA.getSections(units[i]);

              var stageId = sectionId.slice(mp.length);
              var stage = (PA.maps[sections[j].map].stages || []).find(function (s) { return s.id === stageId; });

            var sp = sections[j].id + "-";
            if (sections[j].activities && sectionId.indexOf(sp) === 0) {
              var activityId = sectionId.slice(sp.length);
              if (PA.getActivity(sections[j].activities, activityId)) {
                return { view: "unit", courseId: course.id, unitId: units[i].id,
                         sectionId: sections[j].id, activityId: activityId };
              }
            }
          }
        }
      }
    }
    return { view: "home", courseId: course.id, unitId: null };
  }

  function current() { return parse(window.location.hash); }

  function emit() {
    var route = current();
    listeners.forEach(function (fn) { fn(route); });
  }

  return {
    parse: parse,
    current: current,
    courseHref: function (courseId) { return "#" + courseId; },
    unitHref: function (courseId, unitId) { return "#" + courseId + "-" + unitId; },
    sectionHref: function (courseId, unitId, sectionId) { return "#" + courseId + "-" + unitId + "-" + sectionId; },
    stageHref: function (courseId, unitId, sectionId, stageId) {
      return "#" + courseId + "-" + unitId + "-" + sectionId + "-" + stageId;
    },
    activityHref: function (courseId, unitId, sectionId, activityId) {
      return "#" + courseId + "-" + unitId + "-" + sectionId + "-" + activityId;
    },
    onChange: function (fn) { listeners.push(fn); },
    start: function () {
      window.addEventListener("hashchange", emit);
      emit();
    }
  };
})();

  <script>
/*
 * PIXEL ACADEMY — MAGATZEM del progrés (localStorage)
 * ------------------------------------------------------------
 * Només llegeix i desa; no decideix res (les regles són a progression.js).
 * Tot el progrés va en una sola clau, amb un apartat per recorregut:
 *
 *   localStorage["pixel-academy.progress.v1"] = {
 *     version: 1,
 *     tracks: {
 *       "3r/unit-1/vocabulary": {
 *         bestStars: { "stage-1": 3, "stage-2": 1 },   // millor puntuació de cada etapa
 *         unlocked:  ["stage-1", "stage-2", "stage-3"], // etapes desbloquejades
 *         completed: false,                              // recorregut completat
 *         updatedAt: "2026-11-15T00:40:00.000Z"
 *       }
 *     }
 *   }
 *
 * Partides a mitges (jocs que es poden reprendre, com Find the Action!) van a
 * `sessions["<curs/unitat/àrea>/<etapa>"]` de la mateixa clau; reiniciar un
 * recorregut també n'esborra les partides.
 *
 * Si el navegador no deixa fer servir localStorage (navegació privada, dades
 * bloquejades), el progrés es guarda en memòria mentre la pàgina és oberta.
 */
window.PA = window.PA || {};

PA.progressStore = (function () {
  var KEY = "pixel-academy.progress.v1";
  var memory = { version: 1, tracks: {} };

  function readAll() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return memory;
      var data = JSON.parse(raw);
      if (!data || typeof data !== "object" || !data.tracks) return memory;
      memory = data;
      return data;
    } catch (e) {
      return memory;
    }
  }

  function writeAll(data) {
    memory = data;
    try {
      window.localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      return false;
    }
  }

  return {
    key: KEY,

    /* Progrés desat d'un recorregut (o un de buit) */
    load: function (trackId) {
      var t = readAll().tracks[trackId];
      return {
        bestStars: Object.assign({}, t && t.bestStars),
        unlocked: (t && t.unlocked || []).slice(),
        completed: !!(t && t.completed)
      };
    },

    save: function (trackId, track) {
      var all = readAll();
      all.version = 1;
      all.tracks = all.tracks || {};
      all.tracks[trackId] = {
        bestStars: track.bestStars,
        unlocked: track.unlocked,
        completed: track.completed,
        updatedAt: new Date().toISOString()
      };
      return writeAll(all);
    },

    reset: function (trackId) {
      var all = readAll();
      if (all.tracks) delete all.tracks[trackId];
      if (all.sessions) {
        Object.keys(all.sessions).forEach(function (k) {
          if (k.indexOf(trackId + "/") === 0) delete all.sessions[k];
        });
      }
      return writeAll(all);
    },

    /* Partida a mitges d'una etapa (o null) */
    loadSession: function (key) {
      var s = readAll().sessions;
      return s && s[key] ? JSON.parse(JSON.stringify(s[key])) : null;
    },
    saveSession: function (key, data) {
      var all = readAll();
      all.sessions = all.sessions || {};
      all.sessions[key] = data;
      return writeAll(all);
    },
    clearSession: function (key) {
      var all = readAll();
      if (all.sessions) delete all.sessions[key];
      return writeAll(all);
    }
  };
})();

  <script>
/*
 * PIXEL ACADEMY — REGLES de progressió d'un recorregut
 * ------------------------------------------------------------
 * Funcions pures: reben les etapes (dades) i el progrés desat, i retornen
 * l'estat calculat. No toquen el DOM ni localStorage.
 *
 * Regles aprovades:
 *   - Els blocs (Vocabulary, Grammar, Reading, Mix) són independents: cada un
 *     té el seu recorregut i el seu progrés.
 *   - Dins d'un recorregut, les etapes són seqüencials.
 *   - La primera etapa està desbloquejada per defecte.
 *   - Una etapa queda superada amb 1, 2 o 3 estrelles, i llavors es desbloqueja
 *     la següent. Amb 0 estrelles, la següent continua bloquejada.
 *   - Les etapes superades es poden repetir; es conserva sempre la millor puntuació.
 *   - El recorregut queda completat quan totes les etapes estan superades
 *     (no cal tenir 3 estrelles a totes).
 *   - Les caselles provisionals (comingSoon) es veuen al camí però no es poden
 *     jugar: no compten per a les estrelles ni per completar el recorregut, i la
 *     cadena de desbloqueig les salta (la casella següent depèn de l'última
 *     casella jugable anterior).
 *   - Una etapa amb `requires` s'obre quan aquella etapa concreta està superada
 *     (en lloc de l'anterior del camí).
 *   - Una etapa amb `keepUnlocked` continua oberta per a qui ja la tenia
 *     desbloquejada (és a la llista `unlocked` desada o ja hi té estrelles),
 *     encara que després s'hagi afegit una etapa nova abans al camí.
 *   - MODE MESTRE (només al navegador del mestre, PA.mestre): totes les etapes
 *     jugables surten obertes per poder-les provar. No canvia el que es desa:
 *     el progrés desat es calcula sempre com si el mode estigués apagat.
 *   - Una etapa amb `open` està sempre oberta (es pot jugar sense superar les
 *     anteriors). No canvia l'ordre del camí per a la resta d'etapes.
 */
window.PA = window.PA || {};

/* Mode mestre: s'encén/s'apaga tocant 5 cops seguits el títol PIXEL ACADEMY
   de la portada (js/main.js). Es guarda només en aquest navegador. */
PA.mestre = (function () {
  var KEY = "pixel-academy.mestre";
  function on() { try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; } }
  function set(v) { try { if (v) localStorage.setItem(KEY, "1"); else localStorage.removeItem(KEY); } catch (e) {} }
  return { on: on, set: set, toggle: function () { set(!on()); return on(); } };
})();

PA.progression = (function () {
  var PASS = 1; /* estrelles mínimes per superar una etapa */

  function clampStars(stars, max) {
    stars = Math.round(Number(stars) || 0);
    return Math.max(0, Math.min(max, stars));
  }

  /* Estat calculat de cada etapa a partir de les millors puntuacions */
  function compute(stages, saved, opts) {
    var totObert = !(opts && opts.real) && PA.mestre.on();
    var best = (saved && saved.bestStars) || {};
    var savedUnlocked = (saved && saved.unlocked) || [];
    var previousPassed = true; /* la primera etapa sempre està desbloquejada */
    var currentFound = false;
    var totalStars = 0, maxStars = 0, passedCount = 0;
    var passedById = {};

    var list = stages.map(function (s) {
      if (s.comingSoon) {
        return Object.assign({}, s, {
          bestStars: 0, unlocked: false, passed: false, current: false, state: "soon"
        });
      }
      var bestStars = clampStars(best[s.id], s.maxStars);
      var unlocked = (totObert || s.open) ? true : s.requires ? !!passedById[s.requires] : previousPassed;
      if (!unlocked && s.keepUnlocked && (savedUnlocked.indexOf(s.id) !== -1 || clampStars(best[s.id], s.maxStars) > 0)) {
        unlocked = true;   /* accés conservat d'abans del canvi de camí */
      }
      var passed = unlocked && bestStars >= PASS;
      passedById[s.id] = passed;
      /* actual = la primera etapa desbloquejada que encara no s'ha superat */
      var current = unlocked && !passed && !currentFound && !s.open;
      if (current) currentFound = true;
      previousPassed = passed;
      if (passed) passedCount++;
      totalStars += unlocked ? bestStars : 0;
      maxStars += s.maxStars;
      return Object.assign({}, s, {
        bestStars: unlocked ? bestStars : 0,
        unlocked: unlocked,
        passed: passed,
        current: current,
        state: !unlocked ? "locked" : passed ? "passed" : "available"
      });
    });

    var playable = stages.filter(function (s) { return !s.comingSoon; }).length;
    return {
      stages: list,
      completed: passedCount === playable && playable > 0,
      passedCount: passedCount,
      totalStages: playable,
      totalStars: totalStars,
      maxStars: maxStars
    };
  }

  /* Progrés que s'ha de desar (millors puntuacions + desbloquejos + completat) */
  function toSaved(stages, bestStars, previousUnlocked) {
    var state = compute(stages, { bestStars: bestStars, unlocked: previousUnlocked || [] }, { real: true });
    return {
      bestStars: bestStars,
      unlocked: state.stages.filter(function (s) { return s.unlocked; }).map(function (s) { return s.id; }),
      completed: state.completed
    };
  }

  /*
   * Registra el resultat d'un intent. Retorna el nou progrés per desar i un
   * resum del que ha canviat. Si l'etapa està bloquejada, no canvia res.
   */
  function record(stages, saved, stageId, stars) {
    var before = compute(stages, saved);
    var stage = before.stages.find(function (s) { return s.id === stageId; });
    if (!stage || !stage.unlocked) {
      return { saved: saved, changed: false, reason: "locked" };
    }

    var got = clampStars(stars, stage.maxStars);
    var bestStars = Object.assign({}, saved.bestStars);
    var previousBest = stage.bestStars;
    if (got > previousBest) bestStars[stageId] = got; /* només millora, mai empitjora */

    var next = toSaved(stages, bestStars, saved.unlocked);
    var after = compute(stages, next);
    var newlyUnlocked = after.stages.filter(function (s, i) {
      return s.unlocked && !before.stages[i].unlocked;
    }).map(function (s) { return s.id; });

    return {
      saved: next,
      changed: got > previousBest,
      stars: got,
      previousBest: previousBest,
      bestStars: Math.max(previousBest, got),
      passed: got >= PASS,
      newlyUnlocked: newlyUnlocked,
      justCompleted: after.completed && !before.completed
    };
  }

  return { PASS: PASS, compute: compute, record: record, toSaved: toSaved };
})();

 * ------------------------------------------------------------
 * Funcions pures, com progression.js però sense desbloqueig: totes les
 * activitats estan sempre disponibles. Es desa amb el mateix magatzem
 * (PA.progressStore), amb una entrada per curs/unitat/bloc i, a dins,

 * El conjunt consta com a completat quan totes les activitats tenen ≥ 1 estrella.

window.PA = window.PA || {};

PA.scores = (function () {
  function clamp(n, max) {
    n = Math.round(Number(n) || 0);
    return Math.max(0, Math.min(max, n));
  }

  /* Estat calculat: millor puntuació de cada activitat i totals */
  function compute(items, saved) {
    var best = (saved && saved.bestStars) || {};
    var total = 0, max = 0, done = 0;
    var list = items.map(function (it) {
      var b = clamp(best[it.id], it.maxStars);
      total += b; max += it.maxStars; if (b >= 1) done++;
      return Object.assign({}, it, { bestStars: b, done: b >= 1 });
    });
    return { items: list, totalStars: total, maxStars: max, doneCount: done, completed: done === items.length };
  }

  /* Registra un intent; només millora la marca, mai l'empitjora */
  function record(items, saved, itemId, stars) {
    var item = items.find(function (it) { return it.id === itemId; });
    if (!item) return { saved: saved, changed: false };
    var got = clamp(stars, item.maxStars);
    var bestStars = Object.assign({}, saved && saved.bestStars);
    var previous = clamp(bestStars[itemId], item.maxStars);
    if (got > previous) bestStars[itemId] = got;
    var state = compute(items, { bestStars: bestStars });
    return {
      saved: {
        bestStars: bestStars,
        unlocked: items.map(function (it) { return it.id; }), /* sempre totes */
        completed: state.completed
      },
      changed: got > previous,
      stars: got,
      previousBest: previous,
      bestStars: Math.max(previous, got)
    };
  }

  return { compute: compute, record: record };
})();

  <script>
/*
 * PIXEL ACADEMY — DIBUIX del mapa d'etapes i interacció
 * ------------------------------------------------------------
 * Fa servir:
 *   - PA.getMap()        → dades del recorregut   (js/data/maps.js)
 *   - PA.progressStore   → progrés desat          (js/progress/store.js)
 *   - PA.progression     → regles i estat calculat (js/progress/progression.js)
 *
 * Estats de les caselles: bloquejada, disponible, superada, actual (la
 * següent etapa a fer) i provisional («Coming soon», encara sense activitat). En clicar una etapa disponible o superada s'obre una
 * finestra de prova per simular el resultat (0–3 estrelles); encara no hi ha
 * activitats reals.
 */
window.PA = window.PA || {};
PA.views = PA.views || {};

PA.views.map = (function () {
  var h = PA.h;
  var STAR = "assets/img/map-nodes/stars/star-gold.png";

  function bgAttrs(map) {
    var a = PA.asset(map.background + "-742.webp");
    var b = PA.asset(map.background + "-1484.webp");
    if (PA.isInline()) return { src: b };
    return { src: b, srcset: a + " 742w, " + b + " 1484w", sizes: "(min-width: 760px) 70vw, 680px" };
  }

  /* Candau pixelat (SVG de rectangles, sempre nítid) */
  function padlock() {
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 11 12");
    svg.setAttribute("class", "map-stage__lock");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("shape-rendering", "crispEdges");
    var px = [
      /* contorn fosc */
      ["#0a0f4d", [[3,0,5,1],[2,1,1,1],[8,1,1,1],[1,2,1,3],[9,2,1,3],[0,5,11,1],[0,6,1,5],[10,6,1,5],[0,11,11,1]]],
      /* arc gris */
      ["#c9cbd6", [[3,1,5,1],[2,2,1,3],[8,2,1,3]]],
      /* cos daurat */
      ["#ffc928", [[1,6,9,5]]],
      ["#ffe27a", [[1,6,9,1]]],
      ["#d98a00", [[1,10,9,1]]],
      /* forat del pany */
      ["#0a0f4d", [[5,7,1,2],[4,8,3,1]]]
    ];
    px.forEach(function (group) {
      group[1].forEach(function (r) {
        var rect = document.createElementNS(ns, "rect");
        rect.setAttribute("x", r[0]); rect.setAttribute("y", r[1]);
        rect.setAttribute("width", r[2]); rect.setAttribute("height", r[3]);
        rect.setAttribute("fill", group[0]);
        svg.appendChild(rect);
      });
    });
    return svg;
  }

  /* Il·lustració d'una casella: sprite + tres estrelles superposades
     exactament sobre les dibuixades (daurades si s'han guanyat, grises si no) */
  function stageArt(stage, className) {
    var stars = stage.starSpots.map(function (spot, i) {
      return h("img.stage-art__star", {
        src: PA.asset(STAR), alt: "", width: "69", height: "67", "data-n": i + 1,
        style: {
          "--sx": (spot[0] / PA.stageSprite.width * 100).toFixed(3),
          "--sy": (spot[1] / PA.stageSprite.height * 100).toFixed(3),
          "--sw": (PA.stageSprite.starSize / PA.stageSprite.width * 100).toFixed(3)
        }
      });
    });
    return h("span.stage-art" + (className ? "." + className : ""), null, [
      h("img.stage-art__sprite", { src: PA.asset(stage.sprite), alt: "", width: "384", height: "341", decoding: "async" }),
      h("span.stage-art__stars", null, stars)
    ]);
  }

  function paintStars(artEl, bestStars) {
    [].forEach.call(artEl.querySelectorAll(".stage-art__star"), function (star) {
      star.classList.toggle("is-earned", Number(star.getAttribute("data-n")) <= bestStars);
    });
  }

  function starsText(n, max) {
    return n + (n === 1 ? " star" : " stars") + " of " + max;
  }

  function build(course, unit, section) {
    var map = PA.getMap(section.map);
    var trackId = course.id + "/" + unit.id + "/" + section.id;
    var saved = PA.progressStore.load(trackId);
    var state = PA.progression.compute(map.stages, saved);
    var total = map.stages.length;          /* caselles al camí (també les provisionals) */
    /* Accent del recorregut (p. ex. violeta a Grammar). Sense accent, es fan
       servir el color del curs i el del marc de cada casella, com a Vocabulary. */
    var accent = map.accent;
    function tone(stage) { return accent ? accent.color : stage.color; }
    var nodes = {};       /* id → { item, button, art, label } */
    var dialogStage = null;
    var opener = null;

    /* ---------- Progrés a la capçalera ---------- */
    var chipStars = h("span.map-progress__stars");
    var chipStages = h("span.map-progress__stages");
    var chipText = h("span.visually-hidden");
    var chip = h("span.map-progress", null, [
      h("img.map-progress__icon", { src: PA.asset(STAR), alt: "", width: "69", height: "67" }),
      h("span", { "aria-hidden": "true" }, [chipStars, chipStages]),
      chipText
    ]);

    /* ---------- Avisos per a lectors de pantalla ---------- */
    var live = h("p.visually-hidden", { "aria-live": "polite" });

    /* ---------- Finestra de prova ---------- */
    var dArtSlot = h("span.stage-dialog__art");
    var dKicker = h("p.stage-dialog__kicker");
    var dTitle = h("h2.stage-dialog__title", { id: "stage-dialog-title" });
    var dBest = h("p.stage-dialog__best");
    var simButtons = [1, 2, 3, 0].map(function (n) {
      var label = n === 0 ? "Fail / 0 stars" : "Get " + n + (n === 1 ? " star" : " stars");
      var b = h("button.px-btn.sim-btn" + (n === 0 ? ".sim-btn--fail" : ""), { type: "button", "data-stars": n }, label);
      b.addEventListener("click", function () { applyResult(n); });
      return b;
    });
    var dClose = h("button.back-btn.stage-dialog__close", { type: "button" }, [
      PA.pixelArrow("left"), h("span", null, "Tornar al mapa")
    ]);
    var dialog = h("dialog.stage-dialog", { "aria-labelledby": "stage-dialog-title" },
      h("div.stage-dialog__panel", null, [
        dArtSlot,
        dKicker,
        dTitle,
        dBest,
        h("p.stage-dialog__note", null, "Prova de resultat (simulació, sense activitat real)"),
        h("div.stage-dialog__sim", { role: "group", "aria-label": "Simular resultat" }, simButtons),
        dClose
      ]));
    dClose.addEventListener("click", function () { dialog.close(); });
    dialog.addEventListener("click", function (e) { if (e.target === dialog) dialog.close(); });
    dialog.addEventListener("close", function () {
      if (opener && document.contains(opener)) opener.focus({ preventScroll: true });
    });

    function openStage(id, button) {
      var stage = findStage(id);
      if (!stage || !stage.unlocked) return;
      dialogStage = stage;
      opener = button;
      dArtSlot.textContent = "";
      var art = stageArt(stage);
      paintStars(art, stage.bestStars);
      dArtSlot.appendChild(art);
      dKicker.textContent = section.name + " · Stage " + stage.index + " of " + total;
      dTitle.textContent = stage.label;
      dBest.textContent = stage.passed
        ? "Best score: " + starsText(stage.bestStars, stage.maxStars)
        : "Not passed yet";
      dialog.style.setProperty("--tone", tone(stage));
      dialog.showModal();
      simButtons[0].focus();
    }

    /* número de l'última casella jugable abans d'aquesta (salta les provisionals) */
    function previousPlayable(index) {
      for (var i = index - 2; i >= 0; i--) if (!map.stages[i].comingSoon) return i + 1;
      return index - 1;
    }

    function findStage(id) {
      return state.stages.find(function (s) { return s.id === id; }) || null;
    }

    /* ---------- Resultat simulat → regles → desar → redibuixar ---------- */
    function applyResult(stars) {
      if (!dialogStage) return;
      var id = dialogStage.id;
      var res = PA.progression.record(map.stages, saved, id, stars);
      if (res.reason === "locked") { dialog.close(); return; }
      saved = res.saved;
      PA.progressStore.save(trackId, saved);
      state = PA.progression.compute(map.stages, saved);
      dialog.close();
      render({ stageId: id, result: res });
    }

    /* ---------- Casella ---------- */
    function buildStage(stage) {
      var art = stageArt(stage, "map-stage__art");
      var label = h("span.map-stage__label", { "aria-hidden": "true" });
      var button = h("button.map-stage", { type: "button", "data-stage-id": stage.id, style: { "--tone": tone(stage) } }, [
        art, padlock(), label,
        /* número de pas sempre visible (només als recorreguts que ho demanen) */
        map.numbered ? h("span.map-stage__num", { "aria-hidden": "true" }, String(stage.index)) : null,
        stage.comingSoon ? h("span.map-stage__soon", { "aria-hidden": "true" }, "Coming soon") : null
      ]);
      button.addEventListener("click", function () {
        var s = findStage(stage.id);
        if (s && s.unlocked && s.activity) {
          /* etapa amb activitat real: obre la seva pantalla */
          window.location.hash = PA.router.stageHref(course.id, unit.id, section.id, s.id);
        } else if (s && s.unlocked) {
          openStage(stage.id, button);
        } else if (s && s.comingSoon) {
          button.classList.remove("is-denied");
          void button.offsetWidth;
          button.classList.add("is-denied");
          live.textContent = "Stage " + stage.index + ", " + stage.label + ": coming soon.";
          if (PA.pixMood) setTimeout(function () { PA.pixMood("pensa", "Coming soon!"); }, 0);
        } else {
          /* bloquejada: no s'hi entra; petita sacsejada com a resposta */
          button.classList.remove("is-denied");
          void button.offsetWidth;
          button.classList.add("is-denied");
          live.textContent = "Stage " + stage.index + " is locked. Get at least 1 star in stage " + previousPlayable(stage.index) + ".";
          /* en Pix pensa (després del toc, perquè el mateix toc no l'esborri) */
          if (PA.pixMood) setTimeout(function () { PA.pixMood("pensa", "Finish the last one first!"); }, 0);
        }
      });
      button.addEventListener("animationend", function (e) {
        if (e.animationName === "stage-denied") button.classList.remove("is-denied");
        if (e.animationName === "stage-unlock") button.classList.remove("is-unlocking");
      });
      var item = h("li.map__stage", {
        style: { "--x": stage.position.x, "--y": stage.position.y, "--node-w": map.nodeWidth }
      }, button);
      nodes[stage.id] = { item: item, button: button, art: art, label: label };
      return item;
    }

    /* ---------- Indicador de recorregut completat (a la porta del zoo) ---------- */
    var goal = h("div.map__goal", {
      style: { "--x": map.goal.position.x, "--y": map.goal.position.y },
      "aria-hidden": "true"
    }, [h("img.map__goal-star", { src: PA.asset(STAR), alt: "" }), h("span", null, "Completed!")]);

    /* ---------- Dibuix segons l'estat ---------- */
    function render(change) {
      state.stages.forEach(function (s) {
        var n = nodes[s.id];
        n.button.setAttribute("data-state", s.state);
        n.button.classList.toggle("is-current", s.current);
        n.button.setAttribute("aria-disabled", s.unlocked ? "false" : "true");
        paintStars(n.art, s.bestStars);
        var status = s.comingSoon ? "coming soon"
          : !s.unlocked ? "locked"
          : s.passed ? starsText(s.bestStars, s.maxStars)
          : "not passed yet";
        n.button.setAttribute("aria-label", "Stage " + s.index + " of " + total + ": " + s.label + " — " + status);
        n.label.textContent = s.index + " · " + s.label + (s.comingSoon ? " · Coming soon" : s.unlocked ? "" : " · Locked");
      });

      chipStars.textContent = state.totalStars + " / " + state.maxStars;
      chipStages.textContent = state.completed ? "Completed!" : state.passedCount + "/" + state.totalStages + " stages";
      chip.classList.toggle("is-complete", state.completed);
      chipText.textContent = "Progress: " + state.totalStars + " of " + state.maxStars + " stars, " +
        state.passedCount + " of " + state.totalStages + " stages passed" + (state.completed ? ". Completed!" : ".");
      goal.classList.toggle("is-visible", state.completed);

      if (!change) return;
      var res = change.result;
      var msg = "Stage " + findStage(change.stageId).index + ": " + starsText(res.stars, 3) + ". ";
      if (res.changed && res.previousBest > 0) msg += "New best score! ";
      if (!res.changed && res.previousBest > 0) msg += "Your best score (" + res.previousBest + ") is kept. ";
      if (!res.passed && res.previousBest === 0) msg += "Try again to unlock the next stage. ";

      if (res.changed) nodes[change.stageId].button.classList.add("is-scoring");
      res.newlyUnlocked.forEach(function (id) {
        var b = nodes[id].button;
        b.classList.add("is-unlocking");
        msg += "Stage " + findStage(id).index + " unlocked! ";
      });
      /* en Pix celebra quan s'obre una casella nova o s'acaba el mapa */
      if (PA.pixMood && (res.newlyUnlocked.length || res.justCompleted)) PA.pixMood("celebra", res.justCompleted ? "You did it!" : "New level!");
      if (res.justCompleted) {
        goal.classList.add("is-popping");
        msg += section.name + " completed!";
      }
      if (!res.passed && res.previousBest === 0) nodes[change.stageId].button.classList.add("is-denied");
      setTimeout(function () {
        Object.keys(nodes).forEach(function (k) { nodes[k].button.classList.remove("is-scoring"); });
        goal.classList.remove("is-popping");
      }, 900);
      live.textContent = msg;
    }

    /* ---------- Reiniciar (per a proves) ---------- */
    var resetBtn = h("button.px-btn.px-btn--small.map-reset", { type: "button" }, "Reiniciar el progrés de prova");
    var resetTimer = null;
    resetBtn.addEventListener("click", function () {
      if (!resetBtn.classList.contains("is-confirming")) {
        resetBtn.classList.add("is-confirming");
        resetBtn.textContent = "Segur? Torna a clicar per esborrar-lo";
        resetTimer = setTimeout(function () {
          resetBtn.classList.remove("is-confirming");
          resetBtn.textContent = "Reiniciar el progrés de prova";
        }, 3500);
        return;
      }
      clearTimeout(resetTimer);
      PA.progressStore.reset(trackId);
      saved = PA.progressStore.load(trackId);
      state = PA.progression.compute(map.stages, saved);
      resetBtn.classList.remove("is-confirming");
      resetBtn.textContent = "Reiniciar el progrés de prova";
      render();
      live.textContent = "Progress reset.";
    });

    /* ---------- Muntatge ---------- */
    var mapEl = h("div.map", { style: { "--map-ratio": map.width + " / " + map.height, "--map-w": map.width } }, [
      h("img.map__bg", Object.assign({
        alt: map.alt, width: String(map.width), height: String(map.height), decoding: "async"
      }, bgAttrs(map))),
      goal,
      h("ol.map__stages", { "aria-label": "Etapes de " + section.name }, map.stages.map(buildStage))
    ]);

    var hero = PA.views.sections.buildHeader({
      backHref: PA.router.unitHref(course.id, unit.id),
      backLabel: "Tornar a " + unit.label,
      context: course.label + " · " + unit.label,
      title: section.name,
      extra: chip
    });

    var root = h("div.view.view--sections.view--map" + (accent ? ".has-accent" : ""), {
      style: {
        "--c": accent ? accent.color : course.color,
        "--cb": accent ? accent.bright : course.bright,
        "--sc": section.color
      }
    }, [
      hero,
      h("main.sections.dither.map-page", null, [
        h("div.map-scroll", null, mapEl),
        h("div.map-footer", null, resetBtn),
        live,
        dialog
      ])
    ]);

    render();

    /* En tornar d'una activitat real amb un resultat nou: mateixa animació
       que amb la prova (estrelles, desbloqueig, completat) */
    if (pending && pending.trackId === trackId) {
      var change = { stageId: pending.stageId, result: pending.result };
      pending = null;
      render(change);
    }
    return root;
  }

  var pending = null;

  return {
    build: build,
    /* una activitat real hi deixa el resultat abans de tornar al mapa */
    setPendingResult: function (trackId, stageId, result) {
      pending = { trackId: trackId, stageId: stageId, result: result };
    }
  };
})();

  <script>
/*
 * PIXEL ACADEMY — selecció de quatre activitats (Reading, Listening...)
 * ------------------------------------------------------------
 * Un sol component per a tots els conjunts. Es configura amb:
 *   - l'àrea (bloc) i el curs/unitat              → js/data/courses.js
 *   - títols, colors i tipus de pantalla           → js/data/activities.js
 *   - puntuacions i progrés                        → js/progress/scores.js + store.js
 * Sense mapa ni desbloqueig: les quatre targetes sempre estan disponibles.
 * En obrir-ne una es mostra la pantalla provisional del seu tipus (amb espais
 * reservats) i una prova per simular el resultat (0–3 estrelles).
 */
window.PA = window.PA || {};
PA.views = PA.views || {};

PA.views.activities = (function () {
  var h = PA.h;
  var STAR = "assets/img/map-nodes/stars/star-gold.png";
  var lastResult = null; /* per animar la targeta en tornar d'una activitat */

  function load(set) {
    var saved = PA.progressStore.load(set.id);
    return { saved: saved, state: PA.scores.compute(set.items, saved) };
  }

  function starsText(n, max) {
    return n + (n === 1 ? " star" : " stars") + " of " + max;
  }

  /* Fila de tres estrelles: daurades les guanyades, grises les pendents */
  function starRow(best, max, className) {
    var stars = [];
    for (var i = 1; i <= max; i++) {
      stars.push(h("img.px-star" + (i <= best ? ".is-earned" : ""), {
        src: PA.asset(STAR), alt: "", width: "69", height: "67"
      }));
    }
    return h("span." + className, { "aria-hidden": "true" }, stars);
  }

  function progressChip(state) {
    return h("span.map-progress" + (state.completed ? ".is-complete" : ""), null, [
      h("img.map-progress__icon", { src: PA.asset(STAR), alt: "", width: "69", height: "67" }),
      h("span", { "aria-hidden": "true" }, [
        h("span.map-progress__stars", null, state.totalStars + " / " + state.maxStars),
        h("span.map-progress__stages", null, state.doneCount + "/" + state.items.length + " done")
      ]),
      h("span.visually-hidden", null, "Progress: " + state.totalStars + " of " + state.maxStars +
        " stars, " + state.doneCount + " of " + state.items.length + " activities done.")
    ]);
  }

  /* ---------- Pantalla de selecció: quatre targetes 2 × 2 ---------- */
  function buildSet(course, unit, section) {
    var set = PA.getActivitySet(section.activities);
    var st = load(set).state;
    var highlight = lastResult && lastResult.setId === set.id ? lastResult : null;
    lastResult = null;

    var cards = st.items.map(function (it, i) {
      var status = it.done ? starsText(it.bestStars, it.maxStars) : "not done yet";
      /* targeta provisional (U4, 27-11-2026): es veu amb el títol però encara no s'hi entra */
      if (it.comingSoon) {
        return h("li.sections-grid__item", { style: { "--n": i } }, h("span.activity-card.is-soon", {
          "aria-label": it.title + " — coming soon", style: { "--tone": it.color } }, [
          h("span.activity-card__title", null, it.title),
          h("span.activity-card__soon", null, "Coming soon")
        ]));
      }
      var card = h("a.activity-card", {
        href: PA.router.activityHref(course.id, unit.id, section.id, it.id),
        "aria-label": it.title + " — " + status,
        style: { "--tone": it.color }
      }, [
        h("span.activity-card__title", null, it.title),
        starRow(it.bestStars, it.maxStars, "activity-card__stars")
      ]);
      if (highlight && highlight.itemId === it.id && highlight.changed) card.classList.add("is-scoring");
      return h("li.sections-grid__item", { style: { "--n": i } }, card);
    });

    return h("div.view.view--sections.view--activities", {
      style: { "--c": course.color, "--cb": course.bright, "--sc": section.color }
    }, [
      PA.views.sections.buildHeader({
        backHref: PA.router.unitHref(course.id, unit.id),
        backLabel: "Tornar a " + unit.label,
        context: course.label + " · " + unit.label,
        title: section.name,
        extra: progressChip(st)
      }),
      h("main.sections.dither", null, [
        h("ul.sections-grid.activity-grid", { "aria-label": section.name + " activities" }, cards),
        highlight ? h("p.visually-hidden", { "aria-live": "polite" }, highlight.message) : null
      ])
    ]);
  }

  /* ---------- Pantalla provisional d'una activitat ---------- */
  function buildActivity(course, unit, section, activityId) {
    var set = PA.getActivitySet(section.activities);
    var data = load(set);
    var item = data.state.items.find(function (it) { return it.id === activityId; });
    var setHref = PA.router.sectionHref(course.id, unit.id, section.id);
    /* activitat real (Reading / Listening): motor PA.views.skill */
    if (item.activity && PA.getSkillActivity && PA.getSkillActivity(item.activity)) {
      return PA.views.skill.buildItem(course, unit, section, item, set);
    }

    var slots = set.screenDef.placeholders.map(function (p) {
      return h("section.activity-slot.activity-slot--" + p.key, null, [
        h("h2.activity-slot__title", null, p.title),
        h("p.activity-slot__note", null, p.note)
      ]);
    });

    var sim = [1, 2, 3, 0].map(function (n) {
      var label = n === 0 ? "Fail / 0 stars" : "Get " + n + (n === 1 ? " star" : " stars");
      var b = h("button.px-btn.sim-btn" + (n === 0 ? ".sim-btn--fail" : ""), { type: "button", "data-stars": n }, label);
      b.addEventListener("click", function () {

 *      - encert → la targeta queda verda, amb ✓ i el nom;

 *    estrella obre la casella següent).

  var STAR = "assets/img/map-nodes/stars/star-gold.png";
  var PAUSE_OK = 750;    /* ms abans de la ronda següent després d'un encert */
  var PAUSE_NO = 1700;   /* més temps després d'un error, per veure quin era */

    /* ---------- Fitxa ampliada ---------- */
    var dImg = h("img.guide-dialog__img", { alt: "", width: "800", height: "800" });
    var dName = h("h2.guide-dialog__name", { id: "guide-dialog-name" });
    var dSentence = h("p.guide-dialog__sentence", { hidden: true });
    var dCompare = h("div.guide-compare", { hidden: true });
    var dClose = h("button.px-btn.guide-btn.guide-dialog__close", { type: "button" }, "Tancar");

    var canSpeak = "speechSynthesis" in window && PA.views.skill && PA.views.skill.speak;
    var dListen = canSpeak ? h("button.px-btn.sk-play.guide-dialog__listen", { type: "button" },
      [PA.views.skill.speakerIcon(false), "Listen"]) : null;
    var current = null;

      h("div.guide-dialog__panel", null, [dImg, dName, dSentence, dListen, dCompare, dClose].filter(Boolean)));
    var opener = null;
    dClose.addEventListener("click", function () { dialog.close(); });
    dialog.addEventListener("click", function (e) { if (e.target === dialog) dialog.close(); });

    }

    function openCard(a, btn) {

      dImg.src = PA.fieldGuideImage(guide, a.id, PA.isInline() ? 400 : 800);
      dImg.alt = a.name;

      banner.classList.remove("is-quiz");
      grid.hidden = true;
      banner.hidden = true;
      actions.hidden = true;

    }

    var root = h("div.view.view--sections.view--guide", {
      style: { "--c": section.color, "--cb": "#7FE3D6", "--sc": section.color, "--tone": section.color }
    }, [
      PA.views.sections.buildHeader({
        backHref: mapHref,
        backLabel: "Tornar al mapa",

        actions,
        results,
        dialog

    return root;
  }

  return { build: build, mark: mark };
})();

  <script>
/*
 * PIXEL ACADEMY — Secret Zoo Signs (etapa Exercise d'un recorregut)

 * l'animal sense el nom, una casella buida per lletra i les fitxes desordenades.
 *   - clicar/tocar una fitxa del banc → ocupa la primera casella buida;
 *   - clicar/tocar una lletra col·locada → torna al seu lloc del banc;
 *   - teclat: Tab entre fitxes i botons (Retorn/Espai); escriure una lletra la
 *     col·loca; Retrocés retira l'última lletra col·locada.
 * «Check» s'activa amb totes les caselles plenes. Encert → el rètol s'il·lumina
 * amb el nom i surt «Next». Error → «Try again!» i es pot corregir; després de
 * dos intents fallits també surt «Show word» (mostra el nom i no puntua).
 *
 * Puntuació: rètols resolts sense revelar (encara que s'hagin corregit):
 * 3 → 1 estrella, 6 → 2, 9 → 3. Es desa amb el motor de progressió dels mapes
 * cada vegada que puja (millor marca; ≥ 1 estrella obre la casella següent).
 */
window.PA = window.PA || {};
PA.views = PA.views || {};

PA.views.wordSigns = (function () {
  var h = PA.h;

    var game = PA.getWordSigns(map.stages.find(function (s) { return s.id === stageId; }).activity);
    var guide = PA.getFieldGuide(game.guide);
    var mapHref = PA.router.sectionHref(course.id, unit.id, section.id);
    var savedAtStart = PA.progressStore.load(trackId);
    var total = game.words.length;

    var idx, solved, log, round, lastRes = null, savedStars = 0;

    /* ---------- Capçalera de l'activitat ---------- */

    /* ---------- Rètol ---------- */
    var art = h("img.zoo-sign__img", { alt: "", width: "400", height: "400", decoding: "async" });
    var slotsEl = h("ol.zoo-sign__slots", { "aria-label": "Sign" });
    var sign = h("figure.zoo-sign", null, [
      h("div.zoo-sign__board", null, [
        h("span.zoo-sign__bolt.zoo-sign__bolt--tl"), h("span.zoo-sign__bolt.zoo-sign__bolt--tr"),
        h("div.zoo-sign__art", null, art),
        h("div.zoo-sign__plate", null, slotsEl)

    var bank = h("div.letter-bank", { role: "group", "aria-label": "Letters" });
    var feedback = h("p.signs-feedback", { "aria-live": "assertive" });
    var checkBtn = h("button.px-btn.guide-btn.signs-btn--check", { type: "button" }, "Check");

    var nextBtn = h("button.px-btn.guide-btn.signs-btn--next", { type: "button", hidden: true }, "Next");
    var actions = h("div.signs-actions", null, [checkBtn, showBtn, nextBtn]);
    var play = h("div.signs-play", null, [sign, bank, feedback, actions]);

    /* ---------- Resultat ---------- */
    var resStars = h("span.guide-results__stars", { "aria-hidden": "true" });
    var resTitle = h("h2.guide-results__title", { id: "signs-results-title", tabindex: "-1" });
    var resList = h("ol.signs-results__list", { "aria-label": "Signs" });
    var resBest = h("p.guide-results__best");
    var resNote = h("p.guide-results__note");
    var againBtn = h("button.px-btn.guide-btn", { type: "button" }, "Play again");
    var results = h("section.guide-results.signs-results", { hidden: true, "aria-labelledby": "signs-results-title" }, [
      resStars, resTitle, resList, resBest, resNote,
      h("div.guide-results__actions", null, [againBtn, h("a.px-btn.guide-btn.guide-btn--map", { href: mapHref }, "Tornar al mapa")])
    ]);

    /* ---------- Una ronda ---------- */
    function startRound() {
      var w = game.words[idx];
      round = {
        word: w.word.toUpperCase(),
        tiles: PA.scrambleWord(w.word.replace(/ /g, "")),       /* ordre del banc (sense espais) */
        /* id de fitxa per casella; els espais (fly a kite) són forats fixos: "gap" */
        placed: w.word.split("").map(function (c) { return c === " " ? "gap" : null; }),
        attempts: 0,
        done: null                            /* "solved" | "revealed" */
      };

      art.src = PA.fieldGuideImage(guide, w.id, 400);
      art.alt = "Mystery animal";
      sign.classList.remove("is-solved", "is-revealed", "is-wrong", "is-new");

      round.tiles.forEach(function (t) {

    /* lletra col·locada → torna al banc */
    function unplace(slotIndex, moveFocus) {

      var t = tileById(round.placed[slotIndex]);

      clearWrong();
      render();
      if (moveFocus) t.el.focus();

    function clearWrong() {
      if (sign.classList.contains("is-wrong")) sign.classList.remove("is-wrong");
      if (feedback.classList.contains("is-no")) { feedback.textContent = ""; feedback.className = "signs-feedback"; }
    }

    function render() {
      /* caselles */
      slotsEl.textContent = "";
      /* cada paraula va dins el seu grup perquè, si cal, la frase es parteixi entre paraules */
      var group = h("li.letter-word");
      slotsEl.appendChild(group);
      round.placed.forEach(function (id, i) {
        if (id === "gap") { group = h("li.letter-word"); slotsEl.appendChild(group); return; }
        var t = id === null ? null : tileById(id);
        var li = h("span.letter-slot-wrap");
        if (t && !round.done) {

    function save() {

    }

    function showResults() {
      var n = PA.wordSignsStars(game, solved);

      for (var i = 1; i <= 3; i++) {

      }

    }

    checkBtn.addEventListener("click", check);
    showBtn.addEventListener("click", reveal);

    againBtn.addEventListener("click", function () { newGame(); round.tiles[0].el.focus({ preventScroll: true }); });

    var root = h("div.view.view--sections.view--signs", {
      style: { "--c": section.color, "--cb": "#7FE3D6", "--sc": section.color, "--tone": section.color }
    }, [
      PA.views.sections.buildHeader({
        backHref: mapHref,
        backLabel: "Tornar al mapa",
        context: course.label + " · " + unit.label + " · " + section.name,
        title: game.title
      }),
      h("main.sections.dither.signs-page", null, [head, play, results])
    ]);

    /* teclat: escriure una lletra la col·loca; Retrocés retira l'última */
    root.addEventListener("keydown", function (e) {
