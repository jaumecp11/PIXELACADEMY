  box-shadow: inset calc(var(--px) * -0.5) calc(var(--px) * -0.5) 0 0 rgba(0, 0, 0, 0.25);
}
.zoo-sign__bolt--tl { left: calc(var(--px) * 1.5); }
.zoo-sign__bolt--tr { right: calc(var(--px) * 1.5); }

.zoo-sign__art {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: var(--art-h);
  background:
    repeating-conic-gradient(color-mix(in srgb, var(--c) 10%, #ffffff) 0 25%, color-mix(in srgb, var(--c) 18%, #ffffff) 0 50%) 0 0 / 16px 16px;
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline);
}
.zoo-sign__img {
  width: auto;
  height: 92%;
  max-width: 96%;
  object-fit: contain;
}
.zoo-sign.is-new .zoo-sign__img { animation: guide-pop 0.36s steps(4, end); }

/* la placa del nom: on van les lletres */
.zoo-sign__plate {
  align-self: stretch;
  margin-top: calc(var(--px) * 3);
  padding: calc(var(--px) * 2) calc(var(--px) * 2.5);
  background: color-mix(in srgb, var(--c) 55%, #0a0f4d);
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * 1) 0 0 rgba(255, 255, 255, 0.18),
    inset 0 calc(var(--px) * -1) 0 0 rgba(0, 0, 0, 0.22);
  transition: background-color 0.18s steps(3, end);
}
.zoo-sign__slots,
.signs-results__list { margin: 0; padding: 0; list-style: none; }
.zoo-sign__slots {
  display: flex;
  justify-content: center;
  gap: var(--tile-gap);
}
.letter-slot-wrap { display: flex; }
/* frases amb espais (U4: fly a kite): cada paraula és un grup; entre paraules hi ha un forat
   i, si no hi cap, la frase passa a la fila següent sencera */
.letter-word { display: flex; gap: var(--tile-gap); }
.has-gaps .zoo-sign__slots { flex-wrap: wrap; column-gap: calc(var(--tile) * 0.55); row-gap: var(--tile-gap); max-width: calc(var(--tile) * 13); }
.has-gaps .letter-bank { flex-wrap: wrap; max-width: calc((var(--tile) + var(--tile-gap)) * 11); margin-inline: auto; row-gap: var(--tile-gap); }

/* ---------- Fitxes de lletres (banc i caselles plenes) ---------- */
.px-btn.letter-tile,
.px-btn.letter-slot,
.letter-slot {
  width: var(--tile);
  height: var(--tile);
  min-height: 0;
  padding: 0 0 calc(var(--tile) * 0.06);
  font-size: calc(var(--tile) * 0.58);
  font-weight: 700;
  line-height: 1;
}
.px-btn.letter-tile,
.px-btn.letter-slot {
  --tone: #fff1bf;
  --tone-hi: #ffffff;
  --depth: #d8b25a;
  /* halo turquesa (la fitxa és clara: un halo del seu color no es veuria) */
  --ring: color-mix(in srgb, var(--c) 62%, transparent);
  --ring2: color-mix(in srgb, var(--c) 24%, transparent);
  text-shadow: none;
}
.letter-slot {
  display: flex;
  align-items: center;
  justify-content: center;
  color: #0b1460;
}
/* casella buida: forat a la placa */
.letter-slot:not(.is-filled) {
  background: rgba(10, 15, 77, 0.35);
  box-shadow:
    inset 0 calc(var(--px) * 0.75) 0 0 rgba(0, 0, 0, 0.3),
    inset 0 0 0 calc(var(--px) * 0.5) rgba(255, 255, 255, 0.28);
}
/* casella plena sense botó (rètol resolt o revelat) */
span.letter-slot.is-filled {
  background: #fff1bf;
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1) 0 0 #d8b25a;
}

.letter-bank {
  display: flex;
  justify-content: center;
  gap: var(--tile-gap);
  margin-top: calc(var(--px) * 1);
  padding: calc(var(--px) * 1) calc(var(--px) * 2) calc(var(--px) * 2);
}
/* rètol resolt o revelat: el banc buit no es mostra (l'espai es manté) */
.letter-bank.is-done { visibility: hidden; }
/* fitxa ja col·locada: deixa el seu lloc buit al banc */
.px-btn.letter-tile.is-used {
  color: transparent;
  background: transparent;
  cursor: default;
  transform: none;
  box-shadow: inset 0 0 0 calc(var(--px) * 0.5) rgba(10, 15, 77, 0.18);
  pointer-events: none;
}

/* ---------- Encert / error / revelat ---------- */
.zoo-sign.is-wrong .zoo-sign__plate {
  animation: guide-shake 0.42s steps(6, end);
  background: #b4232c;
}
/* encert: la placa s'il·lumina */
.zoo-sign.is-solved .zoo-sign__plate {
  background: #ffd23f;
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1) 0 0 #e09a00,
    0 calc(var(--px) * -2.25) 0 0 rgba(255, 210, 63, 0.6),
    0 calc(var(--px) * 2.25) 0 0 rgba(255, 210, 63, 0.6),
    calc(var(--px) * -2.25) 0 0 0 rgba(255, 210, 63, 0.6),
    calc(var(--px) * 2.25) 0 0 0 rgba(255, 210, 63, 0.6),
    0 calc(var(--px) * -3.75) 0 0 rgba(255, 210, 63, 0.25),
    0 calc(var(--px) * 3.75) 0 0 rgba(255, 210, 63, 0.25),
    calc(var(--px) * -3.75) 0 0 0 rgba(255, 210, 63, 0.25),
    calc(var(--px) * 3.75) 0 0 0 rgba(255, 210, 63, 0.25);
  animation: guide-pop 0.36s steps(4, end);
}
.zoo-sign.is-solved span.letter-slot.is-filled { background: #ffffff; }
.zoo-sign.is-solved .zoo-sign__art { background: #c9f1b6; }
.zoo-sign.is-solved .zoo-sign__img { animation: guide-pop 0.36s steps(4, end); }
/* revelat: es veu el nom, però no puntua */
.zoo-sign.is-revealed .zoo-sign__plate { background: #ff9b8f; }
.zoo-sign.is-revealed .zoo-sign__art { background: #ffd3cc; }

/* ---------- Missatge i botons ---------- */
.signs-feedback {
  min-height: 1.5em;
  margin-top: calc(var(--px) * 2);
  text-align: center;
  font-size: clamp(1.05rem, 1.5vw, 1.3rem);
  font-weight: 700;
}
.signs-feedback.is-ok { color: #1d7a35; }
.signs-feedback.is-no { color: #b4232c; animation: guide-shake 0.42s steps(6, end); }
.signs-feedback.is-shown { color: #b4232c; }

.signs-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: calc(var(--px) * 4);
  margin-top: calc(var(--px) * 1.5);
  padding-bottom: calc(var(--px) * 4);
}
.px-btn.signs-btn--show { --tone: #ffc928; --tone-hi: #ffe27a; }
/* Check desactivat fins que totes les caselles són plenes */
.signs-actions .px-btn:disabled,
.signs-actions .px-btn:disabled:hover,
.signs-actions .px-btn:disabled:active {
  --tone: #dfe5f5;
  color: #7c86b5;
  cursor: not-allowed;
  transform: none;
  background: var(--tone);
  box-shadow:
    var(--o4),
    inset 0 calc(var(--px) * -1.5) 0 0 #c3cbe4,
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}

/* ---------- Resultat ---------- */
.signs-results { width: min(100%, 700px); margin-top: clamp(12px, 3vh, 32px); }
.signs-results__list {
  display: grid;
  grid-template-columns: repeat(9, minmax(0, 1fr));
  gap: calc(var(--px) * 2);
  width: 100%;
  margin: calc(var(--px) * 1) 0;
}
.signs-mini {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 0.75);
  min-width: 0;
}
.signs-mini__frame {
  display: grid;
  place-items: center;
  width: 100%;
  aspect-ratio: 1;
  padding: calc(var(--px) * 1);
  background: #c9f1b6;
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline),
    0 calc(var(--px) * 1.5) 0 0 var(--shadow);
}
.signs-mini__img { width: 100%; height: 100%; object-fit: contain; }
.signs-mini__name { font-size: 0.8rem; font-weight: 700; line-height: 1.1; }
.signs-mini__tag { font-size: 0.75rem; font-weight: 700; line-height: 1; color: #1d7a35; }
.signs-mini.is-revealed .signs-mini__frame { background: #ffd3cc; }
.signs-mini.is-revealed .signs-mini__name,
.signs-mini.is-revealed .signs-mini__tag { color: #b4232c; }

@media (max-width: 640px) {
  .signs-head { flex-direction: column; gap: calc(var(--px) * 2); padding: calc(var(--px) * 2) calc(var(--px) * 3); text-align: center; }
  .signs-results__list { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
/* ============================================================
   Zoo Express — escena de vies pixelada (SVG), tren, agulla, rètols
   de les andanes i resultat. Accent turquesa de Vocabulary (--c / --cb).
   ============================================================ */

.sections.express-page {
  max-width: 1440px;
  padding-top: clamp(10px, 2vh, 20px);
  padding-bottom: clamp(12px, 3vh, 32px);
}

/* ---------- Instrucció i progrés ---------- */
.express-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(var(--px) * 4);
  width: fit-content;
  max-width: 100%;
  min-height: clamp(48px, 6.5vh, 60px);
  margin: 0 auto calc(var(--px) * 4);
  padding: calc(var(--px) * 1.5) calc(var(--px) * 2) calc(var(--px) * 1.5) calc(var(--px) * 5);
  background: #ffffff;
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1.5) 0 0 color-mix(in srgb, var(--c) 35%, #ffffff),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
.express-head[hidden] { display: none; }
.express-head__text {
  font-size: clamp(1.1rem, 2vw, 1.75rem);
  font-weight: 700;
  line-height: 1.1;
  color: #0b1460;
}
.express-head__count {
  flex: none;
  font-size: clamp(1rem, 1.5vw, 1.25rem);
  font-weight: 700;
  line-height: 1;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 2.5);
  color: #0b1460;
  background: var(--cb);
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline);
}

/* ---------- Tauler ---------- */
.express-play {
  /* tan gran com permet l'alçada; al mòbil ocupa l'amplada (mínim 340 px) */
  --scene-w: max(340px, min(calc(min(100vw, 1440px) - 2 * clamp(16px, 4vw, 40px) - 16px),
                             calc((100vh - var(--inner-hero-h) - 142px) * 1672 / 941), 1360px));
}
.express-play[hidden] { display: none; }
.express-scroll {
  overflow-x: auto;
  overflow-y: hidden;
  padding: var(--px) var(--px) calc(var(--px) * 3);
  scrollbar-width: thin;
}
/* fons i SVG comparteixen la mateixa caixa (1672 × 941): tot queda alineat */
.express-scene {
  position: relative;
  width: var(--scene-w);
  aspect-ratio: 1672 / 941;
  margin: 0 auto;
  overflow: hidden;
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 3) 0 0 var(--shadow);
}
.express-bg,
.express-svg {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  max-width: none;
  user-select: none;
  -webkit-user-select: none;
}
.express-svg { pointer-events: none; }

/* llum verda del senyal quan hi ha via triada */
.xp-lamp { display: none; }
.express-scene:not([data-switch="none"]) .xp-lamp { display: inline; }

/* tren: el tren que se'n va s'esvaeix; l'animal salta quan arriba */
.xp-train { transition: opacity 0.3s steps(3, end); }
.xp-train.is-leaving { opacity: 0; }
.xp-cargo { transform-box: fill-box; transform-origin: 50% 100%; }
.xp-cargo.is-happy { animation: xp-hop 0.7s steps(4, end) 2; }
@keyframes xp-hop {
  0%, 100% { translate: 0 0; }
  50%      { translate: 0 -10px; }
}

/* ---------- Rètols de les estacions ---------- */
.express-sign {
  --tone: var(--c);
  --ring: color-mix(in srgb, var(--c) 62%, transparent);
  --ring2: color-mix(in srgb, var(--c) 24%, transparent);
  --o4:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline);
  --halo:
    0 calc(var(--px) * -2.5) 0 0 var(--ring),
    0 calc(var(--px) * 2.5) 0 0 var(--ring),
    calc(var(--px) * -2.5) 0 0 0 var(--ring),
    calc(var(--px) * 2.5) 0 0 0 var(--ring),
    0 calc(var(--px) * -4) 0 0 var(--ring2),
    0 calc(var(--px) * 4) 0 0 var(--ring2),
    calc(var(--px) * -4) 0 0 0 var(--ring2),
    calc(var(--px) * 4) 0 0 0 var(--ring2);
  --wood: max(2px, calc(var(--scene-w) * 0.0045));
  position: absolute;
  width: max(var(--sign-w), 84px);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 calc(var(--px) * 1);
  border: 0;
  font: inherit;
  font-size: max(13px, calc(var(--scene-w) * 0.025));
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  color: #0b1460;
  background: #fffaf0;
  cursor: pointer;
  box-shadow:
    var(--o4),
    inset 0 0 0 var(--wood) #a8642f,
    inset 0 calc(var(--wood) * -2) 0 0 #7a4220,
    0 calc(var(--px) * 2) 0 0 var(--shadow);
  transition:
    transform 0.12s steps(2, end),
    box-shadow 0.12s steps(2, end),
    background-color 0.12s steps(2, end);
  -webkit-tap-highlight-color: transparent;
}
.express-sign__text { padding-bottom: calc(var(--wood) * 0.8); }
@media (hover: hover) {
  .express-scene:not(.is-busy) .express-sign:hover {
    transform: translate(-50%, calc(var(--px) * -1));
    box-shadow:
      var(--o4),
      inset 0 0 0 var(--wood) #a8642f,
      inset 0 calc(var(--wood) * -2) 0 0 #7a4220,
      0 calc(var(--px) * 3) 0 0 var(--shadow),
      var(--halo);
  }
}
.express-scene:not(.is-busy) .express-sign:active {
  transform: translate(-50%, var(--px));
  background: #ffffff;
  box-shadow: var(--o4), inset 0 0 0 var(--wood) #a8642f, var(--halo);
}
.express-sign:focus-visible {
  outline: var(--px) solid var(--c);
  outline-offset: calc(var(--px) * 2.5);
}
.express-scene.is-busy .express-sign { cursor: default; }

/* triat (destacat abans d'arrencar), correcte, equivocat */
.express-sign.is-chosen {
  background: #ffe27a;
  animation: guide-pop 0.36s steps(4, end);
  box-shadow:
    var(--o4),
    inset 0 0 0 var(--wood) #a8642f,
    inset 0 calc(var(--wood) * -2) 0 0 #7a4220,
    0 calc(var(--px) * -2.5) 0 0 rgba(255, 210, 63, 0.75),
    0 calc(var(--px) * 2.5) 0 0 rgba(255, 210, 63, 0.75),
    calc(var(--px) * -2.5) 0 0 0 rgba(255, 210, 63, 0.75),
    calc(var(--px) * 2.5) 0 0 0 rgba(255, 210, 63, 0.75);
}
.express-sign.is-right { background: #c9f1b6; animation: guide-pop 0.36s steps(4, end); }
.express-sign.is-wrong { background: #ffd3cc; animation: guide-shake 0.42s steps(6, end); }

/* ---------- Missatge (damunt del tauler) ---------- */
.express-feedback {
  position: absolute;
  left: 50%;
  top: 3%;
  transform: translateX(-50%);
  z-index: 2;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 4);
  white-space: nowrap;
  text-align: center;
  font-size: clamp(1rem, calc(var(--scene-w) * 0.026), 1.9rem);
  font-weight: 700;
  line-height: 1.1;
  background: #ffffff;
  pointer-events: none;
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
.express-feedback:empty { display: none; }
.express-feedback.is-ok { color: #1d7a35; background: #e6fbdc; animation: guide-pop 0.36s steps(4, end); }
.express-feedback.is-no { color: #b4232c; background: #fff0ec; animation: guide-shake 0.42s steps(6, end); }

/* ---------- Resultat (reutilitza la llista de Secret Zoo Signs) ---------- */
.express-results { width: min(100%, 700px); margin-top: clamp(12px, 3vh, 32px); }

@media (max-width: 640px) {
  .express-head { flex-direction: column; gap: calc(var(--px) * 2); padding: calc(var(--px) * 2) calc(var(--px) * 3); text-align: center; }
}
/* ============================================================
   Find the Action! — consigna, tres cartes il·lustrades i resultat.
   Fa servir els estils de la guia de camp (field-guide.css); aquí només
   hi ha la mida de les tres cartes en una fila.
   ============================================================ */

.find-page {
  /* cartes tan grans com permet l'alçada (consigna + cartes + botó hi caben) */
  --fc: clamp(120px, min(calc(100vh - var(--inner-hero-h) - 264px),
                         calc((min(100vw, 1320px) - 2 * clamp(16px, 4vw, 40px) - 2 * var(--gg) - 12px) / 3)), 340px);
  --grid-w: calc(3 * var(--fc) + 2 * var(--gg));
}
.guide-grid.find-grid {
  grid-template-columns: repeat(3, var(--fc));
}
.find-grid .guide-card { aspect-ratio: 1 / 1; }
.find-grid .guide-card__img { height: 96%; }

.find-results { width: min(100%, 640px); }
.find-results__list { grid-template-columns: repeat(7, minmax(0, 1fr)); }

@media (max-width: 560px) {
  .find-grid .guide-card { aspect-ratio: 0.9 / 1; }
  .find-results__list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
/* ============================================================
   School Run (3r · Unit 2 · Vocabulary) — joc de carrils
   El bàner (frase) i el canvas 16:9 caben sencers sota la capçalera.
   ============================================================ */
.run-page { display: flex; flex-direction: column; align-items: center; padding-top: clamp(8px, 1.6vh, 16px) !important; padding-bottom: 8px !important; }
.run-play { display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 2); width: 100%; }
.run-play[hidden] { display: none; }
.run-banner {
  --bw: min(100%, calc((100vh - var(--inner-hero-h) - 110px) * 16 / 9));
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: calc(var(--px) * 3);
  width: var(--bw); min-height: 56px; box-sizing: border-box; padding: calc(var(--px) * 1.5) calc(var(--px) * 3);
  background: #ffffff;
  box-shadow: inset 0 calc(var(--px) * 1.5) 0 0 var(--tone), 0 0 0 var(--px) var(--outline), 0 calc(var(--px) * 2) 0 0 var(--shadow);
}
.run-say { padding: calc(var(--px) * 1.5) calc(var(--px) * 2.5); }
.run-sentence { margin: 0; font-size: clamp(1.1rem, 2.1vw, 1.8rem); font-weight: 700; color: #0b1460; line-height: 1.2; }
.run-stats { display: flex; align-items: center; gap: calc(var(--px) * 3); font-weight: 700; color: #0b1460; font-size: clamp(1rem, 1.6vw, 1.35rem); }
.run-heart { color: #e2232c; text-shadow: 0 2px 0 #0a0f4d; font-size: 1.3em; margin-right: 2px; }
.run-heart.is-lost { color: #c9cde3; text-shadow: none; }
.run-combo { color: #e07a00; min-width: 2.4em; }
.run-score { min-width: 3.5em; text-align: right; }
.run-pause { padding: calc(var(--px) * 1.5) calc(var(--px) * 3); font-weight: 700; }
.run-box { position: relative; width: min(100%, calc((100vh - var(--inner-hero-h) - 110px) * 16 / 9)); aspect-ratio: 16 / 9;
  box-shadow: 0 0 0 var(--px) var(--outline), 0 calc(var(--px) * 2.5) 0 0 var(--shadow); }
.run-canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: pointer; touch-action: none; outline: none; }
.run-canvas:focus-visible { outline: var(--px) solid var(--c); outline-offset: calc(var(--px) * 1.5); }
.run-overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--px) * 3);
  background: rgba(10, 15, 77, 0.45); text-align: center; padding: 16px;
}
.run-overlay[hidden] { display: none; }
.run-overlay__title { margin: 0; color: #ffffff; font-size: clamp(1.8rem, 4.4vw, 3.6rem); font-weight: 700;
  text-shadow: -3px 0 0 #0a0f4d, 3px 0 0 #0a0f4d, 0 -3px 0 #0a0f4d, 0 3px 0 #0a0f4d, 0 6px 0 #0a0f4d;
  animation: run-pop 0.35s steps(4, end); }
.run-overlay__text { margin: 0; color: #ffffff; font-size: clamp(1rem, 1.8vw, 1.4rem); font-weight: 700; text-shadow: 0 2px 0 #0a0f4d; max-width: 30ch; }
.run-overlay__text:empty { display: none; }
@keyframes run-pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: none; opacity: 1; } }
.run-arrows { position: absolute; left: 10px; bottom: 10px; display: none; flex-direction: column; gap: 8px; }
.run-arrow { width: 56px; height: 56px; font-size: 1.4rem; padding: 0; opacity: 0.9; }
@media (pointer: coarse) { .run-arrows { display: flex; } }
@media (max-width: 640px) { .run-banner { grid-template-columns: auto 1fr auto; } .run-stats { grid-column: 1 / -1; justify-content: center; } }
/* PIXEL ACADEMY — Sort v2 («Fruit or Vegetable?», 3r · Unit 3): escena estàtica amb dues parades.
   Reaprofita la barra i la capa de School Run (css/school-run.css). v1 (caiguda): css/_sort-game-v1-caiguda.css.txt */
.sort-banner { grid-template-columns: auto 1fr auto; }
.sort-count { font-weight: 700; color: #0b1460; font-size: clamp(1rem, 1.6vw, 1.3rem); min-width: 3.2em; }
.sort-say { margin: 0; font-size: clamp(1.05rem, 1.9vw, 1.6rem); font-weight: 700; color: #0b1460; line-height: 1.2; text-align: center; }

.sort-box {
  position: relative; overflow: hidden; outline: none; user-select: none; container-type: inline-size;
  width: min(100%, calc((100vh - var(--inner-hero-h) - 110px) * 16 / 9)); aspect-ratio: 1672 / 941;
  box-shadow: 0 0 0 var(--px) var(--outline), 0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
.sort-box:focus-visible { outline: var(--px) solid var(--c); outline-offset: calc(var(--px) * 1.5); }
.sort-scene { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }

/* rètols: el text el posa el codi sobre la fusta buida */
.sort-sign {
  position: absolute; display: flex; align-items: center; justify-content: center; gap: .4em; pointer-events: none;
  color: #fff7e0; font-weight: 700; font-size: 3.6cqw; letter-spacing: .02em; line-height: 1;
  text-shadow: -2px 0 0 #4a2a10, 2px 0 0 #4a2a10, 0 -2px 0 #4a2a10, 0 2px 0 #4a2a10, 0 4px 0 #4a2a10;
}
.sort-sign__key { font-size: .7em; opacity: .9; }

/* zones on es toca (invisibles; s'il·luminen en passar-hi) */
.sort-zone { position: absolute; z-index: 600; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 6px; }
.sort-zone:hover, .sort-zone:focus-visible { background: color-mix(in srgb, var(--bin) 14%, transparent); box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--bin) 70%, transparent); outline: none; }
.sort-zone.is-ok { animation: sort-glow .6s steps(3, end); }
.sort-zone.is-no { box-shadow: inset 0 0 0 4px #2e9f4a; }
.sort-zone.is-shake { animation: sort-shake .35s steps(4, end); background: rgba(226, 35, 44, .14); box-shadow: inset 0 0 0 4px #e2232c; }
@keyframes sort-glow { 50% { background: color-mix(in srgb, var(--bin) 22%, transparent); box-shadow: inset 0 0 0 5px var(--bin); } }
@keyframes sort-shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

/* aliments */
.sort-layer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.sort-item { position: absolute; height: auto; aspect-ratio: 1; image-rendering: pixelated; pointer-events: none;
  filter: drop-shadow(0 3px 0 rgba(40, 20, 5, .35)); }
.sort-item[hidden] { display: none; }
.sort-item--new { z-index: 700; transform: translate(-50%, -100%); animation: sort-appear .35s steps(4, end); }
.sort-item--new.is-fly { transition: left .45s cubic-bezier(.3, .7, .4, 1), top .45s cubic-bezier(.3, .7, .4, 1), width .45s ease, transform .45s ease; animation: none; }
.sort-item--placed { animation: sort-land .25s steps(3, end); }
@keyframes sort-appear { 0% { scale: .3; } 70% { scale: 1.15; } 100% { scale: 1; } }
@keyframes sort-land { 50% { scale: 1.1 .88; } }
@media (prefers-reduced-motion: reduce) { .sort-item--new, .sort-item--placed, .sort-zone.is-ok, .sort-zone.is-shake { animation: none; } }

/* ---------- v3 (mestre, 22-11-2026): dues cistelles de fusta que suren sobre el fons, sense marc ni colors ---------- */
.view--sort .sort-box { box-shadow: none; background: transparent; overflow: visible; }
.sort-basket { position: absolute; height: auto; object-fit: contain; pointer-events: none; image-rendering: auto;
  filter: drop-shadow(0 6px 0 rgba(40, 30, 80, .18)); }
.sort-basket--front { z-index: 3; }
.sort-sign--board { z-index: 1; }
.sort-sign__board { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; image-rendering: auto; }
.sort-sign--board .sort-sign__text { position: relative; }
/* sense marcs vermells ni verds: només un petit salt de la cistella */
.sort-zone, .sort-zone:hover, .sort-zone:focus-visible, .sort-zone.is-ok, .sort-zone.is-no, .sort-zone.is-shake {
  background: transparent; box-shadow: none; }
.sort-zone:focus-visible { outline: var(--px) dashed color-mix(in srgb, var(--c) 70%, #0b1460); outline-offset: 4px; }
.sort-zone.is-ok { animation: sort-hop .35s steps(3, end); }
.sort-zone.is-shake { animation: sort-shake .35s steps(4, end); }
@keyframes sort-hop { 50% { transform: translateY(-6px); } }
.sort-zone.is-ok, .sort-zone.is-shake { animation: none; }
.sort-basket.is-hop { animation: sort-hop .35s steps(3, end); }
.sort-basket.is-shake { animation: sort-shake .35s steps(4, end); }
.view--sort .sort-box:focus-visible { outline: none; }

/* Pantalla d'inici: el text a dalt (una línia, sobre una franja fosca) i el Start a baix, entre les cistelles
   (amb la lletra VT323 el text tocava els rètols «Fruit» i «Vegetables», 23-11) */
.sort-page .run-overlay { justify-content: flex-start; padding-top: 2.5%; padding-bottom: 9%; }
.sort-page .run-overlay__btn { margin-top: auto; }
.sort-page .run-overlay__text { max-width: none; white-space: nowrap; padding: 8px 16px; background: rgba(10, 15, 77, .82); box-shadow: 0 0 0 3px #0a0f4d; }
/* PIXEL ACADEMY — Kite Catcher (3r · Unit 4 · Vocabulary 2, 28-11-2026)
   Escena sencera de ChatGPT + estels (una sola imatge, recolorida amb hue-rotate) amb la paraula del codi.
   Reaprofita la barra, la capa i els resultats de School Run i Sort (css/school-run.css, css/sort-game.css). */
.kc-banner { grid-template-columns: auto 1fr auto; }
.kc-phrase {
  margin: 0; text-align: center; font-weight: 700; color: #0b1460; line-height: 1.1;
  font-size: clamp(1.4rem, 2.8vw, 2.3rem); letter-spacing: .02em;
}
.kc-word { display: inline-block; min-width: 2.2em; }
.kc-word.is-fixed { color: #5a6190; }
.kc-word.is-got { color: #2f8a3a; animation: kc-pop .35s steps(3, end); }
.kc-phrase.is-done .kc-word { color: #2f8a3a; }
@keyframes kc-pop { 50% { scale: 1.25; } }

.kc-box {
  position: relative; overflow: clip; user-select: none; container-type: inline-size;
  width: min(100%, calc((100vh - var(--inner-hero-h) - 110px) * 16 / 9)); aspect-ratio: 1672 / 941;
  box-shadow: 0 0 0 var(--px) var(--outline), 0 calc(var(--px) * 2.5) 0 0 var(--shadow);
  background: #cfe6ff;
}
.kc-scene { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
.kc-sky { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.kc-sky .kc-kite { pointer-events: auto; }
.kc-overlay { z-index: 5; }

/* estel: la imatge (vermella) + la paraula al rombe crema del mig */
.kc-kite {
  position: absolute; width: 19cqw; aspect-ratio: 400 / 441; translate: -50% 0; font: inherit;
  border: 0; padding: 0; background: transparent; cursor: pointer;
  filter: drop-shadow(0 4px 0 rgba(10, 15, 77, .28));
}
.kc-kite__img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated;
  filter: hue-rotate(var(--hue, 0deg)); pointer-events: none; }
.kc-kite__word {
  /* la paraula va en una etiqueta blanca damunt el rombe: es llegeix bé encara que sigui llarga (computer) */
  position: absolute; left: 50%; top: 35%; translate: -50% -50%; white-space: nowrap; pointer-events: none;
  font-family: var(--font); font-weight: 700; color: #0b1460; line-height: 1; font-size: 3.3cqw;
  padding: .12em .35em .18em; background: #fff; box-shadow: 0 0 0 .5cqw #0b1460, 0 .6cqw 0 .5cqw rgba(10, 15, 77, .25);
}
.kc-kite:hover .kc-kite__img, .kc-kite:focus-visible .kc-kite__img { filter: hue-rotate(var(--hue, 0deg)) brightness(1.12); }
.kc-kite:focus-visible { outline: var(--px) dashed #0b1460; outline-offset: 2px; }
.kc-kite.is-caught { pointer-events: none; animation: kc-caught .45s steps(4, end) forwards; }
.kc-kite.is-wrong { animation: kc-wrong .4s steps(4, end); }
.kc-kite.is-wrong .kc-kite__word { color: #d1365e; }
.kc-kite.is-away { pointer-events: none; transition: opacity .5s ease; opacity: 0; }
@keyframes kc-caught { 40% { scale: 1.25; } 100% { scale: .2; opacity: 0; } }
@keyframes kc-wrong { 25% { translate: calc(-50% - 10px) 0; } 75% { translate: calc(-50% + 10px) 0; } }
@media (prefers-reduced-motion: reduce) { .kc-kite.is-caught, .kc-kite.is-wrong, .kc-word.is-got { animation: none; } }

.kc-overlay .run-overlay__text { max-width: 34ch; }
.kc-mini { aspect-ratio: 16 / 9; }
.kc-mini .signs-mini__img { object-fit: cover; width: 100%; height: 100%; }
/* PIXEL ACADEMY — Pack the Bag (3r · Unit 4 · Vocabulary 5, 28-11-2026)
   Habitació de ChatGPT + 16 objectes retallats, posats pel codi. Reaprofita barra, capa i resultats de Sort. */
.pb-banner { grid-template-columns: auto 1fr auto; }
.pb-plan { margin: 0; text-align: center; font-weight: 700; color: #0b1460; line-height: 1.15;
  font-size: clamp(1.15rem, 2.1vw, 1.8rem); }
.pb-listen { padding: 4px 10px; }

.pb-box {
  position: relative; overflow: clip; user-select: none; touch-action: none; container-type: inline-size;
  width: min(100%, calc((100vh - var(--inner-hero-h) - 110px) * 16 / 9)); aspect-ratio: 1672 / 941;
  box-shadow: 0 0 0 var(--px) var(--outline), 0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
.pb-scene { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
.pb-bag { position: absolute; z-index: 1; pointer-events: none; }
.pb-bag.is-full { animation: pb-hop .5s steps(4, end); }
@keyframes pb-hop { 40% { transform: translateY(-3%); } }
.pb-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }

/* objecte: (left, top) = centre de la base */
.pb-item {
  position: absolute; translate: -50% -100%; border: 0; padding: 0; background: transparent; cursor: grab;
  pointer-events: auto; touch-action: none; font: inherit;
  transition: left .35s cubic-bezier(.3, .7, .4, 1), top .35s cubic-bezier(.3, .7, .4, 1), scale .2s ease, opacity .3s ease;
  filter: drop-shadow(0 .35cqw 0 rgba(40, 25, 10, .3));
}
.pb-item__img { display: block; width: 100%; height: auto; image-rendering: pixelated; pointer-events: none; }
.pb-item:hover { scale: 1.08; }
.pb-item:focus-visible { outline: var(--px) dashed #0b1460; outline-offset: 3px; }
.pb-item.is-drag { transition: none; scale: 1.15; z-index: 50; cursor: grabbing; filter: drop-shadow(0 1cqw 0 rgba(40, 25, 10, .3)); }
.pb-item.is-packed { pointer-events: none; scale: .45; opacity: 0; }
.pb-item.is-wrong { animation: pb-shake .4s steps(4, end); }
@keyframes pb-shake { 25% { rotate: -8deg; } 75% { rotate: 8deg; } }

.pb-say {
  position: absolute; z-index: 3; left: 50%; bottom: 3%; translate: -50% 0; margin: 0; max-width: 60%;
  padding: .25em .7em; background: #fff; box-shadow: 0 0 0 .35cqw #0b1460;
  font-weight: 700; color: #0b1460; font-size: 2.1cqw; text-align: center; pointer-events: none;
}
.pb-say:empty { display: none; }
.pb-overlay { z-index: 5; }
@media (prefers-reduced-motion: reduce) { .pb-item { transition: none; } .pb-item.is-wrong, .pb-bag.is-full { animation: none; } }
/* PIXEL ACADEMY — Pizza Maker! (3r · Unit 3 · Vocabulary, repte final) */
.pm-page { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 1.6vh, 18px); }
.pm-play { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 1.8vh, 20px); width: min(100%, 1180px); }
.pm-play[hidden], .pm-results[hidden] { display: none; }

/* comanda: en Pix + bafarada */
.pm-order { display: flex; align-items: center; gap: calc(var(--px) * 3); width: min(100%, 900px); }
.pm-order__pix { width: clamp(64px, 8vw, 96px); height: auto; flex: none; image-rendering: auto; }
.pm-order__bubble {
  position: relative; flex: 1; display: flex; align-items: center; justify-content: space-between; gap: calc(var(--px) * 3);
  padding: calc(var(--px) * 3) calc(var(--px) * 4); background: #ffffff;
  box-shadow: 0 0 0 calc(var(--px) * 0.75) var(--outline), 0 calc(var(--px) * 1.5) 0 calc(var(--px) * 0.75) var(--shadow);
}
.pm-order__bubble::before {
  content: ""; position: absolute; left: calc(var(--px) * -3); top: 50%; width: calc(var(--px) * 3); height: calc(var(--px) * 4);
  transform: translateY(-50%); background: var(--outline); clip-path: polygon(100% 0, 0 50%, 100% 100%);
}
.pm-order__text { margin: 0; font-weight: 700; color: #0b1460; font-size: clamp(1.15rem, 2.1vw, 1.7rem); line-height: 1.25; }
.pm-order__listen { flex: none; }
.pm-count { flex: none; }

/* taula: pizza a l'esquerra, bols a la dreta */
.pm-table { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: clamp(16px, 3vw, 44px); width: 100%; }
.pm-pizza {
  position: relative; width: min(42vw, calc(100vh - var(--inner-hero-h, 160px) - 230px)); min-width: 220px; aspect-ratio: 1;
  background: radial-gradient(circle at 50% 50%, #f7e3c4 0 56%, #e9c99c 57% 62%, transparent 63%);
  border-radius: 50%;
}
.pm-pizza img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.pm-pizza__layer { opacity: 0; transform: rotate(var(--rot, 0deg)) scale(1.15); transition: opacity .18s, transform .25s cubic-bezier(.3,1.6,.5,1); }
.pm-pizza__layer.is-on { opacity: 1; transform: rotate(var(--rot, 0deg)) scale(1); }
.pm-side { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 1.6vh, 16px); }
.pm-bowls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 1.4vw, 16px); width: 100%; }
.pm-bowl {
  position: relative; aspect-ratio: 1; padding: calc(var(--px) * 1); border: none; cursor: pointer;
  background: color-mix(in srgb, var(--tone) 10%, #ffffff);
  box-shadow: 0 0 0 calc(var(--px) * 0.75) var(--outline), 0 calc(var(--px) * 1.5) 0 calc(var(--px) * 0.75) var(--shadow);
  transition: transform .12s;
}
.pm-bowl img { width: 100%; height: 100%; object-fit: contain; }
.pm-bowl:hover:not(:disabled) { transform: translateY(calc(var(--px) * -1)); }
.pm-bowl.is-on { background: #fff6cf; box-shadow: 0 0 0 calc(var(--px) * 1) #e0a100, 0 0 0 calc(var(--px) * 1.75) var(--outline); transform: translateY(calc(var(--px) * -1)); }
.pm-bowl.is-ok { background: #e1f7d6; box-shadow: 0 0 0 calc(var(--px) * 1) #2e9f4a, 0 0 0 calc(var(--px) * 1.75) var(--outline); }
.pm-bowl.is-no { background: #ffe1dc; box-shadow: 0 0 0 calc(var(--px) * 1) #e2232c, 0 0 0 calc(var(--px) * 1.75) var(--outline); }
.pm-bowl.is-missing { outline: var(--px) dashed #2e9f4a; outline-offset: calc(var(--px) * 1.5); }
.pm-bowl:disabled { cursor: default; }
.pm-bowl:disabled:not(.is-ok):not(.is-no):not(.is-missing) { opacity: 0.45; }
.pm-feedback { margin: 0; min-height: 1.4em; font-weight: 700; text-align: center; font-size: clamp(1rem, 1.5vw, 1.2rem); }
.pm-feedback.is-ok { color: #12612a; }
.pm-feedback.is-no { color: #b3121a; }
.pm-actions { margin: 0; }

/* resultats: les pizzes fetes */
.pm-results { width: min(100%, 640px); }
.pm-results__list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, clamp(70px, 9vw, 118px)); gap: clamp(10px, 1.6vw, 18px); justify-content: center; }
.pm-mini { position: relative; }
.pm-mini__pizza { position: relative; display: block; aspect-ratio: 1; }
.pm-mini__pizza img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.pm-mini__tag { position: absolute; top: -6px; right: -6px; display: grid; place-items: center; width: 1.6em; height: 1.6em; font-weight: 700; color: #fff; background: #2e9f4a; box-shadow: 0 0 0 2px var(--outline); }
.pm-mini.is-no .pm-mini__tag { background: #e2232c; }

@media (max-width: 760px), (orientation: portrait) {
  .pm-table { grid-template-columns: 1fr; justify-items: center; }
  .pm-pizza { width: min(70vw, 340px); }
}
/* les capes de ChatGPT ocupen tota la imatge: es redueixen a la zona de la salsa (sense tapar la vora) */
.pm-pizza img.pm-pizza__layer { inset: 14%; width: 72%; height: 72%; }
.pm-mini__pizza img + img { inset: 14%; width: 72%; height: 72%; }

/* ---------- PA.pizzaArt: pizza muntada per a Grammar (lliçons i exercicis) ---------- */
.pa-pizza { position: relative; display: inline-flex; align-items: center; gap: 3%; width: 100%; height: 100%; justify-content: center; }
.pa-pizza__pie { position: relative; display: block; height: 100%; aspect-ratio: 1; max-width: 100%; }
.pa-pizza.has-no .pa-pizza__pie { max-width: 60%; }
.pa-pizza__pie img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.pa-pizza__pie img.pa-pizza__layer { inset: 14%; width: 72%; height: 72%; transform: rotate(var(--rot, 0deg)); }
.pa-pizza__no { position: relative; display: block; width: 37%; aspect-ratio: 1; flex: none; }
.pa-pizza__no img { width: 100%; height: 100%; object-fit: contain; }
.pa-pizza__no .ls-cross { inset: 4%; }

/* ---------- PA.lunchboxArt: carmanyola oberta (U3 Lunchbox Radio) ---------- */
.pa-lunch {
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6%; width: 100%; aspect-ratio: 1.15; padding: 8%;
  background: #7fd36b; border-radius: 14px; box-shadow: inset 0 0 0 4px #2f8a2a, inset 0 -8px 0 4px #4fb244, 0 0 0 3px var(--outline, #0b1460);
}
.pa-lunch__cell { display: grid; place-items: center; background: #f4fbef; border-radius: 8px; box-shadow: inset 0 0 0 3px #2f8a2a; min-height: 0; }
.pa-lunch__cell:first-child { grid-row: span 2; }
.pa-lunch__cell img { width: 86%; height: 86%; object-fit: contain; }
.sk-card--food .sk-card__art { display: grid; place-items: center; padding: 6%; }
.sk-card--food .pa-pizza { aspect-ratio: 1; height: auto; }

/* ---------- PA.panelArt: vinyetes muntades (U3 Reading) ----------
   Fons: paret crema a dalt i estovalles de quadres a baix (a les pizzes soles, tot estovalles). */
.pa-panel {
  --cloth: repeating-linear-gradient(90deg, rgba(226, 35, 44, .55) 0 18px, transparent 18px 36px),
           repeating-linear-gradient(0deg, rgba(226, 35, 44, .55) 0 18px, #fff 18px 36px);
  position: relative; display: block; width: 100%; aspect-ratio: 1; overflow: hidden;
  background: linear-gradient(to bottom, #fff6dc 0 42%, transparent 42%), var(--cloth);
}
.pa-panel--pizza { display: grid; place-items: center; background: var(--cloth); }
.pa-panel--pizza .pa-pizza { width: 88%; height: 88%; }
.pa-panel > * { position: absolute; display: block; }
.pa-panel__pizza .pa-pizza { width: 100%; height: 100%; }
.pa-panel img { object-fit: contain; }
/* a: en Pix pensa en la pizza amb tonyina · b: en Pix pispa el bol de tonyina
   c: la pizza sense tonyina (bol ratllat) · d: en Pix salta content amb el bol */
.pa-panel--a .pa-panel__pizza { left: 4%; bottom: 4%; width: 62%; height: 62%; }
.pa-panel--a .pa-panel__pix   { right: 0; top: 0; width: 56%; height: 56%; }
.pa-panel--b .pa-panel__pix   { left: 22%; top: 0; width: 62%; height: 62%; }
.pa-panel--b .pa-panel__pizza { left: 3%; bottom: 4%; width: 42%; height: 42%; }
.pa-panel--b .pa-panel__bowl  { right: 4%; bottom: 5%; width: 40%; height: 40%; }
.pa-panel--c .pa-panel__pizza { left: 2%; top: 8%; width: 96%; height: 88%; }
.pa-panel--d .pa-panel__pix   { left: 4%; top: 2%; width: 66%; height: 66%; }
.pa-panel--d .pa-panel__bowl  { right: 4%; bottom: 5%; width: 42%; height: 42%; }
.sk-order2__pic .pa-panel { pointer-events: none; }
.pa-panel--c .pa-pizza { align-items: center; }
.pa-panel--c .pa-pizza__pie { height: auto; width: 60%; }
/* ============================================================
   Open the Zoo! — imatge a l'esquerra amb el panell «Your sentence» a sota,
   i les opcions a la dreta en columnes (capçalera, fons propi i botons
   apilats). Reutilitza la consigna de Secret Zoo Signs (.signs-head), els
   botons i el resultat de la guia de camp. Accent turquesa de Vocabulary.
   ============================================================ */

.sections.ozoo-page {
  max-width: 1400px;
  padding-top: clamp(10px, 2vh, 20px);
  padding-bottom: clamp(12px, 3vh, 32px);
  /* la imatge i el panell de la frase comparteixen la columna de l'esquerra */
  --pic: clamp(180px, min(calc(100vh - var(--inner-hero-h) - 384px), 34vw), 460px);
  --panel-w: clamp(320px, 34vw, 500px);
}
.ozoo-head { margin-bottom: calc(var(--px) * 4); }

/* tres zones: imatge, columnes d'opcions i panell de la frase */
.ozoo-play {
  display: grid;
  grid-template-columns: var(--panel-w) auto;
  grid-template-areas:
    "pic      groups"
    "sentence groups";
  justify-content: center;
  align-items: start;
  gap: clamp(16px, 2.4vh, 26px) clamp(28px, 4vw, 64px);
}
.ozoo-play[hidden] { display: none; }
.ozoo-pic { grid-area: pic; justify-self: center; }
.ozoo-groups { grid-area: groups; align-self: center; }
.ozoo-panel { grid-area: sentence; }

/* colors suaus de cada grup (columna i espai de la frase) */
.ozoo-tone--animals, .ozoo-tone--who { --g-bg: #dcf6f1; --g-line: #18b5a4; }
.ozoo-tone--actions, .ozoo-tone--verb { --g-bg: #fff2c7; --g-line: #e0a100; }
.ozoo-tone--food,
.ozoo-tone--drink,
.ozoo-tone--places  { --g-bg: #ffe3d6; --g-line: #e2733d; }

/* ---------- Il·lustració ---------- */
.ozoo-pic {
  margin: 0;
  width: var(--pic);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  padding: calc(var(--px) * 3);
  background: color-mix(in srgb, var(--c) 14%, #ffffff);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1.5) 0 0 color-mix(in srgb, var(--c) 30%, #ffffff),
    0 calc(var(--px) * 3) 0 0 var(--shadow);
}
.ozoo-pic__img { width: 100%; height: 100%; object-fit: contain; }
.ozoo-pic__img.is-new { animation: guide-pop 0.36s steps(4, end); }

/* ---------- Columnes d'opcions ---------- */
.ozoo-groups {
  display: grid;
  grid-template-columns: repeat(var(--cols, 3), clamp(150px, 13vw, 210px));
  gap: clamp(18px, 2.2vw, 36px);
}
.ozoo-group {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: calc(var(--px) * 3);
  padding: calc(var(--px) * 3) calc(var(--px) * 3) calc(var(--px) * 4);
  background: var(--g-bg);
  box-shadow:
    inset 0 calc(var(--px) * 1.5) 0 0 var(--g-line),
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
/* columnes una a una: apagada (encara no toca) i la que toca ara */
.ozoo-group { transition: filter .3s ease, opacity .3s ease, transform .3s ease; }
.ozoo-group.is-locked { filter: grayscale(1) brightness(1.04); opacity: .42; }
.ozoo-group.is-locked .ozoo-chip { cursor: not-allowed; }
.ozoo-group.is-turn { transform: translateY(calc(var(--px) * -1.5)); animation: ozoo-turn 1.6s ease-in-out infinite; }
@keyframes ozoo-turn {
  0%, 100% { filter: drop-shadow(0 0 0 transparent); }
  50% { filter: drop-shadow(0 0 calc(var(--px) * 3) color-mix(in srgb, var(--g-line) 70%, transparent)); }
}
@media (prefers-reduced-motion: reduce) { .ozoo-group.is-turn { animation: none; } }
.ozoo-group__label {
  margin: calc(var(--px) * 1) 0 calc(var(--px) * 0.5);
  text-align: center;
  font-size: clamp(1.05rem, 1.4vw, 1.3rem);
  font-weight: 700;
  color: #0b1460;
}
.ozoo-group__chips { display: flex; flex-direction: column; gap: calc(var(--px) * 3); }

.px-btn.ozoo-chip {
  --tone: #ffffff;
  --tone-hi: #ffffff;
  --ring: color-mix(in srgb, var(--c) 62%, transparent);
  --ring2: color-mix(in srgb, var(--c) 24%, transparent);
  width: 100%;
  min-height: clamp(44px, 6.2vh, 56px);
  padding: 0 calc(var(--px) * 2.5);
  font-size: clamp(1.05rem, 1.45vw, 1.35rem);
  color: #0b1460;
  text-shadow: none;
}
/* opció triada (ressaltada mentre és a la frase) */
.px-btn.ozoo-chip.is-picked { --tone: var(--cb); --tone-hi: #b5f2ea; }
/* després de Check: triada correcta, triada equivocada, la correcta que faltava */
.px-btn.ozoo-chip.is-ok { --tone: #8ee07a; --tone-hi: #8ee07a; }
.px-btn.ozoo-chip.is-no { --tone: #ff9b8f; --tone-hi: #ff9b8f; }
.px-btn.ozoo-chip.is-answer {
  --tone: #e6fbdc; --tone-hi: #e6fbdc;
  outline: var(--px) dashed #2e9f4a;
  outline-offset: calc(var(--px) * 0.75);
}
.px-btn.ozoo-chip:disabled { cursor: default; transform: none; }
.px-btn.ozoo-chip:disabled:not(.is-ok):not(.is-no):not(.is-answer) { opacity: 0.55; }

/* ---------- Panell «Your sentence» ---------- */
.ozoo-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 2.5);
  width: var(--panel-w);
  padding: calc(var(--px) * 3) calc(var(--px) * 3) calc(var(--px) * 3.5);
  background: #ffffff;
  box-shadow:
    inset 0 calc(var(--px) * 1.5) 0 0 var(--c),
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
.ozoo-panel__title {
  margin-top: calc(var(--px) * 1);
  font-size: clamp(1rem, 1.3vw, 1.2rem);
  font-weight: 700;
  color: #0b1460;
}
.ozoo-sentence {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: center;
  gap: calc(var(--px) * 2);
  width: 100%;
}
/* un espai per grup: buit (amb el nom del grup) o amb la fitxa de la paraula */
.ozoo-slot {
  display: grid;
  place-items: center;
  min-width: clamp(84px, 8vw, 118px);
  min-height: clamp(42px, 5.6vh, 52px);
  padding: calc(var(--px) * 1);
  background: var(--g-bg);
  box-shadow:
    inset 0 0 0 calc(var(--px) * 0.5) color-mix(in srgb, var(--g-line) 55%, transparent),
    inset 0 calc(var(--px) * 1) 0 0 rgba(10, 15, 77, 0.08);
}
.ozoo-slot__hint { font-size: 0.85rem; font-weight: 700; color: color-mix(in srgb, var(--g-line) 70%, #0b1460); opacity: 0.75; }
.ozoo-tile {
  padding: calc(var(--px) * 1.25) calc(var(--px) * 2.5) calc(var(--px) * 1.5);
  font-size: clamp(1.15rem, 1.7vw, 1.5rem);
  font-weight: 700;
  line-height: 1.1;
  white-space: nowrap;
  color: #0b1460;
  background: #ffffff;
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1) 0 0 var(--g-line);
}
.ozoo-tile.is-new { animation: guide-pop 0.36s steps(4, end); }
.ozoo-tile.is-ok { background: #c9f1b6; box-shadow: 0 calc(var(--px) * -0.75) 0 0 var(--outline), 0 calc(var(--px) * 0.75) 0 0 var(--outline), calc(var(--px) * -0.75) 0 0 0 var(--outline), calc(var(--px) * 0.75) 0 0 0 var(--outline), inset 0 calc(var(--px) * -1) 0 0 #2e9f4a; }
.ozoo-tile.is-no { background: #ffd3cc; color: #b4232c; text-decoration: line-through; box-shadow: 0 calc(var(--px) * -0.75) 0 0 var(--outline), 0 calc(var(--px) * 0.75) 0 0 var(--outline), calc(var(--px) * -0.75) 0 0 0 var(--outline), calc(var(--px) * 0.75) 0 0 0 var(--outline), inset 0 calc(var(--px) * -1) 0 0 #b4232c; }
.ozoo-stop { align-self: flex-end; margin-left: calc(var(--px) * -1); font-size: clamp(1.5rem, 2vw, 1.9rem); font-weight: 700; line-height: 1.2; }

.ozoo-feedback { margin: 0; min-height: 1.3em; text-align: center; }
.ozoo-actions { margin: 0; }
/* Check desactivat fins que tots els espais són plens */
.ozoo-actions .px-btn:disabled,
.ozoo-actions .px-btn:disabled:hover,
.ozoo-actions .px-btn:disabled:active {
  --tone: #dfe5f5;
  color: #7c86b5;
  cursor: not-allowed;
  transform: none;
  background: var(--tone);
  box-shadow: var(--o4), inset 0 calc(var(--px) * -1.5) 0 0 #c3cbe4, 0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}

/* ---------- Resultat ---------- */
.ozoo-results { width: min(100%, 860px); }
.ozoo-results__list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: calc(var(--px) * 2.5);
  width: 100%;
  margin: 0;
  padding: 0;
  list-style: none;
}
.ozoo-mini {
  display: grid;
  grid-template-columns: 52px 1fr auto;
  align-items: center;
  gap: calc(var(--px) * 2);
  padding: calc(var(--px) * 1.5) calc(var(--px) * 2);
  text-align: left;
  background: #c9f1b6;
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline);
}
.ozoo-mini.is-no { background: #ffd3cc; }
.ozoo-mini__img { width: 52px; height: 52px; object-fit: contain; }
.ozoo-mini__text { font-size: 0.9rem; font-weight: 700; line-height: 1.15; }
.ozoo-mini__tag { font-size: 1.1rem; font-weight: 700; color: #1d7a35; }
.ozoo-mini.is-no .ozoo-mini__tag { color: #b4232c; }

/* ---------- Pantalles estretes i tauleta vertical: imatge → columnes → frase ---------- */
@media (max-width: 1000px), (orientation: portrait) {
  .sections.ozoo-page { --pic: clamp(180px, min(34vh, 62vw), 400px); --panel-w: min(100%, 560px); }
  .ozoo-play {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "pic" "groups" "sentence";
    justify-items: center;
  }
  .ozoo-groups { grid-template-columns: repeat(var(--cols, 3), minmax(0, 190px)); width: min(100%, 640px); justify-content: center; }
}
@media (max-width: 640px) {
  .ozoo-results__list { grid-template-columns: minmax(0, 1fr); }
  .ozoo-groups { gap: calc(var(--px) * 2.5); }
  .ozoo-group { padding: calc(var(--px) * 2) calc(var(--px) * 1.5) calc(var(--px) * 3); gap: calc(var(--px) * 2); }
  .px-btn.ozoo-chip { font-size: 0.95rem; padding: 0 calc(var(--px) * 1); }
  .ozoo-slot { min-width: 64px; }
}

/* ---------- Disseny nou (24-11-2026, proposta del mestre): ----------
   dibuix a dalt a l'esquerra, la frase gran a dalt a la dreta i les columnes de paraules
   a sota, amples, a tota l'amplada (abans: columnes petites a la dreta i frase sota el dibuix). */
@media (min-width: 1001px) and (orientation: landscape) {
  .sections.ozoo-page {
    --row-w: var(--wide-w);
    --pic: clamp(150px, calc(100vh - var(--inner-hero-h) - 400px), 330px);
  }
  .ozoo-play {
    grid-template-columns: var(--pic) minmax(0, 1fr);
    grid-template-areas: "pic sentence" "groups groups";
    width: var(--row-w); margin: 0 auto; position: relative; left: var(--wide-shift);
    align-items: stretch;
    gap: clamp(14px, 2.2vh, 24px) clamp(16px, 2vw, 26px);
  }
  .ozoo-pic { width: var(--pic); }
  .ozoo-panel { width: auto; justify-content: center; }
  .ozoo-sentence { justify-content: center; }
  .ozoo-slot { min-height: clamp(50px, 7.5vh, 68px); min-width: clamp(100px, 11vw, 170px); font-size: clamp(1.2rem, 1.9vw, 1.6rem); }
  .ozoo-slot__hint { font-size: clamp(0.95rem, 1.4vw, 1.2rem); }
  .ozoo-sentence { flex-wrap: nowrap; }
  .ozoo-groups { grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); width: 100%; align-self: start; gap: clamp(14px, 2vw, 22px); }
  .ozoo-group { padding: calc(var(--px) * 2.5) calc(var(--px) * 3) calc(var(--px) * 3); gap: calc(var(--px) * 2); }
  .ozoo-group__chips { gap: calc(var(--px) * 2); }
  .px-btn.ozoo-chip { min-height: clamp(42px, 6.4vh, 56px); font-size: clamp(1.2rem, 1.9vw, 1.6rem); }
}
@media (min-width: 1001px) and (orientation: landscape) {
  .ozoo-panel__title { font-size: clamp(1.15rem, 1.7vw, 1.45rem); }
}
/* paraula que ja ve posada a la frase (Pizza Builder!, 24-11-2026) */
.ozoo-tile.is-given { background: #ffffff; color: #0b1460; }
@media (min-width: 1001px) and (orientation: landscape) {
  .ozoo-groups[style*="--cols: 2"] { width: min(100%, 680px); justify-self: center; }
}

/* ✓ / ✗ de la web damunt la carta (U4 · Weekend Builder!) */
.ozoo-pic { position: relative; }
.sk-mark.ozoo-mark { top: 6px; right: 6px; }
.sk-mark.ozoo-mark[hidden] { display: none; }
/* ============================================================
   What are they like? — Grammar 1 (They are / They aren't + adjectiu).
   Targeta amb la il·lustració sencera (transparència original), l'etiqueta
   de l'adjectiu (anglès · català) i la frase a sota. A la comparativa, una
   fletxa pixelada i un marc puntejat ancorats a la imatge (en %) assenyalen
   el grup; a les negatives, una creu vermella travessa l'etiqueta sense
   amagar la paraula. Reutilitza .signs-head, .px-btn, .guide-* i la llista
   del resultat d'Open the Zoo!. Accent lila de Grammar.
   ============================================================ */

.sections.wl-page {
  max-width: 1200px;
  padding-top: clamp(10px, 2vh, 20px);
  padding-bottom: clamp(12px, 3vh, 32px);
  /* alçada de la il·lustració: el que queda sota la capçalera, consigna, frase i botons */
  --art-h: clamp(170px, calc(100vh - var(--inner-hero-h) - 350px), 440px);
}
.wl-head { margin-bottom: calc(var(--px) * 3); }

.wl-play {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(10px, 1.8vh, 18px);
}
.wl-play[hidden] { display: none; }
/* a la pràctica hi ha també la fila de fitxes: la il·lustració es fa una mica més baixa */
.wl-play[data-mode="practice"] { --art-h: clamp(160px, calc(100vh - var(--inner-hero-h) - 425px), 400px); }

/* ---------- Targeta: il·lustració + etiqueta al costat ---------- */
.wl-card {
  /* alçada real de la il·lustració: limitada per l'alçada disponible i per l'amplada de pantalla */
  --art-max-w: min(calc(100vw - 96px), 820px);
  --art-real: min(var(--art-h), calc(var(--art-max-w) / var(--rn, 1.5)));
  --callout-h: 108px;   /* etiqueta + fletxa sobre el grup */
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(16px, 2.4vw, 36px);
  width: 100%;
}
.wl-figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 1.5); min-width: 0; }
.wl-stage {
  padding: calc(var(--px) * 3);
  background: color-mix(in srgb, var(--c) 12%, #ffffff);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1.5) 0 0 color-mix(in srgb, var(--c) 28%, #ffffff),
    0 calc(var(--px) * 3) 0 0 var(--shadow);
}
/* la comparativa necessita lloc a dalt per a l'etiqueta i la fletxa: la imatge es fa una mica més baixa */
.wl-card.has-group { --art-real: min(calc(var(--art-h) - 44px), calc(var(--art-max-w) / var(--rn, 1.5))); }
/* espai a dalt perquè l'etiqueta i la fletxa del grup de l'esquerra hi càpiguen */
.wl-card.has-group .wl-stage {
  padding-top: max(calc(var(--px) * 3), calc(var(--callout-h) - var(--art-real) * 0.2));
}

/* contenidor ancorat: tot el que hi ha a dins es posiciona en % de la imatge */
.wl-art {
  position: relative;
  /* l'amplada surt de l'alçada (sense percentatges: la targeta s'ajusta a la imatge) */
  width: calc(var(--art-real) * var(--rn, 1.5));
  aspect-ratio: var(--ratio, 3 / 2);
}
.wl-art__img { display: block; width: 100%; height: 100%; object-fit: contain; }
.wl-art__img.is-new { animation: guide-pop 0.36s steps(4, end); }

/* marc puntejat al voltant del grup sencer */
.wl-frame {
  position: absolute;
  pointer-events: none;
  outline: calc(var(--px) * 0.75) dashed #ffb400;
  outline-offset: calc(var(--px) * 0.5);
  box-shadow: 0 0 0 calc(var(--px) * 1.25) rgba(255, 210, 63, 0.28);
  animation: wl-blink 1.2s steps(2, end) infinite;
}
.wl-frame[hidden] { display: none; }
@keyframes wl-blink { 50% { outline-color: #ff7a00; } }

/* etiqueta + fletxa, centrades sobre el grup i recolzades a la seva vora de dalt */
.wl-callout {
  position: absolute;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 0.5);
  padding-bottom: calc(var(--px) * 1);
  pointer-events: none;
  z-index: 2;
}
.wl-callout[hidden] { display: none; }
.wl-arrow {
  width: calc(var(--px) * 7);
  height: calc(var(--px) * 7);
  animation: wl-bob 0.9s steps(2, end) infinite;
}
@keyframes wl-bob { 50% { transform: translateY(calc(var(--px) * 1)); } }

/* ---------- Etiqueta de l'adjectiu (anglès · català) ---------- */
.wl-tag {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 3) calc(var(--px) * 2);
  white-space: nowrap;
  background: #ffffff;
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1) 0 0 var(--cb),
    0 calc(var(--px) * 1.5) 0 0 var(--shadow);
}
.wl-tag__word,
.wl-tag__meaning {
  position: relative;
  z-index: 1;   /* per damunt de la creu: la paraula es continua llegint */
  text-shadow: 2px 0 0 #fff, -2px 0 0 #fff, 0 2px 0 #fff, 0 -2px 0 #fff;
}
.wl-tag__word { font-size: clamp(1.25rem, 2vw, 1.75rem); font-weight: 700; line-height: 1.1; color: #0b1460; }
.wl-tag__meaning { font-size: clamp(0.85rem, 1.15vw, 1rem); font-weight: 700; line-height: 1.2; color: var(--c); }
.wl-tag__meaning[hidden] { display: none; }
/* creu vermella sobre l'etiqueta: dues diagonals primes; la paraula continua llegible */
.wl-tag__cross { position: absolute; inset: calc(var(--px) * -1); pointer-events: none; display: none; z-index: 0; }
.wl-tag.is-crossed .wl-tag__cross { display: block; }
.wl-tag__cross::before,
.wl-tag__cross::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top right,
    transparent calc(50% - var(--px) * 0.75), rgba(226, 35, 44, 0.7) calc(50% - var(--px) * 0.75),
    rgba(226, 35, 44, 0.7) calc(50% + var(--px) * 0.75), transparent calc(50% + var(--px) * 0.75));
}
.wl-tag__cross::after { transform: scaleX(-1); }
.wl-tag.is-crossing .wl-tag__cross { animation: guide-pop 0.36s steps(4, end); }
.wl-tag.is-crossed { box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1) 0 0 #e2232c,
    0 calc(var(--px) * 1.5) 0 0 var(--shadow); }

/* etiqueta al costat de la imatge (tigres i goril·les) */
.wl-side { display: none; }
.wl-card.has-side .wl-side { display: flex; flex-direction: column; align-items: center; }
.wl-card.has-side .wl-tag { padding: calc(var(--px) * 2.5) calc(var(--px) * 4) calc(var(--px) * 3); }
.wl-card.has-side .wl-tag__word,
.wl-tag__meaning {
  position: relative;
  z-index: 1;   /* per damunt de la creu: la paraula es continua llegint */
  text-shadow: 2px 0 0 #fff, -2px 0 0 #fff, 0 2px 0 #fff, 0 -2px 0 #fff;
}
.wl-tag__word { font-size: clamp(1.5rem, 2.6vw, 2.2rem); }
.wl-card.has-side .wl-tag__meaning { font-size: clamp(0.95rem, 1.4vw, 1.2rem); }

.wl-compare {
  margin: calc(var(--px) * 2) 0 0;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--ink-soft);
}
.wl-compare[hidden] { display: none; }

/* ---------- Frase ---------- */
.wl-sentence {
  margin: 0;
  text-align: center;
  font-size: clamp(1.6rem, 3vw, 2.4rem);
  font-weight: 700;
  line-height: 1.35;
  color: #0b1460;
}
.wl-verb {
  display: inline-block;
  padding: 0 calc(var(--px) * 1.5);
  background: #c9f1b6;
  box-shadow: inset 0 calc(var(--px) * -1) 0 0 #2e9f4a;
  color: #12612a;
}
.wl-verb.is-neg { background: #ffd3cc; box-shadow: inset 0 calc(var(--px) * -1) 0 0 #e2232c; color: #a1121b; }
/* buit del verb (pràctica) */
.wl-blank {
  display: inline-grid;
  place-items: center;
  min-width: 4.2em;
  padding: 0 calc(var(--px) * 1);
  border-bottom: var(--px) dashed color-mix(in srgb, var(--c) 70%, #0b1460);
  background: color-mix(in srgb, var(--c) 10%, #ffffff);
}
.wl-blank.is-filled { border-bottom-style: solid; }
.wl-blank__tile { padding: 0 calc(var(--px) * 1); }
.wl-blank__tile.is-new { animation: guide-pop 0.36s steps(4, end); }
.wl-blank.is-ok { background: #c9f1b6; border-bottom-color: #2e9f4a; color: #12612a; }
.wl-blank.is-no { background: #ffd3cc; border-bottom-color: #e2232c; color: #a1121b; }
.wl-blank.is-no .wl-blank__tile { text-decoration: line-through; }
/* adjectiu consultable: es llegeix com la resta de la frase, amb un subratllat puntejat */
.wl-adj {
  font: inherit;
  color: inherit;
  padding: 0;
  margin: 0;
  background: none;
  border: 0;
  border-bottom: calc(var(--px) * 0.75) dotted var(--c);
  cursor: help;
}
.wl-adj::after {
  content: "?";
  display: inline-grid;
  place-items: center;
  width: 1.15em;
  height: 1.15em;
  margin-left: calc(var(--px) * 1);
  vertical-align: 0.35em;
  font-size: 0.42em;
  color: #ffffff;
  background: var(--c);
}
.wl-adj:focus-visible { outline: var(--px) solid var(--c); outline-offset: calc(var(--px) * 0.75); }
.wl-tag.is-looked .wl-tag__meaning { animation: guide-pop 0.3s steps(3, end); }

.wl-note { margin: calc(var(--px) * -1) 0 0; font-size: 0.95rem; font-weight: 700; color: var(--ink-soft); }
.wl-note[hidden] { display: none; }

/* ---------- Fitxes are / aren't ---------- */
.wl-chips { display: flex; gap: clamp(14px, 2vw, 28px); justify-content: center; }
.wl-chips[hidden] { display: none; }
.px-btn.wl-chip {
  --tone: #ffffff;
  --tone-hi: #ffffff;
  --ring: color-mix(in srgb, var(--c) 62%, transparent);
  --ring2: color-mix(in srgb, var(--c) 24%, transparent);
  min-width: clamp(120px, 12vw, 170px);
  min-height: clamp(48px, 6.4vh, 60px);
  font-size: clamp(1.25rem, 1.8vw, 1.6rem);
  color: #0b1460;
  text-shadow: none;
}
.px-btn.wl-chip.is-picked { --tone: var(--cb); --tone-hi: #dcc7ff; }
.px-btn.wl-chip.is-ok { --tone: #8ee07a; --tone-hi: #8ee07a; }
.px-btn.wl-chip.is-no { --tone: #ff9b8f; --tone-hi: #ff9b8f; }
.px-btn.wl-chip.is-answer { --tone: #e6fbdc; --tone-hi: #e6fbdc; outline: var(--px) dashed #2e9f4a; outline-offset: calc(var(--px) * 0.75); }
.px-btn.wl-chip:disabled { cursor: default; transform: none; }
.px-btn.wl-chip:disabled:not(.is-ok):not(.is-no):not(.is-answer) { opacity: 0.55; }

.wl-feedback { margin: 0; min-height: 1.3em; text-align: center; font-size: 1.1rem; }
.wl-actions { margin: 0; }
.wl-actions .px-btn:disabled,
.wl-actions .px-btn:disabled:hover,
.wl-actions .px-btn:disabled:active {
  --tone: #dfe5f5;
  color: #7c86b5;
  cursor: not-allowed;
  transform: none;
  background: var(--tone);
  box-shadow: var(--o4), inset 0 calc(var(--px) * -1.5) 0 0 #c3cbe4, 0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}

/* ---------- Resultat ---------- */
.wl-results { width: min(100%, 860px); }
.wl-results__list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ozoo-mini .wl-mini__img { width: 52px; height: 40px; }

/* ---------- Pantalles baixes (portàtil petit): menys aire entre blocs ---------- */
@media (max-height: 760px) and (min-width: 761px) and (orientation: landscape) {
  .sections.wl-page { padding-top: 8px; }
  .wl-head { margin-bottom: calc(var(--px) * 2); }
  .wl-play { gap: 8px; }
  .wl-play[data-mode="practice"] { --art-h: clamp(130px, calc(100vh - var(--inner-hero-h) - 440px), 400px); }
  .wl-sentence { font-size: clamp(1.4rem, 2.6vw, 2rem); }
  .wl-compare { margin-top: calc(var(--px) * 1); }
  .px-btn.wl-chip { min-height: 44px; }
}

/* ---------- Pantalles estretes: etiqueta a sota de la imatge ---------- */
@media (max-width: 760px), (orientation: portrait) {
  .sections.wl-page { --art-h: clamp(150px, 34vh, 360px); }
  .wl-play[data-mode="practice"] { --art-h: clamp(140px, 30vh, 340px); }
  .wl-card { flex-direction: column; gap: calc(var(--px) * 3); }
  .wl-card { --art-max-w: min(calc(100vw - 72px), 820px); }
}
@media (max-width: 640px) {
  .wl-results__list { grid-template-columns: minmax(0, 1fr); }
  .wl-card { --art-max-w: calc(100vw - 52px); --callout-h: 80px; }
  .wl-stage { padding: calc(var(--px) * 1.5); }
  .wl-card.has-group .wl-stage { padding-top: max(calc(var(--px) * 1.5), calc(var(--callout-h) - var(--art-real) * 0.2)); }
  .wl-tag { padding: calc(var(--px) * 1) calc(var(--px) * 2) calc(var(--px) * 1.5); }
  .wl-tag__word,
.wl-tag__meaning {
  position: relative;
  z-index: 1;   /* per damunt de la creu: la paraula es continua llegint */
  text-shadow: 2px 0 0 #fff, -2px 0 0 #fff, 0 2px 0 #fff, 0 -2px 0 #fff;
}
.wl-tag__word { font-size: 1.1rem; }
  .wl-tag__meaning { font-size: 0.8rem; }
  .wl-arrow { width: calc(var(--px) * 5); height: calc(var(--px) * 5); }
}
/* ============================================================
   Ask and answer — Grammar 2 (Are they …? — Yes, they are. / No, they aren't.)
   Imatge a l'esquerra (la comparativa de What are they like?, amb el marc i
   la fletxa ancorats al grup; classes .wl-*) i exercici a la dreta, un ítem
   cada vegada. A la segona part, «Your question» és un espai propi sota la
   imatge. En pantalles estretes: imatge → Your question → exercici.
   ============================================================ */

.sections.aa-page {
  max-width: 1320px;
  --art-h: clamp(170px, calc(100vh - var(--inner-hero-h) - 290px), 440px);
}
.aa-head { margin-bottom: calc(var(--px) * 3); }

.aa-play {
  display: grid;
  grid-template-columns: auto minmax(320px, 470px);
  justify-content: center;
  align-items: center;
  gap: clamp(16px, 2.4vh, 26px) clamp(24px, 3.4vw, 56px);
}
.aa-play[hidden] { display: none; }

/* ---------- Esquerra: il·lustració ---------- */
.aa-left {
  --art-max-w: min(48vw, 740px);
  --art-real: min(var(--art-h), calc(var(--art-max-w) / var(--rn, 2)));
  --callout-h: 76px;    /* etiqueta «they» + fletxa sobre el grup */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 2);
  min-width: 0;
}
/* espai a dalt perquè «they» i la fletxa càpiguen sobre el grup (--gtop: vora de dalt del grup, 0–1) */
.aa-left.is-pointing .aa-stage { padding-top: max(calc(var(--px) * 3), calc(var(--callout-h) - var(--art-real) * var(--gtop, 0.2))); }
.wl-frame[hidden], .wl-callout[hidden], .aa-pointer[hidden] { display: none; }
.aa-callout { gap: calc(var(--px) * 0.5); }
.aa-they {
  padding: calc(var(--px) * 0.75) calc(var(--px) * 2) calc(var(--px) * 1);
  font-size: clamp(1rem, 1.4vw, 1.25rem);
  font-weight: 700;
  line-height: 1.1;
  color: #ffffff;
  background: var(--c);
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline),
    0 calc(var(--px) * 1.25) 0 0 var(--shadow);
}
.wl-frame.is-new { animation: guide-pop 0.36s steps(4, end), wl-blink 1.2s steps(2, end) 0.36s infinite; }
.aa-pointer { margin: calc(var(--px) * 1) 0 0; font-size: 0.9rem; font-weight: 700; color: var(--ink-soft); }

/* ---------- Panells blancs (exercici i Your question) ---------- */
.aa-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 3);
  padding: calc(var(--px) * 4) calc(var(--px) * 4) calc(var(--px) * 4.5);
  background: #ffffff;
  box-shadow:
    inset 0 calc(var(--px) * 1.5) 0 0 var(--c),
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
/* «Your question»: safata suau dins del panell, just sota les fitxes */
.aa-yourq {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 2);
  width: 100%;
  box-sizing: border-box;
  padding: calc(var(--px) * 2.5) calc(var(--px) * 3) calc(var(--px) * 3);
  background: color-mix(in srgb, var(--c) 7%, #ffffff);
  box-shadow: inset 0 0 0 calc(var(--px) * 0.5) color-mix(in srgb, var(--c) 30%, transparent);
}
.aa-panel__title {
  display: flex;
  align-items: center;
  gap: calc(var(--px) * 2);
  margin-top: calc(var(--px) * 0.5);
  font-size: clamp(1rem, 1.3vw, 1.2rem);
  font-weight: 700;
  color: #0b1460;
}
.aa-right { display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 3); width: 100%; }

/* pregunta i resposta, com un petit diàleg */
.aa-dialog {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: calc(var(--px) * 2);
  width: 100%;
}
/* línies del diàleg: pregunta (Q) i resposta (A), alineades a l'esquerra i de la mateixa amplada */
.aa-line {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: calc(var(--px) * 3);
  width: 100%;
  box-sizing: border-box;
  padding: calc(var(--px) * 2) calc(var(--px) * 3);
  background: color-mix(in srgb, var(--c) 12%, #ffffff);
  box-shadow: inset 0 calc(var(--px) * -1) 0 0 color-mix(in srgb, var(--c) 35%, #ffffff);
  --tag: var(--c);
}
/* resposta afirmativa en verd i negativa en vermell (pista de color) */
.aa-line--a.is-yes { background: #e9f8e2; box-shadow: inset 0 calc(var(--px) * -1) 0 0 #9fd98c; --tag: #2e9f4a; }
.aa-line--a.is-no  { background: #ffece8; box-shadow: inset 0 calc(var(--px) * -1) 0 0 #f4a99f; --tag: #e2232c; }
.aa-line__tag {
  display: grid;
  place-items: center;
  width: calc(var(--px) * 9);
  height: calc(var(--px) * 9);
  font-size: 1.15rem;
  font-weight: 700;
  color: #ffffff;
  background: var(--tag);
  box-shadow: 0 0 0 calc(var(--px) * 0.5) var(--outline), 0 calc(var(--px) * 1) 0 0 var(--shadow);
}
.aa-line__text {
  margin: 0;
  font-size: clamp(1.4rem, 2.3vw, 2rem);
  font-weight: 700;
  line-height: 1.35;
  color: #0b1460;
}
.aa-line__text .aa-mark { margin-left: calc(var(--px) * 2); vertical-align: middle; }
.aa-line--a.is-no .wl-blank { border-bottom-color: #e2232c; background: #fff6f4; }
.aa-line--a.is-yes .wl-blank { border-bottom-color: #2e9f4a; background: #f6fdf2; }
.aa-dialog--neg { padding-top: calc(var(--px) * 3); border-top: calc(var(--px) * 0.75) dashed color-mix(in srgb, var(--c) 40%, #ffffff); }
.aa-dialog__label { margin: 0; font-size: 0.9rem; font-weight: 700; color: var(--ink-soft); }
.aa-a--blank { white-space: nowrap; }

/* fitxes are / aren't: 24-11-2026 (mestre) sense color abans de respondre; el verd i el vermell només surten en corregir */
.px-btn.wl-chip.aa-chip--yes, .px-btn.wl-chip.aa-chip--no { --tone: #ffffff; --tone-hi: #f4f6ff; color: #0b1460; }
.px-btn.wl-chip.aa-chip--yes.is-picked, .px-btn.wl-chip.aa-chip--no.is-picked { --tone: #ffe680; --tone-hi: #ffe680; }
.aa-chips { margin-top: calc(var(--px) * 1); }

/* ✓ / ✗ */
.aa-mark {
  display: inline-grid;
  place-items: center;
  width: calc(var(--px) * 8);
  height: calc(var(--px) * 8);
  padding: calc(var(--px) * 1);
  box-sizing: border-box;
  background: #2e9f4a;
  box-shadow: 0 0 0 calc(var(--px) * 0.75) var(--outline);
  animation: guide-pop 0.36s steps(4, end);
}
.aa-mark.is-no { background: #e2232c; }
.aa-mark .guide-mark { width: 100%; height: 100%; }
.aa-row-mark:empty { display: none; }
.aa-row-mark { display: inline-flex; }

/* ---------- Part 2: fitxes de la pregunta ---------- */
.aa-step { margin: 0; align-self: flex-start; display: flex; align-items: center; gap: calc(var(--px) * 2); font-size: clamp(1rem, 1.2vw, 1.1rem); font-weight: 700; color: #0b1460; }
.aa-bank {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: calc(var(--px) * 3);
  min-height: clamp(48px, 6.4vh, 58px);
}
.px-btn.aa-tile,
.aa-tile {
  --tone: #ffffff;
  --tone-hi: #ffffff;
  --ring: color-mix(in srgb, var(--c) 62%, transparent);
  --ring2: color-mix(in srgb, var(--c) 24%, transparent);
  min-width: clamp(56px, 5vw, 76px);
  min-height: clamp(46px, 6vh, 56px);
  padding: 0 calc(var(--px) * 3);
  font-size: clamp(1.25rem, 1.8vw, 1.6rem);
  color: #0b1460;
  text-shadow: none;
}
.px-btn.aa-tile:disabled { cursor: default; transform: none; opacity: 0.55; }
.aa-bank__empty { align-self: center; font-size: 0.9rem; font-weight: 700; color: var(--ink-soft); }

/* Your question: fila de fitxes col·locades */
.aa-slots {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: calc(var(--px) * 2);
  width: 100%;
  min-height: clamp(54px, 7vh, 64px);
  padding: calc(var(--px) * 1.5);
  background: color-mix(in srgb, var(--c) 10%, #ffffff);
  box-shadow: inset 0 0 0 calc(var(--px) * 0.5) color-mix(in srgb, var(--c) 45%, transparent);
}
.aa-slots.is-ok { background: #e6fbdc; box-shadow: inset 0 0 0 calc(var(--px) * 0.5) #2e9f4a; }
.aa-slots.is-no { background: #ffe9e5; box-shadow: inset 0 0 0 calc(var(--px) * 0.5) #e2232c; }
.aa-slots__hint { font-size: 0.95rem; font-weight: 700; color: color-mix(in srgb, var(--c) 70%, #0b1460); opacity: 0.8; }
.aa-tile--placed {
  font-family: inherit;
  font-size: clamp(1.2rem, 1.7vw, 1.5rem);
  font-weight: 700;
  line-height: 1.1;
  min-height: 0;
  padding: calc(var(--px) * 1.25) calc(var(--px) * 2.5) calc(var(--px) * 1.5);
  background: #ffffff;
  border: 0;
  cursor: pointer;
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1) 0 0 var(--c);
}
.aa-tile--placed:hover:not(:disabled) { background: #f4edff; }
.aa-tile--placed:focus-visible { outline: var(--px) solid var(--c); outline-offset: calc(var(--px) * 1); }
.aa-tile--placed:disabled { cursor: default; }
.aa-tile--placed.is-new { animation: guide-pop 0.36s steps(4, end); }
.aa-fix { margin: 0; font-size: 1rem; font-weight: 700; color: #a1121b; }
.aa-fix[hidden] { display: none; }

/* respostes per triar (apareixen quan la pregunta és completa) */
.aa-answerbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 3);
  width: 100%;
  padding-top: calc(var(--px) * 2);
}
.aa-answerbox[hidden] { display: none; }
.aa-answerbox.is-new .aa-answers { animation: guide-pop 0.36s steps(4, end); }
/* a la segona part, més aire entre fitxes, Your question i respostes */
.aa-play[data-mode="build"] .aa-right { gap: clamp(12px, 2vh, 20px); }
.aa-answers { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(14px, 1.6vw, 24px); }
.px-btn.aa-answer {
  --ring: color-mix(in srgb, var(--c) 62%, transparent);
  --ring2: color-mix(in srgb, var(--c) 24%, transparent);
  min-width: clamp(150px, 10.5vw, 190px);
  min-height: clamp(48px, 6.4vh, 58px);
  padding: 0 calc(var(--px) * 3.5);
  font-size: clamp(1.1rem, 1.5vw, 1.35rem);
  text-shadow: none;
}
/* respostes Yes / No: 24-11-2026 (mestre) sense color abans de respondre; el verd i el vermell només surten en corregir */
.px-btn.aa-answer--yes, .px-btn.aa-answer--no { --tone: #ffffff; --tone-hi: #f4f6ff; color: #0b1460; }
.px-btn.aa-answer--yes.is-picked, .px-btn.aa-answer--no.is-picked { --tone: #ffe680; --tone-hi: #ffe680; }
.px-btn.aa-answer.is-ok { --tone: #8ee07a; --tone-hi: #8ee07a; color: #0b1460; }
.px-btn.aa-answer.is-no { --tone: #ff9b8f; --tone-hi: #ff9b8f; color: #0b1460; }
.px-btn.aa-answer.is-answer { outline: var(--px) dashed #2e9f4a; outline-offset: calc(var(--px) * 0.75); }
.px-btn.aa-answer:disabled { cursor: default; transform: none; }
.px-btn.aa-answer:disabled:not(.is-ok):not(.is-no):not(.is-answer) { opacity: 0.55; }

.aa-feedback { margin: 0; min-height: 1.3em; text-align: center; font-size: 1.05rem; }
.aa-feedback:empty { display: none; }
.aa-actions { margin: 0; }
.aa-actions .px-btn:disabled,
.aa-actions .px-btn:disabled:hover,
.aa-actions .px-btn:disabled:active {
  --tone: #dfe5f5;
  color: #7c86b5;
  cursor: not-allowed;
  transform: none;
  background: var(--tone);
  box-shadow: var(--o4), inset 0 calc(var(--px) * -1.5) 0 0 #c3cbe4, 0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}

/* ---------- Pantalles baixes ---------- */
@media (max-height: 760px) and (min-width: 1001px) and (orientation: landscape) {
  .sections.aa-page { padding-top: 8px; }
  .aa-head { margin-bottom: calc(var(--px) * 2); }
  .aa-panel { gap: calc(var(--px) * 2); padding: calc(var(--px) * 3); }
  .aa-right { gap: calc(var(--px) * 2); }
  .aa-line { padding-top: calc(var(--px) * 1.25); padding-bottom: calc(var(--px) * 1.25); }
  .aa-line__text { font-size: clamp(1.25rem, 2vw, 1.7rem); }
  .aa-play[data-mode="build"] { --art-h: clamp(130px, calc(100vh - var(--inner-hero-h) - 330px), 360px); }
}

/* ---------- Pantalles estretes i vertical: imatge → Your question → exercici ---------- */
@media (max-width: 1000px), (orientation: portrait) {
  .sections.aa-page { --art-h: clamp(150px, 30vh, 340px); }
  .aa-play { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .aa-left { --art-max-w: min(calc(100vw - 72px), 720px); width: 100%; }
  .aa-panel { width: min(100%, 560px); box-sizing: border-box; }
}
@media (max-width: 640px) {
  .aa-left { --art-max-w: calc(100vw - 52px); --callout-h: 60px; }
  .aa-stage { padding-left: calc(var(--px) * 1.5); padding-right: calc(var(--px) * 1.5); padding-bottom: calc(var(--px) * 1.5); }
  .aa-panel { padding: calc(var(--px) * 3) calc(var(--px) * 2.5); }
  .aa-line { padding-left: calc(var(--px) * 2); padding-right: calc(var(--px) * 2); gap: calc(var(--px) * 2); }
  .aa-line__text { font-size: 1.3rem; }
  .aa-line__tag { width: calc(var(--px) * 7); height: calc(var(--px) * 7); font-size: 1rem; }
  .aa-they { font-size: 0.9rem; }
  .px-btn.aa-tile { min-width: 48px; padding: 0 calc(var(--px) * 2); font-size: 1.15rem; }
}

/* ---------- Proposta C (24-11-2026, mestre): ----------
   · sense caixetes Q/A a cap pantalla: la pregunta va en lila clar i la resposta en verd o vermell;
   · exemple resolt: dibuix a dalt a tota l'amplada, la parella del sí i la del no una al costat
     de l'altra a sota, i «Let's start!» a baix a la dreta. */
.aa-page .aa-line__tag { display: none; }
.aa-page .aa-line { grid-template-columns: 1fr; }

.aa-play[data-mode="model"] {
  grid-template-columns: minmax(0, 1fr);
  justify-items: center;
  gap: clamp(12px, 2vh, 20px);
  --c-w: var(--wide-w);
  position: relative; left: var(--wide-shift);
}
.aa-play[data-mode="model"] .aa-left {
  --art-max-w: var(--c-w);
  width: var(--c-w);
  padding: calc(var(--px) * 2) 0;
  background: color-mix(in srgb, var(--c) 8%, #ffffff);
  box-shadow: inset 0 calc(var(--px) * 1.5) 0 0 var(--c),
    0 calc(var(--px) * -1) 0 0 var(--outline), 0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline), var(--px) 0 0 0 var(--outline), 0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
.aa-play[data-mode="model"] .aa-left .wl-stage { background: none; box-shadow: none; }
.aa-play[data-mode="model"] .aa-pointer { display: none; }
.aa-play[data-mode="model"] .aa-panel { width: var(--c-w); padding: 0; background: none; box-shadow: none; gap: clamp(10px, 1.6vh, 16px); }
.aa-play[data-mode="model"] .aa-right { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 2vw, 24px); }
.aa-play[data-mode="model"] .aa-dialog {
  padding: calc(var(--px) * 4) calc(var(--px) * 3) calc(var(--px) * 3);
  background: #ffffff; border-top: 0;
  box-shadow: inset 0 calc(var(--px) * 1.5) 0 0 var(--c),
    0 calc(var(--px) * -1) 0 0 var(--outline), 0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline), var(--px) 0 0 0 var(--outline), 0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
.aa-play[data-mode="model"] .aa-dialog__label { display: none; }
.aa-play[data-mode="model"] .aa-line__text { font-size: clamp(1.3rem, min(2.2vw, 3.6vh), 1.9rem); }
.aa-play[data-mode="model"] .aa-actions { align-self: flex-end; }
.sections.aa-page:has(.aa-play[data-mode="model"]) { --art-h: clamp(150px, calc(100vh - var(--inner-hero-h) - 420px), 420px); }
/* ============================================================
   Animal Puzzle — Grammar 3. Tauler de peces (fons comú darrere de totes,
   perquè les zones transparents es llegeixin igual), peça triada ressaltada,
   imatge muntada sense separacions i dues frases per triar a sota.
   Reutilitza .wl-stage, .wl-frame, .wl-callout, .aa-they, .aa-mark i els
   botons i el resultat de la guia de camp. Accent lila de Grammar.
   ============================================================ */

.sections.pz-page {
  max-width: 1200px;
  /* alçada del tauler: el que queda sota la capçalera, consigna, frases i botons */
  --bh: clamp(170px, calc(100vh - var(--inner-hero-h) - 285px), 500px);
  --piece-bg: #f1ecfb;
}
