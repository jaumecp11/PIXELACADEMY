  <script>
/*
 * PIXEL ACADEMY — TAULERS de les activitats de Skills (3r · Unit 2)
 * ------------------------------------------------------------
 * Un tauler és una pregunta "gran" que val diversos punts (it.max). El motor
 * (js/views/skill.js) li passa { h, shuffle, redText, badge, ready(on) } i
 * espera { el, check() → { pts, evidence: [índexs de frase] } }.
 *
 *   order  ordenar vinyetes (Story Trail): tocar una vinyeta del banc la posa a
 *          la primera casella buida; tocar-ne una de col·locada la torna al banc.
 *   slots  omplir un horari (Ruby's Timetable): tocar una carta i després una
 *          fila (o a l'inrevés); tocar una fila plena retorna la carta.
 *   chart  graella ✓/✗ (Ruby and Oscar Chart): cada casella canvia
 *          buida → ✓ → ✗ → ✓…
 * Disseny: docs/jocs/unitat-2.md §6.
 */
window.PA = window.PA || {};

PA.skillBoards = (function () {
  var CARD = "assets/img/field-guides/school/";

  /* ---------- order ---------- */
  /* order v2 (mestre, 21-11-2026: «les imatges es veuen petites»): ja no hi ha tira de caselles
     + banc; les 4 vinyetes surten grans en una graella 2×2 i, en tocar-les, reben el número
     següent (1, 2, 3, 4). Tocar una vinyeta numerada li treu el número.
     Versió anterior: js/views/_historic/skill-boards-abans-ordre-numeros.js.txt */
  function order(act, it, k) {
    var h = k.h, panels = act.panels, n = panels.length;
    var num = {}, done = false;          /* num[id] = 1..n */
    var shown = k.shuffle(panels);
    while (shown.every(function (p, i) { return p.id === panels[i].id; })) shown = k.shuffle(panels);
    function nextFree() { for (var x = 1; x <= n; x++) { var used = false; for (var id in num) if (num[id] === x) used = true; if (!used) return x; } return 0; }

    var picEls = {};
    var grid = h("div.sk-order2", { role: "group", "aria-label": "Pictures" }, shown.map(function (p) {
      var badgeEl = h("span.sk-order2__num", { "aria-hidden": "true" });
      var b = h("button.sk-order2__pic", { type: "button" }, [
        p.src ? h("img", { src: PA.asset(p.src), alt: "", width: p.w, height: p.h, decoding: "async" }) : PA.panelArt(p), badgeEl]);
      b.addEventListener("click", function () {
        if (done) return;
        if (num[p.id]) delete num[p.id]; else { var x = nextFree(); if (x) num[p.id] = x; }
        draw();
      });
      picEls[p.id] = { b: b, badge: badgeEl, p: p };
      return b;
    }));
    var el = h("div.sk-order.sk-order--num", null, [grid]);   /* la pregunta ja ho diu: «Put the pictures in order.» */

    function draw() {
      shown.forEach(function (p) {
        var o = picEls[p.id], x = num[p.id];
        o.badge.textContent = x ? String(x) : "";
        o.b.classList.toggle("is-numbered", !!x);
        o.b.setAttribute("aria-label", p.alt + (x ? ": number " + x + " (tap to remove)" : ": no number"));
      });
      k.ready(Object.keys(num).length === n);
    }
    draw();

    return { el: el, check: function () {
      done = true;
      var pts = 0;
      panels.forEach(function (p, i) {
        var o = picEls[p.id], ok = num[p.id] === i + 1;
        if (ok) pts++;
        o.b.classList.add(ok ? "is-ok" : "is-no");
        o.b.disabled = true;
        o.b.appendChild(k.badge(ok));
        if (!ok) o.b.appendChild(h("span.sk-order2__right", null, "\u2192 " + (i + 1)));
      });
      return { pts: pts, evidence: [] };
    } };
  }

  /* ---------- slots ---------- */
  function slots(act, it, k) {
    var h = k.h, rows = it.rows;
    var filled = rows.map(function () { return null; }), picked = null, pickedRow = null, done = false;
    var label = function (id) { return (it.labels && it.labels[id]) || (id.charAt(0).toUpperCase() + id.slice(1)); };
    var folder = it.cardFolder || CARD;
    function rowName(r) { return r.label || PA.timeWords(r.h, r.m); }

    var rowEls = rows.map(function (r, i) {
      var slot = h("button.sk-slots__slot", { type: "button" });
      slot.addEventListener("click", function () {
        if (done) return;
        if (picked) { place(picked, i); return; }
        if (filled[i]) { filled[i] = null; pickedRow = null; draw(); return; }
        pickedRow = pickedRow === i ? null : i; draw();
      });
      /* fila amb rellotge (horari) o amb una mostra de color i un nom (illes, llocs…) */
      var li = h("li.sk-slots__row", null, [
        r.label ? h("span.sk-slots__swatch", { "aria-hidden": "true", style: { background: r.swatch || "#cfd6f5" } })
                : PA.pixelClock(r.h, r.m, { className: "px-clock--sm", label: PA.timeWords(r.h, r.m) }),
        h("span.sk-slots__time", null, rowName(r)),
        slot
      ]);
      return { li: li, slot: slot };
    });
    var cardEls = {};
    it.bank.forEach(function (id) {
      var b = h("button.sk-card.sk-slots__card", { type: "button", "aria-label": label(id) }, [
        h("span.sk-card__art", null, h("img", { src: PA.asset(folder + id + "-400.webp"), alt: "", width: "400", height: "400" })),
        h("span.sk-card__label", null, label(id))
      ]);
      b.addEventListener("click", function () {
        if (done || filled.indexOf(id) !== -1) return;
        if (pickedRow !== null) { place(id, pickedRow); return; }
        picked = picked === id ? null : id; draw();
      });
      cardEls[id] = b;
    });
    function place(id, i) {
      var was = filled.indexOf(id);
      if (was !== -1) filled[was] = null;
      filled[i] = id; picked = null; pickedRow = null; draw();
    }
    var table = h("ol.sk-slots", { "aria-label": it.ariaLabel || "Ruby's timetable" }, rowEls.map(function (r) { return r.li; }));
    var bank = h("div.sk-slots__bank", { role: "group", "aria-label": "Subjects" }, it.bank.map(function (id) { return cardEls[id]; }));
    var el = h("div.sk-slotsboard", null, [
      h("p.sk-board__hint", null, it.hint || "Tap a subject, then tap its time."), table, bank]);

    function draw() {
      rowEls.forEach(function (r, i) {
        var id = filled[i];
        r.slot.textContent = "";
        if (id) {
          r.slot.appendChild(h("img", { src: PA.asset(folder + id + "-400.webp"), alt: "", width: "400", height: "400" }));
          r.slot.appendChild(h("span", null, label(id)));
        } else r.slot.appendChild(h("span.sk-slots__empty", null, "?"));
        r.slot.classList.toggle("is-filled", !!id);
        r.slot.classList.toggle("is-target", pickedRow === i || (!!picked && !id));
        r.slot.setAttribute("aria-label", rowName(rows[i]) + ": " + (id ? label(id) : "empty"));
      });
      it.bank.forEach(function (id) {
        var used = filled.indexOf(id) !== -1;
        cardEls[id].classList.toggle("is-picked", picked === id);
        cardEls[id].classList.toggle("is-used", used);
        cardEls[id].disabled = used;
      });
      k.ready(filled.indexOf(null) === -1);
    }
    draw();

    return { el: el, check: function () {
      done = true;
      var pts = 0, ev = [];
      rowEls.forEach(function (r, i) {
        var ok = filled[i] === rows[i].answer;
        if (ok) pts++; else if (rows[i].evidence != null) ev.push(rows[i].evidence);
        r.slot.classList.remove("is-target");
        r.slot.classList.add(ok ? "is-ok" : "is-no");
        r.slot.disabled = true;
        r.li.appendChild(k.badge(ok));
        if (!ok) r.li.appendChild(h("span.sk-slots__right", null, [
          h("img", { src: PA.asset(folder + rows[i].answer + "-400.webp"), alt: "", width: "400", height: "400" }), label(rows[i].answer)]));
      });
      bank.hidden = true;
      return { pts: pts, evidence: ev };
    } };
  }

  /* ---------- chart ---------- */
  function chart(act, it, k) {
    var h = k.h, cols = it.cols, rows = it.rows;
    var state = rows.map(function () { return cols.map(function () { return null; }); }), done = false;
    var cells = [];
    var head = h("tr", null, [h("th", { scope: "col" }, h("span.sk-chart__corner", null, ""))].concat(cols.map(function (c) {
      return h("th.sk-chart__col", { scope: "col" }, [
        h("img", { src: PA.asset(c.src || (CARD + c.image + "-400.webp")), alt: "", width: "400", height: "400" }), h("span", null, c.label)]);
    })));
    var body = rows.map(function (r, ri) {
      cells[ri] = [];
      return h("tr", null, [h("th.sk-chart__row", { scope: "row" }, [
        r.icon ? h("img", { src: PA.asset(CARD + r.icon + "-400.webp"), alt: "", width: "400", height: "400" }) : null,
        h("span", null, r.text)].filter(Boolean))
      ].concat(cols.map(function (c, ci) {
        var b = h("button.sk-chart__cell", { type: "button" });
        b.addEventListener("click", function () {
          if (done) return;
          var v = state[ri][ci];
          state[ri][ci] = v === true ? false : true;   /* buida → ✓ → ✗ → ✓ … */
          draw();

        cells[ri][ci] = b;

    });
    var table = h("table.sk-chart", null, [h("thead", null, head), h("tbody", null, body)]);
    var el = h("div.sk-chartboard", null, [h("p.sk-board__hint", null, "Tap each box: ✓ yes · ✗ no."), table]);

    function mark(v) { return v === true ? "✓" : v === false ? "✗" : ""; }
    function draw() {
      var full = true;
      rows.forEach(function (r, ri) {
        cols.forEach(function (c, ci) {

          if (v === null) full = false;
          b.textContent = mark(v);
          b.classList.toggle("is-yes", v === true);
          b.classList.toggle("is-nope", v === false);
          b.setAttribute("aria-label", c.label + " " + r.text + ": " + (v === true ? "yes" : v === false ? "no" : "empty"));
        });

      k.ready(full);
    }
    draw();

    return { el: el, check: function () {
      done = true;
      var pts = 0, ev = [];
      rows.forEach(function (r, ri) {
        cols.forEach(function (c, ci) {
          var want = !!r.answers[c.id], ok = state[ri][ci] === want, b = cells[ri][ci];
          if (ok) pts++;
          else if (r.evidence && r.evidence[c.id] != null) ev.push(r.evidence[c.id]);
          b.disabled = true;
          b.classList.add(ok ? "is-ok" : "is-no");

        });
      });
      return { pts: pts, evidence: ev };
    } };
  }

  return { order: order, slots: slots, chart: chart };
})();

/* ---------- tap: tocar una persona en una escena (Listen and Tap, U2 L3) ----------
   it: { max: 1, answer } · act.scene { src, w, h } · act.zones [{ id, name, box: [x0, y0, x1, y1] en % }] */
PA.skillBoards.tap = function (act, it, k) {

  k.ready(false);

/* ---------- Imatge d'un tauler de frases: carta, aula amb rellotge o rellotge sol ---------- */
PA.skillBoardPicture = function (it, h) {
  var art;
  if (it.room) art = PA.roomArt(it.room[0], it.room[1], it.room[2], { bigClock: true });
  else if (it.clock) art = PA.pixelClock(it.clock[0], it.clock[1], { label: "A clock" });

  return h("figure.sk-boardpic" + (it.clock ? ".sk-boardpic--clock" : ""), null, [art, mk]);

/* ---------- build: construir la frase amb columnes (Grammar Review U2, 19-11-2026) ----------
   Com Open the Zoo!: una paraula per columna, i les columnes s'encenen una a una
   (només té color la que toca i les ja triades).
   it: { board: "build", max: 1, sprite | room: [id, h, m], groups: [{ name, tone, options, answer }] } */
PA.skillBoards.build = function (act, it, k) {
  var h = k.h, picks = {}, done = false, fresh = null;
  var opts = it.groups.map(function (g) { return k.shuffle(g.options); });
  var groupsBox = h("div.ozoo-groups.sk-build__groups");
  groupsBox.style.setProperty("--cols", it.groups.length);
  var sentence = h("p.ozoo-sentence.sk-build__sentence", { "aria-live": "polite" });

  function draw() {
    var turn = it.groups.findIndex(function (g) { return !picks[g.name]; });
    groupsBox.textContent = ""; sentence.textContent = "";
    it.groups.forEach(function (g, gi) {
      var locked = !done && turn !== -1 && gi > turn;
      var state = done ? "" : locked ? ".is-locked" : gi === turn ? ".is-turn" : ".is-done";
      var chips = opts[gi].map(function (w) {
        var on = picks[g.name] === w, cls = "button.px-btn.ozoo-chip" + (on ? ".is-picked" : "");
        if (done) { if (on) cls += w === g.answer ? ".is-ok" : ".is-no"; else if (w === g.answer && picks[g.name] !== g.answer) cls += ".is-answer"; }
        var b = h(cls, { type: "button", "aria-pressed": on ? "true" : "false", disabled: (done || locked) ? true : null }, w);
        b.addEventListener("click", function () { if (done || picks[g.name] === w) return; picks[g.name] = w; fresh = g.name; draw(); });
        return b;
      });
      groupsBox.appendChild(h("div.ozoo-group.ozoo-tone--" + g.tone + state, { role: "group", "aria-label": g.name, "aria-disabled": locked ? "true" : null }, [
        h("p.ozoo-group__label", null, g.name), h("div.ozoo-group__chips", null, chips)]));
      var w = picks[g.name];
      sentence.appendChild(h("span.ozoo-slot.ozoo-tone--" + g.tone + (w ? ".is-filled" : ""), { "aria-label": g.name + ": " + (w || "empty") },
        w ? h("span.ozoo-tile" + (done ? (w === g.answer ? ".is-ok" : ".is-no") : "") + (fresh === g.name ? ".is-new" : ""), null, w)
          : h("span.ozoo-slot__hint", { "aria-hidden": "true" }, g.name)));
    });
    sentence.appendChild(h("span.ozoo-stop", { "aria-hidden": "true" }, "."));
    fresh = null;
    k.ready(turn === -1);
  }
  draw();
  var answer = it.groups.map(function (g) { return g.answer; }).join(" ") + ".";
  return {
    el: h("div.sk-build", null, [PA.skillBoardPicture(it, h), h("div.sk-build__right", null, [groupsBox, sentence])]),
    check: function () {
      done = true; draw();
      var ok = it.groups.every(function (g) { return picks[g.name] === g.answer; });
      return { pts: ok ? 1 : 0, answer: answer };
    }
  };
};

/* ---------- words: ordenar les paraules d'una frase en un diàleg (Grammar Review U2) ----------
   Una línia ja hi és (i es pot escoltar); l'altra (build) es munta tocant les fitxes.
   Tocar una fitxa del banc la posa al final; tocar-ne una de posada la torna al banc.
   it: { board: "words", max: 1, sprite | room | clock, lines: [{ who, text } | { who, build }] } */
PA.skillBoards.words = function (act, it, k) {
  var h = k.h, done = false, placed = [];
  var target = it.lines.filter(function (l) { return l.build; })[0].build;
  var m = target.match(/^(.*?)([.?!])$/), words = m[1].split(" "), stop = m[2];
  var ids = words.map(function (_, i) { return i; }), bank = k.shuffle(ids);
  while (bank.every(function (v, i) { return words[v] === words[i]; })) bank = k.shuffle(ids);   /* mai ja ordenada */
  var buildEl = h("p.sk-chat__build", { "aria-live": "polite" });
  var bankEl = h("div.sk-words__bank", { role: "group", "aria-label": "Words" });
  var fixEl = h("p.sk-words__fix", { hidden: true });

  var rows = it.lines.map(function (l, i) {
    var side = i % 2 ? ".sk-chat__row--right" : "";
    /* 28-11-2026 (mestre): sense el nom de qui parla; les bombolles a esquerra i dreta ja ho diuen */
    var who = null;
    if (l.build) return h("div.sk-chat__row.is-build" + side, null, [who, h("div.sk-chat__bubble.sk-chat__bubble--build", null, buildEl)]);
    var bub = h("div.sk-chat__bubble", null, [h("span", null, l.text)]);
    if (k.speak && "speechSynthesis" in window) {
      var b = h("button.px-btn.sk-play.sk-chat__listen", { type: "button", "aria-label": "Listen" }, [k.speakerIcon(false)]);
      b.addEventListener("click", function () { b.classList.add("is-playing"); k.speak(l.text, false, function () { b.classList.remove("is-playing"); }); });
      bub.appendChild(b);
    }
    return h("div.sk-chat__row" + side, null, [who, bub]);
  });

  function draw(result) {
    buildEl.textContent = ""; bankEl.textContent = "";
    placed.forEach(function (wi, pi) {
      var t = h("button.sk-word.is-placed" + (result ? (result[pi] ? ".is-ok" : ".is-no") : ""), { type: "button", disabled: done ? true : null, "aria-label": words[wi] + " (tap to remove)" }, words[wi]);
      t.addEventListener("click", function () { if (done) return; placed.splice(pi, 1); draw(); });
      buildEl.appendChild(t);
    });
    for (var e = placed.length; e < words.length; e++) buildEl.appendChild(h("span.sk-word__gap", { "aria-hidden": "true" }));
    buildEl.appendChild(h("span.sk-word__stop", { "aria-hidden": "true" }, stop));
    bank.forEach(function (wi) {
      var used = placed.indexOf(wi) !== -1;
      var b = h("button.sk-word" + (used ? ".is-used" : ""), { type: "button", disabled: (done || used) ? true : null }, words[wi]);
      b.addEventListener("click", function () { if (done || used) return; placed.push(wi); draw(); });
      bankEl.appendChild(b);
    });
    k.ready(placed.length === words.length);
  }
  draw();
  return {
    el: h("div.sk-words", null, [PA.skillBoardPicture(it, h),
      h("div.sk-words__right", null, [h("div.sk-chat", null, rows), bankEl, fixEl])]),
    check: function () {
      done = true;
      var res = placed.map(function (wi, pi) { return words[wi] === words[pi]; });
      draw(res);
      var ok = res.every(Boolean);
      bankEl.hidden = true;
      if (!ok) { fixEl.hidden = false; fixEl.textContent = target; }
      return { pts: ok ? 1 : 0, answer: target };
    }
  };
};

/* ---------- pair: frase amb un quadrat a cada extrem (U2 R3 i L4, mestre 21-11-2026) ----------
   Una frase per pregunta, ben pautada: [rellotge] «English is at half past eleven.» [assignatura].
   A sota, 3 rellotges i 3 assignatures; tocar-ne un el posa al seu quadrat (el rellotge sempre
   a l'esquerra, l'assignatura sempre a la dreta); tocar un quadrat ple el buida.
   it: { max: 2, sentence, say?, answer: { h, m, subject }, clocks: [[h, m] ×3], subjects: [id ×3] }
   Si hi ha it.say (listening), la frase no es veu fins a Check. */
PA.skillBoards.pair = function (act, it, k) {
  var h = k.h, CARD = "assets/img/field-guides/school/", done = false;
  var listen = !!it.say;
  var label = function (id) { return id === "pe" ? "PE" : id.charAt(0).toUpperCase() + id.slice(1); };
  var ck = function (c) { return c[0] + ":" + c[1]; };
  var clocks = k.shuffle(it.clocks), subjects = k.shuffle(it.subjects);
  var pickClock = null, pickSubj = null;

  var leftSq = h("button.sk-pair__sq.sk-pair__sq--clock", { type: "button" });
  var rightSq = h("button.sk-pair__sq.sk-pair__sq--subj", { type: "button" });
  var mid = h("p.sk-pair__text" + (listen ? ".is-listen" : ""));
  if (listen) mid.appendChild(h("span.sk-pair__ear", { "aria-hidden": "true" }, k.speakerIcon(false)));
  else k.redText(it.sentence).forEach(function (n) { mid.appendChild(typeof n === "string" ? document.createTextNode(n) : n); });
  leftSq.addEventListener("click", function () { if (!done && pickClock) { pickClock = null; draw(); } });

        backBtn.textContent = "◀"; nextBtn.textContent = "▶";
        backBtn.setAttribute("aria-label", "Back"); nextBtn.setAttribute("aria-label", "Next");
        backBtn.classList.add("ls-arrow"); nextBtn.classList.add("ls-arrow");
      } else {
        [backBtn, nextBtn, doneBtn].forEach(function (b) { actions.appendChild(b); });
        backBtn.textContent = "Back"; nextBtn.textContent = "Next";
        backBtn.removeAttribute("aria-label"); nextBtn.removeAttribute("aria-label");
        backBtn.classList.remove("ls-arrow"); nextBtn.classList.remove("ls-arrow");
      }
      actions.hidden = !!strip;
      /* la nota va dins la franja, sota les frases */
      if (strip && strip.querySelector(".ls-c__lines")) strip.querySelector(".ls-c__lines").appendChild(note);
      else body.parentNode.insertBefore(note, actions);
      var last = step === act.screens.length - 1;
      backBtn.disabled = step === 0;
      nextBtn.hidden = last; doneBtn.hidden = !last;
      if (focus) (last ? doneBtn : nextBtn).focus({ preventScroll: true });
    }

    function done() {
      var res = PA.progression.record(map.stages, PA.progressStore.load(trackId), stageId, act.doneStars || 3);
      if (res.reason !== "locked") {
        PA.progressStore.save(trackId, res.saved);
        PA.views.map.setPendingResult(trackId, stageId, res);
      }
      window.location.hash = mapHref;
    }

    var root = h("div.view.view--sections.view--guide.view--wd.view--ls", {
      style: { "--c": accent, "--cb": (map.accent && map.accent.bright) || "#C29BFF", "--sc": accent, "--tone": accent }
    }, [
      PA.views.sections.buildHeader({
        backHref: mapHref, backLabel: "Tornar al mapa",
        context: course.label + " · " + unit.label + " · " + section.name,
        title: act.title
      }),
      h("main.sections.dither.wl-page.wd-page.ls-page", null, [
        head,
        h("div.wd-play", null, [body, note, actions])
      ])
    ]);
    render(false);
    return root;
  }

  return { build: build };
})();

</script>
  <script>
/*
 * Pantalla provisional d'una unitat: títol, il·lustració i tornar.
 * Més endavant aquí s'hi afegirà el menú d'activitats de la unitat
 * (vegeu games/README.md). De moment no mostra cap activitat.
 */
window.PA = window.PA || {};
PA.views = PA.views || {};

PA.views.unit = (function () {
  var h = PA.h;
  var root;

  function build(course, unit) {
    var img = h("img.unit-page__img", Object.assign({
      alt: "Il·lustració de " + unit.label + ": " + unit.title,
      width: "1086", height: "1448", decoding: "async"
    }, PA.unitImageAttrs(unit.image, 1086, "(min-width: 900px) 46vw, 92vw")));

    var title = h("h1.unit-page__title", { tabindex: "-1" }, unit.title);

    return h("div.view.view--unit", { style: { "--c": course.color, "--cb": course.bright } }, [
      h("header.unit-bar", null, [
        h("img.unit-bar__bg", Object.assign({ alt: "", width: "2172", height: "724", decoding: "async" },
          PA.headerImageAttrs())),
        h("div.unit-bar__inner", null, [
          h("a.back-btn", { href: PA.router.courseHref(course.id) }, [
            PA.pixelArrow("left"),
            h("span", null, "Tornar a " + course.label)
          ]),
          h("a.brand-mini", { href: "#", "aria-label": "Pixel Academy, inici" }, "PIXEL ACADEMY")
        ])
      ]),
      h("main.unit-page.dither", null, [
        h("figure.unit-page__art", null, img),
        h("div.unit-page__info", null, [
          h("p.unit-page__label", null, unit.label),
          title,
          h("p.unit-page__course", null, course.name)
        ])
      ])
    ]);
  }

  return {
    /* prev: ruta anterior, per tornar el focus a l'àrea d'on veníem */
    show: function (container, route, prev) {
      var course = PA.getCourse(route.courseId);
      var unit = PA.getUnit(course, route.unitId);
      var hasSections = PA.getSections(unit).length > 0;
      var section = route.sectionId ? PA.getSection(unit, route.sectionId) : null;

      /* Etapa d'un mapa amb activitat real: només si està desbloquejada */
      var guideStage = null;
      if (section && section.map && route.stageId) {
        var trackId = course.id + "/" + unit.id + "/" + section.id;
        var st = PA.progression.compute(PA.getMap(section.map).stages, PA.progressStore.load(trackId));
        guideStage = st.stages.find(function (s) { return s.id === route.stageId; });
        if (!guideStage || !guideStage.unlocked) {
          guideStage = null;
          window.history.replaceState(null, "", PA.router.sectionHref(course.id, unit.id, section.id));
        }
      }

      if (root) root.remove();
      if (!hasSections) {
        root = build(course, unit);                                   /* pantalla provisional (sense canvis) */
      } else if (guideStage) {
        /* etapa amb activitat real: guia de camp, Safari Snap!, Secret Zoo Signs, Zoo Express, Find the Action!, Open the Zoo! o les activitats de Grammar */
        root = PA.getPackGame && PA.getPackGame(guideStage.activity)
          ? PA.views.packBag.build(course, unit, section, guideStage.id)         /* Pack the Bag (U4) */
          : PA.getKiteGame && PA.getKiteGame(guideStage.activity)
          ? PA.views.kiteCatcher.build(course, unit, section, guideStage.id)     /* Kite Catcher (U4) */
          : PA.getRunGame && PA.getRunGame(guideStage.activity)
          ? PA.views.schoolRun.build(course, unit, section, guideStage.id)      /* School Run (19-11-2026) */
          : PA.getPizzaMaker && PA.getPizzaMaker(guideStage.activity)
          ? PA.views.pizzaMaker.build(course, unit, section, guideStage.id)     /* Pizza Maker! (U3) */
          : PA.getSortGame && PA.getSortGame(guideStage.activity)
          ? PA.views.sortGame.build(course, unit, section, guideStage.id)       /* Sort: Fruit or Vegetable? (U3) */
          : PA.getSafariGame(guideStage.activity)
          ? PA.views.safari.build(course, unit, section, guideStage.id)
          : PA.getWordSigns(guideStage.activity)
            ? PA.views.wordSigns.build(course, unit, section, guideStage.id)
            : PA.getExpressGame(guideStage.activity)
              ? PA.views.express.build(course, unit, section, guideStage.id)
              : PA.getFindActionGame(guideStage.activity)
                ? PA.views.findAction.build(course, unit, section, guideStage.id)
                : PA.getOpenZooGame(guideStage.activity)
                  ? PA.views.openZoo.build(course, unit, section, guideStage.id)
                  : PA.getGrammarActivity(guideStage.activity)
                    ? PA.views[PA.getGrammarActivity(guideStage.activity).view || "whatLike"].build(course, unit, section, guideStage.id)
                    : PA.getSkillActivity && PA.getSkillActivity(guideStage.activity)
                      ? PA.views.skill.buildStage(course, unit, section, guideStage.id)
                      : PA.views.fieldGuide.build(course, unit, section, guideStage.id);
      } else if (section && section.map) {
        root = PA.views.map.build(course, unit, section);             /* àrea amb mapa d'etapes */
      } else if (section && section.activities && route.activityId) {
        root = PA.views.activities.buildActivity(course, unit, section, route.activityId); /* una activitat */
      } else if (section && section.activities) {
        root = PA.views.activities.buildSet(course, unit, section);   /* quatre activitats */
      } else if (section) {
        root = PA.views.sections.buildSoon(course, unit, section);    /* àrea: "Coming soon" */
      } else {
        root = PA.views.sections.buildMenu(course, unit);             /* menú de quatre àrees */
      }
      container.appendChild(root);
      /* activitats: tot a la pantalla, sense scroll (js/views/fit.js) */
      var actMain = (guideStage || route.activityId) ? root.querySelector("main.sections") : null;
      if (actMain) actMain.classList.add("is-activity");
      /* totes les pantalles de la unitat (menú, mapes, llistes): també sense scroll (23-11) */
      var fitMain = actMain || root.querySelector("main");
      if (PA.fit) PA.fit[fitMain ? "watch" : "stop"](fitMain);

      var activity = route.activityId ? PA.getActivity(section.activities, route.activityId) : null;
      var guide = guideStage ? ((PA.getRunGame && PA.getRunGame(guideStage.activity)) || (PA.getSortGame && PA.getSortGame(guideStage.activity)) || (PA.getPizzaMaker && PA.getPizzaMaker(guideStage.activity)) || PA.getFieldGuide(guideStage.activity) || PA.getSafariGame(guideStage.activity) || PA.getWordSigns(guideStage.activity) || PA.getExpressGame(guideStage.activity) || PA.getFindActionGame(guideStage.activity) || PA.getOpenZooGame(guideStage.activity) || PA.getGrammarActivity(guideStage.activity) || (PA.getSkillActivity && PA.getSkillActivity(guideStage.activity))) : null;
      document.title = (guide ? guide.title + " · " : "") +
        (activity ? activity.title + " · " : "") + (section ? section.name + " · " : "") +
        unit.label + ": " + unit.title + " – Pixel Academy";
      document.documentElement.style.setProperty("--accent", course.color);
      document.documentElement.style.setProperty("--accent-bright", course.bright);
      window.scrollTo(0, 0);

      /* De l'àrea al menú: el focus torna a la targeta de l'àrea */
      var fromSection = prev && prev.view === "unit" && prev.sectionId &&
        prev.courseId === route.courseId && prev.unitId === route.unitId && !route.sectionId;
      var card = fromSection && root.querySelector(
        '.section-card[href="' + PA.router.sectionHref(course.id, unit.id, prev.sectionId) + '"]');
      if (card) { card.focus(); return; }

      /* De l'activitat a les quatre: el focus torna a la targeta de l'activitat */
      var fromActivity = prev && prev.view === "unit" && prev.activityId && !route.activityId &&
        prev.sectionId === route.sectionId && prev.unitId === route.unitId && prev.courseId === route.courseId;
      var aCard = fromActivity && root.querySelector(
        '.activity-card[href="' + PA.router.activityHref(course.id, unit.id, route.sectionId, prev.activityId) + '"]');
      if (aCard) { aCard.focus(); return; }

      /* De l'etapa (guia) al mapa: el focus torna a la casella de l'etapa */
      var fromStage = prev && prev.view === "unit" && prev.stageId && !route.stageId &&
        prev.sectionId === route.sectionId && prev.unitId === route.unitId && prev.courseId === route.courseId;
      var sBtn = fromStage && root.querySelector('.map-stage[data-stage-id="' + prev.stageId + '"]');
      if (sBtn) { sBtn.focus({ preventScroll: true }); return; }

      var title = root.querySelector(".unit-page__title, .inner-hero__title");
      if (title) title.focus({ preventScroll: true });
    },
    hide: function () {
      if (root) { root.remove(); root = null; }
    }
  };
})();

</script>
  <script>
/*
 * Arrencada de Pixel Academy: decideix quina vista es mostra segons la ruta.
 */
(function () {
  var app = document.getElementById("app");
  var homeScroll = 0;
  var lastRoute = null;
  var lastUnitHash = null;

  PA.router.onChange(function (route) {
    var lastView = lastRoute && lastRoute.view;
    if (route.view === "unit") {
      if (lastView !== "unit") homeScroll = window.scrollY;
      /* la targeta de la portada és la de la unitat, també si som dins d'una àrea */
      lastUnitHash = PA.router.unitHref(route.courseId, route.unitId);
      PA.views.home.hide();
      PA.views.unit.show(app, route, lastRoute);
    } else {
      var comingBack = lastView === "unit";
      PA.views.unit.hide();
      if (PA.fit) PA.fit.stop();
      PA.views.home.show(app, route);
      if (comingBack) {
        window.scrollTo(0, homeScroll);
        /* torna el focus a la targeta d'on veníem */
        var card = document.querySelector('.unit-card[href="' + lastUnitHash + '"]');
        if (card) card.focus({ preventScroll: true });
      }
    }
    lastRoute = route;
  });

  /* Mode mestre: 5 tocs seguits al títol de la portada l'encenen o l'apaguen */
  var taps = [];
  document.addEventListener("click", function (e) {
    if (!e.target.closest || !e.target.closest(".brand__title")) return;
    var now = Date.now();
    taps = taps.filter(function (t) { return now - t < 2500; });
    taps.push(now);
    if (taps.length >= 5) { taps = []; PA.mestre.toggle(); location.reload(); }
  });
  if (PA.mestre.on()) {
    var badge = document.createElement("div");
    badge.className = "mestre-badge";
    badge.textContent = "MODE MESTRE · tot obert";
    document.body.appendChild(badge);
  }

  PA.router.start();
})();

</script>
