/* ============================================================
   PIXEL ACADEMY — base: tipografia, colors, reset i fons
   ============================================================ */

/* La tipografia es defineix a fonts.css */

:root {
  /* Unitat de píxel de la interfície: vores, ombres i esglaons en múltiples d'aquest valor */
  --px: 4px;

  /* Colors principals */
  --page: #e4f2ff;          /* cel clar de la pàgina */
  --page-dot: #cfe6ff;      /* tramat del fons */
  --ink: #0b1460;           /* text principal, blau marí dels marcs de les il·lustracions */
  --ink-soft: #3a4690;      /* text secundari */
  --outline: #0a0f4d;       /* contorns pixelats */
  --shadow: rgba(10, 15, 77, 0.28);
  --tag-bg: #ffffff;

  /* Accent: color del curs seleccionat (JS el canvia) */
  --accent: #ed8843;
  --accent-bright: #ffb36c;

  --font: "VT323", "Pixelify Sans", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --step: steps(4, end);

  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* Pixel Academy fa servir sempre la paleta clara (cel blau clar amb quadrícula),
   també quan el sistema està en mode fosc: és la identitat visual de la plataforma. */

*, *::before, *::after { box-sizing: inherit; }

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font);
  font-size: 1.125rem;
  line-height: 1.4;
  color: var(--ink);
  background-color: var(--page);
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
}

/* Zona amb tramat de píxels molt suau que s'esvaeix cap avall:
   evita una gran superfície plana sense competir amb les il·lustracions */
.dither { position: relative; isolation: isolate; }
.dither::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  width: 100vw;
  transform: translateX(-50%);
  height: min(100%, 640px);
  z-index: -1;
  background-image:
    linear-gradient(45deg, var(--page-dot) 25%, transparent 25%, transparent 75%, var(--page-dot) 75%),
    linear-gradient(45deg, var(--page-dot) 25%, transparent 25%, transparent 75%, var(--page-dot) 75%);
  background-size: 24px 24px;
  background-position: 0 0, 12px 12px;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
  pointer-events: none;
}

/* Final de la capçalera (portada i interior): una vora neta, com el contorn
   fosc de 4 px de tots els elements pixelats, amb una ombra dura d'un píxel.
   Sense dissolucions ni degradats. */
.site-header::after,
.inner-hero::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1;
  height: var(--px);
  background: var(--outline);
  box-shadow: 0 var(--px) 0 0 rgba(10, 15, 77, 0.16);
  pointer-events: none;
}

img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
ul { list-style: none; margin: 0; padding: 0; }
h1, h2, p, figure { margin: 0; }

[hidden] { display: none !important; }

:focus { outline: none; }
:focus-visible {
  outline: var(--px) solid var(--accent-bright);
  outline-offset: var(--px);
}

.px-arrow {
  width: 1.25em;
  height: 1.25em;
  flex: none;
}
.px-arrow--up { transform: rotate(90deg); }

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Mode mestre (js/main.js): etiqueta petita perquè el mestre sàpiga que té tot obert */
.mestre-badge {
  position: fixed; top: 8px; right: 8px; z-index: 60; pointer-events: none;
  padding: 4px 10px; font-size: .8rem; font-weight: 700; letter-spacing: .04em;
  color: #fff; background: #E0457B; box-shadow: 0 0 0 3px var(--outline, #0b1460);
}

/* Sense scroll quan la pantalla ja hi cap (js/views/fit.js): en Pix queda quiet al seu lloc */
html.pa-noscroll, html.pa-noscroll body { overflow: hidden; overscroll-behavior: none; }

/* Amplada útil al costat d'en Pix (24-11-2026, propostes C i Open the Zoo): el contingut ample va de
   l'espai d'en Pix (250px a l'esquerra) fins a la vora dreta, i es desplaça només si cal. */
:root {
  --wide-w: min(1000px, calc(100vw - 274px));
  --wide-shift: max(0px, calc(250px - (100vw - var(--wide-w)) / 2));
}
@media (max-width: 699px) { :root { --wide-w: 100%; --wide-shift: 0px; } }
/* la consigna també es centra sobre el contingut desplaçat */
.ls-page .wd-head, .aa-page .aa-head, .ozoo-page .ozoo-head { position: relative; left: var(--wide-shift); }
/* ============================================================
   Capçalera: paisatge, títol PIXEL ACADEMY i etiqueta de matèria
   ============================================================ */

:root {
  /* Alçada de la capçalera: depèn de l'amplada i també de l'alçada de la
     pantalla, perquè en un escriptori habitual (1920 × ~850) les targetes
     i els seus títols hi càpiguen sense desplaçar-se. */
  --header-h: clamp(200px, min(22vw, 32vh), 360px);
}

.site-header {
  position: relative;
  /* per sobre de la zona d'unitats (la vora inferior i els botons de curs hi sobresurten) */
  z-index: 1;
  height: var(--header-h);
}

.site-header__bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  /* enquadrament per a una capçalera baixa i ampla: equilibri entre els
     núvols, les copes dels arbres i el prat amb flors */
  object-position: 50% 64%;
}

/* ---------- Marca ---------- */

.brand {
  position: absolute;
  left: 50%;
  top: 17%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(8px, 1.1vw, 14px);
  width: max-content;
  max-width: 94vw;
  z-index: 1;
}

.brand__title {
  --o: max(3px, 0.05em);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  /* proporcional a l'alçada de la capçalera */
  font-size: clamp(2.1rem, calc(var(--header-h) * 0.2), 4.8rem);
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.05em;
  color: #ffffff;
  /* contorn pixelat + gruix inferior, com un rètol de joc de 16 bits */
  text-shadow:
    calc(var(--o) * -1) 0 0 var(--outline),
    var(--o) 0 0 var(--outline),
    0 calc(var(--o) * -1) 0 var(--outline),
    0 var(--o) 0 var(--outline),
    calc(var(--o) * -1) calc(var(--o) * -1) 0 var(--outline),
    var(--o) calc(var(--o) * -1) 0 var(--outline),
    calc(var(--o) * -1) var(--o) 0 var(--outline),
    var(--o) var(--o) 0 var(--outline),
    0 calc(var(--o) * 2) 0 var(--outline),
    calc(var(--o) * -1) calc(var(--o) * 2) 0 var(--outline),
    var(--o) calc(var(--o) * 2) 0 var(--outline),
    0 calc(var(--o) * 3) 0 var(--outline);
}

.brand__letter { display: inline-block; }
.brand__space { display: inline-block; width: 0.38em; }

/* Animació d'entrada: les lletres cauen una a una, a salts (només 1a càrrega) */
.is-intro .brand__letter {
  animation: brand-drop 0.5s steps(5, end) both;
  animation-delay: calc(var(--i) * 45ms + 120ms);
}
.is-intro .subject-tag {
  animation: tag-pop 0.3s steps(3, end) both;
  animation-delay: 820ms;
}

@keyframes brand-drop {
  0%   { transform: translateY(-0.7em); opacity: 0; }
  60%  { transform: translateY(0.08em); opacity: 1; }
  100% { transform: translateY(0); opacity: 1; }
}
@keyframes tag-pop {
  0%   { transform: scale(0.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* Etiqueta de la matèria: penjada sota el títol com un rètol */
.subject-tag {
  font-size: clamp(0.95rem, 1.3vw, 1.15rem);
  font-weight: 600;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 4);
  color: #0b1460;
  background: var(--tag-bg);
  /* vora pixelada amb cantonades retallades */
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1) 0 0 rgba(10, 15, 77, 0.14),
    0 calc(var(--px) * 2) 0 0 var(--shadow);
}

@media (max-width: 600px) {
  .brand { top: 13%; }
}
/* ============================================================
   Selector de cursos: sis botons rectangulars pixelats
   ============================================================ */

:root {
  --course-btn-h: clamp(56px, min(4.6vw, 8vh), 80px);
  --nav-gap: clamp(12px, 1.7vw, 24px);
  --nav-rows: 1;
  /* alçada total del selector (1 fila a l'ordinador, 2 en pantalles petites) */
  --nav-h: calc(var(--nav-rows) * var(--course-btn-h) + (var(--nav-rows) - 1) * var(--nav-gap));
  /* la part del selector que queda per sota del paisatge */
  --nav-below: calc(var(--nav-h) - var(--course-btn-h) / 2);
}

.course-nav {
  position: absolute;
  left: 0; right: 0;
  bottom: 0;
  /* la primera fila queda a cavall entre el paisatge i la zona inferior */
  transform: translateY(var(--nav-below));
  z-index: 2;
  padding: 0 calc(var(--px) * 4);
}

.course-nav__list {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: var(--nav-gap);
  /* amplada lligada a l'alçada dels botons: cada botó manté la proporció
     (~1,8 : 1) i el conjunt queda equilibrat amb la capçalera */
  width: min(76%, calc(var(--course-btn-h) * 12.3));
  margin: 0 auto;
}

@media (max-width: 900px) {
  .course-nav__list { width: min(94%, 720px); }
}

.course-btn {
  --depth: color-mix(in srgb, var(--c) 68%, #0a0f4d);
  position: relative;
  display: flex;
  align-items: baseline;
  justify-content: center;
  height: var(--course-btn-h);
  padding-top: calc(var(--course-btn-h) * 0.14);
  text-decoration: none;
  color: #0b1460;
  background: var(--c);
  font-weight: 700;
  line-height: 1;
  /* contorn de 4 costats = cantonades retallades com un sprite */
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1.5) 0 0 var(--depth),
    inset 0 var(--px) 0 0 rgba(255, 255, 255, 0.28),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
  /* text blau marí: llegible sobre els sis colors (contrast ≥ 4:1) */
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.4);
  transition: transform 0.12s steps(2, end), background-color 0.16s steps(2, end), box-shadow 0.16s steps(2, end);
  -webkit-tap-highlight-color: transparent;
}

.course-btn__num { font-size: calc(var(--course-btn-h) * 0.62); }
.course-btn__ord {
  font-size: calc(var(--course-btn-h) * 0.32);
  margin-left: 0.08em;
  transform: translateY(-0.55em);
}

/* Curs seleccionat: to més brillant, botó premut i halo esglaonat suau */
.course-btn[aria-current="page"] {
  background: var(--cb);
  transform: translateY(calc(var(--px) * 0.5));
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    inset 0 var(--px) 0 0 rgba(255, 255, 255, 0.45),
    inset 0 calc(var(--px) * -1) 0 0 color-mix(in srgb, var(--cb) 80%, #0a0f4d),
    0 calc(var(--px) * -2.5) 0 0 color-mix(in srgb, var(--cb) 45%, transparent),
    0 calc(var(--px) * 2.5) 0 0 color-mix(in srgb, var(--cb) 45%, transparent),
    calc(var(--px) * -2.5) 0 0 0 color-mix(in srgb, var(--cb) 45%, transparent),
    calc(var(--px) * 2.5) 0 0 0 color-mix(in srgb, var(--cb) 45%, transparent);
}

.course-btn:focus-visible {
  outline: var(--px) solid #ffffff;
  outline-offset: calc(var(--px) * 2);
}

/* Pantalles petites: dues files de tres, botons amples i fàcils de prémer */
@media (max-width: 560px) {
  :root {
    --course-btn-h: 60px;
    --nav-gap: 12px;
    --nav-rows: 2;
  }
  .course-nav { padding: 0 calc(var(--px) * 4); }
  .course-nav__list {
    width: 100%;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
/* ============================================================
   Zona d'unitats: indicació inicial, encapçalament i targetes
   ============================================================ */

:root {
  /* Silueta exacta del marc blau de les il·lustracions (cantonades esglaonades).
     Retalla el blanc exterior sense modificar els fitxers d'imatge. */
  --card-clip: polygon(0.00% 8.29%, 1.93% 8.29%, 1.93% 5.52%, 2.76% 5.52%, 2.76% 5.46%, 3.13% 5.46%, 3.13% 4.56%, 3.50% 4.56%, 3.50% 4.28%, 4.70% 4.28%, 4.70% 3.25%, 6.08% 3.25%, 6.08% 2.21%, 9.39% 2.21%, 9.39% 2.14%, 9.94% 2.14%, 9.94% 1.24%, 10.41% 1.24%, 10.41% 1.17%, 11.14% 1.17%, 11.14% 0.00%, 88.77% 0.00%, 88.77% 1.17%, 89.78% 1.17%, 89.78% 1.24%, 90.15% 1.24%, 90.15% 2.14%, 90.52% 2.14%, 90.52% 2.21%, 93.83% 2.21%, 93.83% 3.25%, 95.21% 3.25%, 95.21% 4.21%, 95.58% 4.21%, 95.58% 4.28%, 96.50% 4.28%, 96.50% 4.56%, 96.87% 4.56%, 96.87% 5.46%, 97.51% 5.46%, 97.51% 5.52%, 98.07% 5.52%, 98.07% 8.29%, 100.00% 8.29%, 100.00% 91.44%, 99.54% 91.44%, 99.54% 91.51%, 98.25% 91.51%, 98.25% 93.72%, 97.88% 93.72%, 97.88% 94.27%, 96.96% 94.27%, 96.96% 94.68%, 96.59% 94.68%, 96.59% 95.79%, 95.21% 95.79%, 95.21% 96.82%, 93.74% 96.82%, 93.74% 97.86%, 88.95% 97.86%, 88.95% 98.90%, 87.66% 98.90%, 87.66% 100.00%, 12.25% 100.00%, 12.25% 98.90%, 11.05% 98.90%, 11.05% 98.62%, 10.68% 98.62%, 10.68% 97.86%, 6.26% 97.86%, 6.26% 96.89%, 5.89% 96.89%, 5.89% 96.82%, 4.79% 96.82%, 4.79% 95.86%, 4.42% 95.86%, 4.42% 95.79%, 3.50% 95.79%, 3.50% 95.44%, 3.13% 95.44%, 3.13% 94.27%, 2.03% 94.27%, 2.03% 92.54%, 1.66% 92.54%, 1.66% 91.51%, 0.46% 91.51%, 0.46% 91.44%, 0.00% 91.44%);
}

.units {
  max-width: 1240px;
  margin: 0 auto;
  /* deixa lloc per a la part del selector de cursos que sobresurt del paisatge */
  padding:
    calc(var(--nav-below) + var(--px) * 3 + clamp(20px, 3.2vh, 40px))
    clamp(16px, 4vw, 40px)
    clamp(48px, 7vw, 96px);
  min-height: 50vh;
}

/* A la portada, la quadrícula (idèntica: colors, quadrats i esvaïment)
   comença 72 px més amunt, per sota del paisatge, perquè es vegi a través
   del tramat de la transició. 72 = 3 quadrats de 24 px: el dibuix queda
   exactament alineat amb l'anterior. */
.view--home .units.dither::before {
  top: -72px;
  height: calc(min(100%, 640px) + 72px);
  -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 72px, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 0, #000 72px, transparent 100%);
}

/* ---------- Indicació inicial ---------- */

.units-prompt {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 3);
  padding-top: clamp(12px, 3vw, 40px);
  color: var(--ink);
  text-align: center;
}
.units-prompt .px-arrow {
  width: 2rem;
  height: 2rem;
  color: var(--ink-soft);
  animation: prompt-bob 1.2s steps(2, end) infinite;
}
.units-prompt__text {
  font-size: clamp(1.25rem, 2.2vw, 1.6rem);
  font-weight: 600;
}
@keyframes prompt-bob {
  0%, 100% { translate: 0 0; }
  50%      { translate: 0 calc(var(--px) * -2); }
}

/* ---------- Encapçalament del curs ---------- */

.units__heading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(var(--px) * 3);
  margin-bottom: clamp(14px, 2.4vh, 32px);
  font-size: clamp(1.4rem, min(2.6vw, 3.6vh), 2rem);
  font-weight: 700;
  line-height: 1.1;
  text-align: center;
}
/* dos "píxels" del color del curs a cada banda */
.units__heading::before,
.units__heading::after {
  content: "";
  width: calc(var(--px) * 3);
  height: calc(var(--px) * 3);
  background: var(--c);
  box-shadow: calc(var(--px) * 4) 0 0 0 var(--cb);
  flex: none;
}
.units__heading::before { margin-right: calc(var(--px) * 4); }
.units__heading::after  { box-shadow: calc(var(--px) * -4) 0 0 0 var(--cb); margin-left: calc(var(--px) * 4); }

.units-empty {
  text-align: center;
  font-size: 1.25rem;
  color: var(--ink-soft);
  padding: calc(var(--px) * 6) 0;
}

/* ---------- Graella ---------- */

.units-grid {
  display: grid;
  /* Amplada màxima de les targetes limitada per l'alçada disponible: en un
     escriptori habitual es veuen senceres amb el títol; en pantalles baixes
     no baixen de 220 px (llavors cal desplaçar-se). Proporció 3:4 intacta. */
  --card-max: 320px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), var(--card-max)));
  justify-content: center;
  gap: clamp(28px, 3.4vw, 48px) clamp(20px, 3vw, 40px);
}

@media (min-width: 900px) and (orientation: landscape) {
  .units-grid { --card-max: max(220px, min(320px, calc(35vh - 66px))); }
}

.units-grid__item {
  animation: card-in 0.32s steps(4, end) both;
  animation-delay: calc(var(--n) * 70ms);
}
@keyframes card-in {
  0%   { opacity: 0; transform: translateY(calc(var(--px) * 6)); }
  100% { opacity: 1; transform: translateY(0); }
}

/* ---------- Targeta ---------- */

.unit-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: calc(var(--px) * 3.5);
  text-decoration: none;
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
}

.unit-card__art {
  display: block;
  width: 100%;
  margin-bottom: calc(var(--px) * 2);
  /* ombra dura que segueix la silueta esglaonada de la il·lustració */
  filter: drop-shadow(0 calc(var(--px) * 1.5) 0 var(--shadow));
  transition: transform 0.18s steps(3, end), filter 0.18s steps(3, end);
}

.unit-card__img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  clip-path: var(--card-clip);
  background: color-mix(in srgb, var(--c) 25%, var(--page));
}

.unit-card__label {
  font-size: 1.1rem;
  font-weight: 600;
  line-height: 1;
  padding: calc(var(--px) * 1.75) calc(var(--px) * 3);
  margin-left: var(--px);
  color: #0b1460;
  background: var(--cb);
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline);
}

.unit-card__title {
  font-size: clamp(1.5rem, min(2.3vw, 3.4vh), 2rem);
  font-weight: 700;
  line-height: 1.12;
  letter-spacing: 0.01em;
  padding-left: var(--px);
  max-width: 100%;
  overflow-wrap: break-word;
  text-wrap: balance;
}

/* Focus de teclat: contorn del color del curs que ressegueix el marc */
.unit-card:focus-visible { outline: none; }
.unit-card:focus-visible .unit-card__art {
  transform: translateY(calc(var(--px) * -2));
  filter:
    drop-shadow(var(--px) 0 0 var(--cb))
    drop-shadow(calc(var(--px) * -1) 0 0 var(--cb))
    drop-shadow(0 var(--px) 0 var(--cb))
    drop-shadow(0 calc(var(--px) * -1) 0 var(--cb))
    drop-shadow(0 calc(var(--px) * 3) 0 var(--shadow));
}
.unit-card:focus-visible .unit-card__title {
  text-decoration: underline;
  text-decoration-thickness: var(--px);
  text-underline-offset: calc(var(--px) * 1.5);
  text-decoration-color: var(--c);
}

/* 27-11-2026 (U4): a partir de 700 px totes les unitats van en una sola fila (fins a 6),
   perquè la portada del curs no faci scroll quan n'hi ha 4 o més */
@media (min-width: 700px) {
  .units-grid { grid-template-columns: repeat(var(--n-units, 4), minmax(0, var(--card-max))); }
}
/* ============================================================
   Pantalla provisional de la unitat
   ============================================================ */

.view--unit {
  min-height: 100vh;
  animation: view-in 0.2s steps(3, end) both;
}
@keyframes view-in {
  0%   { opacity: 0; }
  100% { opacity: 1; }
}

/* ---------- Franja superior amb el paisatge ---------- */

.unit-bar {
  position: relative;
  height: clamp(96px, 11vw, 140px);
  overflow: hidden;
}
.unit-bar__bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 78%;
}
.unit-bar::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: calc(var(--px) * 3);
  background:
    linear-gradient(var(--page), var(--page)) bottom / 100% var(--px) no-repeat,
    repeating-linear-gradient(90deg,
      var(--page) 0 calc(var(--px) * 5),
      transparent calc(var(--px) * 5) calc(var(--px) * 16)) bottom / 100% calc(var(--px) * 3) no-repeat;
}

.unit-bar__inner {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: calc(var(--px) * 4);
  max-width: 1240px;
  height: 100%;
  margin: 0 auto;
  padding: 0 clamp(16px, 4vw, 40px) calc(var(--px) * 3);
}

.back-btn {
  --depth: color-mix(in srgb, var(--c) 68%, #0a0f4d);
  display: inline-flex;
  align-items: center;
  gap: calc(var(--px) * 2.5);
  min-height: 52px;
  padding: calc(var(--px) * 2) calc(var(--px) * 5) calc(var(--px) * 2.5) calc(var(--px) * 4);
  font-size: 1.2rem;
  font-weight: 700;
  line-height: 1;
  color: #ffffff;
  text-decoration: none;
  background: var(--c);
  text-shadow: -2px 0 0 var(--outline), 2px 0 0 var(--outline), 0 -2px 0 var(--outline), 0 2px 0 var(--outline);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1.5) 0 0 var(--depth),
    inset 0 var(--px) 0 0 rgba(255, 255, 255, 0.28),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
  transition: transform 0.12s steps(2, end), background-color 0.12s steps(2, end);
}
.back-btn .px-arrow {
  width: 1.1em;
  height: 1.1em;
  filter: drop-shadow(2px 0 0 var(--outline)) drop-shadow(-2px 0 0 var(--outline)) drop-shadow(0 2px 0 var(--outline)) drop-shadow(0 -2px 0 var(--outline));
}

.brand-mini {
  font-size: clamp(1rem, 2vw, 1.5rem);
  font-weight: 700;
  color: #ffffff;
  text-decoration: none;
  letter-spacing: 0.02em;
  text-shadow:
    -3px 0 0 var(--outline), 3px 0 0 var(--outline),
    0 -3px 0 var(--outline), 0 3px 0 var(--outline),
    -3px -3px 0 var(--outline), 3px -3px 0 var(--outline),
    -3px 3px 0 var(--outline), 3px 3px 0 var(--outline),
    0 6px 0 var(--outline);
}

/* ---------- Contingut ---------- */

.unit-page {
  display: grid;
  grid-template-columns: auto minmax(0, 30rem);
  justify-content: center;
  align-items: center;
  gap: clamp(28px, 5vw, 72px);
  max-width: 1240px;
  margin: 0 auto;
  padding: clamp(24px, 4vw, 48px) clamp(16px, 4vw, 40px) clamp(48px, 6vw, 80px);
}

.unit-page__art {
  /* la il·lustració és la protagonista: tan gran com permeti la pantalla */
  width: min(46vw, calc((100vh - 220px) * 0.75), 600px);
  min-width: 260px;
  filter: drop-shadow(0 calc(var(--px) * 3) 0 var(--shadow));
}
.unit-page__img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  clip-path: var(--card-clip);
  background: color-mix(in srgb, var(--c) 25%, var(--page));
}

.unit-page__info {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: calc(var(--px) * 4);
}

.unit-page__label {
  font-size: 1.15rem;
  font-weight: 600;
  line-height: 1;
  padding: calc(var(--px) * 2) calc(var(--px) * 3);
  color: #0b1460;
  background: var(--cb);
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline);
}

.unit-page__title {
  font-size: clamp(2.3rem, 4.2vw, 3.75rem);
  font-weight: 700;
  line-height: 1.02;
  text-wrap: balance;
}

.unit-page__title:focus,
.unit-page__title:focus-visible { outline: none; }

.unit-page__course {
  font-size: 1.2rem;
  color: var(--ink-soft);
}

@media (max-width: 820px) {
  .unit-page {
    grid-template-columns: 1fr;
    justify-items: center;
    text-align: center;
  }
  .unit-page__art { width: min(88vw, 460px); min-width: 0; }
  .unit-page__info { align-items: center; order: -1; }
  .brand-mini { display: none; }
}
/* ============================================================
   Interior d'una unitat amb àrees: capçalera compacta,
   menú de quatre àrees (2×2) i pantalla provisional d'una àrea.
   No modifica cap estil de la portada.
   ============================================================ */

:root {
  /* Capçalera interior: una sola franja (24-11-2026, proposta C del mestre:
     tornar + unitat + títol en una línia, per guanyar alçada a les activitats).
     Abans: clamp(128px, 17vh, 180px) amb la unitat a sobre del títol. */
  --inner-hero-h: clamp(80px, 11vh, 104px);
}

/* ---------- Capçalera interior compacta ---------- */

.inner-hero {
  position: relative;
  z-index: 1; /* per sobre de la quadrícula, que continua per sota del paisatge */
  height: var(--inner-hero-h);
}

.inner-hero__bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  /* franja de núvols, copes dels arbres i prat */
  object-position: 50% 62%;
}

.inner-hero__inner {
  position: relative;
  z-index: 1;
  display: grid;
  /* columnes laterals iguals: el títol queda centrat de debò */
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: calc(var(--px) * 4);
  max-width: 1320px;
  height: 100%;
  margin: 0 auto;
  padding: 6px clamp(16px, 4vw, 40px) 10px;
}

.inner-hero__back { justify-self: start; }

.inner-hero__heading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 2);
  min-width: 0;
  text-align: center;
}

/* Context de la unitat: etiqueta amb el color del curs, com a les targetes */
.inner-hero__context {
  font-size: clamp(0.9rem, 1.2vw, 1.05rem);
  font-weight: 600;
  line-height: 1;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 3);
  color: #0b1460;
  background: var(--cb);
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline);
}

/* Títol protagonista: blanc amb contorn pixelat, com el de la portada però més petit */
.inner-hero__title {
  --o: max(3px, 0.06em);
  font-size: clamp(1.9rem, min(4.2vw, 6.2vh), 3.4rem);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: 0.03em;
  color: #ffffff;
  text-wrap: balance;
  text-shadow:
    calc(var(--o) * -1) 0 0 var(--outline),
    var(--o) 0 0 var(--outline),
    0 calc(var(--o) * -1) 0 var(--outline),
    0 var(--o) 0 var(--outline),
    calc(var(--o) * -1) calc(var(--o) * -1) 0 var(--outline),
    var(--o) calc(var(--o) * -1) 0 var(--outline),
    calc(var(--o) * -1) var(--o) 0 var(--outline),
    var(--o) var(--o) 0 var(--outline),
    0 calc(var(--o) * 2) 0 var(--outline),
    calc(var(--o) * -1) calc(var(--o) * 2) 0 var(--outline),
    var(--o) calc(var(--o) * 2) 0 var(--outline);
}
.inner-hero__title:focus,
.inner-hero__title:focus-visible { outline: none; }

/* ---------- Zona de contingut ---------- */

.sections {
  max-width: 1320px;
  margin: 0 auto;
  padding: clamp(18px, 4vh, 44px) clamp(16px, 4vw, 40px) clamp(40px, 6vh, 72px);
}

/* Mateixa quadrícula que la portada (colors, quadrats i esvaïment idèntics),
   amb el mateix punt d'arrencada: 72 px (3 quadrats) per sota de la capçalera */
.view--sections .sections.dither::before {
  top: -72px;
  height: calc(min(100%, 640px) + 72px);
  -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 72px, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 0, #000 72px, transparent 100%);
}

/* ---------- Menú de quatre àrees (2×2) ---------- */

.sections-grid {
  /* Alçada objectiu d'una targeta: dues files caben a la pantalla d'escriptori */
  --card-h: clamp(190px, calc((100vh - var(--inner-hero-h) - 150px) / 2), 330px);
  --sg: clamp(18px, 2.4vw, 32px);
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--sg);
  /* la targeta fa ~2 vegades la seva alçada (il·lustració 4:3 al 66% de l'amplada) */
  width: min(100%, calc(var(--card-h) / 0.495 * 2 + var(--sg)));
  margin: 0 auto;
}

.sections-grid__item {
  display: flex;
  animation: card-in 0.32s steps(4, end) both;
  animation-delay: calc(var(--n) * 70ms);
}

/* ---------- Targeta d'àrea ---------- */

.section-card {
  --sc-depth: color-mix(in srgb, var(--sc) 66%, #0a0f4d);
  --sc-tint: color-mix(in srgb, var(--sc) 26%, #ffffff);
  position: relative;
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 34fr) minmax(0, 66fr);
  container-type: inline-size;
  color: #0b1460;
  text-decoration: none;
  background: var(--sc);
  /* contorn de 4 costats (cantonades retallades) + ombra dura, com els botons de curs */
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 3) 0 0 var(--shadow);
  transition: transform 0.14s steps(2, end), box-shadow 0.14s steps(2, end);
  -webkit-tap-highlight-color: transparent;
}

.section-card__text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(var(--px) * 2.5);
  min-width: 0;
  padding: 6cqi 2.5cqi 6cqi 3.5cqi;
  /* el mateix tramat de quadrats de 24 px que el fons de la pàgina, molt suau */
  background-image:
    linear-gradient(45deg, rgba(255, 255, 255, 0.09) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.09) 75%),
    linear-gradient(45deg, rgba(255, 255, 255, 0.09) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.09) 75%);
  background-size: 24px 24px;
  background-position: 0 0, 12px 12px;
  /* llum a dalt i profunditat a baix, en franges dures */
  box-shadow:
    inset 0 var(--px) 0 0 rgba(255, 255, 255, 0.3),
    inset 0 calc(var(--px) * -2) 0 0 var(--sc-depth);
}

.section-card__name {
  /* «Vocabulary» (la paraula més llarga) sempre cap a la columna */
  font-size: clamp(1.05rem, 4.9cqi, 2.4rem);
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.4);
}

.section-card__tagline {
  font-size: clamp(0.85rem, 2.7cqi, 1.3rem);
  font-weight: 600;
  line-height: 1.15;
  color: rgba(11, 20, 96, 0.82);
  text-wrap: balance;
}

/* La il·lustració és la protagonista: ocupa ~66% de la targeta, sobre el color aclarit */
.section-card__art {
  position: relative;
  display: block;
  aspect-ratio: 4 / 3;
  background: var(--sc-tint);
  /* separació esglaonada entre la franja de color i la il·lustració */
  box-shadow: inset var(--px) 0 0 0 var(--outline);
}

.section-card__img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 2.5% 2.5% 1.5% 3%;
}

/* Focus de teclat: contorn gruixut del color de l'àrea */
a.section-card:focus-visible {
  outline: var(--px) solid var(--sc);
  outline-offset: calc(var(--px) * 2);
}
a.section-card:focus-visible .section-card__name {
  text-decoration: underline;
  text-decoration-thickness: var(--px);
  text-underline-offset: calc(var(--px) * 1.5);
}

/* ---------- Pantalla provisional d'una àrea ---------- */

.section-card--static {
  grid-template-columns: 1fr;
  width: min(100%, 600px, calc((100vh - var(--inner-hero-h) - 150px) * 4 / 3));
  min-width: min(100%, 300px);
  margin: 0 auto;
}
.section-card--static .section-card__art {
  order: -1;
  box-shadow: inset 0 calc(var(--px) * -1) 0 0 var(--outline);
}
.section-card--static .section-card__text {
  align-items: center;
  padding: calc(var(--px) * 3.5) calc(var(--px) * 4) calc(var(--px) * 4.5);
}
.section-card--static .section-card__name {
  font-size: clamp(1.4rem, 5cqi, 2rem);
}

/* ---------- Pantalles estretes: 2×2 amb el dibuix a sobre (23-11: sense scroll;
   abans una columna, que obligava a desplaçar-se). Una columna només als mòbils (<520px). ---------- */

@media (max-width: 899px) {
  .sections-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    width: min(100%, calc((100vh - var(--inner-hero-h) - 110px) * 1.25));
  }
  .activity-grid { width: min(100%, 680px); }
  .activity-card { min-width: 0; }
  .activity-card__title { font-size: clamp(1.25rem, 3.3vw, 1.9rem); overflow-wrap: anywhere; }
  .section-card {
    grid-template-columns: 1fr;
  }
  .section-card__art {
    order: -1;
    box-shadow: inset 0 calc(var(--px) * -1) 0 0 var(--outline);
  }
  .section-card__text {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: calc(var(--px) * 1.5) calc(var(--px) * 4);
    padding: calc(var(--px) * 3.5) calc(var(--px) * 4.5) calc(var(--px) * 4.5);
  }
  .section-card__name { font-size: clamp(1.5rem, 7cqi, 2.1rem); }
  .section-card__tagline { font-size: clamp(1rem, 3.8cqi, 1.2rem); }
}

/* unitat i títol en una línia (24-11-2026) */
@media (min-width: 521px) {
  .inner-hero__heading { flex-direction: row; align-items: center; gap: calc(var(--px) * 3); }
  .inner-hero__title { font-size: clamp(1.7rem, min(3.4vw, 5.6vh), 2.7rem); }
  .inner-hero__inner { padding-top: 4px; padding-bottom: 6px; }
}

@media (max-width: 820px) {
  .inner-hero__inner { grid-template-columns: auto minmax(0, 1fr); }
  .inner-hero__heading { align-items: flex-end; text-align: right; }
}

@media (max-width: 520px) {
  :root { --inner-hero-h: 156px; }
  .sections-grid { grid-template-columns: 1fr; width: min(100%, 560px); }
  .inner-hero__inner {
    grid-template-columns: 1fr;
    align-content: center;
    justify-items: start;
    row-gap: calc(var(--px) * 2.5);
  }
  .inner-hero__heading { align-items: flex-start; text-align: left; }
  .inner-hero__back { min-height: 44px; font-size: 1.05rem; }
}

/* Pantalles d'activitat: menys marge a dalt i a baix, perquè tot hi càpiga
   sense scroll (js/views/fit.js fa la resta). 19-11-2026 */
.view--sections main.sections.is-activity {
  padding-top: clamp(10px, 2vh, 22px);
  padding-bottom: clamp(10px, 2vh, 22px);
}
/* ============================================================
   Mapa d'etapes d'una àrea (Vocabulary · zoo)
   El mapa es mostra sencer, amb la seva proporció real, i les
   caselles es posicionen en % sobre el mateix contenidor: no es
   mouen del camí en canviar la mida de la finestra.
   ============================================================ */

.map-page {
  padding-top: clamp(14px, 2.6vh, 28px);
  padding-bottom: clamp(24px, 4vh, 48px);
}

/* En pantalles estretes el mapa no s'encongeix per sota de 680 px
   (les caselles serien massa petites): es desplaça en horitzontal. */
.map-scroll {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  /* espai per al contorn i l'ombra dura del mapa */
  padding: var(--px) var(--px) calc(var(--px) * 3);
  scrollbar-width: thin;
}

.map {
  position: relative;
  /* tan gran com permeti l'alçada de la pantalla (el mapa sencer es veu sense
     desplaçar-se, també a 1190x711), mai més que l'original ni menys de 560 px */
  width: max(560px, min(100%, calc((100vh - var(--inner-hero-h) - 118px) * var(--map-w) / 1060), calc(var(--map-w) * 1px)));
  aspect-ratio: var(--map-ratio);
  margin: 0 auto;
  background: #8fd14f;
  /* marc fosc de 4 px i ombra dura, com la resta d'elements de Pixel Academy */
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 3) 0 0 var(--shadow);
}

.map__bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.map__stages {
  position: absolute;
  inset: 0;
  margin: 0;
  padding: 0;
  list-style: none; /* l'ordre és al camí; sense números */
}

/* Cada casella: centrada al seu punt del camí */
.map__stage {
  position: absolute;
  left: calc(var(--x) * 1%);
  top: calc(var(--y) * 1%);
  width: calc(var(--node-w) * 1%);
  transform: translate(-50%, -50%);
}

.map-stage {
  position: relative;
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  font: inherit;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- Il·lustració d'etapa: sprite + 3 estrelles superposades ---------- */

.stage-art {
  position: relative;
  display: block;
}
.stage-art__sprite {
  display: block;
  width: 100%;
  height: auto;
}
.stage-art__stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
/* cada estrella es col·loca exactament sobre la dibuixada a l'sprite */
.stage-art__star {
  position: absolute;
  left: calc(var(--sx) * 1%);
  top: calc(var(--sy) * 1%);
  width: calc(var(--sw) * 1%);
  height: auto;
  translate: -50% -50%;
  /* no guanyada: grisa (mateixa forma que la daurada) */
  filter: grayscale(1) brightness(1.2) contrast(0.8);
}
.stage-art__star.is-earned { filter: none; }

/* ombra dura curta que assenta la casella sobre el camí */
.map-stage__art {
  filter: drop-shadow(0 calc(var(--px) * 0.75) 0 rgba(10, 15, 77, 0.35));
}

/* ---------- Estat: bloquejada ---------- */

.map-stage__lock {
  position: absolute;
  top: 9%;
  right: 4%;
  width: 21%;
  height: auto;
  display: none;
  filter: drop-shadow(0 2px 0 rgba(10, 15, 77, 0.4));
}
.map-stage[data-state="locked"] { cursor: not-allowed; }
.map-stage[data-state="locked"] .map-stage__lock { display: block; }
.map-stage[data-state="locked"] .stage-art__sprite {
  filter: grayscale(1) brightness(0.95) contrast(0.85);
}
.map-stage[data-state="locked"] .map-stage__art { opacity: 0.88; }

/* en clicar una bloquejada: sacsejada curta a salts */
.map-stage.is-denied { animation: stage-denied 0.36s steps(6, end); }
@keyframes stage-denied {
  0%, 100% { translate: 0 0; }
  20%, 60% { translate: calc(var(--px) * -1) 0; }
  40%, 80% { translate: var(--px) 0; }
}

/* ---------- Estat: provisional («Coming soon») ---------- */

.map-stage[data-state="soon"] { cursor: default; }
.map-stage[data-state="soon"] .stage-art__sprite { filter: saturate(0.45) brightness(1.04); }
.map-stage__soon {
  position: absolute;
  left: 50%;
  top: 88%;
  translate: -50% 0;
  white-space: nowrap;
  font-size: clamp(0.62rem, 0.85vw, 0.85rem);
  font-weight: 700;
  line-height: 1;
  padding: calc(var(--px) * 0.75) calc(var(--px) * 1.5);
  color: #0b1460;
  background: #ffd23f;
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -0.75) 0 0 #e09a00;
  pointer-events: none;
}

/* ---------- Número de pas (recorreguts amb `numbered`) ---------- */

.map-stage__num {
  position: absolute;
  left: 6%;
  top: 4%;
  display: grid;
  place-items: center;
  min-width: 1.6em;
  height: 1.6em;
  padding: 0 0.2em 0.1em;
  font-size: clamp(0.75rem, 1.05vw, 1.05rem);
  font-weight: 700;
  line-height: 1;
  color: #ffffff;
  background: #0b1460;
  box-shadow:
    inset 0 calc(var(--px) * -0.75) 0 0 color-mix(in srgb, var(--tone) 70%, #0b1460),
    0 calc(var(--px) * 0.75) 0 0 rgba(10, 15, 77, 0.35);
  pointer-events: none;
}

/* ---------- Estat: actual (la següent etapa a fer) ---------- */

.map-stage.is-current .map-stage__art {
  filter:
    drop-shadow(calc(var(--px) * 1) 0 0 color-mix(in srgb, var(--tone) 55%, transparent))
    drop-shadow(calc(var(--px) * -1) 0 0 color-mix(in srgb, var(--tone) 55%, transparent))
    drop-shadow(0 calc(var(--px) * -1) 0 color-mix(in srgb, var(--tone) 55%, transparent))
    drop-shadow(0 calc(var(--px) * 0.75) 0 rgba(10, 15, 77, 0.35));
  animation: stage-bob 1.6s steps(1, end) infinite;
}
@keyframes stage-bob {
  0%, 60%, 100% { translate: 0 0; }
  70%, 90%      { translate: 0 calc(var(--px) * -1); }
}
/* l'etapa actual mostra sempre la seva etiqueta */
.map-stage.is-current .map-stage__label { opacity: 1; }

/* ---------- Animacions de progrés ---------- */

.map-stage.is-unlocking .map-stage__art { animation: stage-unlock 0.6s steps(5, end); }
@keyframes stage-unlock {
  0%   { scale: 0.86; }
  50%  { scale: 1.1; }
  100% { scale: 1; }
}
.map-stage.is-scoring .stage-art__star.is-earned { animation: star-pop 0.5s steps(4, end); }
@keyframes star-pop {
  0%   { scale: 0.4; }
  60%  { scale: 1.3; }
  100% { scale: 1; }
}

/* Etiqueta discreta (tipus i ordre) que apareix en hover o focus */
.map-stage__label {
  position: absolute;
  left: 50%;
  bottom: calc(100% - 6%);
  translate: -50% 0;
  white-space: nowrap;
  font-size: clamp(0.8rem, 1vw, 1rem);
  font-weight: 700;
  line-height: 1;
  padding: calc(var(--px) * 1.25) calc(var(--px) * 2.25);
  color: #0b1460;
  background: #ffffff;
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline),
    0 var(--px) 0 0 var(--tone);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s steps(2, end);
}
.map-stage[data-state="locked"] .map-stage__label { box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline),
    0 var(--px) 0 0 #9aa0b8; }

.map-stage:focus-visible { outline: none; }
.map-stage:focus-visible .map-stage__label,
.map-stage:hover .map-stage__label { opacity: 1; }

/* Focus de teclat: contorn esglaonat del color de la casella */
.map-stage:focus-visible .map-stage__art {
  filter:
    drop-shadow(var(--px) 0 0 var(--tone))
    drop-shadow(calc(var(--px) * -1) 0 0 var(--tone))
    drop-shadow(0 var(--px) 0 var(--tone))
    drop-shadow(0 calc(var(--px) * -1) 0 var(--tone))
    drop-shadow(0 calc(var(--px) * 0.75) 0 rgba(10, 15, 77, 0.35));
}
.map-stage[data-state="locked"]:focus-visible .map-stage__art {
  filter:
    drop-shadow(var(--px) 0 0 #9aa0b8)
    drop-shadow(calc(var(--px) * -1) 0 0 #9aa0b8)
    drop-shadow(0 var(--px) 0 #9aa0b8)
    drop-shadow(0 calc(var(--px) * -1) 0 #9aa0b8);
}

/* ---------- Recorregut completat: insígnia a la porta del zoo ---------- */

.map__goal {
  position: absolute;
  left: calc(var(--x) * 1%);
  top: calc(var(--y) * 1%);
  translate: -50% -50%;
  display: none;
  align-items: center;
  gap: calc(var(--px) * 1.5);
  padding: calc(var(--px) * 1.25) calc(var(--px) * 2.5);
  font-size: clamp(0.75rem, 1.15vw, 1.05rem);
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  color: #0b1460;
  background: #ffd23f;
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1) 0 0 #e09a00,
    0 calc(var(--px) * 2) 0 0 rgba(10, 15, 77, 0.3);
}
.map__goal.is-visible { display: flex; }
.map__goal.is-popping { animation: stage-unlock 0.6s steps(5, end); }
.map__goal-star { width: 1.3em; height: auto; }

/* ---------- Progrés a la capçalera ---------- */

.inner-hero__context-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: calc(var(--px) * 2);
}
.map-progress {
  display: inline-flex;
  align-items: center;
  gap: calc(var(--px) * 1.5);
  font-size: clamp(0.9rem, 1.2vw, 1.05rem);
  font-weight: 700;
  line-height: 1;
  padding: calc(var(--px) * 1) calc(var(--px) * 2.5) calc(var(--px) * 1) calc(var(--px) * 1.5);
  color: #0b1460;
  background: #ffffff;
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline);
}
.map-progress > span[aria-hidden] { display: inline-flex; gap: calc(var(--px) * 2.5); }
.map-progress__icon { width: 1.35em; height: auto; }
.map-progress__stages { color: #3a4690; }
.map-progress.is-complete { background: #ffd23f; }
.map-progress.is-complete .map-progress__stages { color: #0b1460; }

@media (max-width: 820px) {
  .inner-hero__context-row { justify-content: flex-end; }
}
@media (max-width: 520px) {
  .inner-hero__context-row { justify-content: flex-start; }
}

/* ---------- Peu del mapa: reiniciar (només per a proves) ---------- */

.map-footer {
  display: flex;
  justify-content: center;
  margin-top: calc(var(--px) * 2);
}

/* ---------- Finestra provisional de l'etapa ---------- */

.stage-dialog {
  --c: var(--tone);
  --cb: color-mix(in srgb, var(--tone) 70%, #ffffff);
  width: min(94vw, 440px);
  max-height: calc(100vh - 24px);
  /* margen interior per al contorn i l'ombra dura del quadre */
  padding: var(--px) var(--px) calc(var(--px) * 4);
  border: 0;
  background: transparent;
  overflow: auto;
  color: var(--ink);
}
.stage-dialog::backdrop {
  background: rgba(10, 15, 77, 0.5);
}
.stage-dialog[open] {
  animation: dialog-in 0.18s steps(3, end) both;
}
@keyframes dialog-in {
  0%   { opacity: 0; transform: translateY(calc(var(--px) * 3)); }
  100% { opacity: 1; transform: translateY(0); }
}

.stage-dialog__panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 3);
  padding: calc(var(--px) * 5) calc(var(--px) * 5) calc(var(--px) * 6);
  text-align: center;
  background: #fffaf0;
  /* franja superior del color de l'etapa + marc fosc + ombra dura */
  box-shadow:
    inset 0 calc(var(--px) * 2) 0 0 var(--tone),
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 3) 0 0 rgba(10, 15, 77, 0.45);
}

.stage-dialog__art {
  display: block;
  width: min(52%, 200px);
}

.stage-dialog__kicker {
  font-size: 1rem;
  font-weight: 600;
  line-height: 1;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 3);
  color: #0b1460;
  background: var(--cb);
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline);
}

.stage-dialog__title {
  font-size: clamp(2rem, 6vw, 2.6rem);
  font-weight: 700;
  line-height: 1;
}

.stage-dialog__best {
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--ink);
}

.stage-dialog__note {
  font-size: 0.95rem;
  color: var(--ink-soft);
}

/* Botons de prova del resultat: 2 × 2 */
.stage-dialog__sim {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: calc(var(--px) * 3.5);
  width: 100%;
  margin: calc(var(--px) * 1) 0 calc(var(--px) * 3);
}
/* (.px-btn.… perquè guanyin al color per defecte del botó genèric) */
.px-btn.sim-btn { --tone: #ffc928; --tone-hi: #ffe27a; width: 100%; }
.px-btn.sim-btn--fail { --tone: #ff9b8f; --tone-hi: #ffc4bc; }

/* el botó de tornar dins de la finestra fa servir el color de l'etapa */
.stage-dialog__close {
  font: inherit;
  font-size: 1.15rem;
  font-weight: 700;
  border: 0;
  cursor: pointer;
}

/* focus de teclat del botó de la finestra: amb el color de l'etapa */
.stage-dialog__close:focus-visible {
  outline: var(--px) solid var(--tone);
  outline-offset: calc(var(--px) * 1.5);
}

/* Reiniciar el progrés de prova: botó petit i neutre */
.px-btn.map-reset { --tone: #dfe5f5; --tone-hi: #ffffff; }
.px-btn.map-reset.is-confirming { --tone: #ff9b8f; --tone-hi: #ffc4bc; }

/* ---------- Recorregut amb accent propi (p. ex. Grammar, violeta) ----------
   Només afecta la interfície que envolta el mapa: el títol, el comptador de
   progrés i la insígnia de completat. El mapa i els sprites no canvien.
   (--c / --cb ja porten l'accent: botó de tornar i etiqueta de context.) */
.has-accent .inner-hero__title {
  text-shadow:
    calc(var(--o) * -1) 0 0 var(--outline),
    var(--o) 0 0 var(--outline),
    0 calc(var(--o) * -1) 0 var(--outline),
    0 var(--o) 0 var(--outline),
    calc(var(--o) * -1) calc(var(--o) * -1) 0 var(--outline),
    var(--o) calc(var(--o) * -1) 0 var(--outline),
    calc(var(--o) * -1) var(--o) 0 var(--outline),
    var(--o) var(--o) 0 var(--outline),
    0 calc(var(--o) * 2) 0 var(--c),
    calc(var(--o) * -1) calc(var(--o) * 2) 0 var(--outline),
    var(--o) calc(var(--o) * 2) 0 var(--outline),
    0 calc(var(--o) * 3) 0 var(--outline);
}
.has-accent .map-progress {
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline),
    0 var(--px) 0 0 var(--c);
}
.has-accent .map-progress__stages { color: var(--c); }
.has-accent .map-progress.is-complete .map-progress__stages { color: #0b1460; }
.has-accent .map__goal {
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1) 0 0 #e09a00,
    0 calc(var(--px) * 2) 0 0 var(--c);
}
/* ============================================================
   Selecció de quatre activitats (Reading, Listening) i pantalla
   provisional d'una activitat. Mateix llenguatge que les targetes
   del menú de la unitat: contorn fosc de 4 px, ombra dura i tramat.
   ============================================================ */

/* ---------- Icona provisional dins d'una targeta d'àrea (Listening) ---------- */
.section-card__art--icon {
  display: grid;
  place-items: center;
}
.section-card__icon {
  width: 58%;
  height: auto;
  filter: drop-shadow(0 calc(var(--px) * 1) 0 rgba(10, 15, 77, 0.25));
}

/* ---------- Estrelles (daurades guanyades, grises pendents) ---------- */
.px-star {
  display: block;
  height: auto;
  filter: grayscale(1) brightness(1.2) contrast(0.8);
}
.px-star.is-earned { filter: none; }

/* ---------- Targetes 2 × 2 (mateixa graella que el menú de la unitat) ---------- */
.activity-card {
  --depth: color-mix(in srgb, var(--tone) 66%, #0a0f4d);
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 2.2vh, 20px);
  /* mateixa proporció que les targetes d'àrea */
  aspect-ratio: 2.02 / 1;
  padding: calc(var(--px) * 4);
  text-align: center;
  text-decoration: none;
  color: #ffffff;
  background-color: var(--tone);
  /* el mateix tramat de 24 px que la columna de color de les targetes d'àrea */
  background-image:
    linear-gradient(45deg, rgba(255, 255, 255, 0.09) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.09) 75%),
    linear-gradient(45deg, rgba(255, 255, 255, 0.09) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.09) 75%);
  background-size: 24px 24px;
  background-position: 0 0, 12px 12px;
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    inset 0 var(--px) 0 0 rgba(255, 255, 255, 0.3),
    inset 0 calc(var(--px) * -2) 0 0 var(--depth),
    0 calc(var(--px) * 3) 0 0 var(--shadow);
  -webkit-tap-highlight-color: transparent;
}

/* títol protagonista: blanc amb contorn pixelat, com els títols de la capçalera */
.activity-card__title {
  --o: max(3px, 0.06em);
  font-size: clamp(1.8rem, min(3.6vw, 6vh), 3.2rem);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: 0.03em;
  text-shadow:
    calc(var(--o) * -1) 0 0 var(--outline),
    var(--o) 0 0 var(--outline),
    0 calc(var(--o) * -1) 0 var(--outline),
    0 var(--o) 0 var(--outline),
    calc(var(--o) * -1) calc(var(--o) * -1) 0 var(--outline),
    var(--o) calc(var(--o) * -1) 0 var(--outline),
    calc(var(--o) * -1) var(--o) 0 var(--outline),
    var(--o) var(--o) 0 var(--outline),
    0 calc(var(--o) * 2) 0 var(--outline);
}

.activity-card__stars {
  display: flex;
  gap: clamp(4px, 0.8vw, 10px);
}
.activity-card__stars .px-star {
  width: clamp(30px, 3.4vw, 50px);
  filter: grayscale(1) brightness(1.2) contrast(0.8) drop-shadow(0 2px 0 rgba(10, 15, 77, 0.35));
}
.activity-card__stars .px-star.is-earned { filter: drop-shadow(0 2px 0 rgba(10, 15, 77, 0.35)); }

/* en tornar d'una activitat amb millor marca: les estrelles fan "pop" */
.activity-card.is-scoring .px-star.is-earned { animation: star-pop 0.5s steps(4, end); }

.activity-card:focus-visible {
  outline: var(--px) solid var(--tone);
  outline-offset: calc(var(--px) * 2);
}

/* ---------- Pantalla provisional d'una activitat ---------- */

.activity-page {
  display: flex;
  flex-direction: column;
  gap: clamp(16px, 2.6vh, 28px);
  width: min(100%, 880px);
  margin: 0 auto;
}

.activity-slots {
  display: grid;
  gap: clamp(14px, 2.2vh, 24px);
}

/* espai reservat: quadre clar amb vora discontínua pixelada */
.activity-slot {
  display: flex;
  flex-direction: column;
  gap: calc(var(--px) * 2);
  padding: calc(var(--px) * 5) calc(var(--px) * 6);
  background: rgba(255, 255, 255, 0.75);
  border: var(--px) dashed color-mix(in srgb, var(--tone) 75%, #0a0f4d);
}
.activity-slot--text,
.activity-slot--audio { min-height: clamp(120px, 20vh, 200px); }
.activity-slot--questions { min-height: clamp(90px, 13vh, 140px); }

.activity-slot__title {
  align-self: flex-start;
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 3);
  color: #0b1460;
  background: color-mix(in srgb, var(--tone) 55%, #ffffff);
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline);
}
.activity-slot__note {
  font-size: 1.05rem;
  color: var(--ink-soft);
}

/* prova de resultat: mateix aspecte que la finestra de les etapes del mapa */
.activity-sim {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 3);
  padding: calc(var(--px) * 5) calc(var(--px) * 5) calc(var(--px) * 3);
  text-align: center;
  background: #fffaf0;
  box-shadow:
    inset 0 calc(var(--px) * 2) 0 0 var(--tone),
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 3) 0 0 var(--shadow);
}
.activity-sim__head {
  display: flex;
  align-items: center;
  gap: calc(var(--px) * 3);
}
.activity-sim__stars { display: flex; gap: 4px; }
.activity-sim__stars .px-star { width: 34px; }
.activity-sim__best {
  font-size: 1.15rem;
  font-weight: 600;
}
.activity-sim .stage-dialog__sim { max-width: 460px; }

/* targeta provisional (encara sense activitat): apagada i sense clic */
.activity-card.is-soon { filter: grayscale(0.55) brightness(0.92); cursor: default; }
.activity-card__soon {
  font-size: clamp(0.95rem, 1.6vw, 1.25rem); padding: 2px 10px; color: #fff;
  background: rgba(10, 15, 77, 0.55); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6);
}
/* ============================================================
   Guia de camp (Zoo Field Guide): graella 3 × 3 d'animals,
   fitxa ampliada, rondes de comprovació i resultat.
   Accent turquesa de Vocabulary (--c / --cb a .view--guide).
   ============================================================ */

/* ---------- Consigna grossa sobre la graella ---------- */
.guide-page {
  /* mides compartides per la consigna i la graella (mateixa amplada) */
  --gg: clamp(12px, 1.6vw, 22px);
  --gc-h: clamp(110px, calc((100vh - var(--inner-hero-h) - 196px - 2 * var(--gg)) / 3), 250px);
  --grid-w: calc(3 * var(--gc-h) * 1.75 + 2 * var(--gg));
}

.guide-banner {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: min(100%, var(--grid-w));
  min-height: clamp(52px, 7vh, 68px);
  margin: 0 auto calc(var(--px) * 4);
  padding: calc(var(--px) * 2) calc(var(--px) * 22) calc(var(--px) * 2);
  text-align: center;
  background: #ffffff;
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1.5) 0 0 color-mix(in srgb, var(--c) 35%, #ffffff),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
.guide-banner[hidden] { display: none; }
.guide-banner__text {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: calc(var(--px) * 3);
  font-size: clamp(1.35rem, 2.4vw, 2rem);
  font-weight: 700;
  line-height: 1.1;
  color: #0b1460;
}
/* l'animal que es demana: gros i destacat */
.guide-banner__target {
  font-size: 1.3em;
  line-height: 1;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 3.5) calc(var(--px) * 2);
  background: #ffd23f;
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1) 0 0 #e09a00;
}
.guide-banner__target[hidden] { display: none; }
.guide-banner__round {
  position: absolute;
  right: calc(var(--px) * 4);
  top: 50%;
  translate: 0 -50%;
  font-size: clamp(1rem, 1.5vw, 1.25rem);
  font-weight: 700;
  line-height: 1;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 2.5);
  color: #0b1460;
  background: var(--cb);
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline);
}
.guide-banner__round[hidden] { display: none; }
/* cada consigna nova "salta" una mica per cridar l'atenció */
.guide-banner.is-pop .guide-banner__target { animation: guide-pop 0.36s steps(4, end); }
@keyframes guide-pop {
  0%   { scale: 0.7; }
  60%  { scale: 1.12; }
  100% { scale: 1; }
}

/* ---------- Graella 3 × 3 ---------- */
.guide-page {
  padding-top: clamp(14px, 2.4vh, 28px);
}

/* en pantalles molt estretes, la graella es desplaça en horitzontal
   en lloc d'encongir les targetes per sota d'una mida còmoda */
.guide-scroll {
  overflow-x: auto;
  /* marge lateral perquè la sacsejada d'un error no quedi retallada */
  padding: calc(var(--px) * 3) calc(var(--px) * 3) calc(var(--px) * 4);
  margin: calc(var(--px) * -3) calc(var(--px) * -3) 0;
}

.guide-grid {
  /* --gc-h i --gg (a .guide-page): les 3 files, la consigna i el botó hi caben */
  display: grid;
  /* targetes amples: la graella és la protagonista de la pantalla */
  grid-template-columns: repeat(3, minmax(104px, calc(var(--gc-h) * 1.75)));
  gap: var(--gg);
  justify-content: center;
}
.guide-grid[hidden] { display: none; }

/* graella ampla (p. ex. Animal Actions, 7 targetes): 4 + 3 centrades, dues files
   més altes; en pantalles estretes es reparteixen en més files */
.guide-page:has(.guide-grid--wide) {
  --gc-h: clamp(100px, min(calc((100vh - var(--inner-hero-h) - 206px - var(--gg)) / 2),
                            calc((min(100vw, 1320px) - 2 * clamp(16px, 4vw, 40px) - 3 * var(--gg) - 12px) / 4 / 1.3)), 300px);
  --grid-w: calc(4 * var(--gc-h) * 1.3 + 3 * var(--gg));
}
.guide-grid--wide {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  max-width: var(--grid-w);
  margin: 0 auto;
}
.guide-grid--wide .guide-grid__item { flex: 0 0 calc(var(--gc-h) * 1.3); }
.guide-grid--wide .guide-card { aspect-ratio: 1.3 / 1; }

.guide-grid__item {
  display: flex;
  animation: card-in 0.32s steps(4, end) both;
  animation-delay: calc(var(--n) * 40ms);
}

.guide-card {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  aspect-ratio: 1.75 / 1;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 2) calc(var(--px) * 2);
  border: 0;
  font: inherit;
  color: #0b1460;
  cursor: pointer;
  background: color-mix(in srgb, var(--c) 14%, #ffffff);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1.5) 0 0 color-mix(in srgb, var(--c) 30%, #ffffff),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
  -webkit-tap-highlight-color: transparent;
}

.guide-card__art {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.guide-card__img {
  width: auto;
  height: 100%;
  max-width: 100%;
  object-fit: contain;
}
.guide-card__name {
  flex: none;
  font-size: clamp(0.95rem, 1.5vw, 1.4rem);
  font-weight: 700;
  line-height: 1.1;
  padding-top: calc(var(--px) * 0.5);
}

/* comprovació: mateixes posicions; els noms només apareixen en els animals ja
   resolts, que queden marcats fins al final (verd = trobat, vermell = no) */
.guide-grid.is-quiz .guide-card__name { visibility: hidden; }
.guide-grid.is-quiz .guide-card.is-correct .guide-card__name,
.guide-grid.is-quiz .guide-card.is-missed .guide-card__name { visibility: visible; }
.guide-card[aria-disabled="true"] { cursor: default; }

.guide-card.is-correct { background: #c9f1b6; }
.guide-card.is-missed { background: #ffd3cc; }
.guide-card.is-just-marked .guide-card__art { animation: guide-pop 0.36s steps(4, end); }

/* error: la targeta clicada sacseja un moment (no queda marcada) */
.guide-card.is-shaking {
  animation: guide-shake 0.42s steps(6, end);
  outline: var(--px) solid #d9434a;
  outline-offset: 0;
}
@keyframes guide-shake {
  0%, 100% { translate: 0 0; }
  20%, 60% { translate: calc(var(--px) * -1.5) 0; }
  40%, 80% { translate: calc(var(--px) * 1.5) 0; }
}

.guide-card__badge {
  position: absolute;
  top: calc(var(--px) * 1.5);
  right: calc(var(--px) * 1.5);
  display: none;
  width: clamp(26px, 2.2vw, 34px);
  aspect-ratio: 1;
  padding: 3px;
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline);
}
.guide-card.is-correct .guide-card__badge { display: block; background: #2e9f4a; }
.guide-card.is-missed .guide-card__badge { display: block; background: #d9434a; }
.guide-mark { display: block; width: 100%; height: 100%; }

/* ---------- Retroacció i botons sota la graella ---------- */
.guide-feedback {
  min-height: 1.6em;
  margin-top: calc(var(--px) * 2);
  text-align: center;
  font-size: clamp(1.05rem, 1.5vw, 1.3rem);
  font-weight: 700;
}
.guide-feedback:empty { min-height: 0; margin-top: calc(var(--px) * 2); }
.guide-feedback.is-ok { color: #1d7a35; }
.guide-feedback.is-no { color: #b4232c; }

.guide-actions {
  display: flex;
  justify-content: center;
  margin-top: calc(var(--px) * 2);
}
.guide-actions[hidden] { display: none; }

.px-btn.guide-btn {
  --tone: var(--c);
  --tone-hi: var(--cb);
  min-width: 170px;
  min-height: 52px;
  font-size: clamp(1.1rem, 1.5vw, 1.3rem);
  text-decoration: none;
}
.px-btn.guide-btn[hidden] { display: none; }
.px-btn.guide-btn--map { --tone: #dfe5f5; --tone-hi: #ffffff; }

/* ---------- Resultat ---------- */
.guide-results {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 3);
  width: min(100%, 560px);
  margin: clamp(8px, 3vh, 32px) auto 0;
  padding: calc(var(--px) * 6) calc(var(--px) * 6) calc(var(--px) * 6);
  text-align: center;
  background: #fffaf0;
  box-shadow:
    inset 0 calc(var(--px) * 2) 0 0 var(--c),
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 3) 0 0 var(--shadow);
}
.guide-results[hidden] { display: none; }
.guide-results__stars { display: flex; gap: 8px; }
.guide-results__stars .px-star { width: clamp(48px, 6vw, 68px); }
.guide-results__title {
  font-size: clamp(1.8rem, 3.4vw, 2.4rem);
  font-weight: 700;
  line-height: 1.05;
}
.guide-results__title:focus { outline: none; }
.guide-results__best { font-size: 1.15rem; font-weight: 600; }
.guide-results__note { font-size: 1.1rem; color: #1d7a35; font-weight: 700; }
.guide-results__note[hidden] { display: none; }
.guide-results__actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: calc(var(--px) * 4);
  margin-top: calc(var(--px) * 2);
}

/* ---------- Fitxa ampliada ---------- */
.guide-dialog {
  width: min(94vw, 460px);
  max-height: calc(100vh - 24px);
  padding: var(--px) var(--px) calc(var(--px) * 4);
  border: 0;
  background: transparent;
  overflow: auto;
  color: var(--ink);
}
.guide-dialog.has-compare { width: min(94vw, 600px); }
.guide-dialog::backdrop { background: rgba(10, 15, 77, 0.5); }
.guide-dialog[open] { animation: dialog-in 0.18s steps(3, end) both; }

.guide-dialog__panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 3);
  padding: calc(var(--px) * 5) calc(var(--px) * 5) calc(var(--px) * 6);
  text-align: center;
  background: #fffaf0;
  box-shadow:
    inset 0 calc(var(--px) * 2) 0 0 var(--c),
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 3) 0 0 rgba(10, 15, 77, 0.45);
}
.guide-dialog__img {
  width: min(72vw, 340px, calc(100vh - 260px));
  height: auto;
}
.guide-dialog.has-compare .guide-dialog__img { width: min(56vw, 230px, calc(100vh - 470px)); min-width: 140px; }
.guide-dialog__name {
  font-size: clamp(2rem, 6vw, 2.6rem);
  font-weight: 700;
  line-height: 1;
}

.guide-dialog__sentence {
  font-size: clamp(1.25rem, 3.6vw, 1.6rem);
  font-weight: 700;
  line-height: 1.2;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 3);
  background: color-mix(in srgb, var(--c) 16%, #ffffff);
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline);
}
.guide-dialog__sentence[hidden] { display: none; }

/* comparació: Tortoise (legs) i Sea turtle (flippers) */
.guide-compare {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: calc(var(--px) * 4);
  width: 100%;
  padding-top: calc(var(--px) * 3);
  border-top: var(--px) dashed color-mix(in srgb, var(--c) 60%, #0a0f4d);
}
.guide-compare[hidden] { display: none; }
.guide-compare__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 2);
}
.guide-compare__img {
  width: min(100%, 160px);
  height: auto;
}
.guide-compare__caption {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 1.5);
}
.guide-compare__name { font-size: 1.2rem; font-weight: 700; line-height: 1; }
.guide-compare__hint {
  font-size: 1rem;
  font-weight: 700;
  line-height: 1;
  padding: calc(var(--px) * 1.25) calc(var(--px) * 2.5);
  color: #0b1460;
  background: var(--cb);
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline);
}

.guide-dialog__close { margin-top: calc(var(--px) * 1); }

/* ---------- Pantalles estretes ---------- */
@media (max-width: 560px) {
  .guide-card { aspect-ratio: 0.92 / 1; }
  .guide-grid--wide .guide-grid__item { flex-basis: calc((100% - var(--gg)) / 2); }
  .guide-grid--wide .guide-card { aspect-ratio: 1.1 / 1; }
  .guide-card__name { font-size: 0.95rem; }
  .guide-banner { padding: calc(var(--px) * 2) calc(var(--px) * 3); flex-direction: column; gap: calc(var(--px) * 2); }
  .guide-banner__round { position: static; translate: none; }
  .guide-banner__text { font-size: 1.3rem; }
}

/* Tauletes en vertical: targetes més quadrades per aprofitar l'alçada */
@media (min-width: 561px) and (orientation: portrait) {
  .guide-card { aspect-ratio: 1.15 / 1; }
}

/* graella ampla en tauleta vertical: tres targetes per fila (3 + 3 + 1), més grosses */
@media (min-width: 561px) and (orientation: portrait) {
  .guide-page:has(.guide-grid--wide) {
    --gc-h: clamp(100px, min(calc((100vh - var(--inner-hero-h) - 206px - 2 * var(--gg)) / 3),
                              calc((min(100vw, 1320px) - 2 * clamp(16px, 4vw, 40px) - 2 * var(--gg) - 12px) / 3 / 1.3)), 300px);
    --grid-w: calc(3 * var(--gc-h) * 1.3 + 2 * var(--gg));
  }
}

/* 🔊 Listen a la fitxa ampliada (19-11-2026) */
.guide-dialog__listen { justify-self: center; align-self: center; margin-block: calc(var(--px) * 2); }
/* ============================================================
   Safari Snap! — consigna, panorama del zoo amb visor, àlbum de 9.
   Accent turquesa de Vocabulary (--c / --cb a .view--snap).
   ============================================================ */

/* aquesta pantalla fa servir més amplada que les altres: escena + àlbum */
.sections.snap-page { max-width: 1760px; padding-top: clamp(10px, 2vh, 20px); }
.view--snap { --album-w: clamp(230px, 18vw, 300px); }

/* ---------- Consigna i progrés ---------- */
.snap-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: calc(var(--px) * 2) calc(var(--px) * 6);
  margin: 0 auto calc(var(--px) * 3);
}
.snap-head[hidden] { display: none; }
.snap-task {
  display: flex;
  align-items: center;
  gap: 0.35em;
  min-height: clamp(48px, 6.5vh, 60px);
  padding: calc(var(--px) * 1.5) calc(var(--px) * 5);
  font-size: clamp(1.35rem, 2.3vw, 2rem);
  font-weight: 700;
  line-height: 1.1;
  color: #0b1460;
  background: #ffffff;
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1.5) 0 0 color-mix(in srgb, var(--c) 35%, #ffffff),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
/* l'animal demanat: destacat en groc */
.snap-task__target {
  font-size: 1.15em;
  line-height: 1;
  padding: calc(var(--px) * 1.25) calc(var(--px) * 3) calc(var(--px) * 1.75);
  background: #ffd23f;
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1) 0 0 #e09a00;
}
.snap-task__target.is-pop { animation: guide-pop 0.36s steps(4, end); }

.snap-progress {
  display: flex;
  align-items: center;
  gap: calc(var(--px) * 3);
  font-size: clamp(1.05rem, 1.5vw, 1.3rem);
  font-weight: 700;
}
.snap-progress__bar {
  position: relative;
  width: clamp(90px, 9vw, 150px);
  height: calc(var(--px) * 4);
  background: #ffffff;
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline);
}
.snap-progress__fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  background: var(--c);
  transition: width 0.24s steps(3, end);
}

/* ---------- Escena i àlbum ---------- */
.snap-play {
  display: grid;
  grid-template-columns: minmax(0, auto) var(--album-w);
  justify-content: center;
  align-items: start;
  gap: clamp(16px, 2vw, 28px);
}
.snap-play[hidden] { display: none; }
.snap-stage { min-width: 0; }

/* en pantalles estretes, l'escena es desplaça per arribar a tots els recintes */
.snap-scroll {
  overflow-x: auto;
  overflow-y: hidden;
  padding: var(--px) var(--px) calc(var(--px) * 3);
  scrollbar-width: thin;
}
.snap-zoo {
  position: relative;
  /* tan gran com permet l'alçada; mai més petit que --zoo-min (llavors es desplaça) */
  width: max(var(--zoo-min), min(calc(min(100vw, 1760px) - var(--album-w) - 2 * clamp(16px, 4vw, 40px) - clamp(16px, 2vw, 28px) - 24px), calc((100vh - var(--inner-hero-h) - 154px) * var(--zoo-ar)), 1672px));
  aspect-ratio: var(--zoo-ratio);
  margin: 0 auto;
  cursor: none;
  touch-action: pan-x pan-y;   /* a la tauleta es pot desplaçar; un toc curt fa la foto */
  user-select: none;
  -webkit-user-select: none;
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 3) 0 0 var(--shadow);
}
.snap-zoo:focus-visible {
  outline: var(--px) solid var(--c);
  outline-offset: calc(var(--px) * 2.5);
}
.snap-zoo__bg,
.snap-zoo__animals {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.snap-zoo img { pointer-events: none; }

/* animals: ombra dura curta que els assenta a terra */
.snap-animal {
  position: absolute;
  display: block;
  max-width: none;
  filter: drop-shadow(0 2px 0 rgba(10, 15, 77, 0.35));
}
.snap-animal.is-snapped { animation: guide-pop 0.36s steps(4, end); }

/* ---------- Visor ---------- */
.snap-viewfinder {
  position: absolute;
  pointer-events: none;
  background: rgba(255, 255, 255, 0.06);
}
.snap-viewfinder__svg { display: block; width: 100%; height: 100%; }
.snap-viewfinder__flash {
  position: absolute;
  inset: 0;
  background: #ffffff;
  opacity: 0;
}
.snap-viewfinder__flash.is-on { animation: snap-flash 0.3s steps(3, end); }
@keyframes snap-flash {
  0%   { opacity: 0.9; }
  100% { opacity: 0; }
}

/* ---------- Missatge sota l'escena ---------- */
.snap-message {
  min-height: 1.5em;
  margin-top: calc(var(--px) * 1);
  text-align: center;
  font-size: clamp(1.1rem, 1.6vw, 1.4rem);
  font-weight: 700;
}
.snap-message.is-ok { color: #1d7a35; }
.snap-message.is-no { color: #b4232c; }
.snap-message.is-shake { animation: guide-shake 0.42s steps(6, end); }

/* ---------- Àlbum (3 × 3) ---------- */
.snap-side {
  padding: calc(var(--px) * 3) calc(var(--px) * 3) calc(var(--px) * 4);
  background: #fffaf0;
  box-shadow:
    inset 0 calc(var(--px) * 2) 0 0 var(--c),
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 3) 0 0 var(--shadow);
}
.snap-side__title {
  margin: calc(var(--px) * 1) 0 calc(var(--px) * 3);
  text-align: center;
  font-size: clamp(1.1rem, 1.4vw, 1.3rem);
  font-weight: 700;
}
.snap-album {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: calc(var(--px) * 3) calc(var(--px) * 2.5);
}
.snap-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 0.75);
  min-width: 0;
}
.snap-slot__frame {
  display: grid;
  place-items: center;
  width: 100%;
  aspect-ratio: 1;
  padding: calc(var(--px) * 1);
  background: #ffffff;
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline),
    0 calc(var(--px) * 1.5) 0 0 var(--shadow);
}
.snap-slot__empty { font-size: 1.6rem; font-weight: 700; color: #b9c3f4; }
.snap-slot__empty[hidden], .snap-slot__img[hidden] { display: none; }
.snap-slot__img { width: 100%; height: 100%; object-fit: contain; }
.snap-slot__name {
  min-height: 1.2em;
  font-size: clamp(0.85rem, 1vw, 1rem);
  font-weight: 700;
  line-height: 1.1;
}
.snap-slot.is-filled .snap-slot__frame { background: #c9f1b6; }
/* animal perdut (una sola oportunitat): ✗ i el nom, en vermell */
.snap-slot.is-missed .snap-slot__frame { background: #ffd3cc; }
.snap-slot.is-missed .snap-slot__empty { color: #b4232c; }
.snap-slot.is-missed .snap-slot__name { color: #b4232c; }
.snap-slot.is-new .snap-slot__frame { animation: guide-pop 0.36s steps(4, end); }

/* ---------- Resultat ---------- */
.snap-results { margin-top: clamp(12px, 3vh, 32px); width: min(100%, 640px); }
.snap-results__album {
  display: grid;
  grid-template-columns: repeat(9, minmax(0, 1fr));
  gap: calc(var(--px) * 2);
  width: 100%;
  margin: calc(var(--px) * 1) 0;
}
.snap-results__album .snap-slot.is-new .snap-slot__frame { animation: none; }
.snap-results__album .snap-slot__name { font-size: 0.8rem; }

/* ---------- Pantalles més estretes: àlbum a sota ---------- */
@media (max-width: 1100px) {
  .snap-play { grid-template-columns: minmax(0, 1fr); }
  /* 19-11: també limitada per l'alçada (escena + àlbum en una fila han de cabre sense scroll) */
  .snap-zoo { width: max(min(var(--zoo-min), 100%), min(100%, calc((100vh - var(--inner-hero-h) - 300px) * var(--zoo-ar)), 1672px)); }
  .snap-album { grid-template-columns: repeat(9, minmax(0, 1fr)); }
  .snap-side { width: min(100%, 860px); margin: 0 auto; }
}
@media (max-width: 640px) {
  .snap-album { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .snap-results__album { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
/* ============================================================
   Secret Zoo Signs — rètol del zoo amb l'animal, caselles de lletres,
   banc de fitxes desordenades i botons Check / Show word / Next.
   Accent turquesa de Vocabulary (--c / --cb a .view--signs).
   ============================================================ */

.sections.signs-page { padding-top: clamp(10px, 2vh, 20px); padding-bottom: clamp(12px, 3vh, 32px); }

/* ---------- Instrucció i progrés ---------- */
.signs-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(var(--px) * 4);
  width: fit-content;
  max-width: 100%;
  min-height: clamp(48px, 6.5vh, 60px);
  margin: 0 auto calc(var(--px) * 4);
  padding: calc(var(--px) * 1.5) calc(var(--px) * 2) calc(var(--px) * 1.5) calc(var(--px) * 5);
  background: #ffffff;
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    inset 0 calc(var(--px) * -1.5) 0 0 color-mix(in srgb, var(--c) 35%, #ffffff),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
.signs-head[hidden] { display: none; }
.signs-head__text {
  font-size: clamp(1.15rem, 2.1vw, 1.8rem);
  font-weight: 700;
  line-height: 1.1;
  color: #0b1460;
}
.signs-head__count {
  flex: none;
  font-size: clamp(1rem, 1.5vw, 1.25rem);
  font-weight: 700;
  line-height: 1;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 2.5);
  color: #0b1460;
  background: var(--cb);
  box-shadow:
    0 calc(var(--px) * -0.5) 0 0 var(--outline),
    0 calc(var(--px) * 0.5) 0 0 var(--outline),
    calc(var(--px) * -0.5) 0 0 0 var(--outline),
    calc(var(--px) * 0.5) 0 0 0 var(--outline);
}

.signs-play {
  /* mides: les fitxes depenen de la llargada de la paraula (--n, des del JS) i
     la il·lustració ocupa l'alçada que queda; tot hi cap sense desplaçar-se */
  --tile-gap: clamp(4px, 0.8vw, 10px);
  --tile: clamp(32px, min(6.6vh, calc((100vw - 100px) / (var(--n, 8) + 0.6))), 68px);
  --art-h: clamp(110px, calc(100vh - var(--inner-hero-h) - 2 * var(--tile) - 350px), 300px);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.signs-play[hidden] { display: none; }

/* ---------- Rètol ---------- */
/* el rètol s'aguanta sobre dos pals de fusta */
.zoo-sign {
  position: relative;
  max-width: 100%;
  margin: 0;
  padding-bottom: calc(var(--px) * 5);
}
.zoo-sign::before,
.zoo-sign::after {
  content: "";
  position: absolute;
  bottom: 0;
  width: calc(var(--px) * 3);
  height: calc(var(--px) * 5);
  background: #a8642f;
  box-shadow:
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline),
    inset calc(var(--px) * -1) 0 0 0 #7a4220;
}
.zoo-sign::before { left: 18%; }
.zoo-sign::after { right: 18%; }
.zoo-sign__board {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: min(100%, calc(var(--art-h) * 1.5));
  padding: calc(var(--px) * 4) calc(var(--px) * 4) calc(var(--px) * 3.5);
  background: #fffaf0;
  box-shadow:
    inset 0 calc(var(--px) * 2) 0 0 var(--c),
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 3) 0 0 var(--shadow);
}
/* cargols pixelats a les cantonades */
.zoo-sign__bolt {
  position: absolute;
  top: calc(var(--px) * 3.5);
  width: calc(var(--px) * 1.5);
  height: calc(var(--px) * 1.5);
  background: color-mix(in srgb, var(--c) 45%, #0a0f4d);
