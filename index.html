.pz-head { margin-bottom: calc(var(--px) * 3); }

.pz-play {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(10px, 1.8vh, 18px);
}
.pz-play[hidden] { display: none; }

/* ---------- Tauler ---------- */
.pz-stage {
  --board-max-w: min(calc(100vw - 72px), 860px);
  --board-h: min(var(--bh), calc(var(--board-max-w) / var(--rn, 1.5)));
  padding: calc(var(--px) * 3);
}
/* a la ronda de la comparativa es reserva lloc a dalt per a «they» i la fletxa */
.pz-stage.is-pointing { --board-h: min(calc(var(--bh) - 40px), calc(var(--board-max-w) / var(--rn, 1.5))); padding-top: max(calc(var(--px) * 3), calc(76px - var(--board-h) * 0.2)); }
.pz-art {
  position: relative;
  width: calc(var(--board-h) * var(--rn, 1.5));
  height: var(--board-h);
}
.pz-board {
  --gap: calc(var(--px) * 1.5);
  display: grid;
  grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
  grid-template-rows: repeat(var(--rows, 2), minmax(0, 1fr));
  gap: var(--gap);
  width: 100%;
  height: 100%;
  transition: gap 0.3s steps(3, end);
}
.pz-piece {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  cursor: pointer;
  /* mateix fons darrere de totes les peces */
  background-color: var(--piece-bg);
  background-image: var(--img);
  background-repeat: no-repeat;
  background-size: calc(var(--cols) * 100%) calc(var(--rows) * 100%);
  image-rendering: auto;
  box-shadow: 0 0 0 calc(var(--px) * 0.5) var(--outline), 0 calc(var(--px) * 1) 0 calc(var(--px) * 0.5) var(--shadow);
  transition: transform 0.12s steps(2, end);
}
.pz-piece:hover { transform: translateY(calc(var(--px) * -0.75)); }
.pz-piece:focus-visible { outline: var(--px) solid var(--c); outline-offset: calc(var(--px) * 1); z-index: 2; }
/* peça triada: s'aixeca amb un marc groc que batega */
.pz-piece.is-selected {
  z-index: 3;
  transform: translateY(calc(var(--px) * -1.5)) scale(1.03);
  box-shadow:
    0 0 0 calc(var(--px) * 0.75) #ffd23f,
    0 0 0 calc(var(--px) * 1.5) var(--outline),
    0 calc(var(--px) * 3) 0 calc(var(--px) * 1) var(--shadow);
  animation: pz-pulse 0.8s steps(2, end) infinite;
}
@keyframes pz-pulse { 50% { box-shadow: 0 0 0 calc(var(--px) * 0.75) #ff9f1c, 0 0 0 calc(var(--px) * 1.5) var(--outline), 0 calc(var(--px) * 3) 0 calc(var(--px) * 1) var(--shadow); } }
.pz-piece.is-swapped { animation: guide-pop 0.3s steps(3, end); }

/* imatge muntada: sense separacions ni contorns, una sola il·lustració */
.pz-board.is-solved { --gap: 0px; }
.pz-board.is-solved .pz-piece {
  cursor: default;
  transform: none;
  box-shadow: none;
  animation: none;
}
.pz-board.is-solved .pz-piece:hover { transform: none; }
.pz-art:has(.pz-board.is-solved) { animation: guide-pop 0.4s steps(4, end); }
.pz-art .wl-frame[hidden], .pz-art .wl-callout[hidden] { display: none; }

.pz-status { margin: calc(var(--px) * 1) 0 0; font-size: clamp(0.95rem, 1.2vw, 1.1rem); font-weight: 700; color: var(--ink-soft); text-align: center; }

/* ---------- Frases per triar ---------- */
.pz-options { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(14px, 2vw, 28px); }
.pz-options[hidden] { display: none; }
.pz-options.is-new { animation: guide-pop 0.36s steps(4, end); }
.px-btn.pz-option {
  --ring: color-mix(in srgb, var(--c) 62%, transparent);
  --ring2: color-mix(in srgb, var(--c) 24%, transparent);
  display: inline-flex;
  align-items: center;
  gap: calc(var(--px) * 2);
  min-width: clamp(200px, 18vw, 270px);
  min-height: clamp(50px, 6.6vh, 60px);
  padding: 0 calc(var(--px) * 4);
  justify-content: center;
  font-size: clamp(1.1rem, 1.6vw, 1.45rem);
  text-shadow: none;
}
/* 24-11-2026 (mestre): are / aren't sense color abans de respondre */
.px-btn.pz-option--yes, .px-btn.pz-option--no { --tone: #ffffff; --tone-hi: #f4f6ff; color: #0b1460; }
.px-btn.pz-option .wl-verb { background: none; box-shadow: none; color: inherit; }
.px-btn.pz-option.is-ok { --tone: #8ee07a; --tone-hi: #8ee07a; color: #0b1460; }
.px-btn.pz-option.is-no { --tone: #ff9b8f; --tone-hi: #ff9b8f; color: #0b1460; }
.px-btn.pz-option.is-answer { color: #0b1460; outline: var(--px) dashed #2e9f4a; outline-offset: calc(var(--px) * 0.75); }
.px-btn.pz-option:disabled { cursor: default; transform: none; }
.px-btn.pz-option:disabled:not(.is-ok):not(.is-no):not(.is-answer) { opacity: 0.55; }
.pz-option .aa-mark { width: calc(var(--px) * 7); height: calc(var(--px) * 7); }

.pz-after { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: calc(var(--px) * 2) clamp(16px, 2vw, 28px); }
.pz-status[hidden] { display: none; }
.pz-feedback { margin: 0; min-height: 1.3em; text-align: center; font-size: clamp(1.05rem, 1.4vw, 1.25rem); }
.pz-feedback:empty { display: none; }
.pz-actions { margin: 0; }

/* ---------- Resultat ---------- */
.pz-results__list { grid-template-columns: minmax(0, 1fr); width: min(100%, 520px); }

/* ---------- Pantalles baixes ---------- */
@media (max-height: 760px) and (min-width: 761px) and (orientation: landscape) {
  .sections.pz-page { padding-top: 8px; --bh: clamp(150px, calc(100vh - var(--inner-hero-h) - 275px), 470px); }
  .pz-head { margin-bottom: calc(var(--px) * 2); }
  .pz-play { gap: 8px; }
}

/* ---------- Pantalles estretes i vertical ---------- */
@media (max-width: 760px), (orientation: portrait) {
  .sections.pz-page { --bh: clamp(160px, 38vh, 440px); }
}
@media (max-width: 640px) {
  .pz-stage { --board-max-w: calc(100vw - 52px); padding: calc(var(--px) * 1.5); }
  .pz-stage.is-pointing { padding-top: max(calc(var(--px) * 1.5), calc(64px - var(--board-h) * 0.2)); }
  .pz-board { --gap: var(--px); }
  .px-btn.pz-option { min-width: 0; width: 100%; }
  .pz-options { width: 100%; flex-direction: column; }
}
/* ============================================================
   What do they do? — Grammar 4 (They + verb / They don't + verb).
   Dues cartes de la mateixa mida, una al costat de l'altra (també al mòbil),
   amb la frase just a sota de la imatge. don't sempre en el mateix vermell.
   Reutilitza .signs-head i els botons de la guia de camp. Accent lila.
   ============================================================ */

.sections.wd-page {
  max-width: 1200px;
  padding-top: clamp(10px, 2vh, 20px);
  padding-bottom: clamp(12px, 3vh, 32px);
  /* costat de la imatge de cada carta: cap dues cartes a l'amplada i tot a l'alçada */
  --card-w: clamp(140px, min(calc((100vw - 120px) / 2), calc(100vh - var(--inner-hero-h) - 345px)), 440px);
  --dont: #c4161f;
  --dont-bg: #ffe1dc;
}
.wd-head { margin-bottom: calc(var(--px) * 3); }

.wd-play {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(8px, 1.6vh, 16px);
}
.wd-title {
  margin: 0;
  padding: calc(var(--px) * 1) calc(var(--px) * 3) calc(var(--px) * 1.25);
  font-size: clamp(1.05rem, 1.5vw, 1.3rem);
  font-weight: 700;
  color: #ffffff;
  background: var(--c);
  box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline),
    0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline),
    calc(var(--px) * 0.75) 0 0 0 var(--outline);
}
.wd-scene { margin: 0; font-size: clamp(0.95rem, 1.2vw, 1.1rem); font-weight: 700; color: var(--ink-soft); text-align: center; }
.wd-scene[hidden] { display: none; }

/* ---------- Cartes ---------- */
.wd-cards {
  display: grid;
  grid-template-columns: repeat(2, var(--card-w));
  gap: clamp(14px, 3vw, 48px);
  align-items: stretch;
  justify-content: center;
}
.wd-cards.is-new .wd-card { animation: guide-pop 0.36s steps(4, end); }
.wd-card {
  margin: 0;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 3) 0 0 var(--shadow);
}
.wd-card__art {
  width: 100%;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  padding: calc(var(--px) * 2);
  box-sizing: border-box;
  /* el mateix fons a totes les cartes, perquè la transparència es llegeixi igual */
  background: color-mix(in srgb, var(--c) 12%, #ffffff);
  box-shadow: inset 0 calc(var(--px) * -1) 0 0 color-mix(in srgb, var(--c) 28%, #ffffff);
}
.wd-card__art { grid-template: minmax(0, 100%) / minmax(0, 100%); }
.wd-card__img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
.wd-card__text {
  flex: 1;
  display: block;
  padding: calc(var(--px) * 2.5) calc(var(--px) * 2) calc(var(--px) * 3);
  font-size: clamp(1.05rem, 1.9vw, 1.65rem);
  font-weight: 700;
  line-height: 1.3;
  text-align: center;
  color: #0b1460;
}
/* barra de color a la carta: verd (afirmativa) / vermell (negativa) */
.wd-card.is-pos .wd-card__text { box-shadow: inset 0 calc(var(--px) * -1) 0 0 #9fd98c; }
.wd-card.is-neg .wd-card__text { box-shadow: inset 0 calc(var(--px) * -1) 0 0 #f4a99f; }
.wd-dont {
  display: inline-block;
  padding: 0 calc(var(--px) * 1.25);
  color: var(--dont);
  background: var(--dont-bg);
  box-shadow: inset 0 calc(var(--px) * -0.75) 0 0 var(--dont);
}
.wd-phrase { white-space: normal; }

/* ---------- Pantalla de contrast: aren't (com són) o don't (què fan) ---------- */
.view--wd { --how: #1f5fc4; --how-bg: #dde9ff; --do: #b35600; --do-bg: #ffe7c4; }
.wd-cards.is-contrast .wd-card__art { aspect-ratio: 4 / 3; }
/* en horitzontal, cartes més amples i imatge més baixa perquè hi càpiga la regla */
@media (orientation: landscape) and (min-width: 761px) {
  .wd-cards.is-contrast { grid-template-columns: repeat(2, min(calc((100vw - 140px) / 2), 500px)); }
  .wd-cards.is-contrast .wd-card__art { aspect-ratio: auto; height: clamp(90px, calc(100vh - var(--inner-hero-h) - 470px), 250px); }
}
.wd-card--rule.is-how { --tone-k: var(--how); --tone-kbg: var(--how-bg); }
.wd-card--rule.is-do  { --tone-k: var(--do);  --tone-kbg: var(--do-bg); }
.wd-card__label {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: center;
  gap: 0 calc(var(--px) * 2);
  margin: 0;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 2) calc(var(--px) * 1.75);
  font-size: clamp(0.95rem, 1.4vw, 1.2rem);
  font-weight: 700;
  color: #ffffff;
  background: var(--tone-k);
}
.wd-card__ask { font-size: 0.85em; opacity: 0.85; }
.wd-key {
  display: inline-block;
  padding: 0 calc(var(--px) * 1);
  color: var(--tone-k);
  background: var(--tone-kbg);
  box-shadow: inset 0 calc(var(--px) * -0.75) 0 0 var(--tone-k);
}
.wd-cards.is-contrast .wd-card__text { flex: none; padding-bottom: calc(var(--px) * 2); box-shadow: none; }
.wd-rule {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--px) * 1.5);
  padding: calc(var(--px) * 2) calc(var(--px) * 2) calc(var(--px) * 3);
  border-top: calc(var(--px) * 0.5) dashed color-mix(in srgb, var(--tone-k) 40%, #ffffff);
}
.wd-rule__head { margin: 0; font-size: clamp(0.95rem, 1.3vw, 1.15rem); font-weight: 700; color: #0b1460; }
.wd-rule__what { color: var(--tone-k); }
.wd-rule__words {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: calc(var(--px) * 1.5);
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: clamp(0.85rem, 1.15vw, 1.05rem);
  font-weight: 700;
}
.wd-rule__words .wd-key { padding: calc(var(--px) * 0.5) calc(var(--px) * 1.5); background: #ffffff; box-shadow: inset 0 0 0 calc(var(--px) * 0.5) color-mix(in srgb, var(--tone-k) 55%, transparent); }
.wd-rule__words .wd-key.is-here { background: var(--tone-kbg); box-shadow: inset 0 0 0 calc(var(--px) * 0.5) var(--tone-k); }

/* ajuda breu: don't = do not */
.wd-note { margin: 0; }
.wd-note[hidden] { display: none; }
.wd-note__box {
  display: inline-block;
  padding: calc(var(--px) * 1) calc(var(--px) * 3);
  font-size: clamp(1rem, 1.3vw, 1.2rem);
  font-weight: 700;
  color: #0b1460;
  background: #ffffff;
  box-shadow: inset 0 0 0 calc(var(--px) * 0.5) color-mix(in srgb, var(--dont) 45%, transparent);
}

.wd-actions { margin: calc(var(--px) * 1.5) 0 0; }
.wd-actions .px-btn:disabled,
.wd-actions .px-btn:disabled:hover,
.wd-actions .px-btn:disabled:active {
  --tone: #dfe5f5;
  color: #7c86b5;
  cursor: not-allowed;
  transform: none;
  background: var(--tone);
  box-shadow: var(--o4), inset 0 calc(var(--px) * -1.5) 0 0 #c3cbe4, 0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
.px-btn.wd-done { --tone: #2e9f4a; --tone-hi: #46b862; }

/* ---------- Pantalles baixes ---------- */
@media (max-height: 760px) and (min-width: 761px) and (orientation: landscape) {
  .sections.wd-page { padding-top: 8px; --card-w: clamp(140px, min(calc((100vw - 120px) / 2), calc(100vh - var(--inner-hero-h) - 315px)), 430px); }
  .wd-head { margin-bottom: calc(var(--px) * 2); }
  .wd-play { gap: 6px; }
  .wd-card__text { padding-top: calc(var(--px) * 1.5); padding-bottom: calc(var(--px) * 2); }
}
/* ---------- Vertical i mòbil: les dues cartes continuen una al costat de l'altra ---------- */
@media (orientation: portrait) {
  .sections.wd-page { --card-w: clamp(130px, min(calc((100vw - 64px) / 2), 38vh), 400px); }
}
@media (max-width: 640px) {
  .sections.wd-page { --card-w: calc((100vw - 52px) / 2); }
  .wd-cards { gap: 12px; }
  .wd-card__art { padding: var(--px); }
  .wd-card__text { font-size: 0.95rem; padding: calc(var(--px) * 2) calc(var(--px) * 1.25) calc(var(--px) * 2.5); }
  .wd-card__label { font-size: 0.8rem; padding-left: var(--px); padding-right: var(--px); }
  .wd-rule { padding-left: var(--px); padding-right: var(--px); }
  .wd-rule__words { font-size: 0.75rem; gap: var(--px); }
}
/* ============================================================
   Grammar Review — Grammar 5 (repte final). Fa servir el format de quadern
   d'Ask and answer (.aa-*: imatge a l'esquerra, panell a la dreta) i hi afegeix
   la frase amb buit, la línia de resposta, les dues cartes de l'últim ítem
   (la dels tigres ressaltada) i la pista en català.
   ============================================================ */

/* frase amb un buit */
.gr-sentence {
  margin: 0;
  width: 100%;
  box-sizing: border-box;
  padding: calc(var(--px) * 3) calc(var(--px) * 3) calc(var(--px) * 3.5);
  font-size: clamp(1.45rem, 2.4vw, 2.05rem);
  font-weight: 700;
  line-height: 1.45;
  text-align: center;
  color: #0b1460;
  background: color-mix(in srgb, var(--c) 10%, #ffffff);
  box-shadow: inset 0 calc(var(--px) * -1) 0 0 color-mix(in srgb, var(--c) 35%, #ffffff);
}
.gr-sentence .aa-mark,
.gr-line-a .aa-mark { margin-left: calc(var(--px) * 2); vertical-align: middle; }
.gr-options { flex-wrap: wrap; }
.px-btn.wl-chip.gr-chip { min-width: clamp(110px, 9vw, 150px); }

/* línia de la resposta curta: buit llarg o la frase triada */
.gr-blank-long { min-width: 9em; }
.gr-picked {
  display: inline-block;
  padding: 0 calc(var(--px) * 1.5);
  background: color-mix(in srgb, var(--c) 10%, #ffffff);
  border-bottom: var(--px) solid color-mix(in srgb, var(--c) 70%, #0b1460);
}
.gr-picked.is-new { animation: guide-pop 0.36s steps(4, end); }
.gr-picked.is-ok { background: #c9f1b6; border-bottom-color: #2e9f4a; color: #12612a; }
.gr-picked.is-no { background: #ffd3cc; border-bottom-color: #e2232c; color: #a1121b; text-decoration: line-through; }

/* colors de la regla aren't (com són) / don't (què fan), els mateixos que a What do they do? */
.view--gr { --how: #1f5fc4; --how-bg: #dde9ff; --do: #b35600; --do-bg: #ffe7c4; --dont: #c4161f; --dont-bg: #ffe1dc; }
.gr-hint .wd-key.is-how, .gr-hint__what.is-how { --tone-k: var(--how); --tone-kbg: var(--how-bg); }
.gr-hint .wd-key.is-do,  .gr-hint__what.is-do  { --tone-k: var(--do);  --tone-kbg: var(--do-bg); }
.gr-hint__what { color: var(--tone-k); }
.gr-hint .wd-key, .gr-hint .wd-dont { padding: 0 calc(var(--px) * 0.75); }

/* correcció: frase correcta amb la paraula ressaltada i pista en català */
.gr-feedback { min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 2); width: 100%; }
.gr-feedback:empty { display: none; }
.gr-feedback__line { margin: 0; font-size: clamp(1.05rem, 1.45vw, 1.25rem); font-weight: 700; text-align: center; line-height: 1.5; }
.gr-feedback__line.is-ok { color: #1d7a35; }
.gr-feedback__line.is-no { color: #b4232c; }
.gr-feedback__line .wl-verb { color: #12612a; }
.gr-feedback__line .wl-verb.is-neg { color: #a1121b; }
.gr-hint {
  display: flex;
  max-width: 100%;
  box-sizing: border-box;
  align-items: center;
  gap: calc(var(--px) * 2.5);
  margin: 0;
  padding: calc(var(--px) * 2) calc(var(--px) * 3);
  font-size: clamp(0.98rem, 1.25vw, 1.12rem);
  font-weight: 700;
  line-height: 1.3;
  color: #0b1460;
  background: #fff6d6;
  box-shadow: inset 0 0 0 calc(var(--px) * 0.5) #e0a100;
  animation: guide-pop 0.36s steps(4, end);
}
.gr-hint__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: calc(var(--px) * 7);
  height: calc(var(--px) * 7);
  color: #0b1460;
  background: #ffd23f;
  box-shadow: 0 0 0 calc(var(--px) * 0.5) var(--outline);
}

/* ---------- Dues cartes (últim ítem): tigres ressaltats, balenes al costat ---------- */
.gr-pair {
  display: grid;
  grid-template-columns: repeat(2, var(--gr-card, clamp(140px, min(22vw, calc(var(--art-h) - 20px)), 330px)));
  gap: clamp(14px, 2vw, 28px);
  padding-top: calc(var(--px) * 9);
}
.gr-pair[hidden] { display: none; }
.gr-pair.is-new .gr-card { animation: guide-pop 0.36s steps(4, end); }
.gr-card {
  position: relative;
  margin: 0;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  padding: calc(var(--px) * 2);
  box-sizing: border-box;
  background: color-mix(in srgb, var(--c) 12%, #ffffff);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 3) 0 0 var(--shadow);
}
.gr-card__img { width: 100%; height: 100%; object-fit: contain; }
.gr-card.is-dim { opacity: 0.55; filter: saturate(0.6); }
.gr-card.is-highlight {
  box-shadow:
    0 0 0 calc(var(--px) * 1) #ffd23f,
    0 0 0 calc(var(--px) * 2) var(--outline),
    0 calc(var(--px) * 3.5) 0 calc(var(--px) * 1) var(--shadow);
  animation: wl-blink-card 1.2s steps(2, end) infinite;
}
@keyframes wl-blink-card { 50% { box-shadow: 0 0 0 calc(var(--px) * 1) #ff9f1c, 0 0 0 calc(var(--px) * 2) var(--outline), 0 calc(var(--px) * 3.5) 0 calc(var(--px) * 1) var(--shadow); } }
.gr-card__they {
  position: absolute;
  left: 50%;
  bottom: calc(100% + var(--px) * 2.5);
  transform: translateX(-50%);
  padding: calc(var(--px) * 0.75) calc(var(--px) * 2) calc(var(--px) * 1);
  font-size: clamp(1rem, 1.4vw, 1.25rem);
  font-weight: 700;
  line-height: 1.1;
  color: #ffffff;
  background: var(--c);
  box-shadow: 0 0 0 calc(var(--px) * 0.75) var(--outline);
}

@media (max-width: 1000px), (orientation: portrait) {
  .gr-pair { --gr-card: clamp(130px, min(calc((100vw - 80px) / 2), 30vh), 300px); }
}
@media (max-width: 640px) {
  .gr-pair { --gr-card: calc((100vw - 60px) / 2); gap: 12px; }
  .gr-sentence { font-size: 1.3rem; padding: calc(var(--px) * 2.5) calc(var(--px) * 2); }
  .px-btn.wl-chip.gr-chip { min-width: 0; padding: 0 calc(var(--px) * 3); }
}
/* ============================================================
   Reading i Listening — motor comú d'activitats (PA.views.skill).
   Text a l'esquerra i exercici a la dreta quan hi ha lectura; si no, un sol
   panell centrat. Cartes grans, una pregunta cada vegada, que respiri.
   Reutilitza .signs-head, .px-btn, .wl-chip, .wl-blank, .aa-answer, .aa-mark,
   .wl-stage / .wl-art (fletxa) i el resultat de la guia de camp.
   ============================================================ */

.sections.sk-page {
  max-width: 1240px;
  padding-top: clamp(10px, 2vh, 20px);
  padding-bottom: clamp(12px, 3vh, 32px);
  display: flex;
  flex-direction: column;
  align-items: center;
  --card: clamp(110px, min(16vw, calc(100vh - var(--inner-hero-h) - 450px)), 255px);
}
.sk-head { margin-bottom: calc(var(--px) * 3); }
.sk-task:has(.sk-intro) { --card-cut: 34px; }
.sk-intro { margin: 0; font-size: clamp(1rem, 1.3vw, 1.15rem); font-weight: 700; color: var(--ink-soft); text-align: center; }
.sk-intro[hidden] { display: none; }

.sk-play-area { display: flex; justify-content: center; width: 100%; }
.sk-play-area[hidden] { display: none; }
.sk-play-area.has-text {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
  gap: clamp(18px, 2.6vw, 40px);
  align-items: start;
}

/* ---------- Panells ---------- */
.sk-panel,
.sk-text {
  box-sizing: border-box;
  background: #ffffff;
  box-shadow:
    inset 0 calc(var(--px) * 1.5) 0 0 var(--tone),
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
.sk-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(12px, 2vh, 20px);
  width: min(100%, 880px);
  padding: calc(var(--px) * 5) calc(var(--px) * 5) calc(var(--px) * 5.5);
}
.sk-play-area.has-text .sk-panel { width: 100%; }
.sk-task { display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 2vh, 20px); width: 100%; }

/* ---------- Text de lectura ---------- */
.sk-text { padding: calc(var(--px) * 5) calc(var(--px) * 6) calc(var(--px) * 6); }
.sk-text__title {
  margin: 0 0 calc(var(--px) * 3);
  font-size: clamp(1.15rem, 1.7vw, 1.45rem);
  font-weight: 700;
  color: var(--tone);
}
.sk-text__body {
  margin: 0;
  font-size: clamp(1.1rem, 1.55vw, 1.4rem);
  font-weight: 700;
  line-height: 1.75;
  color: #0b1460;
}
.sk-sentence { transition: background 0.2s steps(2, end); padding: 0 1px; }
.sk-sentence.is-evidence {
  background: #fff1a8;
  box-shadow: inset 0 calc(var(--px) * -0.75) 0 0 #e0a100;
  animation: guide-pop 0.36s steps(4, end);
}
/* buits de la història */
.sk-gap {
  display: inline-block;
  min-width: 4.2em;
  padding: 0 calc(var(--px) * 1);
  text-align: center;
  line-height: 1.4;
  border-bottom: calc(var(--px) * 0.75) dashed color-mix(in srgb, var(--tone) 55%, #0b1460);
  color: color-mix(in srgb, var(--tone) 60%, #0b1460);
}
.sk-gap.is-active { background: #fff1a8; border-bottom-style: solid; border-bottom-color: #e0a100; animation: sk-glow 1.2s steps(2, end) infinite; }
@keyframes sk-glow { 50% { background: #ffe066; } }
.sk-gap.is-ok { background: #e1f7d6; border-bottom: calc(var(--px) * 0.75) solid #2e9f4a; color: #12612a; }
.sk-gap.is-no { background: #ffe1dc; border-bottom: calc(var(--px) * 0.75) solid #e2232c; color: #a1121b; }
.sk-step { margin: 0; font-size: 1rem; font-weight: 700; color: var(--ink-soft); }

/* ---------- Pista escrita ---------- */
.sk-clue {
  display: flex;
  align-items: center;
  gap: calc(var(--px) * 3);
  margin: 0;
  padding: calc(var(--px) * 3) calc(var(--px) * 5);
  font-size: clamp(1.35rem, 2.3vw, 2rem);
  font-weight: 700;
  color: #0b1460;
  background: color-mix(in srgb, var(--tone) 12%, #ffffff);
  box-shadow: inset 0 calc(var(--px) * -1) 0 0 color-mix(in srgb, var(--tone) 45%, #ffffff);
}
.sk-clue__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: calc(var(--px) * 9);
  height: calc(var(--px) * 9);
  color: #ffffff;
  background: var(--tone);
  box-shadow: 0 0 0 calc(var(--px) * 0.5) var(--outline);
}

/* ---------- Cartes ---------- */
.sk-cards { display: grid; grid-template-columns: repeat(3, calc(var(--card) - var(--card-cut, 0px))); gap: clamp(14px, 2.4vw, 36px); justify-content: center; }
.sk-cards--2 { grid-template-columns: repeat(2, calc(var(--card) * 1.05)); }
.sk-card {
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 0;
  border: 0;
  cursor: pointer;
  font: inherit;
  background: #ffffff;
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
  transition: transform 0.12s steps(2, end);
}
.sk-card:hover:not(:disabled) { transform: translateY(calc(var(--px) * -1)); }
.sk-card:focus-visible { outline: var(--px) solid var(--tone); outline-offset: calc(var(--px) * 2); }
.sk-card__art { display: grid; place-items: center; aspect-ratio: 1; padding: calc(var(--px) * 2); background: color-mix(in srgb, var(--tone) 10%, #ffffff); }
.sk-card__art img { width: 100%; height: 100%; object-fit: contain; }
.sk-card__label { padding: calc(var(--px) * 1.5) calc(var(--px) * 1) calc(var(--px) * 2); font-size: clamp(1rem, 1.4vw, 1.25rem); font-weight: 700; color: #0b1460; text-align: center; }
.sk-card__label.is-hidden { visibility: hidden; }
.sk-card.is-picked { transform: translateY(calc(var(--px) * -1.5)); box-shadow: 0 0 0 calc(var(--px) * 1) #ffd23f, 0 0 0 calc(var(--px) * 2) var(--outline), 0 calc(var(--px) * 3) 0 calc(var(--px) * 1) var(--shadow); }
.sk-card.is-ok { box-shadow: 0 0 0 calc(var(--px) * 1) #2e9f4a, 0 0 0 calc(var(--px) * 2) var(--outline); }
.sk-card.is-ok .sk-card__art { background: #e1f7d6; }
.sk-card.is-no { box-shadow: 0 0 0 calc(var(--px) * 1) #e2232c, 0 0 0 calc(var(--px) * 2) var(--outline); }
.sk-card.is-no .sk-card__art { background: #ffe1dc; }
.sk-card.is-answer { outline: var(--px) dashed #2e9f4a; outline-offset: calc(var(--px) * 1.5); }
.sk-card:disabled { cursor: default; }
.sk-card:disabled:not(.is-ok):not(.is-no):not(.is-answer) { opacity: 0.5; }
.sk-card .aa-mark { position: absolute; top: calc(var(--px) * -2.5); right: calc(var(--px) * -2.5); }

/* ---------- Reproductor ---------- */
.sk-player { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--px) * 4); }
.px-btn.sk-play {
  --tone: #ff9f43;
  --tone-hi: #ffb76b;
  display: inline-flex;
  align-items: center;
  gap: calc(var(--px) * 2.5);
  min-height: clamp(54px, 7vh, 66px);
  padding: 0 calc(var(--px) * 5);
  font-size: clamp(1.15rem, 1.6vw, 1.4rem);
}
.px-btn.sk-play--slow { --tone: #7fb2ff; --tone-hi: #9cc4ff; }
.sk-play__icon { width: calc(var(--px) * 6); height: calc(var(--px) * 5); filter: drop-shadow(1px 1px 0 rgba(10, 15, 77, 0.45)); }
.px-btn.sk-play.is-playing .sk-wave { animation: sk-wave 0.5s steps(2, end) infinite; }
@keyframes sk-wave { 50% { opacity: 0.2; } }
.sk-novoice { margin: 0; flex-basis: 100%; text-align: center; font-weight: 700; color: var(--ink-soft); }
.sk-novoice[hidden] { display: none; }
.sk-heard { margin: 0; font-size: clamp(0.98rem, 1.3vw, 1.15rem); font-weight: 700; color: #0b1460; text-align: center; }
.sk-heard__label { color: var(--ink-soft); }

/* ---------- Frase amb buit, afirmació ---------- */
.sk-line {
  margin: 0;
  width: 100%;
  box-sizing: border-box;
  padding: calc(var(--px) * 3) calc(var(--px) * 3) calc(var(--px) * 3.5);
  font-size: clamp(1.35rem, 2.2vw, 1.9rem);
  font-weight: 700;
  line-height: 1.45;
  text-align: center;
  color: #0b1460;
  background: color-mix(in srgb, var(--tone) 10%, #ffffff);
  box-shadow: inset 0 calc(var(--px) * -1) 0 0 color-mix(in srgb, var(--tone) 40%, #ffffff);
}
.sk-chips { flex-wrap: wrap; }
.sk-chips--col { flex-direction: column; align-items: stretch; width: min(100%, 300px); }
.px-btn.wl-chip.sk-chip { --cb: color-mix(in srgb, var(--tone) 45%, #ffffff); }

/* True / False */
.sk-tf { display: flex; gap: clamp(16px, 2vw, 28px); justify-content: center; }
.px-btn.sk-tf__btn { min-width: clamp(140px, 13vw, 190px); min-height: clamp(52px, 7vh, 62px); font-size: clamp(1.2rem, 1.7vw, 1.5rem); text-shadow: none; }
/* 24-11-2026 (mestre): True / False sense color abans de respondre */
.px-btn.sk-tf__btn--true, .px-btn.sk-tf__btn--false { --tone: #ffffff; --tone-hi: #f4f6ff; color: #0b1460; }
.px-btn.sk-tf__btn--true.is-picked, .px-btn.sk-tf__btn--false.is-picked { --tone: #ffe680; --tone-hi: #ffe680; }
.px-btn.sk-tf__btn.is-ok { --tone: #8ee07a; --tone-hi: #8ee07a; color: #0b1460; }
.px-btn.sk-tf__btn.is-no { --tone: #ff9b8f; --tone-hi: #ff9b8f; color: #0b1460; }
.px-btn.sk-tf__btn.is-answer { outline: var(--px) dashed #2e9f4a; outline-offset: calc(var(--px) * 0.75); }
.px-btn.sk-tf__btn:disabled { cursor: default; transform: none; }
.px-btn.sk-tf__btn .aa-mark, .px-btn.wl-chip .aa-mark, .px-btn.aa-answer .aa-mark { width: calc(var(--px) * 6); height: calc(var(--px) * 6); margin-left: calc(var(--px) * 2); vertical-align: middle; }

/* imatge petita amb fletxa */
.sk-stage {
  --art-real: min(var(--pic-h, clamp(120px, calc(100vh - var(--inner-hero-h) - 520px), 230px)), calc(min(100%, 520px) / var(--rn, 1.5)));
  padding: calc(var(--px) * 2);
}
.sk-stage.is-pointing { padding-top: max(calc(var(--px) * 2), calc(70px - var(--art-real) * var(--gtop, 0.2))); }
.sk-stage .wl-art { width: calc(var(--art-real) * var(--rn, 1.5)); aspect-ratio: var(--ratio); max-width: 100%; }
.sk-kind--yesno .sk-stage { --pic-h: clamp(105px, calc(100vh - var(--inner-hero-h) - 540px), 300px); }

.sk-feedback { display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 1.5); }
.sk-feedback:empty { display: none; }
.sk-feedback__line { margin: 0; font-size: clamp(1.05rem, 1.45vw, 1.25rem); font-weight: 700; text-align: center; }
.sk-feedback__line.is-ok { color: #1d7a35; }
.sk-feedback__line.is-no { color: #b4232c; }
.sk-actions { margin: 0; }
.sk-actions .px-btn:disabled, .sk-actions .px-btn:disabled:hover, .sk-actions .px-btn:disabled:active {
  --tone: #dfe5f5; color: #7c86b5; cursor: not-allowed; transform: none; background: var(--tone);
  box-shadow: var(--o4), inset 0 calc(var(--px) * -1.5) 0 0 #c3cbe4, 0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
.sk-results { width: min(100%, 720px); }

/* ---------- Pantalles baixes ---------- */
@media (max-height: 760px) and (min-width: 761px) and (orientation: landscape) {
  .sections.sk-page { padding-top: 8px; }
  .sk-head { margin-bottom: calc(var(--px) * 2); }
  .sk-panel { padding: calc(var(--px) * 3.5); gap: 10px; }
  .sk-text { padding: calc(var(--px) * 3.5) calc(var(--px) * 4.5); }
  .sk-text__body { line-height: 1.6; font-size: clamp(1rem, 1.4vw, 1.2rem); }
}
/* ---------- Vertical i mòbil ---------- */
/* 19-11: text i exercici costat a costat fins a 700 px d'amplada (pantalla de Claude, tauleta apaïsada) */
@media (max-width: 700px), (orientation: portrait) {
  .sk-play-area.has-text { grid-template-columns: minmax(0, 1fr); }
  .sections.sk-page { --card: clamp(96px, calc((100vw - 120px) / 3), 210px); }
}
@media (max-width: 640px) {
  .sk-panel { padding: calc(var(--px) * 3.5) calc(var(--px) * 2.5); }
  .sk-text { padding: calc(var(--px) * 3.5); }
  .sk-cards { gap: 10px; }
  .sections.sk-page { --card: calc((100vw - 92px) / 3); }
  .sk-cards--2 { grid-template-columns: repeat(2, calc((100vw - 92px) / 2)); }
  .sk-clue { font-size: 1.25rem; padding: calc(var(--px) * 2.5) calc(var(--px) * 3); }
  .px-btn.sk-play { padding: 0 calc(var(--px) * 3.5); }
}

/* =================================================================
   3r · Unit 2 · Reading (19-11-2026): bombolla, negatives, taulers
   ================================================================= */
.sk-neg { color: #d81e28; }
.sk-shortnote {
  margin: 0;
  padding: calc(var(--px) * 1.5) calc(var(--px) * 3);
  font-size: 1rem; font-weight: 700; color: #0b1460;
  background: #fff6cf;
  box-shadow: 0 0 0 calc(var(--px) * 0.5) #e0a100;
}
/* bombolla de diàleg (Who Says It?) */
.sk-bubble {
  position: relative;
  margin: 0 0 calc(var(--px) * 3);
  padding: calc(var(--px) * 3.5) calc(var(--px) * 6);
  max-width: 38ch;
  font-size: clamp(1.3rem, 2.2vw, 1.85rem); font-weight: 700; line-height: 1.35; color: #0b1460; text-align: center;
  background: #ffffff;
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--outline), 0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline), var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
}
.sk-bubble::after {   /* cua pixelada */
  content: ""; position: absolute; left: 50%; bottom: calc(var(--px) * -4);
  width: calc(var(--px) * 4); height: calc(var(--px) * 4); margin-left: calc(var(--px) * -2);
  background: #ffffff;
  clip-path: polygon(0 0, 100% 0, 0 100%);
  box-shadow: inset var(--px) 0 0 0 var(--outline);
}
.sk-kind--pick .sk-cards--4 { grid-template-columns: repeat(4, minmax(0, calc(var(--card) * 0.9))); }
@media (max-width: 760px) { .sk-kind--pick .sk-cards--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* text en paràgrafs numerats (Story Trail) */
.sk-text__paras { margin: 0; padding-left: 1.6em; display: grid; gap: calc(var(--px) * 2); }
.sk-text__paras .sk-para::marker { color: var(--tone); font-weight: 700; }
.sk-text__listen { margin: 0 0 calc(var(--px) * 3); }

.sk-board__hint { margin: 0; font-size: 1rem; font-weight: 700; color: var(--ink-soft, #3b4380); text-align: center; }

/* ---------- order: ordenar vinyetes ---------- */
.sk-order { display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 3); width: 100%; }
.sk-order__strip { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 1.4vw, 16px); width: 100%; }
.sk-order__slot, .sk-order__pic {
  position: relative; display: grid; place-items: center; width: 100%; aspect-ratio: 1; padding: calc(var(--px) * 1);
  border: 0; font: inherit; cursor: pointer; background: color-mix(in srgb, var(--tone) 10%, #ffffff);
  box-shadow: 0 0 0 var(--px) var(--outline), 0 calc(var(--px) * 2) 0 0 var(--shadow);
}
.sk-order__slot { background: repeating-linear-gradient(45deg, #ffffff 0 6px, color-mix(in srgb, var(--tone) 8%, #ffffff) 6px 12px); }
.sk-order__slot img, .sk-order__pic img { width: 100%; height: 100%; object-fit: contain; image-rendering: auto; }
.sk-order__num {
  position: absolute; top: calc(var(--px) * -2); left: calc(var(--px) * -2); z-index: 1;
  display: grid; place-items: center; width: calc(var(--px) * 7); height: calc(var(--px) * 7);
  font-weight: 700; color: #ffffff; background: var(--tone); box-shadow: 0 0 0 calc(var(--px) * 0.5) var(--outline);
}
.sk-order__bank { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 1.4vw, 16px); width: 100%; }
.sk-order__pic:hover:not(:disabled) { transform: translateY(calc(var(--px) * -1)); }
.sk-order__pic.is-used { opacity: 0.25; cursor: default; }
.sk-order__slot.is-ok { box-shadow: 0 0 0 calc(var(--px) * 1) #2e9f4a, 0 0 0 calc(var(--px) * 2) var(--outline); }
.sk-order__slot.is-no { box-shadow: 0 0 0 calc(var(--px) * 1) #e2232c, 0 0 0 calc(var(--px) * 2) var(--outline); }
.sk-order__slot.is-answer { cursor: default; outline: var(--px) dashed #2e9f4a; outline-offset: calc(var(--px) * 1); }
.sk-order__right { width: 100%; display: grid; gap: calc(var(--px) * 2); }
.sk-order .aa-mark, .sk-slots__row .aa-mark { position: absolute; top: calc(var(--px) * -2.5); right: calc(var(--px) * -2.5); }

/* ---------- slots: omplir l'horari ---------- */
.sk-slotsboard { display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 3); width: 100%; }
.sk-slots { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--px) * 2); width: 100%; max-width: 520px; }
.sk-slots__row {
  position: relative; display: grid; grid-template-columns: auto 1fr minmax(120px, 44%) auto; align-items: center; gap: calc(var(--px) * 3);
  padding: calc(var(--px) * 1.5) calc(var(--px) * 3); background: #ffffff;
  box-shadow: 0 0 0 calc(var(--px) * 0.75) var(--outline);
}
.sk-slots__time { font-weight: 700; color: #0b1460; font-size: clamp(0.95rem, 1.3vw, 1.15rem); }
.sk-slots__slot {
  display: flex; align-items: center; gap: calc(var(--px) * 2); min-height: calc(var(--px) * 12); padding: calc(var(--px) * 1) calc(var(--px) * 2);
  border: 0; font: inherit; font-weight: 700; color: #0b1460; cursor: pointer;
  background: repeating-linear-gradient(45deg, #ffffff 0 6px, color-mix(in srgb, var(--tone) 10%, #ffffff) 6px 12px);
  box-shadow: inset 0 0 0 calc(var(--px) * 0.5) color-mix(in srgb, var(--tone) 55%, #0b1460);
}
.sk-slots__slot img { width: calc(var(--px) * 10); height: calc(var(--px) * 10); object-fit: contain; }
.sk-slots__slot.is-filled { background: color-mix(in srgb, var(--tone) 12%, #ffffff); }
.sk-slots__slot.is-target { box-shadow: inset 0 0 0 calc(var(--px) * 0.75) #e0a100; background: #fff6cf; }
.sk-slots__empty { margin-inline: auto; font-size: 1.4rem; color: color-mix(in srgb, var(--tone) 60%, #ffffff); }
.sk-slots__slot.is-ok { background: #e1f7d6; box-shadow: inset 0 0 0 calc(var(--px) * 0.75) #2e9f4a; }
.sk-slots__slot.is-no { background: #ffe1dc; box-shadow: inset 0 0 0 calc(var(--px) * 0.75) #e2232c; }
.sk-slots__right { display: flex; align-items: center; gap: var(--px); font-weight: 700; color: #12612a; font-size: 0.95rem; }
.sk-slots__right img { width: calc(var(--px) * 8); height: calc(var(--px) * 8); object-fit: contain; }
.sk-slots__bank { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: clamp(10px, 1.6vw, 18px); width: 100%; }
.sk-slots__card .sk-card__label { font-size: 1rem; }
.sk-slots__card.is-used { opacity: 0.25; }

/* ---------- chart: graella ✓ / ✗ ---------- */
.sk-chartboard { display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 3); width: 100%; }
.sk-chart { border-collapse: separate; border-spacing: calc(var(--px) * 1.5); }
.sk-chart th, .sk-chart td { padding: 0; }
.sk-chart__col { width: clamp(84px, 11vw, 120px); font-weight: 700; color: #0b1460; }
.sk-chart__col img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; background: color-mix(in srgb, var(--tone) 10%, #ffffff); box-shadow: 0 0 0 calc(var(--px) * 0.75) var(--outline); }
.sk-chart__row { display: flex; align-items: center; gap: calc(var(--px) * 2); padding-right: calc(var(--px) * 2); text-align: left; font-weight: 700; color: #0b1460; font-size: clamp(0.95rem, 1.35vw, 1.2rem); }
.sk-chart__row img { width: calc(var(--px) * 11); height: calc(var(--px) * 11); object-fit: contain; flex: none; }
.sk-chart__cell {
  position: relative; display: grid; place-items: center; width: 100%; min-width: 64px; aspect-ratio: 1.6; border: 0;
  font: inherit; font-size: 2rem; font-weight: 700; cursor: pointer; background: #ffffff;
  box-shadow: 0 0 0 calc(var(--px) * 0.75) var(--outline), 0 calc(var(--px) * 1.5) 0 0 var(--shadow);
}
.sk-chart__cell.is-yes { color: #12612a; background: #e1f7d6; }
.sk-chart__cell.is-nope { color: #c3121b; background: #ffe1dc; }
.sk-chart__cell.is-ok { box-shadow: 0 0 0 calc(var(--px) * 1) #2e9f4a, 0 0 0 calc(var(--px) * 1.75) var(--outline); }
.sk-chart__cell.is-no { box-shadow: 0 0 0 calc(var(--px) * 1) #e2232c, 0 0 0 calc(var(--px) * 1.75) var(--outline); opacity: 0.85; }
.sk-chart__right {
  position: absolute; right: calc(var(--px) * -2); bottom: calc(var(--px) * -2); display: grid; place-items: center;
  width: calc(var(--px) * 7); height: calc(var(--px) * 7); font-size: 1.1rem; color: #ffffff; background: #2e9f4a;
  box-shadow: 0 0 0 calc(var(--px) * 0.5) var(--outline);
}
@media (max-width: 560px) {
  .sk-chart__row span { font-size: 0.9rem; }
  .sk-chart__cell { min-width: 52px; }
}
.sk-slots__right { grid-column: 3 / 5; }
.sk-chart__row { min-width: 11.5em; }
.sk-chart__row span { overflow-wrap: anywhere; }

/* ---------- 19-11 · taulers compactes: tot ha de cabre sense scroll ---------- */
.sk-slotsboard { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr; align-items: start; gap: calc(var(--px) * 2) calc(var(--px) * 3); }
.sk-slotsboard > .sk-board__hint { grid-column: 1 / -1; }
.sk-slots { gap: calc(var(--px) * 1.25); max-width: none; }
.sk-slots__row { grid-template-columns: auto minmax(0, 0.9fr) minmax(0, 1.1fr); gap: calc(var(--px) * 2); padding: calc(var(--px) * 1) calc(var(--px) * 2); }
.sk-slots__row .px-clock--sm { width: clamp(34px, 3.4vw, 46px); }
.sk-slots__time { font-size: clamp(0.85rem, 1.1vw, 1rem); line-height: 1.15; }
.sk-slots__slot { min-height: calc(var(--px) * 9); padding: calc(var(--px) * 0.75) calc(var(--px) * 1.5); font-size: 0.95rem; }
.sk-slots__slot img { width: calc(var(--px) * 8); height: calc(var(--px) * 8); }
.sk-slots__right { grid-column: 2 / 4; font-size: 0.85rem; }
.sk-slots__bank { grid-template-columns: repeat(2, clamp(64px, 6.4vw, 88px)); gap: calc(var(--px) * 2); width: auto; }
.sk-slots__card { padding: calc(var(--px) * 1); }
.sk-slots__card .sk-card__label { font-size: 0.85rem; }
.sk-slots__bank[hidden] { display: none; }
.sk-slotsboard:has(.sk-slots__bank[hidden]) { grid-template-columns: minmax(0, 1fr); }

.sk-chart { border-spacing: calc(var(--px) * 1); }
.sk-chart__col { width: clamp(64px, 7vw, 92px); font-size: 0.95rem; }
.sk-chart__row { font-size: clamp(0.85rem, 1.15vw, 1.05rem); min-width: 10em; }
.sk-chart__row img { width: calc(var(--px) * 8); height: calc(var(--px) * 8); }
.sk-chart__cell { aspect-ratio: auto; height: clamp(38px, 6vh, 52px); min-width: 0; font-size: 1.6rem; }

.sk-order__strip, .sk-order__bank { width: min(100%, calc((100vh - var(--inner-hero-h) - 330px) * 2.1)); margin-inline: auto; }
.sk-order { gap: calc(var(--px) * 2); }
/* U1 Reading (19-11): illes de color, bombolla amb Listen, requadre sota el text, 3 columnes a la graella */
.sk-slots__swatch { width: clamp(34px, 3.4vw, 46px); aspect-ratio: 1.4; border-radius: 50% 50% 46% 54% / 60% 60% 40% 40%; box-shadow: 0 0 0 calc(var(--px) * 0.5) var(--outline), inset 0 calc(var(--px) * -1.5) 0 rgba(0,0,0,.15); }
.sk-bubble__listen { margin-left: calc(var(--px) * 3); vertical-align: middle; padding: calc(var(--px) * 1) calc(var(--px) * 2); }
.sk-text__note { margin-top: calc(var(--px) * 3); display: inline-block; }
.sk-chart:has(thead th:nth-child(4)) .sk-chart__col { width: clamp(60px, 6.4vw, 90px); }

/* ---------- U2 Listening (19-11): aules amb rellotge, tap, frase final ---------- */
.px-room { position: relative; display: block; width: 100%; }
.px-room__img { display: block; width: 100%; height: auto; }
.px-room .px-clock.px-room__clock { position: absolute; filter: drop-shadow(1px 2px 0 rgba(20, 30, 60, .35)); }
.px-room__hands { position: absolute; aspect-ratio: 1; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; }
.sk-card--room .sk-card__art { aspect-ratio: auto; }
.sk-kind--pick .sk-cards--3:has(.sk-card--room) { grid-template-columns: repeat(3, minmax(0, clamp(150px, min(22vw, calc((100vh - var(--inner-hero-h) - 330px) * 0.95)), 300px))); }
.sk-after { margin: 0; font-size: clamp(1.1rem, 1.8vw, 1.5rem); font-weight: 700; color: #0b1460; background: #fff6cf; padding: calc(var(--px) * 1.5) calc(var(--px) * 3); box-shadow: inset 0 0 0 calc(var(--px) * 0.5) #e0a100; }
.sk-tapboard { display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 1.5); width: 100%; }
.sk-tap { position: relative; width: min(100%, calc((100vh - var(--inner-hero-h) - 300px) * 1.52)); }
.sk-tap__img { display: block; width: 100%; height: auto; }
.sk-tap__zone { position: absolute; border: 0; padding: 0; background: transparent; cursor: pointer; }
.sk-tap__zone:hover:not(:disabled) { box-shadow: inset 0 0 0 3px rgba(255, 210, 63, 0.7); }
.sk-tap__zone.is-picked { box-shadow: inset 0 0 0 4px #ffd23f, 0 0 0 2px #0a0f4d; }
.sk-tap__zone.is-ok, .sk-tap__zone.is-answer { box-shadow: inset 0 0 0 4px #2e9f4a, 0 0 0 2px #0a0f4d; }
.sk-tap__zone.is-no { box-shadow: inset 0 0 0 4px #e2232c, 0 0 0 2px #0a0f4d; }
.sk-tap__zone .aa-mark { position: absolute; top: -10px; right: -10px; }
.sk-tap__name { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); white-space: nowrap; padding: 2px 8px; font-weight: 700; color: #ffffff; background: #2e9f4a; box-shadow: 0 0 0 2px #0a0f4d; }
.sk-tap__hint.is-pop { color: #c3121b; animation: guide-pop 0.3s steps(3, end); }

/* ---------- Taulers de frases del Grammar Review U2: build (columnes) i words (ordenar) ---------- */
.ozoo-tone--who  { --g-bg: #e8ddff; --g-line: #9462de; }
.ozoo-tone--verb { --g-bg: #fff2c7; --g-line: #e0a100; }
.ozoo-tone--more { --g-bg: #dcf6f1; --g-line: #18b5a4; }
.sk-boardpic {
  margin: 0; width: clamp(150px, min(24vw, calc(100vh - var(--inner-hero-h, 130px) - 330px)), 300px);
  aspect-ratio: 1; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 6px;
  background: #fff; box-shadow: 0 0 0 3px var(--outline, #0b1460), 0 6px 0 3px var(--shadow, rgba(10, 15, 77, .25));
}
.sk-boardpic > img, .sk-boardpic > .px-room { width: 100%; height: auto; }
.sk-boardpic--clock { background: #fdf7e8; }
.sk-boardpic--clock .px-clock { width: 80%; }
.sk-build, .sk-words { display: flex; align-items: center; justify-content: center; gap: clamp(16px, 3vw, 40px); width: 100%; }
.sk-build__right, .sk-words__right { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }
.sk-build__groups { grid-template-columns: repeat(var(--cols, 3), clamp(130px, 12vw, 190px)); gap: clamp(10px, 1.4vw, 22px); }
.sk-build .ozoo-group { gap: 8px; padding: 8px 8px 10px; }
.sk-build .ozoo-group__chips { gap: 8px; }
.sk-build .px-btn.ozoo-chip { min-height: 44px; font-size: clamp(1.05rem, 1.35vw, 1.3rem); white-space: normal; line-height: 1.1; }
.sk-build__sentence .ozoo-tile { font-size: clamp(1rem, 1.4vw, 1.3rem); }

/* diàleg: bombolles Ruby ↔ Oscar */
.sk-chat { display: flex; flex-direction: column; gap: 12px; width: min(560px, 100%); }
.sk-chat__row { display: flex; align-items: center; gap: 10px; }
.sk-chat__row--right { flex-direction: row-reverse; }
.sk-chat__who { flex: none; min-width: 58px; padding: 4px 8px; font-weight: 700; font-size: .95rem; text-align: center; color: #fff; background: #9462de; box-shadow: 0 0 0 2px #0b1460; }
.sk-chat__row--right .sk-chat__who { background: #18b5a4; }
.sk-chat__bubble {
  position: relative; display: flex; align-items: center; gap: 10px; flex: 1; min-height: 52px;
  padding: 10px 14px; font-size: clamp(1.1rem, 1.5vw, 1.35rem); font-weight: 700; color: #0b1460;
  background: #fff; box-shadow: 0 0 0 3px #0b1460, 0 5px 0 3px rgba(10, 15, 77, .2);
}
.sk-chat__bubble--build { background: #f4f0ff; }
.sk-chat__listen { margin-left: auto; padding: 4px 6px; min-height: 0; transform: scale(.85); }
.sk-chat__build { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0; width: 100%; }
.sk-word {
  padding: 7px 12px 8px; font: inherit; font-size: clamp(1.05rem, 1.4vw, 1.3rem); font-weight: 700; color: #0b1460;
  background: #fff; border: 0; cursor: pointer;
  box-shadow: 0 0 0 3px #0b1460, inset 0 -4px 0 #c8c0ee;
  transition: transform .12s ease;
}
.sk-word:hover:not(:disabled) { transform: translateY(-2px); }
.sk-word.is-placed { background: #fffbe6; box-shadow: 0 0 0 3px #0b1460, inset 0 -4px 0 #e0a100; animation: guide-pop .3s steps(4, end); }
.sk-word.is-used { visibility: hidden; }
.sk-word.is-ok { background: #c9f1b6; box-shadow: 0 0 0 3px #0b1460, inset 0 -4px 0 #2e9f4a; animation: none; }
.sk-word.is-no { background: #ffd3cc; color: #b4232c; box-shadow: 0 0 0 3px #0b1460, inset 0 -4px 0 #b4232c; animation: none; }
.sk-word:disabled { cursor: default; }
.sk-word__gap { display: inline-block; width: 46px; height: 34px; border-bottom: 3px dashed #9d93cf; }
.sk-word__stop { font-size: 1.5rem; font-weight: 700; color: #0b1460; }
.sk-words__bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 10px; padding: 12px; width: min(560px, 100%); background: #f4f0ff; box-shadow: inset 0 0 0 2px #c8c0ee; }
.sk-words__bank[hidden] { display: none; }
.sk-words__fix { margin: 0; padding: 6px 12px; font-weight: 700; color: #1d6b2f; background: #e6fbdc; box-shadow: 0 0 0 2px #2e9f4a; }
.sk-words__fix[hidden] { display: none; }
@media (max-width: 760px) {
  .sk-build, .sk-words { flex-direction: column; }
  .sk-boardpic { width: clamp(120px, 34vw, 200px); }
}
.sk-panel:has(.sk-build), .sk-panel:has(.sk-words) { width: min(100%, 1080px); }

/* ---------- pair: [rellotge] frase [assignatura] (U2 R3 i L4, 21-11-2026) ---------- */
.sk-panel:has(.sk-pairboard) { width: min(100%, 980px); }
.sk-pairboard { display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 3); width: 100%; }
.sk-pair__line {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center;
  gap: calc(var(--px) * 3); width: 100%;
  padding: calc(var(--px) * 2.5); background: color-mix(in srgb, var(--tone) 10%, #ffffff);
  box-shadow: 0 0 0 calc(var(--px) * 0.75) var(--outline), 0 calc(var(--px) * 1.5) 0 calc(var(--px) * 0.75) var(--shadow);
}
.sk-pair__sq {
  width: clamp(96px, 11vw, 140px); aspect-ratio: 1; display: grid; place-items: center; position: relative;
  padding: calc(var(--px) * 1.5); border: none; cursor: pointer; font: inherit;
  background: repeating-linear-gradient(135deg, #ffffff 0 10px, color-mix(in srgb, var(--tone) 10%, #ffffff) 10px 20px);
  box-shadow: inset 0 0 0 calc(var(--px) * 0.75) color-mix(in srgb, var(--tone) 70%, #0b1460);
}
.sk-pair__sq.is-filled { background: #ffffff; }
.sk-pair__sq img, .sk-pair__sq .px-clock { width: 100%; height: auto; }
.sk-pair__empty { font-size: 2.2rem; font-weight: 700; color: color-mix(in srgb, var(--tone) 60%, #ffffff); }
.sk-pair__sq.is-ok { background: #e1f7d6; box-shadow: inset 0 0 0 calc(var(--px) * 1) #2e9f4a; }
.sk-pair__sq.is-no { background: #ffe1dc; box-shadow: inset 0 0 0 calc(var(--px) * 1) #e2232c; }
.sk-pair__sq .aa-mark { position: absolute; top: calc(var(--px) * -2.5); right: calc(var(--px) * -2.5); }
.sk-pair__text {
  margin: 0; text-align: center; font-weight: 700; color: #0b1460; line-height: 1.3;
  font-size: clamp(1.3rem, 2.3vw, 1.9rem);
  padding: calc(var(--px) * 3) calc(var(--px) * 2); background: #ffffff;
  box-shadow: inset 0 0 0 calc(var(--px) * 0.75) var(--outline);
}
.sk-pair__text.is-listen { display: grid; place-items: center; min-height: 3.2em; color: color-mix(in srgb, var(--tone) 70%, #0b1460); }
.sk-pair__ear { display: grid; place-items: center; color: color-mix(in srgb, var(--tone) 75%, #0b1460); }
.sk-pair__ear svg { width: calc(var(--px) * 12); height: calc(var(--px) * 10); filter: none; }
.sk-pair__ear svg rect { fill: currentColor; }
.sk-pair__banks { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--px) * 4); width: 100%; }
.sk-pair__col { display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 1.5); }
.sk-pair__head { margin: 0; font-weight: 700; color: color-mix(in srgb, var(--tone) 70%, #0b1460); font-size: 0.95rem; }
.sk-pair__bank { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--px) * 2.5); width: 100%; }
.sk-pair__opt { padding: calc(var(--px) * 1.5); }
.sk-pair__opt .px-clock { width: 100%; height: auto; }
.sk-pair__opt .sk-card__label { font-size: 0.95rem; }
.sk-pair__opt.is-answer { box-shadow: 0 0 0 calc(var(--px) * 1) #2e9f4a, 0 0 0 calc(var(--px) * 2) var(--outline); }
@media (max-width: 700px) { .sk-pair__banks { grid-template-columns: 1fr; } }
/* Story Trail: capítols curts i grans (mestre, 21-11-2026) */
.sk-text__paras .sk-para { font-size: clamp(1.15rem, 1.8vw, 1.5rem); line-height: 1.45; }

/* order v2: vinyetes grans 2×2 amb número (mestre, 21-11-2026) */
.sk-order--num { gap: calc(var(--px) * 2); }
.sk-order2 {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 20px);
  width: min(100%, calc((100vh - var(--inner-hero-h, 200px) - 232px) * 1.02)); margin-inline: auto;
}
.sk-order2__pic {
  position: relative; display: block; padding: calc(var(--px) * 1.25); border: none; cursor: pointer; background: #ffffff;
  box-shadow: 0 0 0 calc(var(--px) * 0.75) var(--outline), 0 calc(var(--px) * 1.5) 0 calc(var(--px) * 0.75) var(--shadow);
  transition: transform .12s;
}
.sk-order2__pic:hover:not(:disabled) { transform: translateY(calc(var(--px) * -1)); }
.sk-order2__pic img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: contain; }
.sk-order2__num {
  position: absolute; top: calc(var(--px) * -2); left: calc(var(--px) * -2);
  min-width: 1.7em; height: 1.7em; display: none; place-items: center;
  font-weight: 700; font-size: clamp(1.2rem, 2vw, 1.6rem); color: #ffffff; background: var(--tone);
  box-shadow: 0 0 0 calc(var(--px) * 0.75) var(--outline);
}
.sk-order2__pic.is-numbered .sk-order2__num { display: grid; }
.sk-order2__pic.is-numbered { box-shadow: 0 0 0 calc(var(--px) * 1) var(--tone), 0 0 0 calc(var(--px) * 1.75) var(--outline); }
.sk-order2__pic.is-ok { box-shadow: 0 0 0 calc(var(--px) * 1) #2e9f4a, 0 0 0 calc(var(--px) * 1.75) var(--outline); }
.sk-order2__pic.is-no { box-shadow: 0 0 0 calc(var(--px) * 1) #e2232c, 0 0 0 calc(var(--px) * 1.75) var(--outline); }
.sk-order2__pic .aa-mark { position: absolute; top: calc(var(--px) * -2.5); right: calc(var(--px) * -2.5); }
.sk-order2__right { position: absolute; bottom: calc(var(--px) * 1.5); right: calc(var(--px) * 1.5); padding: 0 .4em; font-weight: 700; color: #ffffff; background: #2e9f4a; box-shadow: 0 0 0 calc(var(--px) * 0.5) var(--outline); }
.sk-kind--trail.has-text { grid-template-columns: minmax(0, 0.9fr) minmax(320px, 1.1fr); }

/* pair: totes les opcions iguals (quadrats, sense nom) — mestre, 21-11-2026 */
.sk-pair__opt { aspect-ratio: 1; display: grid; place-items: center; }
.sk-pair__opt .sk-card__art { padding: calc(var(--px) * 1); background: transparent; width: 100%; }
.sk-pair__opt img { width: 100%; height: auto; }

/* ---------- U3 Grammar: pizzes muntades (PA.pizzaArt) ---------- */
.sk-pizza { width: clamp(140px, min(22vw, calc(100vh - var(--inner-hero-h, 130px) - 400px)), 260px); aspect-ratio: 1; }
.sk-pizza.has-no { width: clamp(190px, min(32vw, calc((100vh - var(--inner-hero-h, 130px) - 400px) * 1.6)), 400px); aspect-ratio: 1.6; }
.sk-boardpic .pa-pizza { height: auto; aspect-ratio: 1; }
/* Pizza Order: en Pix amb el globus a l'esquerra, la pizza a la dreta */
.sk-porder { display: flex; align-items: center; justify-content: center; gap: clamp(16px, 3vw, 48px); width: min(820px, calc(100vw - 80px)); }
.sk-porder__pix { display: flex; align-items: center; gap: 10px; }
.sk-porder__pix > img { width: clamp(90px, 12vw, 170px); height: auto; image-rendering: pixelated; }
.sk-porder__bubble {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 18px; max-width: 400px;
  background: #fff; box-shadow: 0 0 0 3px var(--outline, #0b1460), 0 5px 0 3px var(--shadow, rgba(10, 15, 77, .25));
}
.sk-porder__bubble::before { content: ""; position: absolute; left: -14px; top: 50%; width: 14px; height: 14px; margin-top: -7px; background: var(--outline, #0b1460); clip-path: polygon(100% 0, 0 50%, 100% 100%); }
.sk-porder__bubble .sk-player { flex-wrap: nowrap; gap: 10px; }
.sk-porder__q { margin: 0; font-size: clamp(1.15rem, 2vw, 1.6rem); font-weight: 700; text-align: center; }
.sk-pizza--order { width: clamp(170px, min(28vw, calc(100vh - var(--inner-hero-h, 130px) - 300px)), 320px); flex: none; }
@media (max-width: 760px) { .sk-porder { flex-direction: column; gap: 10px; } }

/* lliçons: carta amb pizza */
.wd-card__art.ls-pizza { display: grid; place-items: center; padding: 6%; }
.wd-card__art.ls-pizza .pa-pizza { height: 100%; }
/* opcions d'una paraula (some / any): botons grans */
.sk-options--short { gap: clamp(14px, 2vw, 28px); }
.sk-options.sk-options--short .px-btn.sk-option { min-width: 5.5em; padding: 0.5em 1.1em; font-size: clamp(1.2rem, 2.2vw, 1.7rem); }
/* imatge quadrada (cartes del Grammar U3 a Try It! i Does She Like It?): més gran i centrada */
.sk-stage.sk-stage--square { align-self: center; width: fit-content; --pic-h: clamp(130px, calc(100vh - var(--inner-hero-h) - 440px), 260px); }
.sk-kind--yesno .sk-stage.sk-stage--square { --pic-h: clamp(130px, calc(100vh - var(--inner-hero-h) - 440px), 260px); }
.sk-stage.sk-stage--square .wl-art { width: var(--pic-h); max-width: 70vw; }
/* Escenes per tocar (Lunch at Grandma Pearl's, Lunch Radio, U2): l'espai de la correcció queda
   reservat des del principi, perquè en fer Check la pantalla no canviï de mida (mestre, 22-11-2026) */
.sk-kind--tap .sk-feedback:empty { display: block; }
.sk-kind--tap .sk-feedback { min-height: 30px; justify-content: center; }
.sk-kind--tap.is-listen .sk-feedback { min-height: 60px; }
.sk-kind--tap .sk-tap { width: min(100%, calc((100vh - var(--inner-hero-h) - 340px) * 1.52)); }
.sk-kind--tap.is-listen .sk-tap { width: min(100%, calc((100vh - var(--inner-hero-h) - 375px) * 1.52)); }

/* ✓ / ✗ damunt la carta (Tick or Cross?, U2 Grammar, 24-11-2026) */
.sk-sprite.has-mark { position: relative; width: clamp(150px, calc(100vh - var(--inner-hero-h) - 330px), 250px); }
.sk-mark {
  position: absolute; top: 4px; right: -54px; width: 1.9em; height: 1.9em; display: grid; place-items: center;
  font-size: clamp(1.3rem, 2.2vw, 1.8rem); font-weight: 700; line-height: 1; color: #fff;
  box-shadow: 0 0 0 3px var(--outline, #0b1460), 0 4px 0 3px rgba(11, 20, 96, .25);
}
.sk-mark.is-yes { background: #2f9e44; }
.sk-mark.is-no { background: #e2232c; }

/* ✓ / ✗ damunt la carta dels taulers build / words (U4) */
.sk-boardpic { position: relative; }
.sk-mark.sk-boardmark { top: 4px; right: 4px; font-size: clamp(1rem, 1.8vw, 1.4rem); }
.sk-sprite.is-big { width: clamp(150px, calc(100vh - var(--inner-hero-h) - 330px), 250px); }
/* ============================================================
   Rellotge pixelat, horari i lliçó de teoria (3r · Unit 2).
   Fa servir les cartes de What do they do? (.wd-*) per a les parelles.
   ============================================================ */

/* ---------- Rellotge ---------- */
.px-clock { position: relative; display: block; width: 100%; height: auto; aspect-ratio: 1; }
.px-clock__face, .px-clock__hands { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.px-clock__hands { inset: 0; }
.px-clock--sm { width: clamp(48px, 5vw, 66px); }

/* ---------- Horari ---------- */
.px-timetable {
  list-style: none;
  margin: 0;
  padding: calc(var(--px) * 2.5);
  display: grid;
  gap: calc(var(--px) * 1.5);
  background: #ffffff;
  box-shadow:
    inset 0 calc(var(--px) * 1.5) 0 0 var(--tone, var(--c)),
    0 calc(var(--px) * -1) 0 0 var(--outline), 0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline), var(--px) 0 0 0 var(--outline),
    0 calc(var(--px) * 2.5) 0 0 var(--shadow);
  min-width: min(100%, 300px);
}
.px-timetable__row {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: calc(var(--px) * 3);
  padding: calc(var(--px) * 0.75) calc(var(--px) * 2);
  background: color-mix(in srgb, var(--tone, var(--c)) 7%, #ffffff);
}
.px-timetable__row.is-highlight { background: #fff1a8; box-shadow: inset 0 0 0 calc(var(--px) * 0.75) #e0a100; }
.px-timetable__icon { width: clamp(30px, 3.2vw, 42px); height: auto; image-rendering: pixelated; }
.px-timetable__name { font-size: clamp(1rem, 1.35vw, 1.2rem); font-weight: 700; color: #0b1460; }
.px-timetable__time { font-size: clamp(0.9rem, 1.15vw, 1.05rem); font-weight: 700; color: var(--ink-soft); }

/* ---------- Lliçó ---------- */
.ls-body { width: 100%; display: flex; justify-content: center; }
.ls-body.is-new > * { animation: guide-pop 0.36s steps(4, end); }
.ls-row { display: flex; align-items: center; justify-content: center; gap: clamp(18px, 4vw, 64px); flex-wrap: wrap; width: 100%; }
.ls-col { display: flex; flex-direction: column; gap: calc(var(--px) * 3); min-width: min(100%, 320px); max-width: 560px; }
.ls-clock { width: clamp(150px, min(24vw, calc(100vh - var(--inner-hero-h) - 380px)), 300px); }
.ls-sentence {
  margin: 0;
  padding: calc(var(--px) * 2.5) calc(var(--px) * 4) calc(var(--px) * 3);
  font-size: clamp(1.4rem, 2.6vw, 2.2rem);
  font-weight: 700;
  color: #0b1460;
  background: #ffffff;
  box-shadow: inset 0 calc(var(--px) * -1) 0 0 color-mix(in srgb, var(--c) 40%, #ffffff),
    0 calc(var(--px) * -0.75) 0 0 var(--outline), 0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline), calc(var(--px) * 0.75) 0 0 0 var(--outline);
}
.ls-sentence.is-q { font-size: clamp(1.1rem, 1.8vw, 1.5rem); background: color-mix(in srgb, var(--c) 12%, #ffffff); }
.ls-key { display: inline-block; padding: 0 calc(var(--px) * 1); color: #1f5fc4; background: #dde9ff; box-shadow: inset 0 calc(var(--px) * -0.75) 0 0 #1f5fc4; }
.ls-hint, .ls-note { margin: 0; font-size: clamp(0.98rem, 1.3vw, 1.15rem); font-weight: 700; line-height: 1.4; color: #0b1460; }
.ls-hint { padding: calc(var(--px) * 2) calc(var(--px) * 3); background: #fff6d6; box-shadow: inset 0 0 0 calc(var(--px) * 0.5) #e0a100; }
.ls-note { text-align: center; }
.ls-note[hidden] { display: none; }
.ls-explore { display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 3); }
.ls-explore .ls-clock { width: clamp(140px, min(20vw, calc(100vh - var(--inner-hero-h) - 450px)), 260px); }
.ls-who { color: var(--ink-soft); }
.ls-faded img { opacity: 0.5; filter: saturate(0.5); }
.wd-card__art { position: relative; }
.ls-cross { position: absolute; inset: 18%; pointer-events: none; }
.ls-cross::before, .ls-cross::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top right, transparent calc(50% - 6px), rgba(226, 35, 44, 0.85) calc(50% - 6px), rgba(226, 35, 44, 0.85) calc(50% + 6px), transparent calc(50% + 6px));
}
.ls-cross::after { transform: scaleX(-1); }
.ls-body--pair .wd-card__img { image-rendering: pixelated; }
.ls-body--timetable .aa-line__text { font-size: clamp(1.15rem, 2vw, 1.6rem); }

/* ---------- Exercicis amb rellotge (motor skill) ---------- */
.sk-clockbox { position: relative; width: clamp(120px, min(16vw, calc(100vh - var(--inner-hero-h) - 470px)), 220px); }
.sk-clockbox--big { width: clamp(130px, min(18vw, calc(100vh - var(--inner-hero-h) - 480px)), 240px); }
.sk-clockbox.is-ok .px-clock { filter: drop-shadow(0 0 0 #2e9f4a) drop-shadow(0 0 6px #2e9f4a); }
.sk-clockbox.is-no .px-clock { filter: drop-shadow(0 0 6px #e2343f); }
.sk-clockbox .aa-mark { position: absolute; top: -6px; right: -6px; }
.sk-clockbox.is-answer { width: clamp(80px, 9vw, 120px); }
.sk-clockbox__tag { display: block; text-align: center; font-weight: 700; color: #1d7a35; font-size: 0.9rem; }
.sk-setclock { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 2vw, 24px); flex-wrap: wrap; }
.px-btn.sk-hand { --tone: #ffffff; --tone-hi: #ffffff; color: #0b1460; text-shadow: none; min-height: 48px; padding: 0 calc(var(--px) * 3); font-size: clamp(0.95rem, 1.3vw, 1.15rem); }
.sk-question { font-size: clamp(1.25rem, 2vw, 1.75rem); }
.sk-options { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(10px, 1.6vw, 20px); }
.px-btn.sk-option {
  --tone: #ffffff; --tone-hi: #ffffff;
  --ring: color-mix(in srgb, var(--c) 62%, transparent);
  color: #0b1460; text-shadow: none;
  min-height: clamp(48px, 6.4vh, 58px);
  padding: 0 calc(var(--px) * 4);
  font-size: clamp(1rem, 1.45vw, 1.25rem);
}
/* 24-11-2026 (mestre): les opcions negatives ja no van en vermell: abans de respondre, totes iguals */
.px-btn.sk-option.is-neg { --tone: #ffffff; --tone-hi: #f4f6ff; color: #0b1460; }
.px-btn.sk-option.is-picked { --tone: #ffe680; --tone-hi: #ffe680; color: #0b1460; }
.px-btn.sk-option.is-ok { --tone: #8ee07a; --tone-hi: #8ee07a; color: #0b1460; }
.px-btn.sk-option.is-no { --tone: #ff9b8f; --tone-hi: #ff9b8f; color: #0b1460; }
.px-btn.sk-option.is-answer { outline: var(--px) dashed #2e9f4a; outline-offset: calc(var(--px) * 0.75); }
.px-btn.sk-option:disabled { cursor: default; transform: none; }
.px-btn.sk-option:disabled:not(.is-ok):not(.is-no):not(.is-answer) { opacity: 0.55; }
.px-btn.sk-option .aa-mark { width: calc(var(--px) * 6); height: calc(var(--px) * 6); margin-left: calc(var(--px) * 2); vertical-align: middle; }
.sk-sprite { width: clamp(110px, min(14vw, calc(100vh - var(--inner-hero-h) - 470px)), 200px); }
.sk-sprite img { width: 100%; height: auto; image-rendering: pixelated; }
.sk-kind--choose .px-timetable { width: min(100%, 420px); }
/* horari + pregunta: dues columnes dins del panell */
.sk-task:has(> .px-timetable) { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "tt q" "tt o"; align-items: center; column-gap: clamp(16px, 2.6vw, 36px); }
.sk-task:has(> .px-timetable) > .px-timetable { grid-area: tt; }
.sk-task:has(> .px-timetable) > .sk-question { grid-area: q; align-self: end; }
.sk-task:has(> .px-timetable) > .sk-options { grid-area: o; align-self: start; flex-direction: column; align-items: stretch; }
.sk-kind--choose .px-timetable__row { padding-top: 2px; padding-bottom: 2px; }
.sk-kind--choose .px-clock--sm { width: clamp(30px, 3vw, 40px); }
.px-btn.wl-chip.sk-chip.is-picked { --tone: #ffe680; --tone-hi: #ffe680; color: #0b1460; }
.px-btn.wl-chip.sk-chip { --tone: #ffffff; --tone-hi: #ffffff; color: #0b1460; text-shadow: none; }

@media (max-width: 760px) {
  .sk-task:has(> .px-timetable) { display: flex; }
}
@media (max-width: 640px) {
  .ls-clock { width: 150px; }
  .px-btn.sk-option { width: 100%; }
  .sk-options { flex-direction: column; width: 100%; }
}

/* ---------- Horari curt amb rellotges grans (19-11-2026, «menys files») ---------- */
.px-timetable__title { margin: 0 0 calc(var(--px) * 0.5); text-align: center; font-size: clamp(1rem, 1.4vw, 1.25rem); font-weight: 700; color: #0b1460; letter-spacing: 0.04em; }
.px-timetable--big { gap: calc(var(--px) * 2); }
.px-timetable--big .px-timetable__row { gap: calc(var(--px) * 4); padding: calc(var(--px) * 1.25) calc(var(--px) * 3); }
.px-timetable--big .px-clock--sm { width: clamp(76px, min(9vw, calc((100vh - var(--inner-hero-h) - 330px) / 3.4)), 128px); }
.px-timetable--big .px-timetable__icon { width: clamp(40px, 4.2vw, 60px); }
.px-timetable--big .px-timetable__name { font-size: clamp(1.15rem, 1.7vw, 1.5rem); }
.px-timetable-pair { display: flex; gap: clamp(12px, 2vw, 24px); flex-wrap: wrap; justify-content: center; }
.px-timetable-pair .px-timetable--big .px-clock--sm { width: clamp(64px, min(7vw, calc((100vh - var(--inner-hero-h) - 360px) / 3.6)), 104px); }
.sk-kind--choose .px-timetable--big .px-clock--sm { width: clamp(76px, min(9vw, calc((100vh - var(--inner-hero-h) - 330px) / 3.4)), 128px); }
/* «My school day»: tot el dia (matí i tarda). Primer la pregunta i la resposta, en una fila,
   i a sota les dues meitats: així hi cap sense scroll ni reduir-ho */
.ls-row--split { flex-direction: column-reverse; gap: calc(var(--px) * 3); }
.ls-row--split .ls-col { flex-direction: row; flex-wrap: wrap; justify-content: center; max-width: none; min-width: 0; }
.ls-row--split .px-timetable--big .px-clock--sm { width: clamp(52px, min(6vw, calc((100vh - var(--inner-hero-h) - 380px) / 3.4)), 96px); }
.ls-row--split .px-timetable--big .px-timetable__row { padding: calc(var(--px) * 0.75) calc(var(--px) * 2); gap: calc(var(--px) * 2.5); }
/* 19-11-2026: rellotges més grans (el mestre: «són petits i costa de veure l'hora»). Es fa servir l'alçada lliure de la pantalla */
.sk-clockbox { width: clamp(170px, min(24vw, calc(100vh - var(--inner-hero-h) - 370px)), 300px); }
.sk-clockbox--big { width: clamp(170px, min(24vw, calc(100vh - var(--inner-hero-h) - 400px)), 300px); }
.sk-clockbox.is-answer { width: clamp(90px, 10vw, 140px); }

/* ---------- Proposta C (24-11-2026): consigna i subtítol en una barra ---------- */
.ls-page .wd-head { gap: calc(var(--px) * 3); margin-bottom: calc(var(--px) * 2.5); }
.ls-page .wd-head .wd-title { font-size: clamp(1rem, 1.6vw, 1.35rem); }

/* ---------- Proposta C (24-11-2026): dibuix a dalt, franja de frases a baix amb fletxes ---------- */
.ls-c { display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 2.2vh, 22px); width: var(--wide-w); position: relative; left: var(--wide-shift); }
.ls-c__visual { display: flex; justify-content: center; width: 100%; }
.ls-c__strip {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center;
  gap: clamp(12px, 1.8vw, 22px); width: 100%;
  padding: clamp(12px, 1.8vh, 18px) clamp(12px, 1.6vw, 18px);
  background: #ffffff;
  box-shadow: 0 calc(var(--px) * -0.75) 0 0 var(--outline), 0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline), calc(var(--px) * 0.75) 0 0 0 var(--outline), 0 calc(var(--px) * 2.25) 0 0 var(--shadow);
}
.ls-c__lines, .ls-c__text { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.3vh, 12px); min-width: 0; }
.ls-c__nav { display: flex; flex-direction: column; gap: 8px; }
.ls-c .ls-sentence { font-size: clamp(1.35rem, min(2.5vw, 4.2vh), 2.2rem); text-align: center; box-shadow:
    0 calc(var(--px) * -0.75) 0 0 var(--outline), 0 calc(var(--px) * 0.75) 0 0 var(--outline),
    calc(var(--px) * -0.75) 0 0 0 var(--outline), calc(var(--px) * 0.75) 0 0 0 var(--outline); }
.ls-c .ls-sentence.is-q { font-size: clamp(1.25rem, min(2.2vw, 3.8vh), 1.9rem); box-shadow: none;
  background: color-mix(in srgb, var(--c) 14%, #ffffff); }
.ls-c .ls-hint { text-align: center; }
.px-btn.guide-btn.ls-arrow { min-width: 0; width: clamp(52px, 5.2vw, 66px); height: clamp(52px, 8vh, 66px); padding: 0; font-size: clamp(1.5rem, 2.4vw, 2rem); }
.ls-c__nav .wd-done { min-width: 0; padding: 0 calc(var(--px) * 3); }
.ls-c .ls-clock { width: clamp(150px, min(26vw, calc(100vh - var(--inner-hero-h) - 380px)), 330px); }
.ls-c--explore .ls-clock { width: clamp(130px, min(22vw, calc(100vh - var(--inner-hero-h) - 420px)), 290px); }
.ls-c--explore .ls-explore { flex-direction: row; gap: clamp(14px, 2vw, 28px); }

/* horari curt: tres targetes grans una al costat de l'altra */
.ls-c--tiles .px-timetable { grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; gap: clamp(10px, 1.6vw, 20px); }
.ls-c .ls-note { font-size: clamp(0.95rem, 1.25vw, 1.1rem); }
.ls-c--tiles .px-timetable__title { grid-column: 1 / -1; }
.ls-c--tiles .px-timetable__row {
  grid-template-columns: auto auto; grid-template-areas: "icon name" "clock clock" "time time";
  justify-content: center; justify-items: center; row-gap: calc(var(--px) * 2); padding: calc(var(--px) * 2.5);
}
.ls-c--tiles .px-timetable__icon { grid-area: icon; }
.ls-c--tiles .px-timetable__name { grid-area: name; font-size: clamp(1.3rem, 2.2vw, 1.9rem); }
.ls-c--tiles .px-clock--sm { grid-area: clock; width: clamp(110px, min(15vw, calc(100vh - var(--inner-hero-h) - 450px)), 200px); }
.ls-c--tiles .px-timetable__time { grid-area: time; }

/* dues cartes amb les fletxes ◀ ▶ als costats (26-11-2026) */
.ls-pairrow { display: flex; align-items: center; justify-content: center; gap: clamp(12px, 1.8vw, 24px); position: relative; left: var(--wide-shift); }
.ls-pairrow > .ls-c__nav { flex: none; }
.ls-pairrow { margin-top: clamp(4px, 1vh, 10px); }
.ls-pairrow > .wd-cards:not(.is-contrast) { grid-template-columns: repeat(2, min(var(--card-w), calc((var(--wide-w) - 200px) / 2))); }
.ls-pairrow > .wd-cards.is-contrast { grid-template-columns: repeat(2, min(500px, calc((var(--wide-w) - 200px) / 2))); }
/* la nota, el títol i l'escena es centren sobre les cartes desplaçades */
.wd-play > .ls-note, .wd-play > .wd-note, .view--wd .wd-play > .wd-title, .view--wd .wd-play > .wd-scene, .view--wd .wd-head { position: relative; left: var(--wide-shift); }

/* ✓ / ✗ de la web damunt la carta (U4 · Do you…?) */
.sk-mark.ls-mark { top: 6px; right: 6px; font-size: clamp(1rem, 1.8vw, 1.5rem); }
/* ============================================================
   REGLA D'INTERACCIÓ DE PIXEL ACADEMY
   Tots els elements clicables responen igual, cadascun amb el seu color.
   ------------------------------------------------------------
   Repòs  : contorn fosc de 4 px i ombra dura a sota.
   Hover  : puja 1 píxel gran (4 px), l'ombra dura s'allarga i apareix
            un halo esglaonat (sense difuminat) del color propi.
   Clic   : baixa 1 píxel gran, l'ombra desapareix i el color passa a la
            seva versió brillant, com el curs seleccionat.
   Focus  : cada element manté el seu contorn de focus de teclat.
   Ritme  : 0,12 s a salts (steps): res de moviments tous.
   Per afegir un element nou: defineix --tone i --tone-hi i fes servir
   les mateixes peces (--o4, --halo).
   ============================================================ */

/* Colors de cada element */
.course-btn,
.back-btn      { --tone: var(--c);  --tone-hi: var(--cb); }
a.section-card { --tone: var(--sc); --tone-hi: color-mix(in srgb, var(--sc) 70%, #ffffff); }
a.activity-card { --tone-hi: color-mix(in srgb, var(--tone) 70%, #ffffff); } /* --tone: el de cada targeta */
.unit-card     { --tone: var(--c);  --tone-hi: var(--cb); }

/* Peces compartides */
.course-btn,
.back-btn,
a.section-card,
a.activity-card {
  /* halo en dos esglaons del color propi: intens a prop, suau a fora */
  --ring: color-mix(in srgb, var(--tone) 62%, transparent);
  --ring2: color-mix(in srgb, var(--tone) 24%, transparent);
  --o4:
    0 calc(var(--px) * -1) 0 0 var(--outline),
    0 var(--px) 0 0 var(--outline),
    calc(var(--px) * -1) 0 0 0 var(--outline),
    var(--px) 0 0 0 var(--outline);
  --halo:
    0 calc(var(--px) * -2.5) 0 0 var(--ring),
    0 calc(var(--px) * 2.5) 0 0 var(--ring),
    calc(var(--px) * -2.5) 0 0 0 var(--ring),
    calc(var(--px) * 2.5) 0 0 0 var(--ring),
    0 calc(var(--px) * -4) 0 0 var(--ring2),
    0 calc(var(--px) * 4) 0 0 var(--ring2),
    calc(var(--px) * -4) 0 0 0 var(--ring2),
    calc(var(--px) * 4) 0 0 0 var(--ring2);
  transition:
    transform 0.12s steps(2, end),
    box-shadow 0.12s steps(2, end),
    background-color 0.12s steps(2, end);
}

/* ---------- Hover (només amb ratolí o llapis) ---------- */
@media (hover: hover) {
  .course-btn:not([aria-current="page"]):hover {
    transform: translateY(calc(var(--px) * -1));
    box-shadow:
      var(--o4),
      inset 0 calc(var(--px) * -1.5) 0 0 var(--depth),
      inset 0 var(--px) 0 0 rgba(255, 255, 255, 0.28),
      0 calc(var(--px) * 4) 0 0 var(--shadow),
      var(--halo);
  }

  .back-btn:hover {
    transform: translateY(calc(var(--px) * -1));
    box-shadow:
      var(--o4),
      inset 0 calc(var(--px) * -1.5) 0 0 var(--depth),
      inset 0 var(--px) 0 0 rgba(255, 255, 255, 0.28),
      0 calc(var(--px) * 4) 0 0 var(--shadow),
      var(--halo);
  }

  a.section-card:hover {
    transform: translateY(calc(var(--px) * -1));
    box-shadow:
      var(--o4),
      0 calc(var(--px) * 4.5) 0 0 var(--shadow),
      var(--halo);
  }

  a.activity-card:hover {
    transform: translateY(calc(var(--px) * -1));
    box-shadow:
      var(--o4),
      inset 0 var(--px) 0 0 rgba(255, 255, 255, 0.3),
      inset 0 calc(var(--px) * -2) 0 0 var(--depth),
      0 calc(var(--px) * 4.5) 0 0 var(--shadow),
      var(--halo);
  }

  /* Targetes d'unitat de la portada: la il·lustració (amb el seu marc
     esglaonat) puja i rep el mateix halo, que en ressegueix la silueta */
  .unit-card:hover .unit-card__art {
    transform: translateY(calc(var(--px) * -1));
    filter:
      drop-shadow(calc(var(--px) * 2) 0 0 color-mix(in srgb, var(--tone) 55%, transparent))

.brand-mini { display: inline-block; transition: transform 0.12s steps(2, end); }

/* Mateix ritme per a la il·lustració de les targetes d'unitat */

/* ---------- Caselles del mapa d'etapes ----------

@media (hover: hover) {

      drop-shadow(calc(var(--px) * -1.5) 0 0 color-mix(in srgb, var(--tone) 60%, transparent))
      drop-shadow(0 calc(var(--px) * -1.5) 0 color-mix(in srgb, var(--tone) 60%, transparent))

.map-stage:not([data-state="locked"]):not([data-state="soon"]):active .map-stage__art {

    drop-shadow(calc(var(--px) * 1.5) 0 0 color-mix(in srgb, var(--tone) 60%, transparent))
    drop-shadow(calc(var(--px) * -1.5) 0 0 color-mix(in srgb, var(--tone) 60%, transparent))
    drop-shadow(0 calc(var(--px) * -1.5) 0 color-mix(in srgb, var(--tone) 60%, transparent))

/* ---------- Botó pixelat genèric (.px-btn) ----------

.px-btn {

  --depth: color-mix(in srgb, var(--tone) 70%, #0a0f4d);
  --ring: color-mix(in srgb, var(--tone) 62%, transparent);
  --ring2: color-mix(in srgb, var(--tone) 24%, transparent);
  --o4:

  --halo:
    0 calc(var(--px) * -2.5) 0 0 var(--ring),

    calc(var(--px) * -2.5) 0 0 0 var(--ring),
    calc(var(--px) * 2.5) 0 0 0 var(--ring),
    0 calc(var(--px) * -4) 0 0 var(--ring2),
    0 calc(var(--px) * 4) 0 0 var(--ring2),
    calc(var(--px) * -4) 0 0 0 var(--ring2),

  display: inline-flex;

@media (hover: hover) {

/* ---------- Targetes d'animal de les guies de camp ----------

.guide-card {

    calc(var(--px) * -1) 0 0 0 var(--outline),

    calc(var(--px) * -2.5) 0 0 0 var(--ring),
    calc(var(--px) * 2.5) 0 0 0 var(--ring),
    0 calc(var(--px) * -4) 0 0 var(--ring2),
    0 calc(var(--px) * 4) 0 0 var(--ring2),

    box-shadow 0.12s steps(2, end),

@media (hover: hover) {
